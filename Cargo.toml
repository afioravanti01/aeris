[package]
name         = "aeris"
version      = "0.3.0"
edition      = "2021"
rust-version = "1.75"
license      = "MIT OR Apache-2.0"
description  = "Aeris — a small DSL for ops, governance, pipelines and AI agents"

[dependencies]
clap = { version = "4", features = ["derive"] }
# M22.T3 — async bridge for real L2 backends. Current-thread runtime
# keeps the `!Send` `Env` (Rc<RefCell<…>>-based) compatible with
# `block_on`; `macros` is needed only by the unit tests that spawn
# fake async futures.
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time"] }

[profile.release]
strip         = true
lto           = "fat"
codegen-units = 1
opt-level     = 3
