<header>TECHNICAL PRESENTATION · v0.3</header>
<h1 id="il-problema-tecnico">Il problema tecnico</h1>
<blockquote>
<p>Codice prodotto e letto da LLM. Tre fonti di non-determinismo che si sommano e nessun layer tradizionale le copre insieme.</p>
</blockquote>
<ul>
<li><strong>Modello</strong> — stesso prompt, output diverso. <code>temperature=0</code> riduce, non elimina</li>
<li><strong>Semantica del linguaggio</strong> — costrutti ambigui forzano l'LLM a inferire</li>
<li><strong>Stato del mondo</strong> — rete, DB, FS mutano sotto i piedi del programma</li>
</ul>
<p>I rimedi noti coprono solo un sottoinsieme:</p>
<ul>
<li><strong>Sandboxing</strong> (Docker, gVisor) — controlla il processo, non sa quale funzione tocca cosa</li>
<li><strong>Type systems</strong> (TS, Java, Rust) — parlano di dati, non di <strong>effetti</strong></li>
<li><strong>Effect systems accademici</strong> (F*, Liquid Haskell, Koka) — rigore non pagabile su codice enterprise</li>
<li><strong>DSL/framework</strong> (Airflow, LangChain) — convenzione, non enforcement</li>
</ul>
<footer>Aeris v0.3 · interpreted language for ops, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="4" data-paginate="true" data-header="TECHNICAL PRESENTATION · v0.3" data-footer="Aeris v0.3 · interpreted language for ops, AI and governance" data-theme="aeris" lang="it-IT" data-marpit-pagination="4" style="--paginate:true;--header:TECHNICAL PRESENTATION · v0.3;--footer:Aeris v0.3 · interpreted language for ops, AI and governance;--theme:aeris;" data-marpit-pagination-total="33">
<header>TECHNICAL PRESENTATION · v0.3</header>
<h1 id="cosa-fa-aeris">Cosa fa Aeris</h1>
<div class="columns">
<div class="column compact">
<ul>
<li>Linguaggio <strong>interpretato</strong>, scritto in Rust</li>
<li><strong>Singolo binario statico</strong> <code>aeris</code> &lt; 8 MB, zero dipendenze runtime</li>
<li>Tree-walking interpreter (no bytecode, no JIT) — V0.2 sceglie semplicità sopra performance</li>
<li>File <code>.aer</code>, esecuzione via <code>aeris run &lt;file&gt;</code> / <code>aeris test &lt;file&gt;</code></li>
<li>Ogni esecuzione produce un <strong>trace JSONL</strong> in <code>.aeris/traces/&lt;trace_id&gt;.jsonl</code></li>
<li><code>aeris replay &lt;trace&gt; &lt;source&gt;</code> rigioca l'esecuzione bit-identical sul subset deterministico</li>
</ul>
</div>
<div class="column compact">
<p><strong>Quattro layer di costrutti:</strong></p>
<ul>
<li><strong>L1</strong> — sintassi (lessico, tipi, control flow)</li>
<li><strong>L2</strong> — semantica verificabile (capability, contracts, intent)</li>
<li><strong>L3</strong> — agentic loop (<code>saga</code> con <code>do</code>/<code>undo</code>)</li>
<li><strong>L4</strong> — multi-agent (<code>agent</code>, <code>agent_net</code>)</li>
</ul>
<p>I layer sono <em>opt-in by depth</em>: uno script puro vive in L1; una pipeline self-recovering usa L1+L2+L3.</p>
</div>
</div>
<footer>Aeris v0.3 · interpreted language for ops, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="5" data-paginate="true" data-header="TECHNICAL PRESENTATION · v0.3" data-footer="Aeris v0.3 · interpreted language for ops, AI and governance" data-theme="aeris" lang="it-IT" data-marpit-pagination="5" style="--paginate:true;--header:TECHNICAL PRESENTATION · v0.3;--footer:Aeris v0.3 · interpreted language for ops, AI and governance;--theme:aeris;" data-marpit-pagination-total="33">
<header>TECHNICAL PRESENTATION · v0.3</header>
<h1 id="un-linguaggio-per-ops-ai-automation">Un linguaggio per ops, AI, automation</h1>
<div class="columns">
<div class="column compact">
<p><strong>Per chi è</strong></p>
<ul>
<li>Platform / ops engineer che oggi cucina YAML + Python + shell + Terraform</li>
<li>Autore di pipeline AI che oggi compone LangChain + prompt-string + retry manuali</li>
<li>Team con vincoli di audit / compliance che non possono fidarsi di &quot;un container che gira&quot;</li>
</ul>
<p><strong>Cosa rimpiazza, in un solo file</strong></p>
<ul>
<li>Lo script ops (<code>bash</code> / Python) → <code>.aer</code> con <code>intent</code> e capability esplicite</li>
<li>Il manifesto pipeline (Airflow / Argo) → <code>saga</code> con <code>do</code>/<code>undo</code> obbligatori</li>
<li>Il grafo agenti (LangChain / CrewAI) → <code>agent_net</code> tipato, validato edge-by-edge</li>
<li>La policy egress (OPA / <code>policy.rego</code>) → <code>policy</code> valutata a runtime</li>
</ul>
</div>
<div class="column compact">
<p><strong>Tre modalità d'uso</strong></p>
<ul>
<li><strong>Script</strong> (v0.3, <code>enforce = &quot;off&quot;</code>) — top-level statements, no <code>cap</code>, no <code>main</code>. Per automation rapide, prototipi, demo</li>
<li><strong>Pipeline</strong> (<code>enforce = &quot;loose&quot;</code>) — funzioni con <code>cap</code>, manifest come ceiling. Per ops che salgono progressivamente</li>
<li><strong>Mission-critical</strong> (<code>enforce = &quot;strict&quot;</code>) — disciplina v0.2 piena. Per produzione, audit, compliance</li>
</ul>
<p><strong>Il trace e il replay non si toccano mai.</strong> Tutte e tre le modalità emettono JSONL e supportano <code>aeris replay</code> bit-identical sul subset deterministico — l'audit non è una feature opt-in.</p>
<blockquote>
<p>Lo stesso linguaggio scala da <code>aeris run triage.aer</code> allo stack di produzione regolamentata.</p>
</blockquote>
</div>
</div>
<footer>Aeris v0.3 · interpreted language for ops, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="6" data-paginate="true" data-header="TECHNICAL PRESENTATION · v0.3" data-footer="Aeris v0.3 · interpreted language for ops, AI and governance" data-class="tight" data-theme="aeris" lang="it-IT" class="tight" data-marpit-pagination="6" style="--paginate:true;--header:TECHNICAL PRESENTATION · v0.3;--footer:Aeris v0.3 · interpreted language for ops, AI and governance;--class:tight;--theme:aeris;" data-marpit-pagination-total="33">
<header>TECHNICAL PRESENTATION · v0.3</header>

<h1 id="anatomia-di-un-programma-aeris">Anatomia di un programma Aeris</h1>
<div class="columns">
<div class="column">
<pre><code class="language-aeris">// Script v0.3 — niente main, niente cap, niente boilerplate.
// Triage di log con un LLM headless (claude --print).

let session = ai.session(
  system: &quot;Classify a log line: critical | warning | info.&quot;,
  model:  &quot;claude-haiku-4-5&quot;,
)

let lines = fs.read_file(&quot;./error.log&quot;)
              .split(&quot;\n&quot;)

for line in lines.slice(0, 50) {
  let kind = ai.decide(
    prompt:  &quot;Classify: {line}&quot;,
    choices: [&quot;critical&quot;, &quot;warning&quot;, &quot;info&quot;],
  )?

  if kind == &quot;critical&quot; {
    audit.event(&quot;triage.critical&quot;, { line: line })
  }
}

io.println(&quot;triage done — {ai.usage().calls} LLM calls&quot;)
</code></pre>
</div>
<div class="column compact">
<p><strong>Cosa è visibile a colpo d'occhio</strong></p>
<ul>
<li><strong>Top-level statements</strong> (M26) — niente <code>fn main</code>, lo script gira</li>
<li><strong>String interpolation</strong> (M16) — <code>&quot;{line}&quot;</code>, <code>&quot;{ai.usage().calls}&quot;</code></li>
<li><strong>Named arguments</strong> (v0.3) — <code>system:</code>, <code>model:</code>, <code>choices:</code> su builtin</li>
<li><strong>AI di prima classe</strong> — <code>ai.session</code>, <code>ai.decide</code>, <code>ai.usage</code> nella stdlib, non in libreria esterna</li>
<li><strong><code>?</code> propaga <code>err.llm</code></strong> quando il modello non rispetta <code>choices</code></li>
<li><strong>Trace JSONL</strong> — ogni <code>ai.decide</code>, ogni <code>audit.event</code> finisce in <code>.aeris/traces/&lt;id&gt;.jsonl</code>, riproducibile con <code>aeris replay</code></li>
</ul>
<blockquote>
<p>Stessa identica grammatica scala fino al programma &quot;settle&quot; dell'Atto III: si aggiunge <code>fn</code>, <code>cap</code>, <code>intent</code>, <code>saga</code> — non si cambia linguaggio.</p>
</blockquote>
</div>
</div>
<footer>Aeris v0.3 · interpreted language for ops, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="7" data-paginate="true" data-header="TECHNICAL PRESENTATION · v0.3" data-footer="Aeris v0.3 · interpreted language for ops, AI and governance" data-theme="aeris" lang="it-IT" data-marpit-pagination="7" style="--paginate:true;--header:TECHNICAL PRESENTATION · v0.3;--footer:Aeris v0.3 · interpreted language for ops, AI and governance;--theme:aeris;" data-marpit-pagination-total="33">
<header>TECHNICAL PRESENTATION · v0.3</header>
<h1 id="llm-friendly-per-costruzione">LLM-friendly per costruzione</h1>
<div class="columns">
<div class="column compact">
<p><strong>Grammatica densa, una sola forma legale</strong></p>
<ul>
<li>Tutti i keyword <strong>riservati</strong> — niente soft keyword, <code>grep step</code> è autorevole</li>
<li><strong>Una forma canonica</strong> per ogni costrutto: <code>aeris fmt</code> è totale, non parziale</li>
<li><strong>Nessuna alternativa sintattica</strong> (no <code>function</code>/<code>def</code>/<code>fn</code> insieme, solo <code>fn</code>)</li>
<li>Densità: una <code>saga</code> di 10 step sta in mezza pagina, un <code>agent_net</code> in 6 righe</li>
</ul>
<blockquote>
<p><em>Fewer decisions to make → fewer points of failure.</em> Lo spazio dei completamenti validi è piccolo, l'LLM ha meno modo di sbagliare.</p>
</blockquote>
<p><strong>Why-as-grammar</strong></p>
<ul>
<li><code>intent &quot;...&quot;</code> — il <em>perché</em> del write è antenato grammaticale, non un commento</li>
<li><code>model X@vN</code> — schema versionato sui trust boundary, validato a runtime</li>
<li><code>policy</code> — guardrail come costrutto, non come prompt-string convention</li>
<li><code>requires:</code> / <code>ensures:</code> — pre/post-condizioni come parte della firma</li>
</ul>
</div>
<div class="column compact">
<p><strong>AI built-in, non bolted-on</strong></p>
<ul>
<li><code>ai.session</code> / <code>ai.session_ask</code> con auto-compaction 40→20</li>
<li><code>ai.decide(prompt, choices)</code> enum-style con retry su <code>SchemaViolation</code></li>
<li><code>ai.chat(system, dir)</code> carica una knowledge base markdown in startup</li>
<li><code>ai.network(max_rounds)</code> programmatico + <code>agent</code> / <code>agent_net</code> dichiarativi</li>
<li>Backend <code>http</code> <em>o</em> <code>cli</code> (<code>claude --print</code>, <code>ollama</code>, ...) — niente SDK linkati</li>
</ul>
<p><strong>Reproducibility built-in</strong></p>
<ul>
<li>Ogni <code>ai.*</code> registrato come <code>ai_call</code> nel trace (<code>prompt</code>, <code>model</code>, <code>response</code>, <code>tokens</code>)</li>
<li><code>aeris replay &lt;trace&gt;</code> rigioca offline, bit-identical</li>
<li>La <strong>prima</strong> esecuzione resta stocastica; ogni replay è deterministico</li>
<li>Coerente con l'audience che conta: audit, debug, post-mortem, regression test</li>
</ul>
<blockquote>
<p>Aeris non promette LLM deterministici. Promette <strong>un linguaggio che li tiene visibili, registrati e replayabili</strong>.</p>
</blockquote>
</div>
</div>
<footer>Aeris v0.3 · interpreted language for ops, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="8" data-paginate="true" data-header="TECHNICAL PRESENTATION · v0.3" data-footer="Aeris v0.3 · interpreted language for ops, AI and governance" data-class="divider" data-theme="aeris" lang="it-IT" class="divider" data-marpit-pagination="8" style="--paginate:true;--header:TECHNICAL PRESENTATION · v0.3;--footer:Aeris v0.3 · interpreted language for ops, AI and governance;--class:divider;--theme:aeris;" data-marpit-pagination-total="33">
<header>TECHNICAL PRESENTATION · v0.3</header>

<h1 id="modello-di-esecuzione">Modello di esecuzione</h1>
<blockquote>
<p>I quattro layer, la pipeline source → trace, la matrice degli exit code, il lockset come centro di gravità.</p>
</blockquote>
<footer>Aeris v0.3 · interpreted language for ops, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="9" data-paginate="true" data-header="TECHNICAL PRESENTATION · v0.3" data-footer="Aeris v0.3 · interpreted language for ops, AI and governance" data-theme="aeris" lang="it-IT" data-marpit-pagination="9" style="--paginate:true;--header:TECHNICAL PRESENTATION · v0.3;--footer:Aeris v0.3 · interpreted language for ops, AI and governance;--theme:aeris;" data-marpit-pagination-total="33">
<header>TECHNICAL PRESENTATION · v0.3</header>
<h1 id="i-quattro-layer">I quattro layer</h1>
<table>
<thead>
<tr>
<th>Layer</th>
<th>Cosa aggiunge</th>
<th>Costrutti</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>L1</strong> AI-native syntax</td>
<td>Lessico denso, una forma canonica per costrutto, keyword tutti riservati</td>
<td><code>fn</code>, <code>record</code>, <code>enum</code>, <code>match</code>, <code>if</code>, <code>for</code></td>
</tr>
<tr>
<td><strong>L2</strong> Verifiable semantics</td>
<td>Capability come valori, contratti runtime, intent obbligatorio</td>
<td><code>cap[...]</code>, <code>requires:</code> / <code>ensures:</code>, <code>intent</code></td>
</tr>
<tr>
<td><strong>L3</strong> Agentic loop</td>
<td>Saga con <code>do</code>/<code>undo</code> obbligatori, idempotency automatica, esiti deterministici</td>
<td><code>saga</code>, <code>step</code>, <code>do</code>, <code>undo</code></td>
</tr>
<tr>
<td><strong>L4</strong> Multi-agent</td>
<td>LLM unit tipato, dataflow aciclico, schema validation a ogni edge</td>
<td><code>agent</code>, <code>agent_net</code>, <code>flow</code>, <code>until:</code></td>
</tr>
</tbody>
</table>
<blockquote>
<p>Composizione <em>opt-in by depth</em>. Niente runtime tax per chi non sale di layer.</p>
</blockquote>
<footer>Aeris v0.3 · interpreted language for ops, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="10" data-paginate="true" data-header="TECHNICAL PRESENTATION · v0.3" data-footer="Aeris v0.3 · interpreted language for ops, AI and governance" data-theme="aeris" lang="it-IT" data-marpit-pagination="10" style="--paginate:true;--header:TECHNICAL PRESENTATION · v0.3;--footer:Aeris v0.3 · interpreted language for ops, AI and governance;--theme:aeris;" data-marpit-pagination-total="33">
<header>TECHNICAL PRESENTATION · v0.3</header>
<h1 id="pipeline-di-esecuzione">Pipeline di esecuzione</h1>
<pre><code class="language-text">.aer source ─► lexer ─► parser ─► check (M2) ─► tree-walk eval ─► JSONL trace
                                       │                              │
                                       │                              └─► .aeris/traces/&lt;id&gt;.jsonl
                                       └─► exit non-zero al primo errore strutturale
</code></pre>
<p><strong>Exit code matrix</strong> — un codice per categoria di violazione, scriptable in CI:</p>
<table>
<thead>
<tr>
<th>Code</th>
<th>Causa</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>0</code></td>
<td>Esecuzione ok</td>
</tr>
<tr>
<td><code>64</code></td>
<td>Errore di parse / type / contratto</td>
</tr>
<tr>
<td><code>65</code></td>
<td>Capability mancante o <code>cap[*]</code> nel codice utente</td>
</tr>
<tr>
<td><code>66</code></td>
<td>Chiamata write-effectful fuori da un blocco <code>intent</code> (V2)</td>
</tr>
<tr>
<td><code>67</code></td>
<td><code>saga step</code> con <code>do</code> write e <code>undo: noop</code></td>
</tr>
<tr>
<td><code>68</code></td>
<td><code>model</code> senza <code>@vN</code> su trust boundary</td>
</tr>
<tr>
<td><code>69</code></td>
<td>Lockset stale o byte-swap di una dipendenza</td>
</tr>
<tr>
<td><code>70</code></td>
<td>Ciclo dichiarato in <code>agent_net</code></td>
</tr>
<tr>
<td><code>71</code></td>
<td>Allow-list di firma eccede il ceiling del lockset</td>
</tr>
<tr>
<td><code>74</code></td>
<td>Saga in <code>PartialFailure</code> (undo esaurito le retry)</td>
</tr>
</tbody>
</table>
<footer>Aeris v0.3 · interpreted language for ops, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="11" data-paginate="true" data-header="TECHNICAL PRESENTATION · v0.3" data-footer="Aeris v0.3 · interpreted language for ops, AI and governance" data-theme="aeris" lang="it-IT" data-marpit-pagination="11" style="--paginate:true;--header:TECHNICAL PRESENTATION · v0.3;--footer:Aeris v0.3 · interpreted language for ops, AI and governance;--theme:aeris;" data-marpit-pagination-total="33">
<header>TECHNICAL PRESENTATION · v0.3</header>
<h1 id="determinismo-e-trace">Determinismo e trace</h1>
<div class="columns">
<div class="column">
<p>Il <strong>trace JSONL</strong> è sempre attivo. Ogni interazione con il mondo non-deterministico finisce in una riga:</p>
<ul>
<li><code>cap.ai.*</code> → <code>prompt</code>, <code>model</code>, <code>response</code>, <code>tokens</code>, <code>ts</code></li>
<li><code>cap.clock.now()</code> → timestamp letto</li>
<li><code>cap.random.next()</code> → valore generato</li>
<li>HTTP / shell → hash di request e response</li>
</ul>
<p><strong><code>aeris replay &lt;trace&gt; &lt;source&gt;</code></strong> rigioca il programma:</p>
<ul>
<li>Legge dal nastro invece di chiamare il mondo</li>
<li>Bit-identical sul subset deterministico</li>
<li><code>--live</code> re-issue rete e LLM (per debug differenziale)</li>
</ul>
<p><code>aeris trace diff</code> allinea due trace per <code>(scope, ordinal)</code> e segnala le divergenze.</p>
</div>
<div class="column">
<pre><code class="language-json"><span class="hljs-punctuation">{</span><span class="hljs-attr">&quot;event&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-string">&quot;intent_enter&quot;</span><span class="hljs-punctuation">,</span><span class="hljs-attr">&quot;intent&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-string">&quot;settle invoice batch&quot;</span><span class="hljs-punctuation">,</span>
 <span class="hljs-attr">&quot;scope&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-string">&quot;main.settle&quot;</span><span class="hljs-punctuation">,</span><span class="hljs-attr">&quot;ts&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-string">&quot;2026-05-16T08:30:00Z&quot;</span><span class="hljs-punctuation">}</span>
<span class="hljs-punctuation">{</span><span class="hljs-attr">&quot;event&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-string">&quot;ai_call&quot;</span><span class="hljs-punctuation">,</span><span class="hljs-attr">&quot;scope&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-string">&quot;classify&quot;</span><span class="hljs-punctuation">,</span>
 <span class="hljs-attr">&quot;prompt&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-string">&quot;Classify the invoice...&quot;</span><span class="hljs-punctuation">,</span>
 <span class="hljs-attr">&quot;model&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-string">&quot;claude-opus-4-7&quot;</span><span class="hljs-punctuation">,</span>
 <span class="hljs-attr">&quot;response&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-string">&quot;{\&quot;kind\&quot;:\&quot;utilities\&quot;}&quot;</span><span class="hljs-punctuation">,</span>
 <span class="hljs-attr">&quot;tokens&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-number">142</span><span class="hljs-punctuation">}</span>
<span class="hljs-punctuation">{</span><span class="hljs-attr">&quot;event&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-string">&quot;http_request&quot;</span><span class="hljs-punctuation">,</span><span class="hljs-attr">&quot;scope&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-string">&quot;main.settle.charge&quot;</span><span class="hljs-punctuation">,</span>
 <span class="hljs-attr">&quot;url&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-string">&quot;https://api.acme.com/charge&quot;</span><span class="hljs-punctuation">,</span>
 <span class="hljs-attr">&quot;idempotency_key&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-string">&quot;blake3:7a3f...&quot;</span><span class="hljs-punctuation">,</span>
 <span class="hljs-attr">&quot;req_hash&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-string">&quot;...&quot;</span><span class="hljs-punctuation">,</span><span class="hljs-attr">&quot;resp_hash&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-string">&quot;...&quot;</span><span class="hljs-punctuation">}</span>
<span class="hljs-punctuation">{</span><span class="hljs-attr">&quot;event&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-string">&quot;intent_exit&quot;</span><span class="hljs-punctuation">,</span><span class="hljs-attr">&quot;outcome&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-string">&quot;ok&quot;</span><span class="hljs-punctuation">}</span>
</code></pre>
</div>
</div>
<footer>Aeris v0.3 · interpreted language for ops, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="12" data-paginate="true" data-header="TECHNICAL PRESENTATION · v0.3" data-footer="Aeris v0.3 · interpreted language for ops, AI and governance" data-theme="aeris" lang="it-IT" data-marpit-pagination="12" style="--paginate:true;--header:TECHNICAL PRESENTATION · v0.3;--footer:Aeris v0.3 · interpreted language for ops, AI and governance;--theme:aeris;" data-marpit-pagination-total="33">
<header>TECHNICAL PRESENTATION · v0.3</header>
<h1 id="lockset-come-centro-di-gravit%C3%A0">Lockset come centro di gravità</h1>
<p><code>aeris.toml</code> raccoglie <em>tutto</em> ciò che era sparso fra env var, manifest e config:</p>
<pre><code class="language-toml"><span class="hljs-section">[project]</span>
<span class="hljs-attr">name</span>  = <span class="hljs-string">&quot;settle-pipeline&quot;</span>
<span class="hljs-attr">aeris</span> = <span class="hljs-string">&quot;0.3.0&quot;</span>

<span class="hljs-section">[deps]</span>
<span class="hljs-attr">deploy</span> = { source = <span class="hljs-string">&quot;github.com/acmecorp/aeris-devops&quot;</span>,
           <span class="hljs-attr">version</span> = <span class="hljs-string">&quot;1.2.0&quot;</span>, hash = <span class="hljs-string">&quot;blake3:...&quot;</span> }

<span class="hljs-section">[caps]</span>
<span class="hljs-attr">required</span>        = <span class="hljs-literal">true</span>                          <span class="hljs-comment"># strict mode (M15)</span>
<span class="hljs-attr">http.allow</span>      = [<span class="hljs-string">&quot;api.acme.com&quot;</span>]
<span class="hljs-attr">fs.allow_write</span>  = [<span class="hljs-string">&quot;./out/**&quot;</span>]
<span class="hljs-attr">ai.models</span>       = [<span class="hljs-string">&quot;claude-opus-4-7&quot;</span>, <span class="hljs-string">&quot;claude-haiku-4-5&quot;</span>]

<span class="hljs-section">[ai.backend]</span>
<span class="hljs-attr">kind</span> = <span class="hljs-string">&quot;http&quot;</span>
<span class="hljs-attr">url</span>  = <span class="hljs-string">&quot;https://api.anthropic.com&quot;</span>
<span class="hljs-attr">auth</span> = <span class="hljs-string">&quot;env:ANTHROPIC_API_KEY&quot;</span>

<span class="hljs-section">[policies]</span>
<span class="hljs-attr">active</span> = [<span class="hljs-string">&quot;production_egress&quot;</span>]
</code></pre>
<ul>
<li>Hash mismatch su una dep → errore fatale <strong>prima</strong> dell'esecuzione</li>
<li><code>main</code> riceve il <code>cap</code> <strong>sintetizzato dal lockset</strong> — nessun altro modo per fabbricare un <code>cap</code> da zero</li>
</ul>
<footer>Aeris v0.3 · interpreted language for ops, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="13" data-paginate="true" data-header="TECHNICAL PRESENTATION · v0.3" data-footer="Aeris v0.3 · interpreted language for ops, AI and governance" data-class="divider" data-theme="aeris" lang="it-IT" class="divider" data-marpit-pagination="13" style="--paginate:true;--header:TECHNICAL PRESENTATION · v0.3;--footer:Aeris v0.3 · interpreted language for ops, AI and governance;--class:divider;--theme:aeris;" data-marpit-pagination-total="33">
<header>TECHNICAL PRESENTATION · v0.3</header>

<h1 id="sistema-di-capability">Sistema di capability</h1>
<blockquote>
<p>Capabilities come valori passati per parametro. La signature è il contratto. Niente namespace globale, niente effetti nascosti.</p>
</blockquote>
<footer>Aeris v0.3 · interpreted language for ops, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="14" data-paginate="true" data-header="TECHNICAL PRESENTATION · v0.3" data-footer="Aeris v0.3 · interpreted language for ops, AI and governance" data-theme="aeris" lang="it-IT" data-marpit-pagination="14" style="--paginate:true;--header:TECHNICAL PRESENTATION · v0.3;--footer:Aeris v0.3 · interpreted language for ops, AI and governance;--theme:aeris;" data-marpit-pagination-total="33">
<header>TECHNICAL PRESENTATION · v0.3</header>
<h1 id="capability-come-tipo-first-class">Capability come tipo first-class</h1>
<div class="columns">
<div class="column">
<pre><code class="language-aeris">// Funzione pura: niente parametro cap → niente effetti, mai.
fn total(items: list&lt;Invoice@v1&gt;) -&gt; decimal {
  items.fold(0, fn(acc, it) { acc + it.amount })
}

// Funzione effettuale: l'intera surface è in firma.
fn settle(
  items: list&lt;Invoice@v1&gt;,
  cap: cap[
    http.post @ [&quot;api.acme.com&quot;],
    audit.event,
  ],
) -&gt; result&lt;unit&gt; {
  intent &quot;settle invoice batch&quot; {
    for it in items {
      http.post(&quot;https://api.acme.com/charge&quot;, it)?
    }
    audit.event(&quot;settle.complete&quot;, { count: len(items) })
  }
}
</code></pre>
</div>
<div class="column compact">
<ul>
<li><code>cap[op @ [&quot;allow-list&quot;]]</code> — il tipo elenca le operazioni concesse e i loro vincoli</li>
<li>Allow-list per host, path glob, model, bucket, queue, ...</li>
<li>Una funzione <strong>senza</strong> parametro <code>cap</code> non può fare IO/rete/AI: il parser rifiuta <code>http.post(...)</code> se nessun <code>cap</code> in scope contiene <code>http.post</code></li>
<li>Il body resolution lega <code>&lt;module&gt;.&lt;op&gt;(...)</code> al <code>cap</code> ricevuto — non c'è namespace globale</li>
</ul>
<blockquote>
<p>Object-capability security applicato agli effetti esterni, non all'aliasing di memoria.</p>
</blockquote>
</div>
</div>
<footer>Aeris v0.3 · interpreted language for ops, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="15" data-paginate="true" data-header="TECHNICAL PRESENTATION · v0.3" data-footer="Aeris v0.3 · interpreted language for ops, AI and governance" data-theme="aeris" lang="it-IT" data-marpit-pagination="15" style="--paginate:true;--header:TECHNICAL PRESENTATION · v0.3;--footer:Aeris v0.3 · interpreted language for ops, AI and governance;--theme:aeris;" data-marpit-pagination-total="33">
<header>TECHNICAL PRESENTATION · v0.3</header>
<h1 id="narrowing-e-regole-di-escape">Narrowing e regole di escape</h1>
<div class="columns">
<div class="column">
<pre><code class="language-aeris">fn settle(items, cap: cap[
  http.post @ [&quot;api.acme.com&quot;, &quot;api.stripe.com&quot;],
  fs.write_file @ [&quot;./out/**&quot;],
]) {
  // Restringo prima di passare a charge:
  // mai broadening, sempre subset.
  charge(items, cap.subset[
    http.post @ [&quot;api.stripe.com&quot;]
  ])
}

fn charge(items, cap: cap[http.post @ [&quot;api.stripe.com&quot;]]) {
  intent &quot;charge cards&quot; {
    for it in items { http.post(it.endpoint, it)? }
  }
}
</code></pre>
</div>
<div class="column compact">
<p><strong>Regole strutturali (verificate da M2):</strong></p>
<ul>
<li><code>cap.subset[...]</code> ammette solo restringimenti — broadening rifiutato</li>
<li><code>cap</code> non può essere salvato in record, ritornato come tipo non-cap, inviato in un <code>channel</code></li>
<li><code>cap[*]</code> proibito nel codice utente (E65)</li>
<li>Solo <code>main</code> riceve il <code>cap</code> sintetizzato dal lockset</li>
</ul>
<blockquote>
<p>Un cap che scende lungo l'albero delle chiamate può solo restringersi. Un'attacco che inietta una chiamata a <code>evil.com</code> muore al parser, non in produzione.</p>
</blockquote>
</div>
</div>
<footer>Aeris v0.3 · interpreted language for ops, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="16" data-paginate="true" data-header="TECHNICAL PRESENTATION · v0.3" data-footer="Aeris v0.3 · interpreted language for ops, AI and governance" data-theme="aeris" lang="it-IT" data-marpit-pagination="16" style="--paginate:true;--header:TECHNICAL PRESENTATION · v0.3;--footer:Aeris v0.3 · interpreted language for ops, AI and governance;--theme:aeris;" data-marpit-pagination-total="33">
<header>TECHNICAL PRESENTATION · v0.3</header>
<h1 id="body-resolution">Body resolution</h1>
<p><code>http.post(...)</code> <strong>non</strong> è una chiamata a un namespace globale. È risolta verso il <code>cap</code> in scope.</p>
<pre><code class="language-aeris">use http                                          // rende il modulo visibile

fn ping_status() -&gt; int {
  http.get(&quot;https://api.acme.com/health&quot;)?.status // E65: nessun cap in scope
}

fn ping_status_ok(cap: cap[http.get @ [&quot;api.acme.com&quot;]]) -&gt; int {
  http.get(&quot;https://api.acme.com/health&quot;)?.status // ok
}
</code></pre>
<ul>
<li>Importare un modulo capability-bearing <strong>non</strong> introduce alcuna funzione globale <code>http.post</code></li>
<li>Aggiungere <code>use http</code> in cima al file non abilita niente; serve il <code>cap</code> nella firma</li>
<li>Un LLM che genera codice e dimentica di dichiarare la capability fallisce <strong>al compile time</strong>, non in runtime</li>
</ul>
<footer>Aeris v0.3 · interpreted language for ops, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="17" data-paginate="true" data-header="TECHNICAL PRESENTATION · v0.3" data-footer="Aeris v0.3 · interpreted language for ops, AI and governance" data-theme="aeris" lang="it-IT" data-marpit-pagination="17" style="--paginate:true;--header:TECHNICAL PRESENTATION · v0.3;--footer:Aeris v0.3 · interpreted language for ops, AI and governance;--theme:aeris;" data-marpit-pagination-total="33">
<header>TECHNICAL PRESENTATION · v0.3</header>
<h1 id="surface-lock--v3">Surface lock — V3</h1>
<p>Per ogni funzione <code>pub</code>, la sua effect surface va in <code>.aeris/surface.lock</code>:</p>
<pre><code class="language-toml"><span class="hljs-section">[settle]</span>
<span class="hljs-attr">caps</span> = [
  <span class="hljs-string">&quot;http.post @ [\&quot;api.acme.com\&quot;]&quot;</span>,
  <span class="hljs-string">&quot;audit.event&quot;</span>,
]

<span class="hljs-section">[total]</span>
<span class="hljs-attr">caps</span> = []
</code></pre>
<ul>
<li>Una PR che amplia una surface (aggiunge una sub-cap) <strong>deve</strong> rigenerare il lockfile</li>
<li>Il diff del <code>surface.lock</code> appare come <strong>primo hunk</strong> nella review</li>
<li>Le contrazioni non richiedono re-lock</li>
<li><code>aeris fmt --narrow-caps</code> (V1) propone restringimenti basati sull'uso reale del body</li>
</ul>
<blockquote>
<p>Una PR LLM-generata che aggiunge una chiamata di rete a una funzione prima air-gapped è visibile a colpo d'occhio nella review.</p>
</blockquote>
<footer>Aeris v0.3 · interpreted language for ops, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="18" data-paginate="true" data-header="TECHNICAL PRESENTATION · v0.3" data-footer="Aeris v0.3 · interpreted language for ops, AI and governance" data-class="divider" data-theme="aeris" lang="it-IT" class="divider" data-marpit-pagination="18" style="--paginate:true;--header:TECHNICAL PRESENTATION · v0.3;--footer:Aeris v0.3 · interpreted language for ops, AI and governance;--class:divider;--theme:aeris;" data-marpit-pagination-total="33">
<header>TECHNICAL PRESENTATION · v0.3</header>

<h1 id="contracts-intent-model">Contracts, intent, model</h1>
<blockquote>
<p>Tre costrutti per portare il <em>perché</em> dentro la grammatica: pre/post-condizioni, intent obbligatorio sui write, schemi versionati ai trust boundary.</p>
</blockquote>
<footer>Aeris v0.3 · interpreted language for ops, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="19" data-paginate="true" data-header="TECHNICAL PRESENTATION · v0.3" data-footer="Aeris v0.3 · interpreted language for ops, AI and governance" data-theme="aeris" lang="it-IT" data-marpit-pagination="19" style="--paginate:true;--header:TECHNICAL PRESENTATION · v0.3;--footer:Aeris v0.3 · interpreted language for ops, AI and governance;--theme:aeris;" data-marpit-pagination-total="33">
<header>TECHNICAL PRESENTATION · v0.3</header>
<h1 id="contracts--requires--ensures">Contracts — <code>requires:</code> / <code>ensures:</code></h1>
<pre><code class="language-aeris">fn pay(
  amount: decimal,
  account: string,
  cap: cap[http.post @ [&quot;api.stripe.com&quot;]],
) -&gt; result&lt;Receipt@v1&gt;
  requires: amount &gt; 0
  requires: len(account) == 26
  ensures:  result.ok implies result.value.amount == amount
{
  intent &quot;charge customer&quot; {
    let resp = http.post(&quot;https://api.stripe.com/v1/charges&quot;,
                          { amount, account })?
    Ok(Receipt@v1 { amount, txn_id: resp.id })
  }
}
</code></pre>
<ul>
<li>Pre-condizioni controllate <strong>all'ingresso</strong>, post-condizioni a <strong>ogni return path</strong></li>
<li>Violazione → <code>ContractViolation</code>, flush della trace, exit 64</li>
<li><strong>Non</strong> catchabile da <code>?</code> — è un errore strutturale, non un <code>Err</code> di dominio</li>
<li>Niente SMT, niente proof obligations: tutto runtime, errori actionable</li>
</ul>
<footer>Aeris v0.3 · interpreted language for ops, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="20" data-paginate="true" data-header="TECHNICAL PRESENTATION · v0.3" data-footer="Aeris v0.3 · interpreted language for ops, AI and governance" data-theme="aeris" lang="it-IT" data-marpit-pagination="20" style="--paginate:true;--header:TECHNICAL PRESENTATION · v0.3;--footer:Aeris v0.3 · interpreted language for ops, AI and governance;--theme:aeris;" data-marpit-pagination-total="33">
<header>TECHNICAL PRESENTATION · v0.3</header>
<h1 id="intent-obbligatorio--v2">Intent obbligatorio — V2</h1>
<p>Ogni chiamata <strong>write-effectful</strong> deve stare dentro un blocco <code>intent &quot;...&quot;</code>.</p>
<div class="columns">
<div class="column">
<pre><code class="language-aeris">// E66 — parse-time error:
// &quot;missing enclosing intent for write-effectful call&quot;
fn rotate_cert(cap: cap[fs.write_file @ [&quot;/etc/ssl/**&quot;]]) {
  fs.write_file(&quot;/etc/ssl/new.pem&quot;, new_pem())?
}
</code></pre>
<pre><code class="language-aeris">// OK — intent dichiara il perché.
fn rotate_cert(cap: cap[fs.write_file @ [&quot;/etc/ssl/**&quot;]]) {
  intent &quot;rotate TLS cert before 30-day expiry&quot; {
    fs.write_file(&quot;/etc/ssl/new.pem&quot;, new_pem())?
  }
}
</code></pre>
</div>
<div class="column compact">
<p><strong>Op write-effectful</strong>: <code>cap.fs.write*</code>, <code>cap.http.{post,put,patch,delete}</code>, <code>cap.kube.apply</code>, <code>cap.audit.*</code>, <code>cap.ai.*</code></p>
<p><strong>Trace events:</strong></p>
<ul>
<li><code>intent_enter</code> — stringa, scope, ts</li>
<li><code>intent_exit</code> — outcome, durata</li>
<li>ogni evento dentro il body porta <code>&quot;intent&quot;: &quot;...&quot;</code> come campo</li>
</ul>
<blockquote>
<p>Il <em>perché</em> diventa antenato grammaticale di ogni effetto. Una PR non può nascondere una write nel silenzio.</p>
</blockquote>
</div>
</div>
<footer>Aeris v0.3 · interpreted language for ops, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="21" data-paginate="true" data-header="TECHNICAL PRESENTATION · v0.3" data-footer="Aeris v0.3 · interpreted language for ops, AI and governance" data-theme="aeris" lang="it-IT" data-marpit-pagination="21" style="--paginate:true;--header:TECHNICAL PRESENTATION · v0.3;--footer:Aeris v0.3 · interpreted language for ops, AI and governance;--theme:aeris;" data-marpit-pagination-total="33">
<header>TECHNICAL PRESENTATION · v0.3</header>
<h1 id="model-versionato--vn">Model versionato — <code>@vN</code></h1>
<pre><code class="language-aeris">model Invoice@v1 {
  id:       uuid
  amount:   decimal where amount &gt; 0
  customer: string  where len(customer) &lt;= 64
  status:   InvoiceStatus

  where: status == Cancelled implies amount == 0   // invariante cross-field
}

// Bare `Invoice` senza @vN su un trust boundary → exit 68.
fn ingest(raw: string) -&gt; result&lt;Invoice@v1&gt; {
  json.decode&lt;Invoice@v1&gt;(raw)        // validazione automatica al confine
}
</code></pre>
<ul>
<li>Validazione <strong>automatica</strong> sui trust boundary: HTTP ingress, <code>json.decode</code>, agent boundary</li>
<li><code>where</code> per campo (predicato) e <code>where:</code> record-level (invariante cross-field)</li>
<li>Migrazione tra versioni = funzione pura <strong>esplicita</strong>, mai implicita</li>
<li>Bare <code>Invoice</code> rifiutato al check (E68) — versioning forzato dove conta</li>
</ul>
<footer>Aeris v0.3 · interpreted language for ops, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="22" data-paginate="true" data-header="TECHNICAL PRESENTATION · v0.3" data-footer="Aeris v0.3 · interpreted language for ops, AI and governance" data-class="divider" data-theme="aeris" lang="it-IT" class="divider" data-marpit-pagination="22" style="--paginate:true;--header:TECHNICAL PRESENTATION · v0.3;--footer:Aeris v0.3 · interpreted language for ops, AI and governance;--class:divider;--theme:aeris;" data-marpit-pagination-total="33">
<header>TECHNICAL PRESENTATION · v0.3</header>

<h1 id="saga-e-agenti">Saga e agenti</h1>
<blockquote>
<p>Operazioni multi-step con compensation obbligatoria. LLM unit tipati. Dataflow aciclico fra agenti.</p>
</blockquote>
<footer>Aeris v0.3 · interpreted language for ops, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="23" data-paginate="true" data-header="TECHNICAL PRESENTATION · v0.3" data-footer="Aeris v0.3 · interpreted language for ops, AI and governance" data-class="tight" data-theme="aeris" lang="it-IT" class="tight" data-marpit-pagination="23" style="--paginate:true;--header:TECHNICAL PRESENTATION · v0.3;--footer:Aeris v0.3 · interpreted language for ops, AI and governance;--class:tight;--theme:aeris;" data-marpit-pagination-total="33">
<header>TECHNICAL PRESENTATION · v0.3</header>

<h1 id="saga--anatomia">Saga — anatomia</h1>
<pre><code class="language-aeris">saga settle(
  batch: list&lt;Invoice@v1&gt;,
  cap: cap[
    http.post  @ [&quot;api.acme.com&quot;],
    kube.apply @ [&quot;prod-eu-1&quot;],
    audit.event,
  ],
) {
  intent &quot;settle invoice batch and notify finance&quot;

  step charge {
    do   { for it in batch { http.post(&quot;https://api.acme.com/charge&quot;, it)? } }
    undo { for it in batch { http.post(&quot;https://api.acme.com/refund&quot;, it)? } }
  }

  step ledger {
    requires: charge.ok
    do   { kube.apply(ledger_manifest(batch))? }
    undo { kube.delete(ledger_manifest(batch))? }
  }

  step record {
    requires: ledger.ok
    do   { audit.event(&quot;settle.complete&quot;,    { count: len(batch) }) }
    undo { audit.event(&quot;settle.rolled_back&quot;, { count: len(batch) }) }
  }
}
</code></pre>
<ul>
<li><code>do</code>/<code>undo</code> obbligatori. <code>undo: noop</code> ammesso <strong>solo</strong> se il <code>do</code> non è write-effectful (E67)</li>
<li>Esiti deterministici: <code>ok</code> | <code>rolled_back</code> | <code>PartialFailure</code> (exit 74) — mai stato a metà</li>
</ul>
<footer>Aeris v0.3 · interpreted language for ops, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="24" data-paginate="true" data-header="TECHNICAL PRESENTATION · v0.3" data-footer="Aeris v0.3 · interpreted language for ops, AI and governance" data-theme="aeris" lang="it-IT" data-marpit-pagination="24" style="--paginate:true;--header:TECHNICAL PRESENTATION · v0.3;--footer:Aeris v0.3 · interpreted language for ops, AI and governance;--theme:aeris;" data-marpit-pagination-total="33">
<header>TECHNICAL PRESENTATION · v0.3</header>
<h1 id="idempotency-key--n1">Idempotency key — N1</h1>
<p>Ogni capability di scrittura riceve automaticamente:</p>
<pre><code class="language-text">key = blake3(trace_id ‖ step_name ‖ invocation_index)
</code></pre>
<table>
<thead>
<tr>
<th>Capability</th>
<th>Iniezione</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>http.post/put/patch</code></td>
<td>Header <code>Idempotency-Key: &lt;key&gt;</code></td>
</tr>
<tr>
<td><code>kube.apply</code></td>
<td>Annotation <code>aeris.dev/idempotency-key: &lt;key&gt;</code></td>
</tr>
<tr>
<td><code>rabbitmq.publish</code></td>
<td><code>message-id: &lt;key&gt;</code></td>
</tr>
<tr>
<td><code>mongodb.insert</code></td>
<td>Sentinel field <code>_aeris_idem: &lt;key&gt;</code></td>
</tr>
</tbody>
</table>
<ul>
<li>Replay di uno step già completato → <strong>no-op</strong> lato backend</li>
<li>Cascading undo durante rollback è retry-driven con queste chiavi</li>
<li>Un retry su un undo già parzialmente applicato non duplica l'effetto</li>
</ul>
<blockquote>
<p>Riduce la frequenza pratica di <code>PartialFailure</code> senza pretendere di eliminarla.</p>
</blockquote>
<footer>Aeris v0.3 · interpreted language for ops, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="25" data-paginate="true" data-header="TECHNICAL PRESENTATION · v0.3" data-footer="Aeris v0.3 · interpreted language for ops, AI and governance" data-theme="aeris" lang="it-IT" data-marpit-pagination="25" style="--paginate:true;--header:TECHNICAL PRESENTATION · v0.3;--footer:Aeris v0.3 · interpreted language for ops, AI and governance;--theme:aeris;" data-marpit-pagination-total="33">
<header>TECHNICAL PRESENTATION · v0.3</header>
<h1 id="agent--single-llm-unit">Agent — single LLM unit</h1>
<div class="columns">
<div class="column">
<pre><code class="language-aeris">model Invoice@v1  { id: uuid, amount: decimal where amount &gt; 0 }
model Category@v1 { kind: string }

agent classify {
  llm:     &quot;claude-haiku-4-5&quot;
  intent:  &quot;classify invoice into expense kind&quot;
  prompt:  &quot;&quot;&quot;
    Classify the invoice with amount {input.amount}.
    Return JSON with a single field `kind`.
  &quot;&quot;&quot;
  accept:  Invoice@v1
  produce: Category@v1
  retries: 2
  budget:  { tokens: 2_000, latency: 3s }
}

fn main(cap: cap[ai.complete @ [&quot;claude-haiku-4-5&quot;]])
  -&gt; result&lt;Category@v1&gt;
{
  intent &quot;classify one invoice&quot; {
    classify(Invoice@v1 { id: uuid_v7(), amount: 99.0 }, cap)
  }
}
</code></pre>
</div>
<div class="column compact">
<ul>
<li><code>accept</code>/<code>produce</code> sono <strong><code>model@vN</code></strong> validati a ogni invocazione</li>
<li>Routing contract auto-iniettato dal runtime nel system prompt — non scritto a mano</li>
<li><code>retries:</code> su <code>SchemaViolation</code> con backoff</li>
<li><code>budget:</code> per token e latency; sforamento → <code>BudgetExceeded</code>, exit 1</li>
<li>Ogni invocazione registrata nel trace JSONL (tape recorder N3)</li>
</ul>
</div>
</div>
<footer>Aeris v0.3 · interpreted language for ops, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="26" data-paginate="true" data-header="TECHNICAL PRESENTATION · v0.3" data-footer="Aeris v0.3 · interpreted language for ops, AI and governance" data-theme="aeris" lang="it-IT" data-marpit-pagination="26" style="--paginate:true;--header:TECHNICAL PRESENTATION · v0.3;--footer:Aeris v0.3 · interpreted language for ops, AI and governance;--theme:aeris;" data-marpit-pagination-total="33">
<header>TECHNICAL PRESENTATION · v0.3</header>
<h1 id="agent_net--dataflow-tipato">agent_net — dataflow tipato</h1>
<pre><code class="language-aeris">agent_net invoice_pipeline {
  flow extract  -&gt; classify  -&gt; route
  flow classify -&gt; { audit, archive }            // fan-out type-driven
  flow audit    -&gt; notify_finance

  until: classify.confidence &gt; 0.95 || iterations &gt;= 3
}
</code></pre>
<ul>
<li><strong>DAG aciclico</strong> — ciclo dichiarato → E70 al parse</li>
<li>Routing risolto per <strong>match <code>accept</code> <img class="emoji" draggable="false" alt="↔" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2194.svg" data-marp-twemoji=""/> <code>produce</code></strong>: il runtime sa quale ramo prendere dai tipi</li>
<li><code>until:</code> per loop di convergenza con bound massimo</li>
<li>Una net può essere usata come <strong>nodo</strong> di un'altra net — composizione gerarchica</li>
<li>Esiti: <code>ok(value)</code> o <code>Err(&quot;agent_net &lt;name&gt; exhausted&quot;)</code></li>
</ul>
<blockquote>
<p>Il protocollo di routing diventa parte del <em>programma</em>, non una stringa di prompt.</p>
</blockquote>
<footer>Aeris v0.3 · interpreted language for ops, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="27" data-paginate="true" data-header="TECHNICAL PRESENTATION · v0.3" data-footer="Aeris v0.3 · interpreted language for ops, AI and governance" data-class="divider" data-theme="aeris" lang="it-IT" class="divider" data-marpit-pagination="27" style="--paginate:true;--header:TECHNICAL PRESENTATION · v0.3;--footer:Aeris v0.3 · interpreted language for ops, AI and governance;--class:divider;--theme:aeris;" data-marpit-pagination-total="33">
<header>TECHNICAL PRESENTATION · v0.3</header>

<h1 id="policy-refusal-limiti">Policy, refusal, limiti</h1>
<blockquote>
<p>Policy come costrutto. Le scelte rifiutate per principio. I limiti onesti del modello.</p>
</blockquote>
<footer>Aeris v0.3 · interpreted language for ops, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="28" data-paginate="true" data-header="TECHNICAL PRESENTATION · v0.3" data-footer="Aeris v0.3 · interpreted language for ops, AI and governance" data-theme="aeris" lang="it-IT" data-marpit-pagination="28" style="--paginate:true;--header:TECHNICAL PRESENTATION · v0.3;--footer:Aeris v0.3 · interpreted language for ops, AI and governance;--theme:aeris;" data-marpit-pagination-total="33">
<header>TECHNICAL PRESENTATION · v0.3</header>
<h1 id="policy-come-costrutto">Policy come costrutto</h1>
<pre><code class="language-aeris">policy production_egress {
  match:  http.*
  deny:   url.host not in [&quot;api.acme.com&quot;, &quot;api.stripe.com&quot;]
  audit:  { url, method }
  when:   env == &quot;production&quot;
}

policy ai_budget {
  match: ai.complete
  limit: tokens_per_minute = 60_000
  audit: { model, tokens }
}
</code></pre>
<ul>
<li>Attivata via <strong>import del modulo</strong>, <strong>attributo</strong> <code>#[policy(name)]</code>, o <strong>lockset</strong> <code>[policies] active</code></li>
<li>Valutata su ogni chiamata che matcha — non &quot;ricordata&quot; da un system prompt</li>
<li>Violazione → <code>PolicyViolation</code>, trace event, exit 1</li>
<li><strong>Drift in replay</strong>: se la policy diverge fra live e replay, evento <code>policy_drift</code> nel trace</li>
</ul>
<footer>Aeris v0.3 · interpreted language for ops, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="29" data-paginate="true" data-header="TECHNICAL PRESENTATION · v0.3" data-footer="Aeris v0.3 · interpreted language for ops, AI and governance" data-theme="aeris" lang="it-IT" data-marpit-pagination="29" style="--paginate:true;--header:TECHNICAL PRESENTATION · v0.3;--footer:Aeris v0.3 · interpreted language for ops, AI and governance;--theme:aeris;" data-marpit-pagination-total="33">
<header>TECHNICAL PRESENTATION · v0.3</header>
<h1 id="cose-che-il-linguaggio-rifiuta--e-perch%C3%A9">Cose che il linguaggio rifiuta — e perché</h1>
<table>
<thead>
<tr>
<th>Refusal</th>
<th>Motivazione tecnica</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>No SMT / refinement types</strong></td>
<td>Il verdetto del solver dipende dalla macchina → introduce non-determinismo <em>nel tooling</em>, peggio di quello che proviamo a controllare</td>
</tr>
<tr>
<td><strong>No tier system</strong> (<code>draft/standard/verified</code>)</td>
<td>La semantica del boundary fra tier è inevitabilmente confusa: cosa succede se <code>standard</code> importa <code>draft</code>? Nessuna risposta ergonomica</td>
</tr>
<tr>
<td><strong>No capability inference</strong></td>
<td>Cambi interni a un callee modificherebbero silenziosamente la surface dei caller; il diff PR diventa ingannevole</td>
</tr>
<tr>
<td><strong>No soft keyword</strong></td>
<td>Lookahead position-dependent produce bug di parsing sottili (<code>time</code> token splittato silenziosamente). <code>grep step</code> deve trovare ogni <code>step</code></td>
</tr>
<tr>
<td><strong>No import di riferimenti mutabili</strong></td>
<td>Niente <code>latest</code>, niente <code>*</code>, nessun tag git mutabile. Ogni <code>use X@vN.M.P</code> deve combaciare col lockset o fallisce alla risoluzione</td>
</tr>
<tr>
<td><strong>No <code>.so</code> plugin</strong></td>
<td>Un binario su disco introdurrebbe una effect surface invisibile al check M2. Romperebbe la verificabilità statica delle capability</td>
</tr>
</tbody>
</table>
<footer>Aeris v0.3 · interpreted language for ops, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="30" data-paginate="true" data-header="TECHNICAL PRESENTATION · v0.3" data-footer="Aeris v0.3 · interpreted language for ops, AI and governance" data-theme="aeris" lang="it-IT" data-marpit-pagination="30" style="--paginate:true;--header:TECHNICAL PRESENTATION · v0.3;--footer:Aeris v0.3 · interpreted language for ops, AI and governance;--theme:aeris;" data-marpit-pagination-total="33">
<header>TECHNICAL PRESENTATION · v0.3</header>
<h1 id="limiti-onesti-del-modello">Limiti onesti del modello</h1>
<table>
<thead>
<tr>
<th>Limite</th>
<th>Cosa significa</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Prima esecuzione LLM non-deterministica</strong></td>
<td>Il tape recorder rende <code>aeris replay</code> bit-identical <em>dopo</em> la prima run. Quella prima resta in balìa del modello: <code>temperature=0</code> riduce la varianza, non la elimina</td>
</tr>
<tr>
<td><strong>Logica dentro capability legittima non verificata</strong></td>
<td>Se una funzione tiene legittimamente <code>cap[audit.write]</code> e scrive l'attore sbagliato, Aeris non se ne accorge. Garantiamo visibilità (firma) e obbligo (intent, saga); la correttezza del body è responsabilità di test, review, RBAC</td>
</tr>
<tr>
<td><strong>Cascading undo best-effort</strong></td>
<td>L'<code>undo</code> di uno step può a sua volta fallire. Ritentiamo con idempotency key di N1; dopo retry, evento <code>PartialFailure</code> ed exit 74 → richiesta risoluzione umana. Limite noto del pattern SAGA, nessun linguaggio lo elimina</td>
</tr>
</tbody>
</table>
<blockquote>
<p>Aeris è la <strong>prima linea difensiva</strong>, non l'unica. Promettere di più sarebbe disonesto con l'audience che conta (compliance, audit, security).</p>
</blockquote>
<footer>Aeris v0.3 · interpreted language for ops, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="31" data-paginate="true" data-header="TECHNICAL PRESENTATION · v0.3" data-footer="Aeris v0.3 · interpreted language for ops, AI and governance" data-theme="aeris" lang="it-IT" data-marpit-pagination="31" style="--paginate:true;--header:TECHNICAL PRESENTATION · v0.3;--footer:Aeris v0.3 · interpreted language for ops, AI and governance;--theme:aeris;" data-marpit-pagination-total="33">
<header>TECHNICAL PRESENTATION · v0.3</header>
<h1 id="v03--superficie-ergonomica">v0.3 — superficie ergonomica</h1>
<div class="columns">
<div class="column compact">
<p><strong>Stringhe, controllo, errori</strong></p>
<ul>
<li>Interpolazione <code>&quot;hi {name}&quot;</code> con <code>\{</code> / <code>\}</code> escapes (M16)</li>
<li><code>loop { … }</code> sugar per <code>while true</code> (M24)</li>
<li><code>??</code> null-coalesce: <code>Ok/Some/value → v</code>, <code>Err/None/() → rhs</code> (M24)</li>
<li><code>expr catch err { … }</code>, <code>error(&quot;...&quot;)</code>, <code>defer stmt</code> (M17)</li>
<li><code>every 5s { }</code>, <code>retry 3, delay: 1s { }</code>, <code>timeout 30s { }</code>, <code>clock.sleep</code> (M18)</li>
</ul>
<p><strong>Tipi e moduli</strong></p>
<ul>
<li><code>model X@v2 extends X@v1 { … }</code> (M23) — fields + <code>where:</code> ereditati</li>
<li>Top-level statements senza <code>main</code> (M26)</li>
<li>Parametri non tipati per script (<code>fn f(x, y)</code>) (v0.3)</li>
<li><code>strings.*</code>, <code>date.*</code>, <code>json.pretty/parse</code>, <code>yaml.parse</code> (M24)</li>
</ul>
</div>
<div class="column compact">
<p><strong>Toolkit AI</strong></p>
<ul>
<li><code>ai.session(system, model)</code> + <code>ai.session_ask(s, p)</code> con auto-compaction 40→20 (M19)</li>
<li><code>ai.decide(p, choices, retries?)</code> enum-style (M19)</li>
<li><code>ai.usage() → { total_tokens, cost_usd, calls }</code> (M19)</li>
<li><code>ai.chat(system, dir)</code> + <code>chat.ask</code> + <code>chat.kb_size</code> (M19.T6)</li>
<li><code>ai.network(max_rounds)</code> builder programmatico (M28)</li>
<li>Backend <code>cli</code> per <code>ai.complete</code> (M9.T1) — subprocess spawn</li>
</ul>
<p><strong>Test helpers</strong></p>
<ul>
<li><code>assert_status</code>, <code>assert_json</code>, <code>assert_semantic</code> (M21) — l'ultimo usa il backend AI come giudice</li>
</ul>
</div>
</div>
<blockquote>
<p>Trace, replay, <code>model@vN</code> e <code>policy</code> restano attivi sopra <strong>tutta</strong> la superficie v0.3: nessuna ergonomia toglie l'audit.</p>
</blockquote>

<header>TECHNICAL PRESENTATION · v0.3</header>
<h1 id="rilassamento-controllato-del-non-determinismo">Rilassamento controllato del non-determinismo</h1>
<p>La tesi v0.2 fissa la disciplina; la pratica v0.3 ammette che non tutti i progetti vogliono pagarla <em>da subito</em>. Tre modalità, una sola sorgente di verità.</p>
<table>
<thead>
<tr>
<th>Modalità</th>
<th>Default <code>aeris init</code></th>
<th>Effetto</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>enforce = &quot;off&quot;</code></td>
<td><strong>sì</strong> (v0.3)</td>
<td><code>cap[*]</code> sintetizzato a <code>main</code>; niente E65/E66/E67/E71; niente allow-list runtime</td>
</tr>
<tr>
<td><code>enforce = &quot;loose&quot;</code></td>
<td>—</td>
<td>manifest cap come ceiling runtime; le fn senza <code>cap</code> restano ammesse; le fn con <code>cap</code> sono check-ate normalmente</td>
</tr>
<tr>
<td><code>enforce = &quot;strict&quot;</code></td>
<td>—</td>
<td>piena disciplina v0.2 (<code>intent</code> obbligatorio, <code>cap[*]</code> rifiutato nel codice utente, surface lock)</td>
</tr>
</tbody>
</table>
<p><strong>Cosa NON cambia mai:</strong></p>
<ul>
<li>Trace JSONL sempre attivo</li>
<li><code>aeris replay</code> bit-identical sul subset deterministico</li>
<li>Validazione <code>model@vN</code> ai trust boundary</li>
<li><code>policy</code> valutata su ogni chiamata che matcha</li>
</ul>
<blockquote>
<p>Il rilassamento è solo del <strong>vincolo statico</strong>, non della <strong>registrazione runtime</strong>. Un progetto può salire la ladder (<code>off</code> → <code>loose</code> → <code>strict</code>) senza riscrivere codice — solo aggiungendo annotazioni.</p>
</blockquote>
<footer>Aeris v0.3 · interpreted language for ops, AI and governance</footer>
</section>

<tr>

<tr>
<td><strong>v0.2</strong></td>

<tr>
<td></td>

</tr>
<tr>
<td><strong>v0.3</strong></td>
<td>M15B <code>enforce = off | loose | strict</code> · M24 script surface (<code>loop</code>, <code>??</code>, <code>strings.*</code>, methods, natural JSON)</td>

</tr>

<td></td>
<td>M16 interpolazione <code>{x}</code> · M17 <code>catch</code>/<code>error</code>/<code>defer</code> · M18 <code>every</code>/<code>retry</code>/<code>timeout</code>/<code>clock.sleep</code> · M23 <code>model extends</code></td>

<td>partial</td>
</tr>
<tr>
