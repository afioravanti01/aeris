</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="14" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-class="tight" data-theme="aeris" lang="C" class="tight" data-marpit-pagination="14" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--class:tight;--theme:aeris;" data-marpit-pagination-total="43">
<header>Presentazione tecnica · v0.3</header>

<h1 id="il-sistema-di-moduli-a-tre-livelli">Il sistema di moduli a tre livelli</h1>
<div class="columns">
<div class="column">
<pre><code class="language-rust"><span class="hljs-comment">// Livello 1 — Libreria standard, compilata dentro al binario.</span>
<span class="hljs-keyword">use</span> io, json, http, fs, shell, audit, strings, date, yaml

<span class="hljs-comment">// Livello 2 — Gestori nativi per dominio specifico, anch&#x27;essi</span>
<span class="hljs-comment">// dentro al binario, ma con un proprio tipo di permesso.</span>
<span class="hljs-keyword">use</span> ai, kube

<span class="hljs-comment">// Livello 3 — Librerie esterne, scritte in Aeris, distribuite</span>
<span class="hljs-comment">// come repository su GitHub con impronta crittografica</span>
<span class="hljs-comment">// obbligatoria nel file di progetto.</span>
<span class="hljs-keyword">use</span> deploy from <span class="hljs-string">&quot;github.com/acmecorp/aeris-devops&quot;</span> deploy@<span class="hljs-string">&quot;1.2.0&quot;</span>
<span class="hljs-keyword">use</span> { rollout, status } from deploy        <span class="hljs-comment">// ri-esportazione selettiva</span>

<span class="hljs-comment">// Livello 3 (variante locale) — file Aeris sullo stesso disco.</span>
<span class="hljs-keyword">use</span> <span class="hljs-string">&quot;./lib/utilities.aer&quot;</span>
<span class="hljs-keyword">use</span> utilities from <span class="hljs-string">&quot;./lib/utilities.aer&quot;</span>   <span class="hljs-comment">// alias di spazio dei nomi</span>
</code></pre>
</div>
<div class="column compact">
<p><strong>Tre livelli, una sola parola chiave</strong></p>
<p>Tutte le importazioni si scrivono con la parola chiave <code>use</code>. Il livello viene dedotto dalla forma.</p>
<p><strong>Livello 1 — Libreria standard.</strong> Sono i moduli &quot;fondamentali&quot; del linguaggio: <code>io</code> (terminale), <code>fs</code> (file system), <code>http</code> (chiamate HTTP), <code>json</code> e <code>yaml</code> (decodifica/codifica), <code>strings</code>, <code>date</code>, <code>shell</code>, <code>audit</code>. Sono compilati dentro al binario <code>aeris</code> — l'unico eseguibile statico — e diventano visibili a richiesta tramite <code>use</code>.</p>
<p><strong>Livello 2 — Gestori nativi per dominio specifico.</strong> Anch'essi dentro al binario, ma con un tipo di permesso dedicato e una API più strutturata. In v0.3 sono <code>ai</code> (chiamate ai modelli linguistici) e <code>kube</code> (operazioni su Kubernetes). I loro effetti vengono registrati nella traccia con campi specifici del dominio.</p>
<p><strong>Livello 3 — Librerie esterne in Aeris.</strong> Sono file <code>.aer</code> scritti dagli utenti e distribuiti tramite GitHub oppure presenti sul file system locale. Ogni libreria esterna deve essere registrata nel <code>aeris.toml [deps]</code> con la sua <strong>impronta crittografica</strong> (<code>blake3:...</code>): il mismatch fra ciò che si scarica e ciò che è registrato è un errore fatale prima di iniziare l'esecuzione. Non esistono riferimenti mobili (<code>latest</code>, <code>*</code>, tag Git riassegnabili).</p>
<blockquote>
<p>Le librerie dei livelli 1 e 2 non aggiungono permessi al programma — è il <code>cap</code> dichiarato in firma che li abilita. L'<code>use</code> rende soltanto i nomi visibili nel file.</p>
</blockquote>
</div>
</div>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="15" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-class="tight" data-theme="aeris" lang="C" class="tight" data-marpit-pagination="15" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--class:tight;--theme:aeris;" data-marpit-pagination-total="43">
<header>Presentazione tecnica · v0.3</header>

<h1 id="il-file-di-progetto-come-riferimento-unico">Il file di progetto come riferimento unico</h1>
<div class="columns">
<div class="column">
<pre><code class="language-toml"><span class="hljs-section">[project]</span>
<span class="hljs-attr">name</span>  = <span class="hljs-string">&quot;pipeline-fatture&quot;</span>
<span class="hljs-attr">aeris</span> = <span class="hljs-string">&quot;0.3.0&quot;</span>

<span class="hljs-comment"># Dipendenze esterne con impronta crittografica.</span>
<span class="hljs-section">[deps]</span>
<span class="hljs-attr">deploy</span> = { source = <span class="hljs-string">&quot;github.com/acmecorp/aeris-devops&quot;</span>,
           <span class="hljs-attr">version</span> = <span class="hljs-string">&quot;1.2.0&quot;</span>, hash = <span class="hljs-string">&quot;blake3:...&quot;</span> }

<span class="hljs-comment"># Permessi consentiti al programma (tetto runtime).</span>
<span class="hljs-section">[caps]</span>
<span class="hljs-attr">enforce</span>         = <span class="hljs-string">&quot;strict&quot;</span>
<span class="hljs-attr">http.allow</span>      = [<span class="hljs-string">&quot;api.acme.com&quot;</span>]
<span class="hljs-attr">fs.allow_write</span>  = [<span class="hljs-string">&quot;./out/**&quot;</span>]
<span class="hljs-attr">ai.models</span>       = [<span class="hljs-string">&quot;claude-opus-4-7&quot;</span>]

<span class="hljs-comment"># Come raggiungere il modello.</span>
<span class="hljs-section">[ai.backend]</span>
<span class="hljs-attr">kind</span> = <span class="hljs-string">&quot;http&quot;</span>
<span class="hljs-attr">url</span>  = <span class="hljs-string">&quot;https://api.anthropic.com&quot;</span>
<span class="hljs-attr">auth</span> = <span class="hljs-string">&quot;env:ANTHROPIC_API_KEY&quot;</span>

<span class="hljs-comment"># Regole di runtime attive nel progetto.</span>
<span class="hljs-section">[policies]</span>
<span class="hljs-attr">active</span> = [<span class="hljs-string">&quot;egress_produzione&quot;</span>]
</code></pre>
</div>
<div class="column compact">
<p><strong>Un solo file <code>aeris.toml</code> per quello che oggi è sparso</strong></p>
<p>Il file di progetto raccoglie in un solo posto informazioni che oggi vivono distribuite fra variabili d'ambiente, file di manifest, file di configurazione e file di lock specifici dei singoli strumenti.</p>
<p><strong>Contiene quattro cose</strong></p>
<ul>
<li><strong>Le dipendenze</strong>: ogni libreria esterna è registrata con sorgente, versione e impronta crittografica del contenuto. Se la libreria scaricata non corrisponde all'impronta, il programma fallisce <em>prima</em> di iniziare l'esecuzione.</li>
<li><strong>I permessi consentiti</strong>: l'elenco di tutto ciò che il programma può fare verso l'esterno (rete, file system, modelli). Costituisce il <em>tetto</em> dei permessi che le singole funzioni possono dichiarare.</li>
<li><strong>Il backend del modello</strong>: come parlare al modello linguistico (chiamata HTTP a un'API o invocazione di un sottoprocesso da riga di comando).</li>
<li><strong>Le <code>policy</code> attive</strong>: quali regole di sicurezza vengono applicate a ogni chiamata.</li>
</ul>
<blockquote>
<p>La funzione <code>main</code> riceve i permessi <strong>sintetizzati a partire da questo file</strong>. Non esiste alcun altro modo di costruire un valore di tipo <code>cap</code> partendo da zero: i permessi entrano nel programma dall'unico punto controllato in revisione.</p>
</blockquote>
</div>
</div>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="16" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-class="divider" data-theme="aeris" lang="C" class="divider" data-marpit-pagination="16" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--class:divider;--theme:aeris;" data-marpit-pagination-total="43">
<header>Presentazione tecnica · v0.3</header>

<h1 id="parte-iii--le-capabilities">Parte III — Le capabilities</h1>
<blockquote>
<p>Il permesso di compiere un effetto esterno è un <strong>valore</strong> passato come parametro. La firma della funzione è il contratto. Non esiste uno spazio dei nomi globale da cui poter chiamare funzioni con effetti; non esistono effetti collaterali nascosti.</p>
</blockquote>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="17" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-class="tight" data-theme="aeris" lang="C" class="tight" data-marpit-pagination="17" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--class:tight;--theme:aeris;" data-marpit-pagination-total="43">
<header>Presentazione tecnica · v0.3</header>

<h1 id="una-capability-%C3%A8-un-valore-di-tipo-cap">Una capability è un valore di tipo <code>cap</code></h1>
<div class="columns">
<div class="column">
<pre><code class="language-rust"><span class="hljs-comment">// Funzione pura: senza il parametro cap non può compiere</span>
<span class="hljs-comment">// alcun effetto esterno (rete, file, modello).</span>
<span class="hljs-keyword">fn</span> <span class="hljs-title function_">totale</span>(items: list&lt;Fattura@v1&gt;) <span class="hljs-punctuation">-&gt;</span> decimal {
  items.<span class="hljs-title function_ invoke__">map</span>(<span class="hljs-title function_ invoke__">fn</span>(it) { it.importo }).<span class="hljs-title function_ invoke__">sum</span>()
}

<span class="hljs-comment">// Funzione con effetti: l&#x27;elenco degli effetti permessi</span>
<span class="hljs-comment">// è esposto interamente nella firma.</span>
<span class="hljs-keyword">fn</span> <span class="hljs-title function_">chiudi_lotto</span>(
  items: list&lt;Fattura@v1&gt;,
  cap: cap[
    http.post @ [<span class="hljs-string">&quot;api.acme.com&quot;</span>],   <span class="hljs-comment">// solo questo host</span>
    audit.event,                    <span class="hljs-comment">// qualsiasi evento</span>
  ],
) <span class="hljs-punctuation">-&gt;</span> result&lt;unit&gt; {
  intent <span class="hljs-string">&quot;chiudi il lotto fatture&quot;</span> {
    <span class="hljs-keyword">for</span> <span class="hljs-variable">it</span> <span class="hljs-keyword">in</span> items {
      http.<span class="hljs-title function_ invoke__">post</span>(<span class="hljs-string">&quot;https://api.acme.com/charge&quot;</span>, it)?
    }
    audit.<span class="hljs-title function_ invoke__">event</span>(<span class="hljs-string">&quot;chiusura.completata&quot;</span>, { conteggio: <span class="hljs-title function_ invoke__">len</span>(items) })
  }
}
</code></pre>
</div>
<div class="column compact">
<p><strong>Cosa significa &quot;capability come valore&quot;</strong></p>
<p>Per compiere una chiamata che ha un effetto esterno (<code>http.post</code>, <code>fs.write_file</code>, <code>ai.complete</code>, ...) una funzione deve aver ricevuto un parametro di tipo <code>cap</code> che concede quel preciso permesso. Senza tale parametro, il compilatore <em>rifiuta</em> la chiamata.</p>
<p>Il tipo <code>cap[...]</code> elenca le operazioni concesse e i loro vincoli: ogni operazione può avere una lista di valori ammessi (host per HTTP, percorso per il file system, modello per le chiamate AI, bucket, coda di messaggi, e così via).</p>
<p>La firma di <code>chiudi_lotto</code> dice <strong>tutto</strong>: questa funzione può fare <code>http.post</code> solo verso <code>api.acme.com</code> e scrivere eventi di audit; nient'altro. Né lei né le funzioni che chiama possono uscire da questo perimetro.</p>
<blockquote>
<p>È l'idea della <em>object-capability security</em>: tenere a vista il diritto di compiere un effetto, sotto forma di valore esplicito, invece di leggerlo da uno spazio dei nomi globale.</p>
</blockquote>
</div>
</div>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="18" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-class="tight" data-theme="aeris" lang="C" class="tight" data-marpit-pagination="18" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--class:tight;--theme:aeris;" data-marpit-pagination-total="43">
<header>Presentazione tecnica · v0.3</header>

<h1 id="restringere-la-capability-quando-si-passa-al-chiamato">Restringere la capability quando si passa al chiamato</h1>
<div class="columns">
<div class="column">
<pre><code class="language-rust"><span class="hljs-keyword">fn</span> <span class="hljs-title function_">chiudi_lotto</span>(items, cap: cap[
  http.post     @ [<span class="hljs-string">&quot;api.acme.com&quot;</span>, <span class="hljs-string">&quot;api.stripe.com&quot;</span>],
  fs.write_file @ [<span class="hljs-string">&quot;./out/**&quot;</span>],
]) {
  <span class="hljs-comment">// Quando si chiama `addebita` le si passa una capability</span>
  <span class="hljs-comment">// più stretta: solo http.post verso api.stripe.com.</span>
  <span class="hljs-comment">// Non si può MAI allargare ciò che si è ricevuto.</span>
  <span class="hljs-title function_ invoke__">addebita</span>(items, cap.subset[
    http.post @ [<span class="hljs-string">&quot;api.stripe.com&quot;</span>]
  ])
}

<span class="hljs-keyword">fn</span> <span class="hljs-title function_">addebita</span>(items, cap: cap[http.post @ [<span class="hljs-string">&quot;api.stripe.com&quot;</span>]]) {
  intent <span class="hljs-string">&quot;addebita le carte di credito&quot;</span> {
    <span class="hljs-keyword">for</span> <span class="hljs-variable">it</span> <span class="hljs-keyword">in</span> items { http.<span class="hljs-title function_ invoke__">post</span>(it.endpoint, it)? }
  }
}
</code></pre>
</div>
<div class="column compact">
<p><strong>Quattro regole strutturali</strong></p>
<p>Sono verificate dal controllore statico, prima che il programma giri.</p>
<ul>
<li>L'operatore <code>cap.subset[...]</code> accetta solo <strong>restringimenti</strong> della capability ricevuta. Un tentativo di allargarla (chiedere un permesso non posseduto) viene rifiutato.</li>
<li>Un valore di tipo <code>cap</code> non può essere salvato dentro un record, restituito come campo di un altro tipo, inviato attraverso un canale. La sua circolazione resta visibile nella firma delle funzioni.</li>
<li>La forma &quot;tuttofare&quot; <code>cap[*]</code> è proibita nel codice utente: nessuna funzione può chiedere &quot;tutti i permessi possibili&quot;.</li>
<li>Solo <code>main</code> riceve la capability iniziale, e la riceve <strong>sintetizzata a partire dal file di progetto</strong>. Non c'è modo di costruirne una da zero altrove.</li>
</ul>
<blockquote>
<p>Una capability che scende lungo l'albero delle chiamate può solo restringersi. Un attacco che cerca di inserire una chiamata a <code>evil.com</code> viene fermato dal compilatore, prima di arrivare in produzione.</p>
</blockquote>
</div>
</div>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="19" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-class="tight" data-theme="aeris" lang="C" class="tight" data-marpit-pagination="19" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--class:tight;--theme:aeris;" data-marpit-pagination-total="43">
<header>Presentazione tecnica · v0.3</header>

<h1 id="le-chiamate-con-effetti-sono-legate-al-cap-ricevuto">Le chiamate con effetti sono legate al <code>cap</code> ricevuto</h1>
<div class="columns">
<div class="column">
<pre><code class="language-rust"><span class="hljs-keyword">use</span> http       <span class="hljs-comment">// rende il modulo http visibile nel file</span>

<span class="hljs-comment">// FALLISCE: in questa funzione non esiste alcun cap</span>
<span class="hljs-comment">// che concede http.get. Il compilatore rifiuta la</span>
<span class="hljs-comment">// chiamata con un errore di tipo &quot;permesso mancante&quot;.</span>
<span class="hljs-keyword">fn</span> <span class="hljs-title function_">stato_servizio</span>() <span class="hljs-punctuation">-&gt;</span> int {
  http.<span class="hljs-title function_ invoke__">get</span>(<span class="hljs-string">&quot;https://api.acme.com/health&quot;</span>)?.status
}

<span class="hljs-comment">// OK: la firma dichiara il permesso http.get verso</span>
<span class="hljs-comment">// api.acme.com; la chiamata viene legata a quel cap.</span>
<span class="hljs-keyword">fn</span> <span class="hljs-title function_">stato_servizio_ok</span>(
  cap: cap[http.get @ [<span class="hljs-string">&quot;api.acme.com&quot;</span>]]
) <span class="hljs-punctuation">-&gt;</span> int {
  http.<span class="hljs-title function_ invoke__">get</span>(<span class="hljs-string">&quot;https://api.acme.com/health&quot;</span>)?.status
}
</code></pre>
</div>
<div class="column compact">
<p><strong>Le chiamate <code>modulo.operazione(...)</code> non sono globali</strong></p>
<p>Quando in un programma compare <code>http.get(...)</code>, non si sta invocando una funzione di uno spazio dei nomi globale. Il compilatore risolve la chiamata cercando, fra i parametri visibili nel contesto, un valore di tipo <code>cap</code> che concede l'operazione <code>http.get</code>. Se non lo trova, la chiamata viene rifiutata.</p>
<p><strong>Conseguenze pratiche</strong></p>
<ul>
<li>Importare un modulo (<code>use http</code>) non introduce alcuna funzione globale <code>http.post</code>. L'<code>use</code> rende visibile il nome del modulo per scrivere la chiamata, ma il permesso vero arriva sempre dal <code>cap</code> ricevuto.</li>
<li>Aggiungere <code>use http</code> in cima al file non abilita nulla: serve un <code>cap</code> nella firma della funzione che lo concede.</li>
<li>Un modello linguistico che genera codice e dimentica di dichiarare il permesso necessario <strong>fallisce al momento del controllo statico</strong>, prima di girare. L'errore viene visto in fase di revisione, non in produzione.</li>
</ul>
</div>
</div>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="20" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-class="tight" data-theme="aeris" lang="C" class="tight" data-marpit-pagination="20" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--class:tight;--theme:aeris;" data-marpit-pagination-total="43">
<header>Presentazione tecnica · v0.3</header>

<h1 id="la-firma-delle-funzioni-pub-viene-congelata-in-un-file-di-blocco">La firma delle funzioni <code>pub</code> viene congelata in un file di blocco</h1>
<div class="columns">
<div class="column">
<pre><code class="language-toml"><span class="hljs-comment"># .aeris/surface.lock — generato da `aeris lock surface`,</span>
<span class="hljs-comment"># controllato in revisione.</span>

<span class="hljs-section">[chiudi_lotto]</span>
<span class="hljs-attr">caps</span> = [
  <span class="hljs-string">&quot;http.post @ [\&quot;api.acme.com\&quot;]&quot;</span>,
  <span class="hljs-string">&quot;audit.event&quot;</span>,
]

<span class="hljs-section">[totale]</span>
<span class="hljs-attr">caps</span> = []     <span class="hljs-comment"># funzione pura, nessun effetto esterno</span>

<span class="hljs-section">[stato_servizio_ok]</span>
<span class="hljs-attr">caps</span> = [
  <span class="hljs-string">&quot;http.get @ [\&quot;api.acme.com\&quot;]&quot;</span>,
]
</code></pre>
</div>
<div class="column compact">
<p><strong>Cosa c'è nel file di blocco</strong></p>
<p>Per ogni funzione <code>pub</code> (esportata) del progetto, il file <code>.aeris/surface.lock</code> registra l'elenco esatto dei permessi che la firma dichiara. Il file viene generato automaticamente con <code>aeris lock surface</code> e viene messo sotto controllo di versione.</p>
<p><strong>Cosa significa in revisione</strong></p>
<p>Quando qualcuno (umano o modello) modifica una funzione esportata aggiungendo un nuovo effetto — per esempio una chiamata di rete dove prima non ce n'erano — il file di blocco va rigenerato, e la differenza appare come <strong>prima modifica</strong> nella richiesta di merge.</p>
<ul>
<li>Un allargamento dei permessi richiede di rigenerare il file: il revisore vede il diff come prima cosa.</li>
<li>Un restringimento non richiede di rigenerarlo (il vecchio insieme è ancora un sovrainsieme di quello nuovo).</li>
<li><code>aeris fmt --narrow-caps</code> propone in automatico il restringimento minimo della firma in base ai permessi davvero usati dal corpo della funzione.</li>
</ul>
<blockquote>
<p>Una pull request generata da un modello che aggiunge una chiamata di rete a una funzione finora isolata risulta visibile a colpo d'occhio: la prima cosa che il revisore legge è il cambio del file di blocco.</p>
</blockquote>
</div>
</div>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="21" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-class="divider" data-theme="aeris" lang="C" class="divider" data-marpit-pagination="21" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--class:divider;--theme:aeris;" data-marpit-pagination-total="43">
<header>Presentazione tecnica · v0.3</header>

<h1 id="parte-iv--contratti-intenzioni-schemi">Parte IV — Contratti, intenzioni, schemi</h1>
<blockquote>
<p>Tre costrutti per portare il <em>perché</em> del codice dentro la grammatica: condizioni di ingresso e di uscita di una funzione, dichiarazione di scopo obbligatoria sulle scritture esterne, schemi versionati validati sui confini di fiducia.</p>
</blockquote>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="22" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-class="tight" data-theme="aeris" lang="C" class="tight" data-marpit-pagination="22" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--class:tight;--theme:aeris;" data-marpit-pagination-total="43">
<header>Presentazione tecnica · v0.3</header>

<h1 id="condizioni-di-ingresso-e-di-uscita--requires-ed-ensures">Condizioni di ingresso e di uscita — <code>requires:</code> ed <code>ensures:</code></h1>
<div class="columns">
<div class="column">
<pre><code class="language-rust"><span class="hljs-keyword">fn</span> <span class="hljs-title function_">paga</span>(
  importo: decimal,
  conto:   string,
  cap:     cap[http.post @ [<span class="hljs-string">&quot;api.stripe.com&quot;</span>]],
) <span class="hljs-punctuation">-&gt;</span> result&lt;Ricevuta@v1&gt;
  <span class="hljs-comment">// pre-condizioni: controllate all&#x27;ingresso</span>
  requires: importo &gt; <span class="hljs-number">0</span>
  requires: <span class="hljs-title function_ invoke__">len</span>(conto) == <span class="hljs-number">26</span>

  <span class="hljs-comment">// post-condizione: controllata su ogni via di uscita</span>
  ensures:  result.ok implies result.value.importo == importo
{
  intent <span class="hljs-string">&quot;addebita il cliente&quot;</span> {
    <span class="hljs-keyword">let</span> <span class="hljs-variable">r</span> = http.<span class="hljs-title function_ invoke__">post</span>(<span class="hljs-string">&quot;https://api.stripe.com/v1/charges&quot;</span>,
                       { importo, conto })?
    <span class="hljs-title function_ invoke__">Ok</span>(Ricevuta@v1 { importo, id_transazione: r.id })
  }
}
</code></pre>
</div>
<div class="column compact">
<p><strong>Cosa dichiarano <code>requires:</code> ed <code>ensures:</code></strong></p>
<p><code>requires:</code> elenca le pre-condizioni che gli argomenti devono soddisfare <em>prima</em> che il corpo della funzione venga eseguito. <code>ensures:</code> elenca le post-condizioni che il valore di ritorno deve soddisfare <em>dopo</em>, su qualsiasi via di uscita della funzione (ritorno normale, ritorno anticipato, propagazione di errore).</p>
<p>Il binding speciale <code>result</code> dentro <code>ensures:</code> permette di ragionare sul valore restituito.</p>
<p><strong>Cosa succede quando una condizione fallisce</strong></p>
<p>La violazione produce un errore strutturale del tipo <code>ContractViolation</code>. Il runtime:</p>
<ol>
<li>registra l'evento nella traccia, incluse le variabili coinvolte;</li>
<li>svuota i buffer di scrittura della traccia su disco;</li>
<li>termina il programma con codice di uscita 64.</li>
</ol>
<blockquote>
<p>Una violazione di contratto <strong>non</strong> si propaga con <code>?</code> né si recupera con <code>catch</code>: è un errore strutturale, non un errore di dominio. Recuperare in silenzio da una violazione di contratto significherebbe vanificare la dichiarazione del contratto stesso.</p>
</blockquote>
</div>
</div>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="23" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-class="tight" data-theme="aeris" lang="C" class="tight" data-marpit-pagination="23" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--class:tight;--theme:aeris;" data-marpit-pagination-total="43">
<header>Presentazione tecnica · v0.3</header>

<h1 id="il-blocco-intent-%C3%A8-obbligatorio-su-ogni-scrittura-esterna">Il blocco <code>intent</code> è obbligatorio su ogni scrittura esterna</h1>
<div class="columns">
<div class="column">
<pre><code class="language-rust"><span class="hljs-comment">// FALLISCE al controllo statico:</span>
<span class="hljs-comment">// &quot;manca il blocco intent intorno a una scrittura esterna&quot;</span>
<span class="hljs-keyword">fn</span> <span class="hljs-title function_">ruota_certificato</span>(
  cap: cap[fs.write_file @ [<span class="hljs-string">&quot;/etc/ssl/**&quot;</span>]],
) <span class="hljs-punctuation">-&gt;</span> result&lt;unit&gt; {
  fs.<span class="hljs-title function_ invoke__">write_file</span>(<span class="hljs-string">&quot;/etc/ssl/new.pem&quot;</span>, <span class="hljs-title function_ invoke__">nuovo_pem</span>())
}
</code></pre>
<pre><code class="language-rust"><span class="hljs-comment">// CORRETTO: il blocco intent dichiara lo scopo della</span>
<span class="hljs-comment">// scrittura. La descrizione finisce nella traccia.</span>
<span class="hljs-keyword">fn</span> <span class="hljs-title function_">ruota_certificato</span>(
  cap: cap[fs.write_file @ [<span class="hljs-string">&quot;/etc/ssl/**&quot;</span>]],
) <span class="hljs-punctuation">-&gt;</span> result&lt;unit&gt; {
  intent <span class="hljs-string">&quot;ruota il certificato TLS prima dello scadere a 30 giorni&quot;</span> {
    fs.<span class="hljs-title function_ invoke__">write_file</span>(<span class="hljs-string">&quot;/etc/ssl/new.pem&quot;</span>, <span class="hljs-title function_ invoke__">nuovo_pem</span>())
  }
}
</code></pre>
</div>
<div class="column compact">
<p><strong>Quali chiamate richiedono un <code>intent</code></strong></p>
<p>Tutte le operazioni che producono un effetto <strong>scritturale</strong> verso l'esterno: scritture su file system (<code>fs.write_*</code>), HTTP modificanti (<code>http.{post,put,patch,delete}</code>), apply su Kubernetes (<code>kube.apply</code>), eventi di audit (<code>audit.*</code>), chiamate al modello (<code>ai.*</code>).</p>
<p>Le operazioni di sola lettura (<code>io.println</code>, <code>fs.read_file</code>, <code>http.get</code>) non lo richiedono: possono comparire dentro un blocco <code>intent</code> ma non sono obbligate a farlo.</p>
<p><strong>Cosa finisce nella traccia</strong></p>
<p>Il runtime emette tre eventi attorno al blocco:</p>
<ul>
<li><code>intent_enter</code> all'ingresso: contiene la descrizione testuale, lo scope, il timestamp.</li>
<li><code>intent_exit</code> all'uscita: contiene l'esito (<code>ok</code>, <code>err</code>, <code>partial</code>) e la durata.</li>
<li>Ogni evento emesso <em>dentro</em> il corpo porta il campo <code>&quot;intent&quot;</code> con la stessa descrizione, in modo che si riesca a risalire allo scopo di ogni singola riga della traccia.</li>
</ul>
<blockquote>
<p>Lo scopo della scrittura diventa parte della grammatica. Una pull request non può aggiungere una scrittura esterna in silenzio: il <code>intent</code> deve esistere, e la sua descrizione è leggibile al colpo d'occhio.</p>
</blockquote>
</div>
</div>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="24" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-class="tight" data-theme="aeris" lang="C" class="tight" data-marpit-pagination="24" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--class:tight;--theme:aeris;" data-marpit-pagination-total="43">
<header>Presentazione tecnica · v0.3</header>

<h1 id="schemi-versionati--model-xvn">Schemi versionati — <code>model X@vN</code></h1>
<div class="columns">
<div class="column">
<pre><code class="language-rust">model Fattura@v1 {
  id:       uuid
  importo:  decimal <span class="hljs-keyword">where</span> importo &gt; <span class="hljs-number">0</span>
  cliente:  string  <span class="hljs-keyword">where</span> <span class="hljs-title function_ invoke__">len</span>(cliente) &lt;= <span class="hljs-number">64</span>
  stato:    StatoFattura

  <span class="hljs-comment">// Vincoli che coinvolgono più campi insieme</span>
  <span class="hljs-comment">// si scrivono come &quot;where:&quot; a livello del record.</span>
  <span class="hljs-keyword">where</span>: stato == Annullata implies importo == <span class="hljs-number">0</span>
}

<span class="hljs-comment">// Sui confini di fiducia (richieste HTTP in ingresso,</span>
<span class="hljs-comment">// decodifica JSON, scambi fra agenti) il tipo DEVE</span>
<span class="hljs-comment">// portare la sua versione. Usare &quot;Fattura&quot; senza @vN</span>
<span class="hljs-comment">// è rifiutato dal controllore.</span>
<span class="hljs-keyword">fn</span> <span class="hljs-title function_">ingerisci</span>(raw: string) <span class="hljs-punctuation">-&gt;</span> result&lt;Fattura@v1&gt; {
  json.decode&lt;Fattura@v1&gt;(raw)   <span class="hljs-comment">// validazione automatica al confine</span>
}
</code></pre>
</div>
<div class="column compact">
<p><strong>Cos'è un <code>model@vN</code></strong></p>
<p>È uno schema tipizzato — l'analogo di una <code>struct</code> Rust o di un <code>class</code> Python — etichettato con un numero di versione obbligatorio. La versione è parte del tipo: <code>Fattura@v1</code> e <code>Fattura@v2</code> sono due tipi distinti, non convertibili l'uno nell'altro senza una funzione di migrazione esplicita.</p>
<p><strong>Quando il valore viene validato a runtime</strong></p>
<ul>
<li>alla costruzione (<code>Fattura@v1 { ... }</code>);</li>
<li>alla decodifica da JSON (<code>json.decode&lt;Fattura@v1&gt;(...)</code>);</li>
<li>al passaggio fra agenti (lo schema <code>accept</code> / <code>produce</code> di ogni agente);</li>
<li>in ingresso da HTTP o da una coda di messaggi.</li>
</ul>
<p><strong>Due forme di vincolo</strong></p>
<ul>
<li>Vincolo per campo: <code>importo: decimal where importo &gt; 0</code>.</li>
<li>Vincolo a livello del record, che mette in relazione più campi: <code>where: stato == Annullata implies importo == 0</code>.</li>
</ul>
<blockquote>
<p>Il versioning <strong>è obbligatorio sui confini di fiducia</strong> del programma. Una bare <code>Fattura</code> (senza <code>@vN</code>) viene rifiutata dal controllore statico con codice di uscita 68. La migrazione fra versioni è sempre una funzione pura, scritta a mano: niente conversioni implicite, niente sorprese alla decodifica.</p>
</blockquote>
</div>
</div>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="25" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-class="divider" data-theme="aeris" lang="C" class="divider" data-marpit-pagination="25" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--class:divider;--theme:aeris;" data-marpit-pagination-total="43">
<header>Presentazione tecnica · v0.3</header>

<h1 id="parte-v--operazioni-reversibili-e-agenti-ai">Parte V — Operazioni reversibili e agenti AI</h1>
<blockquote>
<p>Operazioni composte da più passi, dove ogni passo dichiara come <strong>compensare</strong> in caso di errore (<code>saga</code>). Agenti AI come unità tipizzate (<code>agent</code>). Reti di agenti come grafi aciclici fra unità (<code>agent_net</code>).</p>
</blockquote>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="26" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-class="tight" data-theme="aeris" lang="C" class="tight" data-marpit-pagination="26" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--class:tight;--theme:aeris;" data-marpit-pagination-total="43">
<header>Presentazione tecnica · v0.3</header>

<h1 id="una-saga--passi-con-do-e-undo-obbligatori">Una <code>saga</code> — passi con <code>do</code> e <code>undo</code> obbligatori</h1>
<div class="columns">
<div class="column">
<pre><code class="language-rust">saga <span class="hljs-title function_ invoke__">chiudi_lotto</span>(
  lotto: list&lt;Fattura@v1&gt;,
  cap:   cap[
    http.post  @ [<span class="hljs-string">&quot;api.acme.com&quot;</span>],
    kube.apply @ [<span class="hljs-string">&quot;prod-eu-1&quot;</span>],
    audit.event,
  ],
) {
  intent <span class="hljs-string">&quot;chiudi il lotto fatture e avvisa la finanza&quot;</span>

  step addebita {
    <span class="hljs-keyword">do</span>   { <span class="hljs-keyword">for</span> <span class="hljs-variable">it</span> <span class="hljs-keyword">in</span> lotto { http.<span class="hljs-title function_ invoke__">post</span>(<span class="hljs-string">&quot;https://api.acme.com/charge&quot;</span>, it)? } }
    undo { <span class="hljs-keyword">for</span> <span class="hljs-variable">it</span> <span class="hljs-keyword">in</span> lotto { http.<span class="hljs-title function_ invoke__">post</span>(<span class="hljs-string">&quot;https://api.acme.com/refund&quot;</span>, it)? } }
  }

  step registro {
    requires: addebita.ok
    <span class="hljs-keyword">do</span>   { kube.<span class="hljs-title function_ invoke__">apply</span>(<span class="hljs-title function_ invoke__">manifesto_registro</span>(lotto))? }
    undo { kube.<span class="hljs-title function_ invoke__">delete</span>(<span class="hljs-title function_ invoke__">manifesto_registro</span>(lotto))? }
  }

  step audit {
    requires: registro.ok
    <span class="hljs-keyword">do</span>   { audit.<span class="hljs-title function_ invoke__">event</span>(<span class="hljs-string">&quot;chiusura.completata&quot;</span>,    { conteggio: <span class="hljs-title function_ invoke__">len</span>(lotto) }) }
    undo { audit.<span class="hljs-title function_ invoke__">event</span>(<span class="hljs-string">&quot;chiusura.annullata&quot;</span>,     { conteggio: <span class="hljs-title function_ invoke__">len</span>(lotto) }) }
  }
}
</code></pre>
</div>
<div class="column compact">
<p><strong>Cosa garantisce una <code>saga</code></strong></p>
<p>Una <code>saga</code> è un'operazione composta da più passi (<code>step</code>), dove ogni passo dichiara <em>come si fa</em> (<code>do</code>) e <em>come si annulla</em> (<code>undo</code>).</p>
<p>Se uno step intermedio fallisce, il runtime esegue automaticamente gli <code>undo</code> dei passi già completati, in ordine inverso. L'effetto è quello di una transazione: o l'intera operazione va a buon fine, oppure il sistema torna allo stato precedente.</p>
<p><strong>Regole strutturali</strong></p>
<ul>
<li><code>do</code> e <code>undo</code> sono <strong>obbligatori</strong> su ogni passo. La forma <code>undo: noop</code> è ammessa solo quando il <code>do</code> non scrive nulla all'esterno (per esempio se è una pura lettura). Una scrittura senza <code>undo</code> viene rifiutata dal controllore statico.</li>
<li>Gli esiti possibili sono <strong>tre, deterministici</strong>: <code>ok</code> (tutto a buon fine), <code>rolled_back</code> (rollback completato con successo), <code>parziale</code> (uno o più <code>undo</code> hanno esaurito i ritentativi). Non esiste un quarto stato &quot;a metà strada&quot;.</li>
</ul>
<blockquote>
<p>Una <code>saga</code> rende il rollback un'esigenza grammaticale, non una scelta del programmatore. Una pipeline che scrive senza dichiarare come disfare la scrittura non parsa.</p>
</blockquote>
</div>
</div>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="27" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-theme="aeris" lang="C" data-marpit-pagination="27" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--theme:aeris;" data-marpit-pagination-total="43">
<header>Presentazione tecnica · v0.3</header>
<h1 id="chiavi-di-idempotenza-generate-automaticamente-dal-runtime">Chiavi di idempotenza generate automaticamente dal runtime</h1>
<div class="columns">
<div class="column compact">
<p><strong>Il problema dell'idempotenza</strong></p>
<p>Quando un'operazione esterna fallisce a metà — chiamata HTTP scaduta, connessione di rete caduta — il runtime non sa se l'effetto sul sistema remoto sia avvenuto o meno. Un semplice ritentativo rischia di duplicare l'effetto: due addebiti per la stessa fattura, due <code>apply</code> dello stesso manifesto Kubernetes.</p>
<p><strong>Come Aeris lo risolve</strong></p>
<p>Per ogni chiamata di scrittura, il runtime genera <strong>automaticamente</strong> una chiave di idempotenza derivata da:</p>
<pre><code class="language-text">chiave = blake3(id_traccia ‖ nome_step ‖ indice_invocazione)
</code></pre>
<p>Cioè un'impronta crittografica che dipende solo dall'identità dell'esecuzione e dal punto del programma. Lo stesso programma rigiocato con <code>aeris replay</code> produce le stesse chiavi: il sistema remoto, se le riconosce, scarta i duplicati.</p>
</div>
<div class="column compact">
<p><strong>Dove viene inserita la chiave</strong></p>
<p>A seconda del protocollo, il runtime la inserisce nel campo che il sistema remoto si aspetta.</p>
<table>
<thead>
<tr>
<th>Operazione</th>
<th>Dove finisce la chiave</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>http.post</code>, <code>http.put</code>, <code>http.patch</code></td>
<td>Intestazione <code>Idempotency-Key: &lt;chiave&gt;</code></td>
</tr>
<tr>
<td><code>kube.apply</code></td>
<td>Annotation <code>aeris.dev/idempotency-key: &lt;chiave&gt;</code></td>
</tr>
<tr>
<td><code>rabbitmq.publish</code></td>
<td>Campo <code>message-id: &lt;chiave&gt;</code></td>
</tr>
<tr>
<td><code>mongodb.insert</code></td>
<td>Campo di sentinella <code>_aeris_idem: &lt;chiave&gt;</code></td>
</tr>
</tbody>
</table>
<p><strong>Conseguenze pratiche</strong></p>
<ul>
<li>Rigiocare uno step già completato non lo esegue di nuovo: il sistema remoto, vedendo la chiave già usata, risponde senza ripetere l'effetto.</li>
<li>Durante un rollback, i ritentativi sui passi <code>undo</code> non duplicano gli annullamenti già applicati.</li>
<li>La frequenza pratica dello stato &quot;parziale&quot; si riduce molto. Il problema non si elimina del tutto (richiede cooperazione del sistema remoto), ma il linguaggio fa quello che può.</li>
</ul>
</div>
</div>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="28" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-class="tight" data-theme="aeris" lang="C" class="tight" data-marpit-pagination="28" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--class:tight;--theme:aeris;" data-marpit-pagination-total="43">
<header>Presentazione tecnica · v0.3</header>

<h1 id="un-singolo-agente-ai-come-costrutto-del-linguaggio">Un singolo agente AI come costrutto del linguaggio</h1>
<div class="columns">
<div class="column">
<pre><code class="language-rust">model Fattura@v1   { id: uuid, importo: decimal <span class="hljs-keyword">where</span> importo &gt; <span class="hljs-number">0</span> }
model Categoria@v1 { tipo: string }

agent classifica {
  llm:     <span class="hljs-string">&quot;claude-haiku-4-5&quot;</span>
  intent:  <span class="hljs-string">&quot;classifica la fattura per tipo di spesa&quot;</span>
  prompt:  <span class="hljs-string">&quot;&quot;</span><span class="hljs-string">&quot;
    Classifica la fattura di importo {input.importo}.
    Restituisci un JSON con un solo campo `tipo`.
  &quot;</span><span class="hljs-string">&quot;&quot;</span>
  accept:  Fattura@v1
  produce: Categoria@v1
  retries: <span class="hljs-number">2</span>
  budget:  { tokens: <span class="hljs-number">2_000</span>, latency: <span class="hljs-number">3</span>s }
}

<span class="hljs-keyword">fn</span> <span class="hljs-title function_">main</span>(cap: cap[ai.complete @ [<span class="hljs-string">&quot;claude-haiku-4-5&quot;</span>]])
  <span class="hljs-punctuation">-&gt;</span> result&lt;Categoria@v1&gt;
{
  intent <span class="hljs-string">&quot;classifica una fattura&quot;</span> {
    <span class="hljs-title function_ invoke__">classifica</span>(Fattura@v1 { id: <span class="hljs-title function_ invoke__">uuid_v7</span>(), importo: <span class="hljs-number">99.0</span> }, cap)
  }
}
</code></pre>
</div>
<div class="column compact">
<p><strong>Cosa dichiara un <code>agent</code></strong></p>
<p>Un <code>agent</code> è un'unità di chiamata al modello linguistico promossa a costrutto del linguaggio. Dichiara cinque cose:</p>
<ul>
<li><code>llm</code>: il nome del modello da usare;</li>
<li><code>intent</code>: lo scopo, parte del trace ad ogni invocazione;</li>
<li><code>prompt</code>: il testo da inviare, con interpolazione dei campi dell'input;</li>
<li><code>accept</code> e <code>produce</code>: gli schemi versionati (<code>model@vN</code>) dell'input e dell'output, validati a ogni chiamata;</li>
<li><code>retries:</code> e <code>budget:</code>: vincoli su ritentativi, token e latenza.</li>
</ul>
<p><strong>Cosa fa il runtime per ogni invocazione</strong></p>
<ul>
<li>Inietta automaticamente nel prompt di sistema un <strong>contratto di formato</strong> in JSON che descrive lo schema di uscita atteso. Il prompt del modello non lo deve scrivere a mano.</li>
<li>Valida la risposta contro lo schema <code>produce</code>. Se la risposta non corrisponde, ritenta entro il budget <code>retries:</code>.</li>
<li>Se viene sforato il budget di token o latenza, l'agente fallisce con <code>BudgetExceeded</code> e codice di uscita 1.</li>
<li>L'intera invocazione (prompt, risposta, token, esito) viene registrata nel file di traccia per il replay successivo.</li>
</ul>
</div>
</div>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="29" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-class="tight" data-theme="aeris" lang="C" class="tight" data-marpit-pagination="29" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--class:tight;--theme:aeris;" data-marpit-pagination-total="43">
<header>Presentazione tecnica · v0.3</header>

<h1 id="una-rete-di-agenti--agent_net">Una rete di agenti — <code>agent_net</code></h1>
<div class="columns">
<div class="column">
<pre><code class="language-rust">agent_net pipeline_fatture {
  intent <span class="hljs-string">&quot;estrai → classifica → smista la fattura&quot;</span>

  flow estrai     <span class="hljs-punctuation">-&gt;</span> classifica   <span class="hljs-punctuation">-&gt;</span> smista
  flow classifica <span class="hljs-punctuation">-&gt;</span> { audit, archivio }   <span class="hljs-comment">// fork sui due rami</span>
  flow audit      <span class="hljs-punctuation">-&gt;</span> avvisa_finanza

  <span class="hljs-comment">// L&#x27;iterazione si ferma quando la fiducia del classificatore</span>
  <span class="hljs-comment">// supera 0.95, o dopo 3 giri.</span>
  until: classifica.confidence &gt; <span class="hljs-number">0.95</span> or iterations &gt;= <span class="hljs-number">3</span>
}
</code></pre>
<figure class="aeris-figure">

</div>
<div class="column compact">
<p><strong>Cos'è una <code>agent_net</code></strong></p>
<p>È un grafo di agenti connessi da archi <code>flow</code>. Il grafo deve essere <strong>aciclico</strong>: un ciclo dichiarato esplicitamente nel codice viene rifiutato dal controllore con codice di uscita 70. L'iterazione si ottiene con la clausola <code>until:</code>, che mette un bound massimo sul numero di giri.</p>
<p><strong>Come avviene lo smistamento</strong></p>
<p>Il runtime risolve la diramazione a un nodo a più uscite confrontando lo schema <code>produce</code> del nodo di partenza con gli schemi <code>accept</code> dei nodi di destinazione: prende il ramo i cui schemi combaciano. Il protocollo di smistamento è parte del <strong>programma</strong>, non una stringa di prompt scritta a mano.</p>
<p><strong>Composizione</strong></p>
<p>Una <code>agent_net</code> può comparire come nodo di un'altra <code>agent_net</code>, permettendo di comporre reti più grandi a partire da reti più piccole. Gli esiti possibili sono <code>ok(valore)</code> oppure <code>Err(&quot;agent_net &lt;nome&gt; esaurita&quot;)</code> quando il bound di iterazioni viene raggiunto senza convergenza.</p>
<blockquote>
<p>Lo schema dei messaggi che attraversano la rete è parte della firma. Una hallucination del modello che viola lo schema viene bloccata dal sistema dei tipi, non dal revisore umano.</p>
</blockquote>
</div>
</div>
