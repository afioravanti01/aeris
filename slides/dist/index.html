<p class="eyebrow">Presentazione tecnica · v0.3</p>
<h2 id="aeris-v03">AERIS v0.3</h2>
<p>Linguaggio di programmazione interpretato, pensato per <strong>operazioni di sistema, intelligenza artificiale e automazione</strong>. La sua particolarità è essere scritto <em>e</em> letto da LLM (<em>large language model</em> — modelli linguistici): l'accesso a rete, file system e modelli è descritto nella firma delle funzioni, ogni scrittura esterna dichiara il proprio scopo, e ogni esecuzione viene registrata in modo da essere riprodotta byte per byte.</p>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>

<header>Presentazione tecnica · v0.3</header>
<h1 id="il-problema-da-risolvere">Il problema da risolvere</h1>
<p>Oggi il codice viene generato dai modelli linguistici (LLM) e a sua volta letto da altri modelli per essere modificato o eseguito. Su un programma del genere si sommano tre sorgenti di comportamento imprevedibile, e nessuno strumento tradizionale le copre tutte insieme:</p>
<ul>
<li><strong>Il modello stesso.</strong> A parità di prompt produce uscite diverse. Impostare <code>temperature = 0</code> riduce la varianza, non la elimina.</li>
<li><strong>La grammatica del linguaggio.</strong> Costrutti ambigui o con più scritture valide costringono il modello a indovinare la forma giusta.</li>
<li><strong>Lo stato del mondo esterno.</strong> La rete cade, il database cambia sotto i piedi, il file system viene modificato da altri processi.</li>
</ul>
<p>Le difese che oggi sono in uso coprono solo una parte del problema:</p>
<ul>
<li>I container (Docker, gVisor) controllano cosa il processo <em>può fare</em> a livello di sistema operativo, ma non sanno quale singola funzione del programma tocca quale risorsa.</li>
<li>I sistemi di tipi (TypeScript, Java, Rust) parlano della forma dei dati, non degli effetti che ogni funzione produce.</li>
<li>I sistemi a effetti accademici (F*, Liquid Haskell, Koka) offrono il rigore voluto, ma il costo cognitivo è troppo alto per un team aziendale medio.</li>
<li>I framework di dominio (Airflow, LangChain) impongono convenzioni che il linguaggio non sa far rispettare.</li>
</ul>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="4" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-theme="aeris" lang="it-IT" data-marpit-pagination="4" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--theme:aeris;" data-marpit-pagination-total="39">
<header>Presentazione tecnica · v0.3</header>
<h1 id="cos%C3%A8-aeris-in-concreto">Cos'è Aeris, in concreto</h1>
<div class="columns">
<div class="column compact">
<p><strong>Il prodotto</strong></p>
<ul>
<li>Linguaggio <strong>interpretato</strong>, scritto in Rust.</li>
<li>Un singolo eseguibile statico chiamato <code>aeris</code>, sotto gli 8 MB, senza alcuna dipendenza esterna: si scarica e si esegue.</li>
<li>I programmi sono file di testo con estensione <code>.aer</code>.</li>
<li>Il modello di esecuzione è un <em>tree-walking interpreter</em>: il programma viene letto, trasformato in un albero sintattico, e il runtime visita l'albero nodo per nodo. Niente compilazione, niente codice intermedio.</li>
</ul>
<p><strong>Cosa succede a ogni esecuzione</strong></p>
<ul>
<li><code>aeris run programma.aer</code> esegue il programma.</li>
<li>In parallelo, viene scritto un <em>file di traccia</em> nella cartella <code>.aeris/traces/</code>. Il formato è JSON Lines: un oggetto JSON per ogni riga, una riga per ogni chiamata significativa.</li>
<li><code>aeris replay &lt;id-traccia&gt;</code> rigioca offline l'intero programma a partire dalla traccia, ottenendo le stesse identiche risposte sulle parti deterministiche.</li>
</ul>
</div>
<div class="column">
<p><strong>Il linguaggio è organizzato in quattro livelli</strong></p>
<div class="mermaid">
flowchart TB
  L1["<b>Livello 1 — Sintassi</b><br />variabili, tipi, controllo di flusso"]
  L2["<b>Livello 2 — Semantica verificabile</b><br />capabilities, contratti, intent"]
  L3["<b>Livello 3 — Operazioni reversibili</b><br />saga con do / undo obbligatori"]
  L4["<b>Livello 4 — Coordinamento di agenti AI</b><br />agent, agent_net tipato"]
  L1 --&gt; L2 --&gt; L3 --&gt; L4
  classDef base fill:#F6F3F0,stroke:#1C2035,stroke-width:1px,color:#0E1020;
  class L1,L2,L3,L4 base;
</div>
<p>Ogni livello <em>si compone</em> con quello sotto. I livelli si attivano a richiesta: uno script da poche righe vive nel solo livello 1, una pipeline che si ripristina da sola usa i livelli 1, 2 e 3, un sistema multi-agente coordinato li usa tutti e quattro.</p>
</div>
</div>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="5" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-theme="aeris" lang="it-IT" data-marpit-pagination="5" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--theme:aeris;" data-marpit-pagination-total="39">
<header>Presentazione tecnica · v0.3</header>
<h1 id="a-chi-serve-aeris">A chi serve Aeris</h1>
<div class="columns">
<div class="column compact">
<p><strong>Un linguaggio a uso generale</strong></p>
<p>Aeris è un linguaggio di programmazione <em>a uso generale</em>: con Aeris si scrivono programmi da riga di comando, validatori, parser, piccoli servizi e tutte le automazioni che oggi si scriverebbero in Python o in Go. La sintassi è familiare a chi conosce Rust, Swift, Kotlin o TypeScript.</p>
<p>Tre profili trovano nel linguaggio strumenti già pronti, perché Aeris porta dentro la grammatica esattamente le cose che oggi devono essere cucite a mano:</p>
<ul>
<li><strong>Ingegneri delle operazioni</strong> (chi gestisce deploy e infrastruttura), che oggi mettono insieme file YAML, script Python, shell e Terraform.</li>
<li><strong>Autori di pipeline di intelligenza artificiale</strong>, che oggi combinano librerie come LangChain con stringhe di prompt scritte a mano e logiche di ritentativo artigianali.</li>
<li><strong>Team in contesti regolamentati</strong> — banche, sanità, pubblica amministrazione — che devono sapere con precisione che cosa fa il codice e devono poterlo riprodurre offline a distanza di tempo.</li>
</ul>
</div>
<div class="column compact">
<p><strong>Cosa si tiene in un solo file <code>.aer</code></strong></p>
<ul>
<li>Lo script operativo, oggi in <code>bash</code> o Python, diventa un programma Aeris in cui ogni scrittura esterna dichiara il proprio scopo con un blocco <code>intent</code>.</li>
<li>Il manifesto della pipeline, oggi in Airflow o Argo, diventa una <code>saga</code> con i passi <code>do</code> e <code>undo</code> obbligatori.</li>
<li>Il grafo degli agenti AI, oggi in LangChain o CrewAI, diventa una <code>agent_net</code> con messaggi validati ad ogni passaggio contro uno schema tipizzato.</li>
<li>Le regole di sicurezza sulla rete in uscita, oggi in Open Policy Agent (OPA), diventano costrutti <code>policy</code> valutati dal runtime ad ogni chiamata.</li>
</ul>
<p><strong>Tre modi di scriverlo, una sola grammatica</strong></p>
<ul>
<li><strong>Modalità script.</strong> Si scrivono istruzioni direttamente nel file, senza <code>main</code>, senza dichiarare i permessi. Adatta a prototipi, demo, automazioni veloci.</li>
<li><strong>Modalità progressiva.</strong> Le funzioni dichiarano i propri permessi (<code>cap</code>), il manifesto del progetto fa da limite massimo. Adatta a chi vuole salire gradualmente verso la disciplina piena.</li>
<li><strong>Modalità rigida.</strong> Permessi dichiarati ovunque, blocco <code>intent</code> obbligatorio su ogni scrittura, le firme delle funzioni vengono congelate in un file di blocco controllato in revisione. Adatta a produzione, audit, compliance.</li>
</ul>
<blockquote>
<p>In tutte e tre le modalità il file di traccia e la possibilità di rigiocare l'esecuzione restano attivi: la capacità di rivedere e riprodurre ciò che il programma ha fatto non si può togliere.</p>
</blockquote>
</div>
</div>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="6" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-class="tight" data-theme="aeris" lang="it-IT" class="tight" data-marpit-pagination="6" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--class:tight;--theme:aeris;" data-marpit-pagination-total="39">
<header>Presentazione tecnica · v0.3</header>

<h1 id="come-si-presenta-un-programma-aeris">Come si presenta un programma Aeris</h1>
<div class="columns">
<div class="column">
<pre><code class="language-aeris">// Un programma che legge un file di log, fa classificare
// ogni riga da un modello, e annota nel registro di
// audit le righe segnalate come critiche.
// Senza fn main, senza dichiarazione di permessi.

let sessione = ai.session(
  system: &quot;Classifica la riga come critical, warning o info.&quot;,
  model:  &quot;claude-haiku-4-5&quot;,
)

let righe = fs.read_file(&quot;./error.log&quot;)
              .split(&quot;\n&quot;)

for riga in righe.slice(0, 50) {
  let categoria = ai.decide(
    prompt:  &quot;Classifica: {riga}&quot;,
    choices: [&quot;critical&quot;, &quot;warning&quot;, &quot;info&quot;],
  )?

  if categoria == &quot;critical&quot; {
    audit.event(&quot;triage.critical&quot;, { riga: riga })
  }
}

io.println(&quot;triage completato — {ai.usage().calls} chiamate al modello&quot;)
</code></pre>
</div>
<div class="column compact">
<p><strong>Cosa rende possibile questa scrittura</strong></p>
<ul>
<li>Le istruzioni vengono scritte direttamente al livello del file e vengono eseguite in ordine, senza bisogno di racchiuderle in una funzione <code>main</code>. È lo stesso modello di uno script Python.</li>
<li>Le stringhe interpolano direttamente le espressioni racchiuse tra graffe: <code>&quot;{riga}&quot;</code> al posto della concatenazione manuale.</li>
<li>Le funzioni della libreria standard accettano argomenti per nome. Una chiamata come <code>ai.decide(prompt: ..., choices: [...])</code> si legge come una documentazione di sé stessa.</li>
<li>Le funzioni di intelligenza artificiale (<code>ai.session</code>, <code>ai.decide</code>, <code>ai.usage</code>) sono nella libreria standard del linguaggio, non in un pacchetto da installare a parte.</li>
<li>Il punto interrogativo <code>?</code> posto dopo una chiamata propaga l'errore al chiamante: nel caso di <code>ai.decide</code>, scatta quando il modello restituisce una risposta che non rientra fra quelle elencate in <code>choices</code>.</li>
<li>Ogni chiamata a <code>ai.decide</code> e a <code>audit.event</code> viene registrata in un file di traccia (in formato JSON Lines, un oggetto JSON per riga) accanto al sorgente. Lo stesso programma si rigioca offline con <code>aeris replay</code>, ottenendo gli stessi byte sulle parti deterministiche.</li>
</ul>
<blockquote>
<p>La grammatica scala senza rotture fino al programma &quot;settle&quot; della Parte III: ci si aggiungono <code>fn</code>, <code>cap</code>, <code>intent</code>, <code>saga</code>, senza cambiare linguaggio.</p>
</blockquote>
</div>
</div>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>

<header>Presentazione tecnica · v0.3</header>

<h1 id="i-costrutti-di-base-del-linguaggio">I costrutti di base del linguaggio</h1>
<div class="columns">
<div class="column">
<pre><code class="language-aeris">// Tre forme di legame: let immutabile (predefinito),
// var mutabile, const costante a livello del file.
let titolo      = &quot;report&quot;
var contatore   = 0
const MAX_ITEMS = 100

// Tipi inferiti; le annotazioni si scrivono ai confini
// (firme di funzioni esposte, dati in arrivo).
let importo: decimal = 12.50

// if è un'espressione: produce il valore del ramo scelto.
let etichetta = if importo &gt; 100.0 { &quot;grande&quot; } else { &quot;piccolo&quot; }

// Cicli su intervalli, mappe e altre iterabili.
for i in 0..contatore { io.println(&quot;{i}: {titolo}&quot;) }

// I tipi enumerazione hanno varianti che possono portare
// dati: senza dati, in posizione, o con campi nominali.
enum Stato {
  Attivo,
  Bannato { motivo: string },
  Sospeso,
}

let s = stato_corrente()

// match è un'espressione. I pattern possono estrarre i
// campi nominali di un costruttore; le guardie filtrano
// ulteriormente con una condizione (`if`).
let messaggio = match s {
  Bannato { motivo } -&gt; &quot;bloccato: {motivo}&quot;,
  Attivo             -&gt; &quot;ok&quot;,
  Sospeso            -&gt; &quot;in attesa&quot;,
}

// Gli errori sono valori. ? propaga al chiamante, ??
// sostituisce un'assenza (None) o un errore (Err).
let nick = cerca_soprannome() ?? &quot;anonimo&quot;
let dati = fs.read_file(percorso)?

// Le funzioni sono valori di prima classe (closure).
// I tipi nativi (list, string, map) hanno metodi.
let maiuscoli = [&quot;alice&quot;, &quot;bob&quot;].map(fn(n) { strings.upper(n) })
</code></pre>
</div>
<div class="column compact">
<p><strong>Quello che ci si aspetta da un linguaggio moderno</strong></p>
<p>I legami fra nome e valore sono di tre tipi: <code>let</code> (immutabile, è il caso normale), <code>var</code> (riassegnabile, all'interno di una funzione), <code>const</code> (costante a livello del file). I tipi vengono inferiti automaticamente dal compilatore; le annotazioni di tipo restano utili ai confini di interfaccia.</p>
<p>Sia <code>if</code> sia <code>match</code> sono <strong>espressioni</strong>: il loro valore è il valore del ramo scelto. Si possono usare ovunque sia ammesso un valore, anche a destra di un <code>let</code>. Il <code>match</code> accetta pattern su letterali, costruttori di enumerazione e record (estraendo direttamente i campi nominali), oltre a guardie introdotte con <code>if</code>.</p>
<p>Gli errori sono <strong>valori restituiti</strong>, non eccezioni. Una funzione il cui esito può fallire restituisce un valore di tipo <code>result&lt;T&gt;</code> (cioè <code>Ok(t)</code> oppure <code>Err(e)</code>). L'operatore <code>?</code> posto dopo una chiamata propaga l'errore al chiamante; l'operatore <code>??</code> fornisce un valore di sostituzione quando l'espressione di sinistra produce <code>None</code> o <code>Err</code>.</p>
<p>Le funzioni (incluse quelle anonime, le <em>closure</em>) sono valori di prima classe. I tipi nativi <code>list</code>, <code>string</code>, <code>map</code> espongono i metodi di uso comune: <code>.map</code>, <code>.contains</code>, <code>.slice</code>, <code>.join</code>, <code>.split</code>, <code>.trim</code> e simili.</p>
<blockquote>
<p>Sintassi familiare a chi conosce Rust, Swift o Kotlin. Tutta la novità del linguaggio è concentrata nei costrutti dei livelli superiori: <code>cap</code>, <code>intent</code>, <code>saga</code>, <code>agent</code>, <code>policy</code>.</p>
</blockquote>
</div>
</div>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="8" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-theme="aeris" lang="it-IT" data-marpit-pagination="8" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--theme:aeris;" data-marpit-pagination-total="39">
<header>Presentazione tecnica · v0.3</header>
<h1 id="perch%C3%A9-%C3%A8-adatto-a-essere-scritto-e-letto-da-un-modello-linguistico">Perché è adatto a essere scritto e letto da un modello linguistico</h1>
<div class="columns">
<div class="column compact">
<p><strong>Una grammatica con una sola forma legale</strong></p>
<p>Ogni parola chiave del linguaggio è riservata: nessun termine cambia significato a seconda del contesto. Una ricerca testuale di <code>step</code> o <code>saga</code> trova <em>davvero</em> tutte le occorrenze. Ogni costrutto ha una sola scrittura canonica, e il formatter <code>aeris fmt</code> la impone in modo completo: dato un programma valido, esiste una sola sua forma legale. Non esistono varianti sintattiche per la stessa cosa — si scrive <code>fn</code>, mai <code>function</code> o <code>def</code>.</p>
<p>Il risultato è uno spazio dei completamenti validi molto piccolo. Un modello che genera codice ha meno decisioni da prendere, e quindi meno modi di sbagliare. Una <code>saga</code> da dieci passi sta in mezza pagina; una rete di agenti in sei righe.</p>
<p><strong>Il &quot;perché&quot; è parte della grammatica</strong></p>
<p>Concetti che in altri linguaggi vivono nei commenti, nei messaggi di commit o nei ticket, in Aeris sono costrutti del linguaggio.</p>
<p><code>intent &quot;...&quot;</code> dichiara lo scopo di una scrittura esterna ed è obbligatorio in modalità rigida. <code>model Fattura@v1</code> versiona uno schema dato sui confini di fiducia (chi entra ed esce dal programma) e lo valida a runtime. <code>policy</code> esprime una regola di sicurezza come parte del programma, non come convenzione di prompt. Le clausole <code>requires:</code> ed <code>ensures:</code> portano le pre-condizioni e le post-condizioni dentro la firma della funzione.</p>
</div>
<div class="column compact">
<p><strong>L'intelligenza artificiale è nella libreria standard</strong></p>
<p>Le funzioni che oggi vivono in librerie esterne come LangChain qui sono <strong>primitive del linguaggio</strong>:</p>
<ul>
<li><code>ai.session</code> e <code>ai.session_ask</code> reggono una conversazione multi-turno, con compattazione automatica della cronologia oltre i quaranta messaggi.</li>
<li><code>ai.decide(prompt, choices)</code> impone al modello di scegliere fra un insieme dichiarato di valori, con ritentativo automatico se la risposta cade fuori.</li>
<li><code>ai.chat(system, dir)</code> costruisce un chatbot caricando in avvio una cartella di documenti come base di conoscenza.</li>
<li><code>ai.network</code> programmatico oppure <code>agent</code> e <code>agent_net</code> dichiarativi descrivono le reti di agenti.</li>
<li>Il backend del modello è configurabile via file di progetto: chiamata HTTP a un'API (Anthropic, OpenAI) oppure invocazione di un sottoprocesso da riga di comando (<code>claude --print</code>, <code>ollama run</code>). Nessuna libreria di terze parti collegata in fase di compilazione.</li>
</ul>
<p><strong>Riproducibilità inclusa</strong></p>
<p>Ogni chiamata al modello viene registrata nel file di traccia come un evento JSON che contiene il prompt, il modello, la risposta e il numero di token consumati. Il comando <code>aeris replay</code> rigioca l'intera sessione offline ottenendo gli stessi byte sulla parte deterministica. La prima esecuzione resta stocastica per natura; ogni esecuzione successiva di tipo replay è deterministica.</p>
</div>
</div>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>

<blockquote>
<p>I quattro livelli del linguaggio, il flusso che porta dal sorgente alla traccia, i codici di uscita previsti, il file di progetto come riferimento unico.</p>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="10" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-theme="aeris" lang="it-IT" data-marpit-pagination="10" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--theme:aeris;" data-marpit-pagination-total="39">
<header>Presentazione tecnica · v0.3</header>
<h1 id="i-quattro-livelli-del-linguaggio">I quattro livelli del linguaggio</h1>
<table>
<thead>
<tr>
<th>Livello</th>
<th>Cosa aggiunge</th>
<th>Costrutti</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>1</strong> — Sintassi adatta ai modelli</td>
<td>Lessico denso, una sola forma canonica per ogni costrutto, tutte le parole chiave riservate</td>
<td><code>fn</code>, <code>record</code>, <code>enum</code>, <code>match</code>, <code>if</code>, <code>for</code></td>
</tr>
<tr>
<td><strong>2</strong> — Semantica verificabile</td>
<td>I permessi sugli effetti esterni sono valori passati per parametro, contratti controllati a runtime, blocco <code>intent</code> obbligatorio sulle scritture</td>
<td><code>cap[...]</code>, <code>requires:</code> / <code>ensures:</code>, <code>intent</code></td>
</tr>
<tr>
<td><strong>3</strong> — Operazioni reversibili</td>
<td><code>saga</code> con passi obbligati a dichiarare <code>do</code> (azione) e <code>undo</code> (compensazione); chiavi di idempotenza generate dal runtime</td>
<td><code>saga</code>, <code>step</code>, <code>do</code>, <code>undo</code></td>
</tr>
<tr>
<td><strong>4</strong> — Coordinamento di agenti AI</td>
<td>Agenti come unità tipizzate, grafo aciclico fra agenti, validazione di schema ad ogni passaggio</td>
<td><code>agent</code>, <code>agent_net</code>, <code>flow</code>, <code>until:</code></td>
</tr>
</tbody>
</table>
<blockquote>
<p>I livelli <strong>si attivano a richiesta</strong>: un programma usa solo i livelli che servono. Uno script di trenta righe vive nel livello 1; chi sale ai livelli superiori paga il costo solo di ciò che usa.</p>
</blockquote>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="11" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-theme="aeris" lang="it-IT" data-marpit-pagination="11" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--theme:aeris;" data-marpit-pagination-total="39">
<header>Presentazione tecnica · v0.3</header>
<h1 id="dal-sorgente-alla-traccia">Dal sorgente alla traccia</h1>
<div class="columns">
<div class="column">
<div class="mermaid">
flowchart LR
  A["sorgente<br /><code>.aer</code>"] --&gt; B["analisi<br />lessicale"]
  B --&gt; C["analisi<br />sintattica"]
  C --&gt; D["controllo<br />statico"]
  D --&gt; E["esecuzione<br />(interprete)"]
  E --&gt; F["traccia<br /><code>.jsonl</code>"]
  D -. "se errore" .-&gt; X(["uscita con<br />codice ≠ 0"])
  E -. "se errore" .-&gt; X
  classDef step fill:#F6F3F0,stroke:#1C2035,stroke-width:1px,color:#0E1020;
  classDef err fill:#FF7E51,stroke:#D14600,color:#0E1020;
  class A,B,C,D,E,F step;
  class X err;
</div>
<p>L'esecuzione procede in cinque fasi: il <strong>lexer</strong> divide il sorgente in token; il <strong>parser</strong> li ricompone in un albero sintattico; il <strong>controllore statico</strong> verifica le proprietà strutturali (permessi dichiarati, schemi versionati, blocchi <code>intent</code> presenti sulle scritture); l'<strong>interprete</strong> visita l'albero nodo per nodo; ogni evento significativo finisce in una riga del <strong>file di traccia</strong>.</p>
</div>
<div class="column compact">
<p><strong>Codici di uscita previsti</strong></p>
<p>Ogni categoria di violazione ha un proprio codice di uscita, in modo che i sistemi di integrazione continua (CI) possano reagire in maniera differenziata.</p>
<table>
<thead>
<tr>
<th>Codice</th>
<th>Significato</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>0</code></td>
<td>esecuzione conclusa senza errori</td>
</tr>
<tr>
<td><code>64</code></td>
<td>errore di sintassi, di tipo o di contratto</td>
</tr>
<tr>
<td><code>65</code></td>
<td>permesso mancante o uso di <code>cap[*]</code> nel codice utente</td>
</tr>
<tr>
<td><code>66</code></td>
<td>scrittura esterna fuori da un blocco <code>intent</code></td>
</tr>
<tr>
<td><code>67</code></td>
<td>passo di <code>saga</code> che scrive ma dichiara <code>undo: noop</code></td>
</tr>
<tr>
<td><code>68</code></td>
<td><code>model</code> usato senza versione <code>@vN</code> su un confine di fiducia</td>
</tr>
<tr>
<td><code>69</code></td>
<td>file di blocco scaduto: l'impronta di una dipendenza non corrisponde</td>
</tr>
<tr>
<td><code>70</code></td>
<td>ciclo dichiarato in <code>agent_net</code></td>
</tr>
<tr>
<td><code>71</code></td>
<td>la firma di una funzione concede più di quanto consente il manifesto</td>
</tr>
<tr>
<td><code>74</code></td>
<td><code>saga</code> finita in stato parziale (le retry sugli <code>undo</code> sono esaurite)</td>
</tr>
</tbody>
</table>
</div>
</div>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="12" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-theme="aeris" lang="it-IT" data-marpit-pagination="12" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--theme:aeris;" data-marpit-pagination-total="39">
<header>Presentazione tecnica · v0.3</header>
<h1 id="registrazione-e-riesecuzione">Registrazione e riesecuzione</h1>
<div class="columns">
<div class="column compact">
<p><strong>La traccia è sempre attiva</strong></p>
<p>Ogni interazione con il mondo esterno (rete, file system, modelli, orologio, generatore di numeri casuali) finisce su una riga del file di traccia in formato JSON Lines, cioè un oggetto JSON per riga.</p>
<ul>
<li>Chiamate al modello (<code>ai.*</code>): vengono registrati il prompt, il nome del modello, la risposta, il numero di token e il timestamp.</li>
<li>Lettura dell'orologio (<code>clock.now</code>): viene registrato il valore letto.</li>
<li>Generazione di un numero casuale (<code>random.next</code>): viene registrato il valore generato.</li>
<li>Chiamate HTTP o invocazioni di shell: vengono registrate le impronte (hash) della richiesta e della risposta.</li>
</ul>
<p><strong>Rigiocare un'esecuzione</strong></p>
<p>Il comando <code>aeris replay &lt;id-traccia&gt; &lt;sorgente&gt;</code> rilegge il file di traccia e riproduce l'esecuzione del programma leggendo dal &quot;nastro&quot; registrato invece di interrogare il mondo esterno. Sulla parte deterministica del programma l'esecuzione è <strong>identica byte per byte</strong> all'originale.</p>
<p>L'opzione <code>--live</code> lascia che HTTP e modello vengano richiamati realmente, utile per individuare divergenze fra l'esecuzione registrata e una nuova esecuzione (debug differenziale). Il comando <code>aeris trace diff</code> confronta due tracce passo per passo e segnala dove divergono.</p>
</div>
<div class="column">
<pre><code class="language-json"><span class="hljs-punctuation">{</span><span class="hljs-attr">&quot;event&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-string">&quot;intent_enter&quot;</span><span class="hljs-punctuation">,</span>

<span class="hljs-punctuation">{</span><span class="hljs-attr">&quot;event&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-string">&quot;ai_call&quot;</span><span class="hljs-punctuation">,</span>

<span class="hljs-punctuation">{</span><span class="hljs-attr">&quot;event&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-string">&quot;http_request&quot;</span><span class="hljs-punctuation">,</span>
