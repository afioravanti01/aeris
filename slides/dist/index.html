<header>Technical presentation · v0.3</header>
<h1 id="aeris-at-a-glance">Aeris at a glance</h1>
<blockquote>
<p>A general-purpose interpreted language written in Rust, built around a specific domain: <strong>operations, AI orchestration, and governance</strong>.</p>
</blockquote>
<ul>
<li><strong>Runtime</strong> — single static binary <code>aeris</code>, &lt; 8 MB. Zero external runtime requirements. Tree-walk interpreter; one file extension <code>.aer</code>; one project manifest <code>aeris.toml</code>.</li>
<li><strong>Libraries</strong> — general-purpose stdlib · native domain handlers · external <code>.aer</code> modules pinned by cryptographic hash.</li>
<li><strong>LLM integration</strong> — pluggable backend: HTTP API or local CLI process, selected in <code>aeris.toml</code>.</li>
<li><strong>What it replaces in one file</strong> — <code>bash</code> / Python / Terraform scripts, Airflow / Argo workflow manifests, LangChain / CrewAI agent graphs, OPA / Rego security rules.</li>
</ul>
<blockquote>
<p>One grammar covers a 30-line script and a multi-agent system. Discipline is <strong>opt-in by depth</strong>.</p>
</blockquote>
<footer>Aeris v0.3 · interpreted language for operations, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="4" data-paginate="true" data-header="Technical presentation · v0.3" data-footer="Aeris v0.3 · interpreted language for operations, AI and governance" data-class="tight" data-theme="aeris" lang="C" class="tight" data-marpit-pagination="4" style="--paginate:true;--header:Technical presentation · v0.3;--footer:Aeris v0.3 · interpreted language for operations, AI and governance;--class:tight;--theme:aeris;" data-marpit-pagination-total="53">
<header>Technical presentation · v0.3</header>

<h1 id="hello-world">Hello world</h1>
<div class="columns">
<div class="column">
<pre><code class="language-rust"><span class="hljs-comment">// Script mode — no main, no ceremony.</span>
<span class="hljs-keyword">use</span> io

io.<span class="hljs-title function_ invoke__">println</span>(<span class="hljs-string">&quot;hello, aeris&quot;</span>)
</code></pre>
<pre><code class="language-rust"><span class="hljs-comment">// With a main function.</span>
<span class="hljs-keyword">use</span> io

<span class="hljs-keyword">fn</span> <span class="hljs-title function_">main</span>() {
  io.<span class="hljs-title function_ invoke__">println</span>(<span class="hljs-string">&quot;hello, aeris&quot;</span>)
}
</code></pre>
</div>
<div class="column compact">
<ul>
<li>A <code>.aer</code> file without <code>fn main</code> is a <strong>valid program</strong> — top-level statements run in declaration order.</li>
<li>A <code>.aer</code> file with <code>fn main</code> runs the function after the top-level statements.</li>
<li><code>use io</code> is <strong>mandatory</strong> to call <code>io.println</code> — modules must be brought into scope.</li>
<li>The standard library is <strong>closed</strong> — no third-party deps. Adding a built-in requires an Aeris release.</li>
</ul>
</div>
</div>
<footer>Aeris v0.3 · interpreted language for operations, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="5" data-paginate="true" data-header="Technical presentation · v0.3" data-footer="Aeris v0.3 · interpreted language for operations, AI and governance" data-class="tight" data-theme="aeris" lang="C" class="tight" data-marpit-pagination="5" style="--paginate:true;--header:Technical presentation · v0.3;--footer:Aeris v0.3 · interpreted language for operations, AI and governance;--class:tight;--theme:aeris;" data-marpit-pagination-total="53">
<header>Technical presentation · v0.3</header>

<h1 id="how-an-interpreted-language-works">How an interpreted language works</h1>
<div class="columns">
<div class="column compact">
<p><strong>1 · Lexer</strong> — reads the bytes of a <code>.aer</code> file and emits typed tokens annotated with line numbers. An unknown character ends the run.</p>
<p><strong>2 · Parser</strong> — recursive-descent over the tokens. Builds the <strong>AST</strong> — a tree where each node is a language construct (a <code>let</code>, a call, a <code>saga</code>, an <code>agent</code>).</p>
<p><strong>3 · Static check</strong> — pre-run pass that verifies structural properties: schemas, idempotency-key obligations, agent graphs. Failure → distinct exit codes per category.</p>
<p><strong>4 · Interpreter</strong> — walks the AST node by node. Each statement updates the scope; each expression returns a value. Side effects go through the standard library.</p>
</div>
<div class="column">
<pre><code class="language-rust"><span class="hljs-comment">// The Aeris source tree, mapped to the pipeline.</span>
src/lexer.rs        <span class="hljs-comment">// bytes  → tokens</span>
src/parser.rs       <span class="hljs-comment">// tokens → AST</span>
src/checker.rs      <span class="hljs-comment">// AST    → ok / error</span>
src/interpreter.rs  <span class="hljs-comment">// AST    → value, side effects</span>
</code></pre>
<blockquote>
<p>The AST <strong>is</strong> the program. No bytecode, no intermediate representation, no compilation step.</p>
</blockquote>
<blockquote>
<p>~6 KLOC of Rust core. Zero external runtime. Single-shell-script deployment.</p>
</blockquote>
</div>
</div>
<footer>Aeris v0.3 · interpreted language for operations, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="6" data-paginate="true" data-header="Technical presentation · v0.3" data-footer="Aeris v0.3 · interpreted language for operations, AI and governance" data-class="tight" data-theme="aeris" lang="C" class="tight" data-marpit-pagination="6" style="--paginate:true;--header:Technical presentation · v0.3;--footer:Aeris v0.3 · interpreted language for operations, AI and governance;--class:tight;--theme:aeris;" data-marpit-pagination-total="53">
<header>Technical presentation · v0.3</header>

<h1 id="the-ast-walk">The AST walk</h1>
<div class="columns">
<div class="column">
<pre><code class="language-rust"><span class="hljs-keyword">fn</span> <span class="hljs-title function_">walk</span>(node: Node, env: &amp;<span class="hljs-keyword">mut</span> Env) <span class="hljs-punctuation">-&gt;</span> Value {
  <span class="hljs-keyword">match</span> node {
    <span class="hljs-title function_ invoke__">Let</span>(name, e)   =&gt; env.<span class="hljs-title function_ invoke__">set</span>(name, <span class="hljs-title function_ invoke__">walk</span>(e, env)),
    <span class="hljs-title function_ invoke__">If</span>(c, t, f)    =&gt; <span class="hljs-keyword">if</span> <span class="hljs-title function_ invoke__">walk</span>(c, env).<span class="hljs-title function_ invoke__">is_truthy</span>() {
                        <span class="hljs-title function_ invoke__">walk</span>(t, env)
                      } <span class="hljs-keyword">else</span> { <span class="hljs-title function_ invoke__">walk</span>(f, env) },
    <span class="hljs-title function_ invoke__">Call</span>(f, args)  =&gt; <span class="hljs-title function_ invoke__">apply</span>(f, args.<span class="hljs-title function_ invoke__">map</span>(|a| <span class="hljs-title function_ invoke__">walk</span>(a, env))),
    <span class="hljs-title function_ invoke__">Block</span>(stmts)   =&gt; stmts.for_each(|s| <span class="hljs-title function_ invoke__">walk</span>(s, env)),
    <span class="hljs-title function_ invoke__">Return</span>(e)      =&gt; <span class="hljs-title function_ invoke__">unwind</span>(<span class="hljs-title function_ invoke__">walk</span>(e, env)),
    <span class="hljs-comment">// ...one arm per AST variant</span>
  }
}
</code></pre>
</div>
<div class="column compact">
<p><strong>Reading the walk</strong></p>
<ul>
<li>An <em>expression</em> node returns a <code>Value</code> — data flows back up the tree.</li>
<li>A <em>statement</em> node updates the scope or triggers an effect.</li>
<li><code>return</code> / <code>break</code> / <code>continue</code> are error variants that unwind to the right frame.</li>
</ul>
<p><strong>A function call is a sub-walk</strong></p>
<ul>
<li>The function's body is an AST sub-tree.</li>
<li>A new scope is pushed, parameters bound, the body recursed into.</li>
<li>Closures snapshot their environment, so <code>spawn { ... }</code> keeps the scope chain alive.</li>
</ul>
</div>
</div>
<footer>Aeris v0.3 · interpreted language for operations, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="7" data-paginate="true" data-header="Technical presentation · v0.3" data-footer="Aeris v0.3 · interpreted language for operations, AI and governance" data-theme="aeris" lang="C" data-marpit-pagination="7" style="--paginate:true;--header:Technical presentation · v0.3;--footer:Aeris v0.3 · interpreted language for operations, AI and governance;--theme:aeris;" data-marpit-pagination-total="53">
<header>Technical presentation · v0.3</header>
<h1 id="the-four-layers">The four layers</h1>
<div class="columns">
<div class="column">
<figure class="aeris-figure">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-label="The four layers stacked">
<defs>
<marker id="arrL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1C2035" /></marker>
</defs>
<g font-family="Inter, system-ui, sans-serif">
<rect x="20" y="15" width="560" height="70" rx="10" fill="#F6F3F0" stroke="#1C2035" stroke-width="2" />
<text x="40" y="45" font-size="22" font-weight="700" fill="#0E1020">L1 — AI-native syntax</text>
<text x="40" y="72" font-size="16" fill="#5F6470">one canonical form, all keywords reserved</text>
<line x1="300" y1="85" x2="300" y2="100" stroke="#1C2035" stroke-width="2.5" marker-end="url(#arrL)" />
<rect x="20" y="100" width="560" height="70" rx="10" fill="#F6F3F0" stroke="#1C2035" stroke-width="2" />
<text x="40" y="130" font-size="22" font-weight="700" fill="#0E1020">L2 — Verifiable semantics</text>
<text x="40" y="157" font-size="16" fill="#5F6470">capabilities-as-values, contracts, intent</text>
<line x1="300" y1="170" x2="300" y2="185" stroke="#1C2035" stroke-width="2.5" marker-end="url(#arrL)" />
<rect x="20" y="185" width="560" height="70" rx="10" fill="#F6F3F0" stroke="#1C2035" stroke-width="2" />
<text x="40" y="215" font-size="22" font-weight="700" fill="#0E1020">L3 — Agentic loop</text>
<text x="40" y="242" font-size="16" fill="#5F6470">saga with do/undo, derived idempotency</text>
<line x1="300" y1="255" x2="300" y2="270" stroke="#1C2035" stroke-width="2.5" marker-end="url(#arrL)" />
<rect x="20" y="270" width="560" height="70" rx="10" fill="#F6F3F0" stroke="#1C2035" stroke-width="2" />
<text x="40" y="300" font-size="22" font-weight="700" fill="#0E1020">L4 — Multi-agent orchestration</text>
<text x="40" y="327" font-size="16" fill="#5F6470">typed agent_net, schema at every edge</text>
</g>
</svg>
</figure>
</div>
<div class="column compact">
<ul>
<li>Each layer <strong>composes</strong> with the ones below.</li>
<li>A program <strong>pays only</strong> for the layers it uses.</li>
<li>A 30-line script lives in <strong>L1</strong>.</li>
<li>A self-recovering pipeline uses <strong>L1 + L2 + L3</strong>.</li>
<li>A coordinated multi-agent system uses <strong>all four</strong>.</li>
</ul>
</div>
</div>
<footer>Aeris v0.3 · interpreted language for operations, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="8" data-paginate="true" data-header="Technical presentation · v0.3" data-footer="Aeris v0.3 · interpreted language for operations, AI and governance" data-class="divider" data-theme="aeris" lang="C" class="divider" data-marpit-pagination="8" style="--paginate:true;--header:Technical presentation · v0.3;--footer:Aeris v0.3 · interpreted language for operations, AI and governance;--class:divider;--theme:aeris;" data-marpit-pagination-total="53">
<header>Technical presentation · v0.3</header>

<h1 id="core-language">Core language</h1>
<blockquote>
<p>Curly braces, named arguments, models, sagas, concurrency. Everything that ships in the binary.</p>
</blockquote>
<footer>Aeris v0.3 · interpreted language for operations, AI and governance</footer>
</section>

<header>Technical presentation · v0.3</header>

<h1 id="language-at-a-glance">Language at a glance</h1>
<div class="columns">
<div class="column">
<pre><code class="language-rust"><span class="hljs-comment">// Variables: let immutable, var mutable, const file-level.</span>
<span class="hljs-keyword">let</span> <span class="hljs-variable">title</span>  = <span class="hljs-string">&quot;report&quot;</span>
var count  = <span class="hljs-number">0</span>
<span class="hljs-keyword">const</span> PI   = <span class="hljs-number">3.14159</span>

<span class="hljs-comment">// Type annotations optional, encouraged at API boundaries.</span>
<span class="hljs-keyword">let</span> <span class="hljs-variable">amount</span>: decimal = <span class="hljs-number">12.50</span>

<span class="hljs-comment">// Functions return the last expression — no return needed.</span>
<span class="hljs-keyword">fn</span> <span class="hljs-title function_">greet</span>(name: string) <span class="hljs-punctuation">-&gt;</span> string { <span class="hljs-string">&quot;Hello, {name}!&quot;</span> }
<span class="hljs-title function_ invoke__">greet</span>(name: <span class="hljs-string">&quot;Aeris&quot;</span>)

<span class="hljs-comment">// Closures are first-class values.</span>
<span class="hljs-keyword">let</span> <span class="hljs-variable">double</span> = <span class="hljs-title function_ invoke__">fn</span>(x) { x * <span class="hljs-number">2</span> }
<span class="hljs-keyword">let</span> <span class="hljs-variable">evens</span>  = [<span class="hljs-number">1</span>, <span class="hljs-number">2</span>, <span class="hljs-number">3</span>, <span class="hljs-number">4</span>].<span class="hljs-title function_ invoke__">filter</span>(<span class="hljs-title function_ invoke__">fn</span>(x) { x % <span class="hljs-number">2</span> == <span class="hljs-number">0</span> })

<span class="hljs-comment">// String interpolation, multi-line strings.</span>
<span class="hljs-keyword">let</span> <span class="hljs-variable">log</span> = <span class="hljs-string">&quot;request {req.method} {req.path}&quot;</span>
<span class="hljs-keyword">let</span> <span class="hljs-variable">prompt</span> = <span class="hljs-string">&quot;&quot;</span><span class="hljs-string">&quot;
  You are an SRE.
  Analyse: {log}
&quot;</span><span class="hljs-string">&quot;&quot;</span>
</code></pre>
</div>
<div class="column compact">
<ul>
<li>Three binding forms: <code>let</code> (immutable, default), <code>var</code> (mutable, function-scope only), <code>const</code> (file-level).</li>
<li>Types are <strong>inferred</strong>; annotations live at API boundaries.</li>
<li>Functions return the last expression of their body — no <code>return</code> keyword needed.</li>
<li>Call sites use <strong>named arguments</strong>: <code>greet(name: &quot;Aeris&quot;)</code> — order-independent.</li>
<li>Strings interpolate with <code>{expr}</code>; triple-quoted strings preserve newlines.</li>
</ul>
</div>
</div>
<footer>Aeris v0.3 · interpreted language for operations, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="10" data-paginate="true" data-header="Technical presentation · v0.3" data-footer="Aeris v0.3 · interpreted language for operations, AI and governance" data-class="tight" data-theme="aeris" lang="C" class="tight" data-marpit-pagination="10" style="--paginate:true;--header:Technical presentation · v0.3;--footer:Aeris v0.3 · interpreted language for operations, AI and governance;--class:tight;--theme:aeris;" data-marpit-pagination-total="53">
<header>Technical presentation · v0.3</header>

<h1 id="control-flow--if-match-loops">Control flow — <code>if</code>, <code>match</code>, loops</h1>
<div class="columns">
<div class="column">
<pre><code class="language-rust"><span class="hljs-comment">// if and match are expressions — they yield a value.</span>
<span class="hljs-keyword">let</span> <span class="hljs-variable">label</span> = <span class="hljs-keyword">if</span> score &gt;= <span class="hljs-number">90</span> { <span class="hljs-string">&quot;A&quot;</span> }
            <span class="hljs-keyword">else</span> <span class="hljs-keyword">if</span> score &gt;= <span class="hljs-number">70</span> { <span class="hljs-string">&quot;B&quot;</span> }
            <span class="hljs-keyword">else</span> { <span class="hljs-string">&quot;C&quot;</span> }

<span class="hljs-keyword">let</span> <span class="hljs-variable">summary</span> = <span class="hljs-keyword">match</span> resp.status {
  <span class="hljs-number">200</span>      <span class="hljs-punctuation">-&gt;</span> <span class="hljs-string">&quot;ok&quot;</span>,
  <span class="hljs-number">400</span>..<span class="hljs-number">499</span> <span class="hljs-punctuation">-&gt;</span> <span class="hljs-string">&quot;client error&quot;</span>,
  <span class="hljs-number">500</span>..<span class="hljs-number">599</span> <span class="hljs-punctuation">-&gt;</span> <span class="hljs-string">&quot;server error&quot;</span>,
  _        <span class="hljs-punctuation">-&gt;</span> <span class="hljs-string">&quot;other&quot;</span>,
}

<span class="hljs-comment">// Loops.</span>
<span class="hljs-keyword">for</span> <span class="hljs-variable">tag</span> <span class="hljs-keyword">in</span> tags { io.<span class="hljs-title function_ invoke__">println</span>(tag) }
<span class="hljs-keyword">for</span> (k, v) <span class="hljs-keyword">in</span> map { io.<span class="hljs-title function_ invoke__">println</span>(<span class="hljs-string">&quot;{k}={v}&quot;</span>) }
<span class="hljs-keyword">while</span> count &gt; <span class="hljs-number">0</span> { count = count - <span class="hljs-number">1</span> }
<span class="hljs-keyword">loop</span> {
  <span class="hljs-keyword">let</span> <span class="hljs-variable">line</span> = io.<span class="hljs-title function_ invoke__">read_line</span>() ?? <span class="hljs-string">&quot;&quot;</span>
  <span class="hljs-keyword">if</span> line == <span class="hljs-string">&quot;quit&quot;</span> { <span class="hljs-keyword">break</span> }
}
</code></pre>
</div>
<div class="column compact">
<ul>
<li><code>if</code> and <code>match</code> are <strong>expressions</strong> — they evaluate to a value.</li>
<li><code>match</code> patterns: literals, ranges (<code>400..499</code>), wildcards (<code>_</code>), enum variants.</li>
<li><code>match</code> is <strong>exhaustive</strong> — the compiler tells you which case you forgot.</li>
<li><code>for x in iter</code> walks any iterable (<code>list</code>, <code>range</code>, <code>map</code>, <code>channel</code>).</li>
<li><code>loop { ... }</code> is sugar for <code>while true { ... }</code>.</li>
</ul>
</div>
</div>
<footer>Aeris v0.3 · interpreted language for operations, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="11" data-paginate="true" data-header="Technical presentation · v0.3" data-footer="Aeris v0.3 · interpreted language for operations, AI and governance" data-class="tight" data-theme="aeris" lang="C" class="tight" data-marpit-pagination="11" style="--paginate:true;--header:Technical presentation · v0.3;--footer:Aeris v0.3 · interpreted language for operations, AI and governance;--class:tight;--theme:aeris;" data-marpit-pagination-total="53">
<header>Technical presentation · v0.3</header>

<h1 id="pattern-matching--enums-and-destructuring">Pattern matching — enums and destructuring</h1>
<div class="columns">
<div class="column">
<pre><code class="language-rust"><span class="hljs-keyword">enum</span> <span class="hljs-title class_">Status</span> {
  Pending,
  <span class="hljs-title function_ invoke__">Active</span>(since: timestamp),
  Banned { reason: string, until: option&lt;date&gt; },
}

<span class="hljs-keyword">match</span> s {
  Pending           <span class="hljs-punctuation">-&gt;</span> <span class="hljs-string">&quot;pending&quot;</span>,
  <span class="hljs-title function_ invoke__">Active</span>(t)         <span class="hljs-punctuation">-&gt;</span> <span class="hljs-string">&quot;since {t}&quot;</span>,
  Banned { reason } <span class="hljs-punctuation">-&gt;</span> <span class="hljs-string">&quot;blocked: {reason}&quot;</span>,
}

<span class="hljs-comment">// List destructuring with a rest binding.</span>
<span class="hljs-keyword">match</span> xs {
  []                <span class="hljs-punctuation">-&gt;</span> <span class="hljs-string">&quot;empty&quot;</span>,
  [x]               <span class="hljs-punctuation">-&gt;</span> <span class="hljs-string">&quot;single {x}&quot;</span>,
  [first, ..rest]   <span class="hljs-punctuation">-&gt;</span> <span class="hljs-string">&quot;{first} + {len(rest)} more&quot;</span>,
  [a, .., z]        <span class="hljs-punctuation">-&gt;</span> <span class="hljs-string">&quot;{a} ... {z}&quot;</span>,
}

<span class="hljs-comment">// Result destructuring.</span>
<span class="hljs-keyword">match</span> http.<span class="hljs-title function_ invoke__">get</span>(url) {
  <span class="hljs-title function_ invoke__">Ok</span>(resp) <span class="hljs-punctuation">-&gt;</span> <span class="hljs-title function_ invoke__">use_body</span>(resp.body),
  <span class="hljs-title function_ invoke__">Err</span>(e)   <span class="hljs-punctuation">-&gt;</span> raise e,
}
</code></pre>
</div>
<div class="column compact">
<ul>
<li><code>enum</code> variants can carry <strong>typed payload fields</strong> (positional or named).</li>
<li>Variant patterns <strong>bind</strong> their payload — <code>Active(t)</code> makes <code>t</code> available in the arm.</li>
<li>List patterns support <code>..rest</code> for &quot;everything else&quot;.</li>
<li>Pattern matching covers <code>option&lt;T&gt;</code>, <code>result&lt;T&gt;</code>, and any user enum with one structural API.</li>
</ul>
</div>
</div>
<footer>Aeris v0.3 · interpreted language for operations, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="12" data-paginate="true" data-header="Technical presentation · v0.3" data-footer="Aeris v0.3 · interpreted language for operations, AI and governance" data-class="tight" data-theme="aeris" lang="C" class="tight" data-marpit-pagination="12" style="--paginate:true;--header:Technical presentation · v0.3;--footer:Aeris v0.3 · interpreted language for operations, AI and governance;--class:tight;--theme:aeris;" data-marpit-pagination-total="53">
<header>Technical presentation · v0.3</header>

<h1 id="models--records-enums-versioned-schemas">Models — records, enums, versioned schemas</h1>
<div class="columns">
<div class="column">
<pre><code class="language-rust"><span class="hljs-comment">// record — a named-field struct.</span>
record User {
  id:   uuid
  name: string
  age:  int  <span class="hljs-keyword">where</span> age &gt;= <span class="hljs-number">0</span>
}

<span class="hljs-keyword">let</span> <span class="hljs-variable">u</span> = User { id: <span class="hljs-title function_ invoke__">uuid_v7</span>(), name: <span class="hljs-string">&quot;Ada&quot;</span>, age: <span class="hljs-number">36</span> }
<span class="hljs-keyword">let</span> <span class="hljs-variable">v</span> = User { ..u, age: <span class="hljs-number">37</span> }       <span class="hljs-comment">// structural update</span>

<span class="hljs-comment">// model X@vN — a record + a version tag + constraints.</span>
model Invoice@v1 {
  id:       uuid
  amount:   decimal <span class="hljs-keyword">where</span> amount &gt; <span class="hljs-number">0</span>
  customer: string  <span class="hljs-keyword">where</span> <span class="hljs-title function_ invoke__">len</span>(customer) &lt;= <span class="hljs-number">64</span>

  <span class="hljs-keyword">where</span>: status == Cancelled implies amount == <span class="hljs-number">0</span>
}

<span class="hljs-comment">// v2 extends v1 — inherits fields and constraints.</span>
model Invoice@v2 extends Invoice@v1 {
  currency: string <span class="hljs-keyword">where</span> <span class="hljs-title function_ invoke__">len</span>(currency) == <span class="hljs-number">3</span>
}
</code></pre>
</div>
<div class="column compact">
<ul>
<li><code>record</code> is a struct with named, typed fields.</li>
<li><code>model X@vN</code> is a <strong>versioned record</strong>, validated at every <strong>trust boundary</strong> (HTTP ingress, JSON decoding, agent edges).</li>
<li><code>where</code> clauses run on construction — both per-field and at the record level.</li>
<li><code>extends</code> inherits the parent's shape: you may add fields, never remove or rename.</li>
<li>A bare <code>model X</code> (no <code>@vN</code>) at a trust boundary is a parse error.</li>
</ul>
</div>
</div>
<footer>Aeris v0.3 · interpreted language for operations, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="13" data-paginate="true" data-header="Technical presentation · v0.3" data-footer="Aeris v0.3 · interpreted language for operations, AI and governance" data-class="tight" data-theme="aeris" lang="C" class="tight" data-marpit-pagination="13" style="--paginate:true;--header:Technical presentation · v0.3;--footer:Aeris v0.3 · interpreted language for operations, AI and governance;--class:tight;--theme:aeris;" data-marpit-pagination-total="53">
<header>Technical presentation · v0.3</header>

<h1 id="errors--recovery--result---catch-defer">Errors &amp; recovery — <code>result</code>, <code>?</code>, <code>??</code>, <code>catch</code>, <code>defer</code></h1>
<div class="columns">
<div class="column">
<pre><code class="language-rust"><span class="hljs-comment">// result&lt;T&gt; is Ok(value) or Err(error) — errors are values.</span>
<span class="hljs-keyword">fn</span> <span class="hljs-title function_">read_config</span>(path: string) <span class="hljs-punctuation">-&gt;</span> result&lt;Config&gt; {
  <span class="hljs-keyword">let</span> <span class="hljs-variable">bytes</span> = fs.<span class="hljs-title function_ invoke__">read_file</span>(path)?     <span class="hljs-comment">// propagate Err</span>
  json.decode&lt;Config&gt;(bytes)
}

<span class="hljs-comment">// ?? substitutes on Err / None / unit.</span>
<span class="hljs-keyword">let</span> <span class="hljs-variable">nick</span> = <span class="hljs-title function_ invoke__">lookup_nickname</span>() ?? <span class="hljs-string">&quot;anonymous&quot;</span>

<span class="hljs-comment">// catch — handle Err inline, supply a fallback.</span>
<span class="hljs-keyword">let</span> <span class="hljs-variable">data</span> = fs.<span class="hljs-title function_ invoke__">read_file</span>(<span class="hljs-string">&quot;config.json&quot;</span>) catch err {
  io.<span class="hljs-title function_ invoke__">eprintln</span>(<span class="hljs-string">&quot;missing: {err.message}&quot;</span>)
  <span class="hljs-string">b&quot;{}&quot;</span>
}

<span class="hljs-comment">// defer — LIFO cleanup on every exit path.</span>
<span class="hljs-keyword">fn</span> <span class="hljs-title function_">render</span>(items: list&lt;Item&gt;) <span class="hljs-punctuation">-&gt;</span> result&lt;unit&gt; {
  <span class="hljs-keyword">let</span> <span class="hljs-variable">tmp</span> = fs.<span class="hljs-title function_ invoke__">create_temp</span>()?
  defer fs.<span class="hljs-title function_ invoke__">remove</span>(tmp)
  fs.<span class="hljs-title function_ invoke__">write_file</span>(<span class="hljs-string">&quot;./out/report.html&quot;</span>, <span class="hljs-title function_ invoke__">build</span>(items, tmp))?
  <span class="hljs-title function_ invoke__">Ok</span>(())
}
</code></pre>
</div>
<div class="column compact">
<ul>
<li><code>result&lt;T&gt;</code> is <code>Ok(value)</code> or <code>Err(error)</code> — <strong>errors are values</strong>, not exceptions.</li>
<li><code>?</code> after an expression: if <code>Err</code>, return early from the caller.</li>
<li><code>??</code> substitutes on <code>Err</code>, <code>None</code>, or unit.</li>
<li><code>catch err { ... }</code> handles errors inline; <code>err</code> binds to the error value.</li>
<li><code>defer stmt</code> runs on <strong>every</strong> exit path (return, <code>?</code>, <code>raise</code>) — like Go's <code>defer</code>.</li>
</ul>
</div>
</div>
<footer>Aeris v0.3 · interpreted language for operations, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="14" data-paginate="true" data-header="Technical presentation · v0.3" data-footer="Aeris v0.3 · interpreted language for operations, AI and governance" data-class="tight" data-theme="aeris" lang="C" class="tight" data-marpit-pagination="14" style="--paginate:true;--header:Technical presentation · v0.3;--footer:Aeris v0.3 · interpreted language for operations, AI and governance;--class:tight;--theme:aeris;" data-marpit-pagination-total="53">
<header>Technical presentation · v0.3</header>

<h1 id="time-control--every-retry-timeout">Time control — <code>every</code>, <code>retry</code>, <code>timeout</code></h1>
<pre><code class="language-rust"><span class="hljs-comment">// Periodic loop — first iteration runs immediately.</span>
every <span class="hljs-number">5</span>m {
  <span class="hljs-keyword">let</span> <span class="hljs-variable">h</span> = http.<span class="hljs-title function_ invoke__">get</span>(<span class="hljs-string">&quot;https://api.acme.com/health&quot;</span>)
  <span class="hljs-keyword">if</span> !h.ok { audit.<span class="hljs-title function_ invoke__">event</span>(<span class="hljs-string">&quot;api.down&quot;</span>, { ts: clock.<span class="hljs-title function_ invoke__">now</span>() }) }
}

<span class="hljs-comment">// Bounded retry on Err.</span>
<span class="hljs-keyword">let</span> <span class="hljs-variable">r</span> = retry <span class="hljs-number">3</span>, delay: <span class="hljs-number">1</span>s {
  http.<span class="hljs-title function_ invoke__">get</span>(<span class="hljs-string">&quot;https://api.acme.com/status&quot;</span>)
}

<span class="hljs-comment">// Wall-clock bound; not preempted mid-statement.</span>
<span class="hljs-keyword">let</span> <span class="hljs-variable">r</span> = timeout <span class="hljs-number">30</span>s { <span class="hljs-title function_ invoke__">long_running_call</span>() }
</code></pre>
<ul>
<li><code>every D</code> runs the body, waits <code>D</code>, repeats. <code>break</code> exits, <code>continue</code> skips.</li>
<li><code>retry N, delay: D</code> re-runs the body on <code>Err</code>, up to <code>N</code> times with a pause <code>D</code>.</li>
<li><code>timeout D</code> fails the block with <code>Err(...)</code> if it exceeds the wall-clock budget.</li>
<li><code>clock.sleep(D)</code> is recorded so that <code>aeris replay</code> reproduces the same timeline.</li>
</ul>
<blockquote>
<p>No external scheduler (cron / systemd / Airflow) needed — the loop is part of the program, observable in the trace, replayable offline.</p>
</blockquote>
<footer>Aeris v0.3 · interpreted language for operations, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="15" data-paginate="true" data-header="Technical presentation · v0.3" data-footer="Aeris v0.3 · interpreted language for operations, AI and governance" data-class="tight" data-theme="aeris" lang="C" class="tight" data-marpit-pagination="15" style="--paginate:true;--header:Technical presentation · v0.3;--footer:Aeris v0.3 · interpreted language for operations, AI and governance;--class:tight;--theme:aeris;" data-marpit-pagination-total="53">
<header>Technical presentation · v0.3</header>

<h1 id="saga--the-flagship-construct-for-writes">Saga — the flagship construct for writes</h1>
<pre><code class="language-rust">saga <span class="hljs-title function_ invoke__">settle</span>(batch: list&lt;Invoice@v1&gt;) {
  intent <span class="hljs-string">&quot;settle invoice batch&quot;</span>
  step charge {
    <span class="hljs-keyword">do</span>   { <span class="hljs-keyword">for</span> <span class="hljs-variable">it</span> <span class="hljs-keyword">in</span> batch { http.<span class="hljs-title function_ invoke__">post</span>(<span class="hljs-string">&quot;/charge&quot;</span>, it)? } }
    undo { <span class="hljs-keyword">for</span> <span class="hljs-variable">it</span> <span class="hljs-keyword">in</span> batch { http.<span class="hljs-title function_ invoke__">post</span>(<span class="hljs-string">&quot;/refund&quot;</span>, it)? } }
  }
  step ledger {
    requires: charge.ok
    <span class="hljs-keyword">do</span>   { kube.<span class="hljs-title function_ invoke__">apply</span>(<span class="hljs-title function_ invoke__">ledger_manifest</span>(batch))? }
    undo { kube.<span class="hljs-title function_ invoke__">delete</span>(<span class="hljs-title function_ invoke__">ledger_manifest</span>(batch))? }
  }
}
</code></pre>
<ul>
<li><code>saga</code> groups a <strong>multi-step operation that needs compensation</strong> if a later step fails.</li>
<li>Each <code>step</code> declares <strong>both</strong> <code>do</code> (the action) and <code>undo</code> (the compensation).</li>
<li>If a later step fails, the runtime runs the <code>undo</code>s of the completed steps in reverse order.</li>
<li><code>undo: noop</code> is allowed <strong>only when <code>do</code> does not write</strong> — every external write must declare how to undo itself.</li>
<li>Three deterministic outcomes: <code>ok</code>, <code>rolled_back</code>, or <code>PartialFailure</code> (when even the rollback fails — exit code 74).</li>
</ul>
<blockquote>
<p><code>intent &quot;...&quot;</code> declares the saga's purpose; it appears in every trace event emitted from inside the saga.</p>
</blockquote>
<footer>Aeris v0.3 · interpreted language for operations, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="16" data-paginate="true" data-header="Technical presentation · v0.3" data-footer="Aeris v0.3 · interpreted language for operations, AI and governance" data-theme="aeris" lang="C" data-marpit-pagination="16" style="--paginate:true;--header:Technical presentation · v0.3;--footer:Aeris v0.3 · interpreted language for operations, AI and governance;--theme:aeris;" data-marpit-pagination-total="53">
<header>Technical presentation · v0.3</header>
<h1 id="idempotency-key--generated-for-you">Idempotency key — generated for you</h1>
<p><strong>The problem.</strong> Network drops mid-write — you sent <code>POST /charge</code>, you don't know if the backend received it. If you retry, you risk a <strong>double charge</strong>. If you don't, you risk <strong>no charge at all</strong>.</p>
<p><strong>The standard fix.</strong> Attach a unique string — an <em>idempotency key</em> — to every write. The backend remembers keys it has already seen and drops the duplicates. Used by Stripe, AWS, Kubernetes, queues.</p>
<p><strong>What Aeris does.</strong> Inside every <code>saga</code> step, the runtime derives one key per invocation from three stable values:</p>
<pre><code class="language-text">key = blake3( trace_id  ‖  step_name  ‖  invocation_index )
            └─ run id ─┘  └─ in saga ─┘  └─ retry count ─┘
</code></pre>
<table>
<thead>
<tr>
<th>Backend</th>
<th>Where the key goes</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>http.{post, put, patch}</code></td>
<td>header <code>Idempotency-Key</code></td>
</tr>
<tr>
<td><code>kube.apply</code></td>
<td>annotation <code>aeris.idempotency</code></td>
</tr>
<tr>
<td><code>rabbitmq.publish</code></td>
<td><code>message-id</code> field</td>
</tr>
</tbody>
</table>
<ul>
<li>Generated <strong>for every saga step</strong>, in all <code>enforce</code> modes (<code>off</code> / <code>loose</code> / <code>strict</code>).</li>
<li>Outside a saga, calls do not get the derived key — <code>saga</code> is the trigger.</li>
<li>Recorded into the trace alongside the call — <code>aeris replay</code> reuses the same keys.</li>
</ul>
<blockquote>
<p>Same program replayed → same <code>trace_id</code> → <strong>same keys</strong> → the backend drops every duplicate.</p>
</blockquote>
<footer>Aeris v0.3 · interpreted language for operations, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="17" data-paginate="true" data-header="Technical presentation · v0.3" data-footer="Aeris v0.3 · interpreted language for operations, AI and governance" data-class="tight" data-theme="aeris" lang="C" class="tight" data-marpit-pagination="17" style="--paginate:true;--header:Technical presentation · v0.3;--footer:Aeris v0.3 · interpreted language for operations, AI and governance;--class:tight;--theme:aeris;" data-marpit-pagination-total="53">
<header>Technical presentation · v0.3</header>

<h1 id="concurrency--spawn-channel-cancellation">Concurrency — <code>spawn</code>, <code>channel</code>, cancellation</h1>
<div class="columns">
<div class="column">
<pre><code class="language-rust"><span class="hljs-comment">// spawn returns a handle; await yields the result.</span>
<span class="hljs-keyword">let</span> <span class="hljs-variable">h_a</span> = spawn { <span class="hljs-title function_ invoke__">fetch_a</span>() }
<span class="hljs-keyword">let</span> <span class="hljs-variable">h_b</span> = spawn { <span class="hljs-title function_ invoke__">fetch_b</span>() }
<span class="hljs-keyword">let</span> (a, b) = (<span class="hljs-keyword">await</span> h_a, <span class="hljs-keyword">await</span> h_b)

<span class="hljs-comment">// Bounded channel between threads.</span>
<span class="hljs-keyword">let</span> <span class="hljs-variable">ch</span>: channel&lt;int&gt; = <span class="hljs-title function_ invoke__">channel</span>(capacity: <span class="hljs-number">16</span>)
spawn {
  <span class="hljs-keyword">for</span> <span class="hljs-variable">x</span> <span class="hljs-keyword">in</span> <span class="hljs-number">1</span>..<span class="hljs-number">100</span> { ch.<span class="hljs-title function_ invoke__">send</span>(x)? }
  ch.<span class="hljs-title function_ invoke__">close</span>()
}
<span class="hljs-keyword">for</span> <span class="hljs-variable">x</span> <span class="hljs-keyword">in</span> ch { io.<span class="hljs-title function_ invoke__">println</span>(<span class="hljs-string">&quot;{x}&quot;</span>) }

<span class="hljs-comment">// Cooperative cancellation.</span>
<span class="hljs-keyword">let</span> <span class="hljs-variable">h</span> = spawn { <span class="hljs-title function_ invoke__">long_running</span>() }
h.<span class="hljs-title function_ invoke__">cancel</span>()      <span class="hljs-comment">// delivered at the next cancel-point</span>
</code></pre>
</div>
<div class="column compact">
<ul>
<li><code>spawn { ... }</code> returns a <code>handle&lt;T&gt;</code>; <code>await h</code> yields the body's value.</li>
<li><code>channel&lt;T&gt;</code> is a bounded queue between threads — <code>send</code> on full blocks, <code>recv</code> on empty blocks.</li>
<li>Cancellation is <strong>cooperative</strong>: cancel-points are <code>await</code>, <code>?</code>, capability calls, <code>for x in ch</code>.</li>
<li>The current runtime executes <code>spawn</code> inline on the same thread; a <code>spawn_inline</code> trace event marks the limitation.</li>
</ul>
</div>
</div>
<footer>Aeris v0.3 · interpreted language for operations, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="18" data-paginate="true" data-header="Technical presentation · v0.3" data-footer="Aeris v0.3 · interpreted language for operations, AI and governance" data-class="tight" data-theme="aeris" lang="C" class="tight" data-marpit-pagination="18" style="--paginate:true;--header:Technical presentation · v0.3;--footer:Aeris v0.3 · interpreted language for operations, AI and governance;--class:tight;--theme:aeris;" data-marpit-pagination-total="53">
<header>Technical presentation · v0.3</header>

<h1 id="modules--three-layers-one-keyword">Modules — three layers, one keyword</h1>
<div class="columns">
<div class="column">
<pre><code class="language-rust"><span class="hljs-comment">// Layer 1: general-purpose stdlib (built in).</span>
<span class="hljs-keyword">use</span> io, json, fs, http, shell

<span class="hljs-comment">// Layer 2: native domain handlers (built in).</span>
<span class="hljs-keyword">use</span> ai, kube, mongodb

<span class="hljs-comment">// Layer 3: external .aer libraries.</span>
<span class="hljs-keyword">use</span> deploy
  from <span class="hljs-string">&quot;github.com/acmecorp/aeris-devops&quot;</span>
       deploy@<span class="hljs-string">&quot;1.2.0&quot;</span>
<span class="hljs-keyword">use</span> <span class="hljs-string">&quot;./lib/utilities.aer&quot;</span>
<span class="hljs-keyword">use</span> utilities from <span class="hljs-string">&quot;./lib/utilities.aer&quot;</span>
<span class="hljs-keyword">use</span> http <span class="hljs-keyword">as</span> net           <span class="hljs-comment">// rename at the use site</span>
</code></pre>
</div>
<div class="column compact">
<ul>
<li>All imports use the same keyword: <code>use</code>. The layer is inferred from the form.</li>
<li><strong>Layer 1</strong> is built into the <code>aeris</code> binary.</li>
<li><strong>Layer 2</strong> modules are signed native <code>.so</code> / <code>.dylib</code> extensions of the stdlib, declared in <code>aeris.toml [modules.&lt;family&gt;]</code> and pinned by blake3 hash + ed25519 signature.</li>
<li><strong>Layer 3</strong> is <code>.aer</code> source, pinned by <code>blake3</code> hash in <code>aeris.toml</code>.</li>
<li><code>use</code> is <strong>mandatory</strong> for every module reference (exit code 72).</li>
<li>Cyclic imports are rejected at parse time.</li>
</ul>
</div>
</div>
<footer>Aeris v0.3 · interpreted language for operations, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="19" data-paginate="true" data-header="Technical presentation · v0.3" data-footer="Aeris v0.3 · interpreted language for operations, AI and governance" data-theme="aeris" lang="C" data-marpit-pagination="19" style="--paginate:true;--header:Technical presentation · v0.3;--footer:Aeris v0.3 · interpreted language for operations, AI and governance;--theme:aeris;" data-marpit-pagination-total="53">

<header>Technical presentation · v0.3</header>

<h1 id="a-full-http-server--nethttp">A full HTTP server — <code>net.http</code></h1>
<div class="columns">
<div class="column">
<pre><code class="language-rust"><span class="hljs-keyword">use</span> net, fs, json

<span class="hljs-keyword">let</span> <span class="hljs-variable">server</span> = net.<span class="hljs-title function_ invoke__">http</span>(port: <span class="hljs-number">8080</span>)

<span class="hljs-keyword">loop</span> {
  <span class="hljs-keyword">let</span> <span class="hljs-variable">req</span> = server.<span class="hljs-title function_ invoke__">accept</span>()
  spawn {
    <span class="hljs-keyword">if</span> req.path == <span class="hljs-string">&quot;/api/health&quot;</span> {
      req.<span class="hljs-title function_ invoke__">reply_json</span>(<span class="hljs-number">200</span>, json.<span class="hljs-title function_ invoke__">encode</span>({ status: <span class="hljs-string">&quot;ok&quot;</span> }))
    } <span class="hljs-keyword">else</span> <span class="hljs-keyword">if</span> req.path == <span class="hljs-string">&quot;/&quot;</span> {
      req.<span class="hljs-title function_ invoke__">reply</span>(<span class="hljs-number">200</span>, fs.<span class="hljs-title function_ invoke__">read_text</span>(<span class="hljs-string">&quot;./index.html&quot;</span>), <span class="hljs-string">&quot;text/html&quot;</span>)
    } <span class="hljs-keyword">else</span> {
      req.<span class="hljs-title function_ invoke__">reply</span>(<span class="hljs-number">404</span>, <span class="hljs-string">&quot;not found&quot;</span>)
    }
  }
}
</code></pre>
</div>
<div class="column compact">
<ul>
<li><code>net.http(port) -&gt; HttpServer</code> opens a blocking TCP listener.</li>
<li><code>server.accept() -&gt; HttpReq</code> returns the next request.</li>
<li><code>req.reply</code> / <code>req.reply_json</code> write the response.</li>
<li>Per-request fan-out via <code>spawn</code>.</li>
<li>A <code>net_listen</code> event opens the trace; an <code>http_request</code> event is recorded per accepted request.</li>
</ul>
<blockquote>
<p>Part of the binary — no framework, no linked library.</p>
</blockquote>
</div>
</div>
<footer>Aeris v0.3 · interpreted language for operations, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="22" data-paginate="true" data-header="Technical presentation · v0.3" data-footer="Aeris v0.3 · interpreted language for operations, AI and governance" data-class="tight" data-theme="aeris" lang="C" class="tight" data-marpit-pagination="22" style="--paginate:true;--header:Technical presentation · v0.3;--footer:Aeris v0.3 · interpreted language for operations, AI and governance;--class:tight;--theme:aeris;" data-marpit-pagination-total="53">
<header>Technical presentation · v0.3</header>

<h1 id="tests--built-into-the-language">Tests — built into the language</h1>
<div class="columns">
<div class="column">
<pre><code class="language-rust">
test <span class="hljs-string">&quot;addition is commutative&quot;</span> {
  assert <span class="hljs-title function_ invoke__">add</span>(<span class="hljs-number">2</span>, <span class="hljs-number">3</span>) == <span class="hljs-title function_ invoke__">add</span>(<span class="hljs-number">3</span>, <span class="hljs-number">2</span>)
}

test <span class="hljs-string">&quot;GET /health&quot;</span> {
  <span class="hljs-keyword">let</span> <span class="hljs-variable">resp</span> = <span class="hljs-title function_ invoke__">http_for_tests</span>().<span class="hljs-title function_ invoke__">get</span>(<span class="hljs-string">&quot;/health&quot;</span>)
  <span class="hljs-title function_ invoke__">assert_status</span>(resp, <span class="hljs-number">200</span>)
  <span class="hljs-title function_ invoke__">assert_json</span>(resp.body, [<span class="hljs-string">&quot;status&quot;</span>, <span class="hljs-string">&quot;version&quot;</span>])
}

test <span class="hljs-string">&quot;summary is faithful&quot;</span> {
  <span class="hljs-title function_ invoke__">assert_semantic</span>(
    actual:   <span class="hljs-title function_ invoke__">summarise</span>(doc),
    criteria: <span class="hljs-string">&quot;faithful and complete to the original&quot;</span>,
    judge:    <span class="hljs-string">&quot;claude-haiku-4-5&quot;</span>,
  )
}

property <span class="hljs-string">&quot;concat is associative&quot;</span> <span class="hljs-title function_ invoke__">with</span> (
  a: list&lt;int&gt;, b: list&lt;int&gt;, c: list&lt;int&gt;,
) {
  <span class="hljs-title function_ invoke__">assert</span> (a ++ b) ++ c == a ++ (b ++ c)
}
</code></pre>
</div>
<div class="column compact">
<table>
<thead>
<tr>
<th>Helper</th>
<th>Checks</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>assert e</code></td>
<td>boolean</td>
</tr>
<tr>
<td><code>assert_status(r, c)</code></td>
<td>HTTP status</td>
</tr>
<tr>
<td><code>assert_json(t, keys)</code></td>
<td>JSON object has keys</td>
</tr>
<tr>
<td><code>assert_semantic(...)</code></td>
<td>model as judge</td>
</tr>
</tbody>
</table>
<ul>
<li><code>test</code> and <code>property</code> blocks are top-level. The <strong>file</strong> is the grouping unit — no <code>suite</code> keyword.</li>
<li><code>assert_semantic</code> uses the model as a judge — pass iff it agrees the criterion is met.</li>
<li><code>aeris test &lt;file&gt;</code> runs the tests; exit 0 = all pass.</li>
</ul>
</div>
</div>
<footer>Aeris v0.3 · interpreted language for operations, AI and governance</footer>

<header>Technical presentation · v0.3</header>

<h1 id="ai-primitives">AI primitives</h1>
<blockquote>
<p>Model calls as standard-library functions. Sessions, decisions, knowledge bases, multi-agent graphs.</p>
</blockquote>
<footer>Aeris v0.3 · interpreted language for operations, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="24" data-paginate="true" data-header="Technical presentation · v0.3" data-footer="Aeris v0.3 · interpreted language for operations, AI and governance" data-class="tight" data-theme="aeris" lang="C" class="tight" data-marpit-pagination="24" style="--paginate:true;--header:Technical presentation · v0.3;--footer:Aeris v0.3 · interpreted language for operations, AI and governance;--class:tight;--theme:aeris;" data-marpit-pagination-total="53">
<header>Technical presentation · v0.3</header>

<h1 id="ai-primitives--direct-call-and-multi-turn">AI primitives — direct call and multi-turn</h1>
<div class="columns">
<div class="column">
<pre><code class="language-rust"><span class="hljs-keyword">use</span> ai, io

<span class="hljs-comment">// One-shot.</span>
<span class="hljs-keyword">let</span> <span class="hljs-variable">answer</span> = ai.<span class="hljs-title function_ invoke__">complete</span>(<span class="hljs-string">&quot;Analyse: {log}&quot;</span>)

<span class="hljs-comment">// Multi-turn; auto-compaction past 40 messages</span>
<span class="hljs-comment">// (last 20 kept, earlier turns summarised).</span>
<span class="hljs-keyword">let</span> <span class="hljs-variable">s</span>        = ai.<span class="hljs-title function_ invoke__">session</span>(
  system: <span class="hljs-string">&quot;You are an SRE assistant.&quot;</span>,
  model:  <span class="hljs-string">&quot;claude-haiku-4-5&quot;</span>,
)
<span class="hljs-keyword">let</span> (s2, a)  = ai.<span class="hljs-title function_ invoke__">session_ask</span>(s,  <span class="hljs-string">&quot;What does this log mean?&quot;</span>)
<span class="hljs-keyword">let</span> (s3, b)  = ai.<span class="hljs-title function_ invoke__">session_ask</span>(s2, <span class="hljs-string">&quot;And how do I react?&quot;</span>)
</code></pre>
</div>
<div class="column compact">
<ul>
<li><strong><code>ai.complete(prompt, model?)</code></strong> — single-shot call to the model.</li>
<li><strong><code>ai.session</code> + <code>ai.session_ask</code></strong> — rolling conversation. Past 40 messages the history is compacted: the last 20 remain, earlier turns become a single system summary.</li>
<li>Every call is recorded as an <code>ai_call</code> event — <code>aeris replay</code> returns it from the trace, without contacting the model.</li>
</ul>
</div>
</div>
<footer>Aeris v0.3 · interpreted language for operations, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="25" data-paginate="true" data-header="Technical presentation · v0.3" data-footer="Aeris v0.3 · interpreted language for operations, AI and governance" data-class="tight" data-theme="aeris" lang="C" class="tight" data-marpit-pagination="25" style="--paginate:true;--header:Technical presentation · v0.3;--footer:Aeris v0.3 · interpreted language for operations, AI and governance;--class:tight;--theme:aeris;" data-marpit-pagination-total="53">
<header>Technical presentation · v0.3</header>

<h1 id="ai-primitives--constrained-choice-and-usage">AI primitives — constrained choice and usage</h1>
<div class="columns">
<div class="column">
<pre><code class="language-rust"><span class="hljs-comment">// Enum-style decision, auto-retry on mismatch.</span>
<span class="hljs-keyword">let</span> <span class="hljs-variable">action</span> = ai.<span class="hljs-title function_ invoke__">decide</span>(
  prompt:  <span class="hljs-string">&quot;CPU at 95%. What to do?&quot;</span>,
  choices: [<span class="hljs-string">&quot;scale_up&quot;</span>, <span class="hljs-string">&quot;restart&quot;</span>, <span class="hljs-string">&quot;alert&quot;</span>, <span class="hljs-string">&quot;ignore&quot;</span>],
  retries: <span class="hljs-number">3</span>,
)?

<span class="hljs-comment">// Per-process counters.</span>
<span class="hljs-keyword">let</span> <span class="hljs-variable">u</span> = ai.<span class="hljs-title function_ invoke__">usage</span>()
io.<span class="hljs-title function_ invoke__">println</span>(<span class="hljs-string">&quot;spent ${u.cost_usd} over {u.calls} calls&quot;</span>)
</code></pre>
</div>
<div class="column compact">
<p><strong><code>ai.decide</code></strong></p>
<ul>
<li>Post-validates the reply against <code>choices</code>.</li>
<li>Retries on mismatch; <code>Err(err.llm(...))</code> after <code>retries</code> failures.</li>
</ul>
<p><strong><code>ai.usage</code></strong></p>
<ul>
<li>Read-classified diagnostic.</li>
<li>Counter is in-memory; cost via static price table indexed by model name.</li>
</ul>
</div>
</div>
