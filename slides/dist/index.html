<header>Technical presentation · v0.3</header>

<h1 id="aichat--knowledge-base-and-integrated-server"><code>ai.chat</code> — knowledge base and integrated server</h1>
<div class="columns">
<div class="column">
<pre><code class="language-rust"><span class="hljs-comment">// Form 1 — handle with a KB loaded from a directory.</span>
<span class="hljs-keyword">let</span> <span class="hljs-variable">chat</span> = ai.<span class="hljs-title function_ invoke__">chat</span>(
  system: <span class="hljs-string">&quot;Answer only from the loaded documents.&quot;</span>,
  dir:    <span class="hljs-string">&quot;./docs&quot;</span>,
)
io.<span class="hljs-title function_ invoke__">println</span>(<span class="hljs-string">&quot;{chat.kb_size()} files loaded&quot;</span>)
io.<span class="hljs-title function_ invoke__">println</span>(chat.<span class="hljs-title function_ invoke__">ask</span>(<span class="hljs-string">&quot;how do capabilities work?&quot;</span>)?)

<span class="hljs-comment">// Form 2 — same KB + integrated HTTP server.</span>
ai.<span class="hljs-title function_ invoke__">chat</span>(
  system: <span class="hljs-string">&quot;You are the Aeris assistant.&quot;</span>,
  dir:    <span class="hljs-string">&quot;./docs&quot;</span>,
  port:   <span class="hljs-number">8080</span>,
)
<span class="hljs-comment">// blocking accept loop; does not return</span>
</code></pre>
</div>
<div class="column compact">
<p><strong>Form 1 — knowledge base</strong></p>
<ul>
<li>Loads <code>*.md</code>, <code>*.txt</code>, <code>*.rst</code>, <code>*.adoc</code>, <code>*.yaml</code> into the system prompt.</li>
<li>Returns a <code>Chat</code> value with <code>.ask(prompt)</code> and <code>.kb_size()</code>.</li>
</ul>
<p><strong>Form 2 — <code>port: int</code></strong></p>
<ul>
<li>Same KB plus an HTTP server on the given port: <code>GET /</code>, <code>POST /api/chat</code>, <code>GET /api/health</code>, CORS preflight.</li>
<li>A complete chatbot — KB, server, healthcheck, CORS — in <strong>one stdlib call</strong>.</li>
</ul>
</div>
</div>
<footer>Aeris v0.3 · interpreted language for operations, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="27" data-paginate="true" data-header="Technical presentation · v0.3" data-footer="Aeris v0.3 · interpreted language for operations, AI and governance" data-class="tight" data-theme="aeris" lang="C" class="tight" data-marpit-pagination="27" style="--paginate:true;--header:Technical presentation · v0.3;--footer:Aeris v0.3 · interpreted language for operations, AI and governance;--class:tight;--theme:aeris;" data-marpit-pagination-total="53">
<header>Technical presentation · v0.3</header>

<h1 id="multi-agent--agent_net-declarative-vs-ainetwork-programmatic">Multi-agent — <code>agent_net</code> (declarative) vs <code>ai.network</code> (programmatic)</h1>
<div class="columns">
<div class="column">
<pre><code class="language-rust"><span class="hljs-comment">// Declarative — typed on model@vN.</span>
model Doc@v1      { text: string }
model Summary@v1  { headline: string, bullets: list&lt;string&gt; }

agent summarise {
  llm:     <span class="hljs-string">&quot;claude-haiku-4-5&quot;</span>
  accept:  Doc@v1
  produce: Summary@v1
  prompt:  <span class="hljs-string">&quot;Summarise in &lt;= 5 bullets.&quot;</span>
}

agent_net summarise_loop {
  flow summarise <span class="hljs-punctuation">-&gt;</span> critique
  until: critique.ok == <span class="hljs-literal">true</span> || iterations &gt;= <span class="hljs-number">3</span>
}
</code></pre>
</div>
<div class="column">
<pre><code class="language-rust"><span class="hljs-comment">// Programmatic — runtime-discovered agents.</span>
<span class="hljs-keyword">fn</span> <span class="hljs-title function_">main</span>() {
  var net = ai.<span class="hljs-title function_ invoke__">network</span>(max_rounds: <span class="hljs-number">10</span>)

  net.<span class="hljs-title function_ invoke__">agent</span>(name: <span class="hljs-string">&quot;geologist&quot;</span>,
            system: fs.<span class="hljs-title function_ invoke__">read_text</span>(<span class="hljs-string">&quot;./agents/geo.md&quot;</span>))
  net.<span class="hljs-title function_ invoke__">agent</span>(name: <span class="hljs-string">&quot;risk&quot;</span>,
            system: fs.<span class="hljs-title function_ invoke__">read_text</span>(<span class="hljs-string">&quot;./agents/risk.md&quot;</span>))

  <span class="hljs-keyword">let</span> <span class="hljs-variable">r</span> = net.<span class="hljs-title function_ invoke__">run</span>(
    entry:   <span class="hljs-string">&quot;geologist&quot;</span>,
    message: <span class="hljs-string">&quot;Analyse today&#x27;s events.&quot;</span>,
    until:   <span class="hljs-string">&quot;DONE&quot;</span>,
  )
}
</code></pre>
</div>
</div>
<ul>
<li><strong><code>agent_net</code></strong> when schemas are stable: every edge validated against <code>accept</code> / <code>produce</code>, cycles rejected at parse time, iteration via <code>until:</code>.</li>
<li><strong><code>ai.network</code></strong> when the agent set is discovered at runtime (e.g. loaded from a prompt directory). Text-based hand-off: a reply prefixed <code>&gt;&gt;NAME:</code> routes to that node.</li>
</ul>
<footer>Aeris v0.3 · interpreted language for operations, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="28" data-paginate="true" data-header="Technical presentation · v0.3" data-footer="Aeris v0.3 · interpreted language for operations, AI and governance" data-class="divider" data-theme="aeris" lang="C" class="divider" data-marpit-pagination="28" style="--paginate:true;--header:Technical presentation · v0.3;--footer:Aeris v0.3 · interpreted language for operations, AI and governance;--class:divider;--theme:aeris;" data-marpit-pagination-total="53">
<header>Technical presentation · v0.3</header>

<h1 id="verifiability--governance">Verifiability &amp; Governance</h1>
<blockquote>
<p>What the signature can do (<code>cap</code>, allow-lists, enforce). What the program <strong>means</strong> to do (<code>intent</code>, contracts, <code>policy</code>). What every run leaves behind (trace, replay, content-addressed deps).</p>
</blockquote>
<footer>Aeris v0.3 · interpreted language for operations, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="29" data-paginate="true" data-header="Technical presentation · v0.3" data-footer="Aeris v0.3 · interpreted language for operations, AI and governance" data-class="tight" data-theme="aeris" lang="C" class="tight" data-marpit-pagination="29" style="--paginate:true;--header:Technical presentation · v0.3;--footer:Aeris v0.3 · interpreted language for operations, AI and governance;--class:tight;--theme:aeris;" data-marpit-pagination-total="53">
<header>Technical presentation · v0.3</header>

<h1 id="cap--a-permission-carried-as-a-value"><code>cap</code> — a permission, carried as a value</h1>
<div class="columns">
<div class="column">
<pre><code class="language-rust"><span class="hljs-comment">// A function that reaches the network must declare it.</span>
<span class="hljs-keyword">fn</span> <span class="hljs-title function_">fetch</span>(cap: cap[http.get @ [<span class="hljs-string">&quot;api.acme.com&quot;</span>]]) <span class="hljs-punctuation">-&gt;</span> result&lt;string&gt; {
  http.<span class="hljs-title function_ invoke__">get</span>(<span class="hljs-string">&quot;https://api.acme.com/users&quot;</span>)?.body
}

<span class="hljs-comment">// A function without `cap` cannot reach anything external.</span>
<span class="hljs-keyword">fn</span> <span class="hljs-title function_">total</span>(items: list&lt;Invoice@v1&gt;) <span class="hljs-punctuation">-&gt;</span> decimal {
  items.<span class="hljs-title function_ invoke__">fold</span>(<span class="hljs-number">0</span>, <span class="hljs-title function_ invoke__">fn</span>(acc, it) { acc + it.amount })
}
</code></pre>
</div>
<div class="column compact">
<ul>
<li><code>cap</code> is a <strong>parameter</strong> whose type lists the allowed operations.</li>
<li>A function with <strong>no <code>cap</code></strong> cannot reach the network, the file system, or the model.</li>
<li>Allow-lists (<code>@ [&quot;api.acme.com&quot;]</code>) restrict <em>which</em> endpoints, paths, models are reachable.</li>
<li><strong>Pure ⇔ no <code>cap</code></strong> — purity is a <em>structural</em> property of the signature, not a keyword.</li>
</ul>
</div>
</div>
<blockquote>
<p>Aeris applies a well-known idea — <em>permissions as parameters</em> — to LLM-generated code. <strong>Not novel research.</strong></p>
</blockquote>
<footer>Aeris v0.3 · interpreted language for operations, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="30" data-paginate="true" data-header="Technical presentation · v0.3" data-footer="Aeris v0.3 · interpreted language for operations, AI and governance" data-class="tight" data-theme="aeris" lang="C" class="tight" data-marpit-pagination="30" style="--paginate:true;--header:Technical presentation · v0.3;--footer:Aeris v0.3 · interpreted language for operations, AI and governance;--class:tight;--theme:aeris;" data-marpit-pagination-total="53">
<header>Technical presentation · v0.3</header>

<h1 id="allow-list--per-family-endpoint-restriction">Allow-list — per-family endpoint restriction</h1>
<div class="columns">
<div class="column">
<pre><code class="language-rust"><span class="hljs-keyword">fn</span> <span class="hljs-title function_">settle</span>(items, cap: cap[
  http.post     @ [<span class="hljs-string">&quot;api.acme.com&quot;</span>, <span class="hljs-string">&quot;api.stripe.com&quot;</span>],
  kube.apply    @ [<span class="hljs-string">&quot;prod-eu-1&quot;</span>],
  fs.write_file @ [<span class="hljs-string">&quot;./out/**&quot;</span>],
  ai.complete   @ [<span class="hljs-string">&quot;claude-opus-4-7&quot;</span>],
]) <span class="hljs-punctuation">-&gt;</span> result&lt;unit&gt; { ... }
</code></pre>
<table>
<thead>
<tr>
<th>Family</th>
<th>Form</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>http.*</code></td>
<td>hosts</td>
</tr>
<tr>
<td><code>fs.*</code></td>
<td>path globs</td>
</tr>
<tr>
<td><code>kube.*</code></td>
<td>contexts</td>
</tr>
<tr>
<td><code>ai.*</code></td>
<td>models</td>
</tr>
<tr>
<td><code>shell.exec</code></td>
<td><code>argv0</code> list</td>
</tr>
</tbody>
</table>
</div>
<div class="column compact">
<ul>
<li>Each effectful operation names its <strong>reachable endpoints</strong>.</li>
<li>The allow-list is part of the <strong>type</strong> of <code>cap</code>.</li>
<li>A signature outside the project's ceiling is a parse error (exit code 71).</li>
<li>A reviewer reads the signature and learns which external systems are touched <strong>and which endpoints</strong> are reachable — without entering the body.</li>
</ul>
</div>
</div>
<footer>Aeris v0.3 · interpreted language for operations, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="31" data-paginate="true" data-header="Technical presentation · v0.3" data-footer="Aeris v0.3 · interpreted language for operations, AI and governance" data-class="tight" data-theme="aeris" lang="C" class="tight" data-marpit-pagination="31" style="--paginate:true;--header:Technical presentation · v0.3;--footer:Aeris v0.3 · interpreted language for operations, AI and governance;--class:tight;--theme:aeris;" data-marpit-pagination-total="53">
<header>Technical presentation · v0.3</header>

<h1 id="narrowing-and-maincap">Narrowing and <code>main(cap)</code></h1>
<div class="columns">
<div class="column">
<pre><code class="language-rust"><span class="hljs-comment">// Pass a tighter sub-cap to the callee.</span>
<span class="hljs-title function_ invoke__">settle</span>(batch, cap.subset[
  http.post @ [<span class="hljs-string">&quot;api.stripe.com&quot;</span>],
])
</code></pre>
<pre><code class="language-text">$ aeris run src/main.aer
[aeris] effective main cap:
  http.{get,post}  @ [&quot;api.acme.com&quot;, &quot;api.stripe.com&quot;]
  fs.write_file    @ [&quot;./out/**&quot;]
  kube.{apply,get} @ [&quot;prod-eu-1&quot;]
  ai.complete      @ [&quot;claude-opus-4-7&quot;]
  audit.event
</code></pre>
</div>
<div class="column compact">
<p><strong><code>cap.subset[...]</code></strong></p>
<ul>
<li>Restricts the parent cap; never broadens.</li>
<li>An endpoint outside the parent is a parse error.</li>
</ul>
<p><strong><code>main(cap)</code></strong></p>
<ul>
<li>Synthesised from <code>aeris.toml [caps]</code> at startup.</li>
<li>The <strong>only way</strong> a <code>cap</code> value enters the program.</li>
<li>Reviewing the manifest = reviewing the whole authority surface.</li>
</ul>
</div>
</div>
<footer>Aeris v0.3 · interpreted language for operations, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="32" data-paginate="true" data-header="Technical presentation · v0.3" data-footer="Aeris v0.3 · interpreted language for operations, AI and governance" data-theme="aeris" lang="C" data-marpit-pagination="32" style="--paginate:true;--header:Technical presentation · v0.3;--footer:Aeris v0.3 · interpreted language for operations, AI and governance;--theme:aeris;" data-marpit-pagination-total="53">
<header>Technical presentation · v0.3</header>
<h1 id="enforce--three-modes-one-grammar"><code>enforce</code> — three modes, one grammar</h1>
<div class="columns">
<div class="column">
<table>
<thead>
<tr>
<th></th>
<th><code>strict</code></th>
<th><code>loose</code></th>
<th><code>off</code></th>
</tr>
</thead>
<tbody>
<tr>
<td><code>main(cap)</code> from <code>[caps]</code></td>
<td>yes</td>
<td>yes</td>
<td><code>cap[*]</code></td>
</tr>
<tr>
<td><code>cap</code> on fn (65)</td>
<td>error</td>
<td>suppressed</td>
<td>suppressed</td>
</tr>
<tr>
<td><code>intent</code> on write (66)</td>
<td>error</td>
<td>error</td>
<td>suppressed</td>
</tr>
<tr>
<td><code>undo: noop</code> on write (67)</td>
<td>error</td>
<td>error</td>
<td>suppressed</td>
</tr>
<tr>
<td>Runtime allow-list</td>
<td>enforced</td>
<td>enforced</td>
<td>bypassed</td>
</tr>
</tbody>
</table>
</div>
<div class="column compact">
<pre><code class="language-toml"><span class="hljs-section">[caps]</span>
<span class="hljs-attr">enforce</span> = <span class="hljs-string">&quot;strict&quot;</span>   <span class="hljs-comment"># off | loose | strict</span>
</code></pre>
<ul>
<li><strong><code>off</code></strong> — script mode (<code>aeris init</code> default).</li>
<li><strong><code>loose</code></strong> — manifest is the runtime ceiling.</li>
<li><strong><code>strict</code></strong> — full discipline.</li>
</ul>
</div>
</div>
<blockquote>
<p>Modes govern the <strong>static check</strong> only. Trace, replay, schema validation and policy evaluation stay active in all three modes.</p>
</blockquote>
<footer>Aeris v0.3 · interpreted language for operations, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="33" data-paginate="true" data-header="Technical presentation · v0.3" data-footer="Aeris v0.3 · interpreted language for operations, AI and governance" data-class="tight" data-theme="aeris" lang="C" class="tight" data-marpit-pagination="33" style="--paginate:true;--header:Technical presentation · v0.3;--footer:Aeris v0.3 · interpreted language for operations, AI and governance;--class:tight;--theme:aeris;" data-marpit-pagination-total="53">
<header>Technical presentation · v0.3</header>

<h1 id="intent--executable-documentation"><code>intent</code> — executable documentation</h1>
<pre><code class="language-rust">intent <span class="hljs-string">&quot;monitor API latency, alert above the threshold&quot;</span> {
  every <span class="hljs-number">1</span>m {
    <span class="hljs-keyword">let</span> <span class="hljs-variable">p99</span> = http.<span class="hljs-title function_ invoke__">get</span>(<span class="hljs-string">&quot;https://metrics/p99&quot;</span>).json&lt;<span class="hljs-type">f64</span>&gt;()
    <span class="hljs-keyword">if</span> p99 &gt; <span class="hljs-number">500.0</span> {
      http.<span class="hljs-title function_ invoke__">post</span>(
        url:  <span class="hljs-string">&quot;https://slack/hook&quot;</span>,
        body: { text: <span class="hljs-string">&quot;High latency: {p99}ms&quot;</span> },
      )
    }
  }
}
</code></pre>
<ul>
<li>A piece of code's <em>why</em> exists today only in commits, tickets, PR descriptions — out-of-band channels the agent never sees.</li>
<li><code>intent</code> brings the <em>why</em> <strong>into the grammar</strong>.</li>
<li><strong>Mandatory</strong> around every write-effectful call. Lexical check at compile time — exit code 66 when missing.</li>
<li>The runtime emits <code>intent_enter</code> and <code>intent_exit</code> events; every nested event carries the active <code>intent</code> string.</li>
<li>Does <strong>not</strong> verify the body matches the string. Makes <strong>omission</strong> impossible, not dishonesty.</li>
</ul>
<footer>Aeris v0.3 · interpreted language for operations, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="34" data-paginate="true" data-header="Technical presentation · v0.3" data-footer="Aeris v0.3 · interpreted language for operations, AI and governance" data-class="tight" data-theme="aeris" lang="C" class="tight" data-marpit-pagination="34" style="--paginate:true;--header:Technical presentation · v0.3;--footer:Aeris v0.3 · interpreted language for operations, AI and governance;--class:tight;--theme:aeris;" data-marpit-pagination-total="53">
<header>Technical presentation · v0.3</header>

<h1 id="requires--ensures--pre-and-post-conditions"><code>requires:</code> / <code>ensures:</code> — pre and post-conditions</h1>
<div class="columns">
<div class="column">
<pre><code class="language-rust"><span class="hljs-keyword">fn</span> <span class="hljs-title function_">discount</span>(amount: decimal, pct: decimal) <span class="hljs-punctuation">-&gt;</span> decimal
  requires: amount &gt;= <span class="hljs-number">0</span>
  requires: pct &gt;= <span class="hljs-number">0</span> and pct &lt;= <span class="hljs-number">1</span>
  ensures:  result &gt;= <span class="hljs-number">0</span> and result &lt;= amount
{
  amount * (<span class="hljs-number">1</span> - pct)
}

saga <span class="hljs-title function_ invoke__">deploy</span>(version: string)
  requires: env.<span class="hljs-title function_ invoke__">read</span>(<span class="hljs-string">&quot;DATABASE_URL&quot;</span>) != <span class="hljs-literal">None</span>
  ensures:  http.<span class="hljs-title function_ invoke__">get</span>(<span class="hljs-string">&quot;https://prod/health&quot;</span>).status == <span class="hljs-number">200</span>
{
  intent <span class="hljs-string">&quot;ship release {version}&quot;</span>
  step apply  { <span class="hljs-keyword">do</span> { kube.<span class="hljs-title function_ invoke__">apply</span>(...)? } undo { kube.<span class="hljs-title function_ invoke__">delete</span>(...)? } }
  step verify { <span class="hljs-keyword">do</span> { http.<span class="hljs-title function_ invoke__">wait</span>(<span class="hljs-string">&quot;/health&quot;</span>, timeout: <span class="hljs-number">2</span>m)? } undo { noop } }
}
</code></pre>
</div>
<div class="column compact">
<ul>
<li><code>requires:</code> lists <strong>pre-conditions</strong> — checked at function entry, before any body code runs.</li>
<li><code>ensures:</code> lists <strong>post-conditions</strong> — checked at every exit path. <code>result</code> refers to the returned value.</li>
<li>Both available on <strong>functions and sagas</strong>.</li>
<li>A violation produces a fatal <code>ContractViolation</code> — <strong>not catchable</strong> with <code>?</code> or <code>catch</code>. Exit code 64.</li>
<li><strong>Runtime contracts</strong> — checked at boundaries, not proved statically.</li>
</ul>
</div>
</div>
<footer>Aeris v0.3 · interpreted language for operations, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="35" data-paginate="true" data-header="Technical presentation · v0.3" data-footer="Aeris v0.3 · interpreted language for operations, AI and governance" data-class="tight" data-theme="aeris" lang="C" class="tight" data-marpit-pagination="35" style="--paginate:true;--header:Technical presentation · v0.3;--footer:Aeris v0.3 · interpreted language for operations, AI and governance;--class:tight;--theme:aeris;" data-marpit-pagination-total="53">
<header>Technical presentation · v0.3</header>

<h1 id="policy--declarative-governance"><code>policy</code> — declarative governance</h1>
<div class="columns">
<div class="column">
<pre><code class="language-rust">policy production_egress {
  <span class="hljs-keyword">match</span>: http.*
  deny:  url.host not <span class="hljs-keyword">in</span> [<span class="hljs-string">&quot;api.acme.com&quot;</span>, <span class="hljs-string">&quot;api.stripe.com&quot;</span>]
  audit: { url, method }
  when:  env == <span class="hljs-string">&quot;production&quot;</span>
}

policy model_budget {
  <span class="hljs-keyword">match</span>: ai.*
  limit: tokens_per_minute = <span class="hljs-number">60_000</span>
  limit: usd_per_day       = <span class="hljs-number">50</span>
}

policy pii_redact {
  <span class="hljs-keyword">match</span>:   ai.*
  require: not <span class="hljs-title function_ invoke__">contains_pii</span>(prompt)
  deny:    <span class="hljs-title function_ invoke__">contains_email</span>(response)
}
</code></pre>
</div>
<div class="column compact">
<ul>
<li><code>match:</code> picks which calls the rule applies to.</li>
<li><code>deny:</code> blocks the call if the condition is true; <code>require:</code> blocks if false.</li>
<li><code>limit:</code> enforces a quota over a window.</li>
<li><code>audit:</code> adds extra fields to the trace event for matching calls.</li>
<li><code>when:</code> gates activation on the environment.</li>
</ul>
<blockquote>
<p>Rules live in the program — not in the system prompt. The model cannot forget them; the runtime evaluates them on every matching call.</p>
</blockquote>
</div>
</div>
<footer>Aeris v0.3 · interpreted language for operations, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="36" data-paginate="true" data-header="Technical presentation · v0.3" data-footer="Aeris v0.3 · interpreted language for operations, AI and governance" data-theme="aeris" lang="C" data-marpit-pagination="36" style="--paginate:true;--header:Technical presentation · v0.3;--footer:Aeris v0.3 · interpreted language for operations, AI and governance;--theme:aeris;" data-marpit-pagination-total="53">
<header>Technical presentation · v0.3</header>
<h1 id="trace--what-every-run-records">Trace — what every run records</h1>
<p>JSONL stream at <code>&lt;project&gt;/&lt;output_dir&gt;/traces/&lt;id&gt;.jsonl</code>, <strong>always on</strong>.<br />
Default <code>output_dir = &quot;.aeris&quot;</code>, configurable in <code>[runtime]</code>.</p>
<pre><code class="language-text">$ aeris run main.aer
[aeris] trace_id = 01JFEZH7W… → ./.aeris/traces/01JFEZH7W….jsonl
</code></pre>
<table>
<thead>
<tr>
<th>Source</th>
<th>Recorded fields</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>ai.*</code></td>
<td><code>prompt</code>, <code>model</code>, <code>response</code>, <code>tokens</code>, <code>latency</code></td>
</tr>
<tr>
<td><code>clock.now</code>, <code>random.next</code></td>
<td><code>value</code></td>
</tr>
<tr>
<td><code>http.*</code></td>
<td><code>url</code>, <code>method</code>, <code>status</code>, hashes</td>
</tr>
<tr>
<td><code>fs.read_*</code> / <code>fs.write_*</code></td>
<td><code>path</code>, <code>len</code>, <code>hash</code></td>
</tr>
<tr>
<td><code>minio.*</code>, <code>mongodb.*</code>, <code>rabbitmq.*</code></td>
<td>family-specific fields + <code>backend</code></td>
</tr>
<tr>
<td><code>intent</code>, <code>saga</code>, <code>agent_net</code>, <code>policy</code></td>
<td>structured events</td>
</tr>
</tbody>
</table>
<pre><code class="language-json"><span class="hljs-punctuation">{</span><span class="hljs-attr">&quot;kind&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-string">&quot;ai_call&quot;</span><span class="hljs-punctuation">,</span><span class="hljs-attr">&quot;scope&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-string">&quot;classify&quot;</span><span class="hljs-punctuation">,</span><span class="hljs-attr">&quot;model&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-string">&quot;claude-opus-4-7&quot;</span><span class="hljs-punctuation">,</span>
 <span class="hljs-attr">&quot;tokens&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-number">142</span><span class="hljs-punctuation">,</span><span class="hljs-attr">&quot;intent&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-string">&quot;classify the invoice&quot;</span><span class="hljs-punctuation">,</span><span class="hljs-attr">&quot;ts&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-string">&quot;...&quot;</span><span class="hljs-punctuation">}</span>
</code></pre>
<blockquote>
<p>Trace IDs are propagated across HTTP via <code>X-Aeris-Trace-Id: &lt;id&gt;</code> — a single request stays contiguous across processes. The trace path resolves against the <strong>project root</strong> (<code>main.aer</code>'s directory), so <code>cd ~ &amp;&amp; aeris run /path/to/demo/main.aer</code> writes to the demo, not to <code>$HOME</code>.</p>
</blockquote>
<footer>Aeris v0.3 · interpreted language for operations, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="37" data-paginate="true" data-header="Technical presentation · v0.3" data-footer="Aeris v0.3 · interpreted language for operations, AI and governance" data-class="tight" data-theme="aeris" lang="C" class="tight" data-marpit-pagination="37" style="--paginate:true;--header:Technical presentation · v0.3;--footer:Aeris v0.3 · interpreted language for operations, AI and governance;--class:tight;--theme:aeris;" data-marpit-pagination-total="53">
<header>Technical presentation · v0.3</header>

<h1 id="replay-and-bisect--aeris-replay-aeris-trace-diff">Replay and bisect — <code>aeris replay</code>, <code>aeris trace diff</code></h1>
<div class="columns">
<div class="column">
<pre><code class="language-text">$ aeris replay 01JFE...
[aeris] replaying from trace 01JFE...
[aeris] ai.complete  → recorded response
[aeris] clock.now    → recorded value
[aeris] ✓ bit-identical on deterministic subset

$ aeris replay 01JFE... --live
[aeris] live HTTP for http.*; trace for clock/random/ai

$ aeris trace diff 01JFE... 01JG0...
@ ai_call[classify]:
  response: &quot;{\&quot;kind\&quot;:\&quot;utilities\&quot;}&quot;
       !=   &quot;{\&quot;kind\&quot;:\&quot;software\&quot;}&quot;
</code></pre>
</div>
<div class="column compact">
<p><strong><code>aeris replay &lt;id&gt;</code></strong></p>
<ul>
<li><code>ai.*</code> returns the recorded response (no model call).</li>
<li><code>clock.now</code>, <code>random.next</code> emit recorded values.</li>
<li><code>http.*</code> replays fixtures (default) or hits live (<code>--live</code>).</li>
<li><strong>Bit-identical</strong> on the deterministic subset.</li>
</ul>
<p><strong><code>aeris trace diff</code></strong></p>
<ul>
<li>Aligns events by <code>(scope, ordinal)</code> and reports field-level differences.</li>
<li>Foundation for regression <strong>bisect</strong>.</li>
</ul>
</div>
</div>
<footer>Aeris v0.3 · interpreted language for operations, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="38" data-paginate="true" data-header="Technical presentation · v0.3" data-footer="Aeris v0.3 · interpreted language for operations, AI and governance" data-class="tight" data-theme="aeris" lang="C" class="tight" data-marpit-pagination="38" style="--paginate:true;--header:Technical presentation · v0.3;--footer:Aeris v0.3 · interpreted language for operations, AI and governance;--class:tight;--theme:aeris;" data-marpit-pagination-total="53">
<header>Technical presentation · v0.3</header>

<h1 id="external-libraries--content-addressed-supply-chain">External libraries — content-addressed supply chain</h1>
<div class="columns">
<div class="column">
<pre><code class="language-rust"><span class="hljs-keyword">use</span> deploy
  from <span class="hljs-string">&quot;github.com/acmecorp/aeris-devops&quot;</span>
       deploy@<span class="hljs-string">&quot;1.2.0&quot;</span>
</code></pre>
<pre><code class="language-toml"><span class="hljs-section">[deps]</span>
<span class="hljs-attr">deploy</span> = { source  = <span class="hljs-string">&quot;github.com/acmecorp/aeris-devops&quot;</span>,
           <span class="hljs-attr">version</span> = <span class="hljs-string">&quot;1.2.0&quot;</span>,
           <span class="hljs-attr">hash</span>    = <span class="hljs-string">&quot;blake3:7e2c...c1a4&quot;</span> }
</code></pre>
</div>
<div class="column compact">
<ul>
<li>Each dependency is identified by the <strong>blake3 hash</strong> of its bytes.</li>
<li>If the fetched bytes do not match the hash, the run fails <strong>before any code from the dep executes</strong>.</li>
<li>No <code>latest</code>, no <code>*</code>, no movable Git tags — the version answer is always in <code>aeris.toml</code>.</li>
<li>External libs are always <code>.aer</code> source, pinned by <code>blake3</code> in <code>aeris.toml</code>. L2 modules are signed <code>.so</code> extensions of the stdlib (M45) — only modules signed by the Aeris registry key are accepted.</li>
</ul>
<blockquote>
<p>Same content-addressing approach already used by Cargo, npm, Nix.</p>
</blockquote>
</div>
</div>
<footer>Aeris v0.3 · interpreted language for operations, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="39" data-paginate="true" data-header="Technical presentation · v0.3" data-footer="Aeris v0.3 · interpreted language for operations, AI and governance" data-class="tight" data-theme="aeris" lang="C" class="tight" data-marpit-pagination="39" style="--paginate:true;--header:Technical presentation · v0.3;--footer:Aeris v0.3 · interpreted language for operations, AI and governance;--class:tight;--theme:aeris;" data-marpit-pagination-total="53">
<header>Technical presentation · v0.3</header>

<h1 id="manifest-and-lock-file--aeristoml-surfacelock">Manifest and lock file — <code>aeris.toml</code>, <code>surface.lock</code></h1>
<div class="columns">
<div class="column">
<pre><code class="language-toml"><span class="hljs-comment"># aeris.toml — single project reference</span>
<span class="hljs-section">[project]</span>
<span class="hljs-attr">name</span>  = <span class="hljs-string">&quot;settle-pipeline&quot;</span>
<span class="hljs-attr">aeris</span> = <span class="hljs-string">&quot;0.3.0&quot;</span>

<span class="hljs-section">[caps]</span>
<span class="hljs-attr">enforce</span>         = <span class="hljs-string">&quot;strict&quot;</span>
<span class="hljs-attr">http.allow</span>      = [<span class="hljs-string">&quot;api.acme.com&quot;</span>]
<span class="hljs-attr">kube.contexts</span>   = [<span class="hljs-string">&quot;prod-eu-1&quot;</span>]
<span class="hljs-attr">ai.models</span>       = [<span class="hljs-string">&quot;claude-opus-4-7&quot;</span>]

<span class="hljs-section">[ai.backend]</span>
<span class="hljs-attr">kind</span> = <span class="hljs-string">&quot;http&quot;</span>
<span class="hljs-attr">url</span>  = <span class="hljs-string">&quot;https://api.anthropic.com&quot;</span>
<span class="hljs-attr">auth</span> = <span class="hljs-string">&quot;env:ANTHROPIC_API_KEY&quot;</span>
</code></pre>
</div>
<div class="column">
<pre><code class="language-toml"><span class="hljs-comment"># .aeris/surface.lock — produced by `aeris lock surface`</span>
<span class="hljs-section">[surface.&quot;src/invoices.aer&quot;.settle]</span>
<span class="hljs-attr">caps</span>       = [<span class="hljs-string">&quot;http.post&quot;</span>, <span class="hljs-string">&quot;kube.apply&quot;</span>, <span class="hljs-string">&quot;audit.event&quot;</span>]
<span class="hljs-attr">allow.http</span> = [<span class="hljs-string">&quot;api.acme.com&quot;</span>]
</code></pre>
<ul>
<li><strong><code>[caps]</code></strong> is the project-wide ceiling on authority.</li>
<li><strong><code>[ai.backend]</code></strong> picks where AI calls go — HTTP API or local CLI process.</li>
<li><code>surface.lock</code> has one entry per <code>pub fn</code>. A PR that <strong>broadens</strong> any surface must regenerate the lock — the diff is the first hunk in review.</li>
</ul>
</div>
</div>
<footer>Aeris v0.3 · interpreted language for operations, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="40" data-paginate="true" data-header="Technical presentation · v0.3" data-footer="Aeris v0.3 · interpreted language for operations, AI and governance" data-class="divider" data-theme="aeris" lang="C" class="divider" data-marpit-pagination="40" style="--paginate:true;--header:Technical presentation · v0.3;--footer:Aeris v0.3 · interpreted language for operations, AI and governance;--class:divider;--theme:aeris;" data-marpit-pagination-total="53">
<header>Technical presentation · v0.3</header>

<h1 id="why-aeris--design-philosophy">Why Aeris — Design philosophy</h1>
<blockquote>
<p>Why these four layers, why a small language, why now. The thesis: a language designed for the principal author of code today — the model — and for the <strong>reproducibility</strong> its stochastic nature requires.</p>
</blockquote>
<footer>Aeris v0.3 · interpreted language for operations, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="41" data-paginate="true" data-header="Technical presentation · v0.3" data-footer="Aeris v0.3 · interpreted language for operations, AI and governance" data-theme="aeris" lang="C" data-marpit-pagination="41" style="--paginate:true;--header:Technical presentation · v0.3;--footer:Aeris v0.3 · interpreted language for operations, AI and governance;--theme:aeris;" data-marpit-pagination-total="53">
<header>Technical presentation · v0.3</header>
<h1 id="why-these-four-layers">Why these four layers?</h1>
<blockquote>
<p>Code is increasingly <strong>generated</strong> by LLMs and <strong>read</strong> by LLMs — for reasoning, debugging, modifying. That changes the design constraints of the language itself.</p>
</blockquote>
<p><strong>Two requirements that matter now</strong></p>
<ul>
<li><strong>Reduce non-determinism</strong> at every level the language can control.</li>
<li><strong>Make code mechanically verifiable</strong> — what is in the source is the truth.</li>
</ul>
<p><strong>The four layers, as a response</strong></p>
<ul>
<li><strong>L1 — syntax.</strong> Density and zero ambiguity reduce hallucinations.</li>
<li><strong>L2 — semantics.</strong> <code>cap</code>, contracts, <code>intent</code> make a function's behaviour mechanically checkable.</li>
<li><strong>L3 — agentic loop.</strong> Per-step trace and idempotent compensations make recovery <strong>deterministic over a non-deterministic execution</strong>.</li>
<li><strong>L4 — multi-agent.</strong> The routing protocol becomes a <strong>typed graph</strong>, not a coordination prompt.</li>
</ul>
<blockquote>
<p><strong>Opt-in is the contract.</strong> A 30-line script uses only L1; a regulated production system uses all four.</p>
</blockquote>
<footer>Aeris v0.3 · interpreted language for operations, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="42" data-paginate="true" data-header="Technical presentation · v0.3" data-footer="Aeris v0.3 · interpreted language for operations, AI and governance" data-theme="aeris" lang="C" data-marpit-pagination="42" style="--paginate:true;--header:Technical presentation · v0.3;--footer:Aeris v0.3 · interpreted language for operations, AI and governance;--theme:aeris;" data-marpit-pagination-total="53">
<header>Technical presentation · v0.3</header>
<h1 id="the-thesis--controlled-non-determinism">The thesis — controlled non-determinism</h1>
<blockquote>
<p><em>A small language in which the <strong>visibility</strong> of effects, the <strong>compensation</strong> of external writes, the <strong>integrity</strong> of the supply chain, and the <strong>intent</strong> are structural properties of the source.</em></p>
</blockquote>
<p><strong>Three sources of non-determinism</strong></p>
<table>
<thead>
<tr>
<th>Source</th>
<th>Nature</th>
<th>What addresses it</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>The model</strong></td>
<td>Same prompt, different output</td>
<td>Trace + replay</td>
</tr>
<tr>
<td><strong>The grammar</strong></td>
<td>Ambiguous constructs force the model to guess</td>
<td>Reserved keywords, one canonical form, <code>cap</code> as value</td>
</tr>
<tr>
<td><strong>The world</strong></td>
<td>Networks drop, databases mutate, file systems change</td>
<td><code>cap</code>, <code>intent</code>, <code>requires</code> / <code>ensures</code>, <code>policy</code>, <code>model@vN</code></td>
</tr>
</tbody>
</table>
<blockquote>
<p>Aeris does not try to <em>eliminate</em> non-determinism — it makes it <strong>explicit, isolated and governable</strong>.</p>
</blockquote>
<footer>Aeris v0.3 · interpreted language for operations, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="43" data-paginate="true" data-header="Technical presentation · v0.3" data-footer="Aeris v0.3 · interpreted language for operations, AI and governance" data-theme="aeris" lang="C" data-marpit-pagination="43" style="--paginate:true;--header:Technical presentation · v0.3;--footer:Aeris v0.3 · interpreted language for operations, AI and governance;--theme:aeris;" data-marpit-pagination-total="53">
<header>Technical presentation · v0.3</header>
<h1 id="designed-for-llms-14--familiar-carrier-domain-inserts">Designed for LLMs (1/4) — Familiar carrier, domain inserts</h1>
<blockquote>
<p>The probability that a model produces correct code rises with how much the code <strong>resembles its training corpus</strong> and how <strong>narrow</strong> the space of valid completions is.</p>
</blockquote>
<p><strong>Familiar carrier — lower the cognitive ramp</strong></p>
<ul>
<li>Curly braces, <code>match</code>, <strong>named arguments</strong> — known to anyone who used <strong>Rust, Go, Swift</strong>.</li>
<li>Tokenizer-friendly, well-represented in pre-training corpora.</li>
<li>Human reviewers and models pick the surface up <strong>without learning a new dialect</strong>.</li>
</ul>
<p><strong>Domain inserts — channel the intention</strong></p>
<ul>
<li><code>saga</code>, <code>agent</code>, <code>intent</code>, <code>policy</code>, <code>cap</code> — first-class constructs that <strong>encode the domain in the grammar</strong>.</li>
<li>A compensating workflow is <code>saga { step { do {…} undo {…} } }</code>, not fifty lines of try / finally.</li>
<li>Fewer syntactically valid completions → <strong>fewer errors per generated token</strong>.</li>
</ul>
<blockquote>
<p><strong>Familiar where it lowers the ramp; novel where it concentrates intent.</strong></p>
</blockquote>
<footer>Aeris v0.3 · interpreted language for operations, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="44" data-paginate="true" data-header="Technical presentation · v0.3" data-footer="Aeris v0.3 · interpreted language for operations, AI and governance" data-theme="aeris" lang="C" data-marpit-pagination="44" style="--paginate:true;--header:Technical presentation · v0.3;--footer:Aeris v0.3 · interpreted language for operations, AI and governance;--theme:aeris;" data-marpit-pagination-total="53">
<header>Technical presentation · v0.3</header>
<h1 id="designed-for-llms-24--what-not-how">Designed for LLMs (2/4) — WHAT, not HOW</h1>
<blockquote>
<p>Programming languages were always an interface between <strong>the human mind</strong> and <strong>the machine</strong>. The principal author of code today is an LLM. <strong>That assumption has fallen.</strong></p>
</blockquote>
<p><strong>The shift in the question</strong></p>
<ul>
<li>A model does not have a mental model of the program.</li>
<li>It has a <strong>probability distribution over the next token</strong>.</li>
<li>Generating code is, for a model, an <strong>intrinsically stochastic</strong> process.</li>
</ul>
<p><strong>From &quot;how do I build it?&quot; to &quot;what do I want built?&quot;</strong></p>
<ul>
<li>Traditional language: <em>how do I lay out the syntax to be readable?</em></li>
<li>Aeris: <em>what intentions can the agent express directly, without encoding them as mechanism?</em></li>
<li><code>saga</code>, <code>agent</code>, <code>intent</code>, <code>policy</code> are <strong>complete intentions</strong>, not mechanisms.</li>
</ul>
<blockquote>
<p><code>agent_net { flow extractor -&gt; normalizer }</code> communicates more intent than fifty lines of Python — and gives the model less margin to introduce error.</p>
</blockquote>
<footer>Aeris v0.3 · interpreted language for operations, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="45" data-paginate="true" data-header="Technical presentation · v0.3" data-footer="Aeris v0.3 · interpreted language for operations, AI and governance" data-theme="aeris" lang="C" data-marpit-pagination="45" style="--paginate:true;--header:Technical presentation · v0.3;--footer:Aeris v0.3 · interpreted language for operations, AI and governance;--theme:aeris;" data-marpit-pagination-total="53">
<header>Technical presentation · v0.3</header>
<h1 id="designed-for-llms-34--high-abstraction-not-low">Designed for LLMs (3/4) — High abstraction, not low</h1>
<blockquote>
<p>The opposite temptation: keep the language <strong>low-level</strong>, close to the hardware, so the model &quot;has less room to fail.&quot; <strong>Wrong logic.</strong></p>
</blockquote>
<p><strong>Why high abstraction wins</strong></p>
<ul>
<li>A model generates correct code with probability proportional to:
<ul>
<li>how much the code <strong>resembles its training corpus</strong>, and</li>
<li>how <strong>constrained</strong> the space of valid completions is by the language.</li>
</ul>
</li>
<li>High abstraction does both:
<ul>
<li><strong>fewer decisions to make</strong> → fewer points of failure;</li>
<li><strong>higher signal-to-noise</strong> per generated token.</li>
</ul>
</li>
</ul>
<p><strong>Concrete consequence</strong></p>
<ul>
<li><code>saga deploy { … }</code> codifies an entire deployment-with-compensation pattern in one keyword.</li>
<li>Replacing it with twenty <code>if</code> / <code>else</code> branches and ad-hoc rollback logic does not make the model more accurate — it makes it more likely to <strong>drift</strong>.</li>
</ul>
<blockquote>
<p>The aim is not a language humans write faster — it is a language <strong>agents execute with more certainty</strong>.</p>
</blockquote>
<footer>Aeris v0.3 · interpreted language for operations, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="46" data-paginate="true" data-header="Technical presentation · v0.3" data-footer="Aeris v0.3 · interpreted language for operations, AI and governance" data-theme="aeris" lang="C" data-marpit-pagination="46" style="--paginate:true;--header:Technical presentation · v0.3;--footer:Aeris v0.3 · interpreted language for operations, AI and governance;--theme:aeris;" data-marpit-pagination-total="53">
<header>Technical presentation · v0.3</header>
<h1 id="designed-for-llms-44--why-as-grammar">Designed for LLMs (4/4) — Why-as-grammar</h1>
<blockquote>
<p>Historically the <em>what</em> of code lived in the source; the <em>why</em> lived in commits, tickets, PR descriptions — channels the agent <strong>never reads</strong>.</p>
</blockquote>
<p><strong>The cost of that separation</strong></p>
<ul>
<li>A model reading a <code>.aer</code> file <em>without</em> the why must <strong>reverse-engineer purpose</strong> from mechanics.</li>
<li><strong>Every inference is a point of non-determinism.</strong></li>
<li>An agent <em>executing</em> code without knowing why cannot decide whether to <strong>continue, stop, or escalate</strong> when state looks off — it has no acceptance criterion.</li>
</ul>
<p><strong>The why, lifted into the grammar</strong></p>
<ul>
<li><strong><code>intent</code></strong> — purpose attached to every effectful block; <strong>mandatory</strong> at the parse level (exit code 66).</li>
<li><strong><code>requires:</code> / <code>ensures:</code></strong> — conditions on inputs, outputs, world state; <strong>runtime contracts</strong>, exit 64 on violation.</li>
<li><strong><code>policy</code></strong> — declarative guardrails the runtime evaluates <strong>on every matching call</strong>.</li>
<li>All three propagate as <strong>structured events</strong> into the trace — another agent can consume them.</li>
</ul>
<blockquote>
<p>A call with external effects without an enclosing <code>intent</code> is <strong>not even parsed</strong>.</p>
</blockquote>
<footer>Aeris v0.3 · interpreted language for operations, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="47" data-paginate="true" data-header="Technical presentation · v0.3" data-footer="Aeris v0.3 · interpreted language for operations, AI and governance" data-theme="aeris" lang="C" data-marpit-pagination="47" style="--paginate:true;--header:Technical presentation · v0.3;--footer:Aeris v0.3 · interpreted language for operations, AI and governance;--theme:aeris;" data-marpit-pagination-total="53">
<header>Technical presentation · v0.3</header>
<h1 id="reducing-non-determinism-13--the-model">Reducing non-determinism (1/3) — The model</h1>
<blockquote>
<p><strong>Same prompt, different output.</strong> <code>temperature = 0</code> attenuates the variance; it does not eliminate it. This is a physical property of the model — not something a language can remove.</p>
</blockquote>
<p><strong>Aeris' answer: capture, not control</strong></p>
<ul>
<li>Every <code>ai.*</code> call is recorded in the JSONL trace: <strong>prompt, model, response, tokens, timestamp</strong>.</li>
<li><code>aeris replay &lt;trace_id&gt;</code> reproduces the recorded tape — <strong>no network, no model cost, bit-identical</strong> on the deterministic subset.</li>
<li><code>aeris trace diff</code> aligns events by <code>(scope, ordinal)</code> and reports field-level divergences — the foundation for <strong>regression bisect</strong>.</li>
</ul>
<p><strong>The honest promise</strong></p>
<ul>
<li><em>Not</em> &quot;deterministic LLM code&quot; — that would be physically false.</li>
<li><em>Yes</em> <strong>reproducibility after the first execution</strong> — exactly what audit, debugging, regression tests, and post-incident analysis need.</li>
<li>The first run is non-deterministic; <strong>every replay is identical</strong>.</li>
</ul>
<blockquote>
<p><strong>Capture the stochasticity. Do not pretend to control it.</strong></p>
</blockquote>
<footer>Aeris v0.3 · interpreted language for operations, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="48" data-paginate="true" data-header="Technical presentation · v0.3" data-footer="Aeris v0.3 · interpreted language for operations, AI and governance" data-theme="aeris" lang="C" data-marpit-pagination="48" style="--paginate:true;--header:Technical presentation · v0.3;--footer:Aeris v0.3 · interpreted language for operations, AI and governance;--theme:aeris;" data-marpit-pagination-total="53">
<header>Technical presentation · v0.3</header>
<h1 id="reducing-non-determinism-23--the-grammar">Reducing non-determinism (2/3) — The grammar</h1>
<blockquote>
<p>Every ambiguity in the language forces the model to <strong>infer</strong>. Every inference is a fresh point of non-determinism the language can prevent <strong>by construction</strong>.</p>
</blockquote>
<p><strong>Three structural choices</strong></p>
<ul>
<li><strong>All keywords are reserved.</strong> No soft keywords, no position-dependent meaning. <code>grep saga</code> finds <strong>every saga</strong> in the project — no false negatives.</li>
<li><strong>One canonical form per concept.</strong> <code>aeris fmt</code> is <strong>total, not partial</strong> — exactly one way to write each construct, so model and human converge on the same shape.</li>
<li><strong>Capabilities are values, passed as parameters.</strong> The function signature <strong>is the truth</strong> about what the function can touch — no hidden state, no ambient authority to infer.</li>
</ul>
<p><strong>Consequence for the model</strong></p>
<ul>
<li>Fewer paths through the grammar → <strong>tighter completion distribution</strong>.</li>
<li>A reviewer (human or agent) reads the signature and <strong>already knows</strong> what the function can do.</li>
</ul>
<blockquote>
<p>The language gives the model <strong>nothing to guess about</strong>.</p>
</blockquote>
<footer>Aeris v0.3 · interpreted language for operations, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="49" data-paginate="true" data-header="Technical presentation · v0.3" data-footer="Aeris v0.3 · interpreted language for operations, AI and governance" data-theme="aeris" lang="C" data-marpit-pagination="49" style="--paginate:true;--header:Technical presentation · v0.3;--footer:Aeris v0.3 · interpreted language for operations, AI and governance;--theme:aeris;" data-marpit-pagination-total="53">
<header>Technical presentation · v0.3</header>
<h1 id="reducing-non-determinism-33--the-world">Reducing non-determinism (3/3) — The world</h1>
<blockquote>
<p>Code runs against networks, databases, file systems — state that changes between two runs of the same program. This is what <strong>governance</strong> addresses.</p>
</blockquote>
<p><strong>Five structural constructs</strong></p>
<ul>
<li><strong><code>intent</code></strong> binds code to its purpose; <strong>mandatory</strong> on every effectful call — the parser rejects its absence.</li>
<li><strong><code>requires:</code> / <code>ensures:</code></strong> declare conditions on inputs, outputs, world state; a violation <strong>halts at the boundary</strong>, before damage propagates.</li>
<li><strong><code>cap</code></strong> isolates what each function can touch — the signature <strong>lists the authority</strong>.</li>
<li><strong><code>model@vN</code></strong> validates data crossing trust boundaries — a malformed model response is <strong>rejected before it reaches business logic</strong>.</li>
<li><strong><code>policy</code></strong> enforces guardrails the model <strong>cannot forget</strong> — evaluated by the runtime, not entrusted to a system prompt.</li>
</ul>
<blockquote>
<p>The world stays non-deterministic. <strong>The program's response to it does not.</strong></p>
</blockquote>
<footer>Aeris v0.3 · interpreted language for operations, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="50" data-paginate="true" data-header="Technical presentation · v0.3" data-footer="Aeris v0.3 · interpreted language for operations, AI and governance" data-theme="aeris" lang="C" data-marpit-pagination="50" style="--paginate:true;--header:Technical presentation · v0.3;--footer:Aeris v0.3 · interpreted language for operations, AI and governance;--theme:aeris;" data-marpit-pagination-total="53">
<header>Technical presentation · v0.3</header>
<h1 id="theoretical-foundations">Theoretical foundations</h1>
<blockquote>
<p>Nothing in Aeris is new research. The contribution is <strong>synthesis</strong> of well-understood models, applied at one specific level of abstraction: a small interpreted language for <strong>operations, AI, and governance</strong>.</p>
</blockquote>
<p><strong>Pieces, applied</strong></p>
<ul>
<li><strong>Capabilities as values</strong> — the object-capability pattern: the function signature <strong>is the authority graph</strong>; no ambient access.</li>
<li><strong>Sagas with mandatory compensation</strong> — a long-running operation decomposed into idempotent steps, each with an <code>undo</code>.</li>
<li><strong>Content-addressed supply chain</strong> — every external dep is pinned by its <strong>blake3 hash</strong> in <code>aeris.toml</code>; if the bytes do not match, <strong>no code from the dep runs</strong>. Same approach as <strong>Cargo, npm, Nix</strong>.</li>
<li><strong>Runtime contracts</strong> — pre / post-conditions checked at boundaries, not proved statically.</li>
</ul>
<p><strong>Why this synthesis matters here</strong></p>
<ul>
<li>Each piece has decades of evidence in its own domain.</li>
<li>Putting them together <strong>inside the grammar</strong> — not in side-channels — is what makes them visible to the agent that is now the <strong>principal author</strong>.</li>
</ul>
<blockquote>
<p><strong>Engineering applied.</strong> The novelty is in the <strong>assembly</strong>, not in the parts.</p>
</blockquote>
<footer>Aeris v0.3 · interpreted language for operations, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="51" data-paginate="true" data-header="Technical presentation · v0.3" data-footer="Aeris v0.3 · interpreted language for operations, AI and governance" data-theme="aeris" lang="C" data-marpit-pagination="51" style="--paginate:true;--header:Technical presentation · v0.3;--footer:Aeris v0.3 · interpreted language for operations, AI and governance;--theme:aeris;" data-marpit-pagination-total="53">
<header>Technical presentation · v0.3</header>
<h1 id="honest-limits">Honest limits</h1>
<blockquote>
<p>Aeris does not promise what it cannot deliver. Every refusal pays a <strong>declared cost</strong>.</p>
</blockquote>
<p><strong>What Aeris does not promise</strong></p>
<ul>
<li><strong>First model run stays non-deterministic.</strong> Replay is reproducibility <em>after</em> the first run — never instead of it.</li>
<li><strong>In-body correctness inside a legitimate <code>cap</code> is not verified.</strong> That is what tests, property checks, and backend RBAC are for.</li>
<li><strong><code>cap</code> over-broadening is a process problem.</strong> The <code>surface.lock</code> diff makes it visible; CI enforces it.</li>
<li><strong>Cascading undo is best-effort.</strong> Retries exhaust → <code>PartialFailure</code> (exit code 74), surfaced to the operator.</li>
</ul>
<p><strong>Position in the stack</strong></p>
<ul>
<li>Aeris is the <strong>first defensive layer</strong>, not the only one.</li>
<li>It removes whole classes of error from the source — it does not replace operational discipline.</li>
</ul>
<blockquote>
<p>The promise is <strong>made explicit</strong>, so the parts that need other safeguards are visible.</p>
</blockquote>
<footer>Aeris v0.3 · interpreted language for operations, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="52" data-paginate="true" data-header="Technical presentation · v0.3" data-footer="Aeris v0.3 · interpreted language for operations, AI and governance" data-theme="aeris" lang="C" data-marpit-pagination="52" style="--paginate:true;--header:Technical presentation · v0.3;--footer:Aeris v0.3 · interpreted language for operations, AI and governance;--theme:aeris;" data-marpit-pagination-total="53">
<header>Technical presentation · v0.3</header>
<h1 id="what-aeris-refuses-on-principle">What Aeris refuses on principle</h1>
<blockquote>
<p>Every refusal is a deliberate trade: a feature declined to keep <strong>what is in the source the truth</strong>.</p>
</blockquote>
<p><strong>No automatic formal proofs</strong></p>
<ul>
<li>Solver verdicts depend on the <strong>machine and the heuristics</strong> — that is non-determinism in the <em>tooling</em>, the very thing we are trying to control.</li>
<li><code>requires:</code> / <code>ensures:</code> are <strong>runtime contracts</strong>, checked at boundaries.</li>
</ul>
<p><strong>No automatic inference of capabilities</strong></p>
<ul>
<li>The signature must be the truth. A hidden inference would silently broaden authority between two PRs — and <strong>break review</strong>.</li>
</ul>
<p><strong>No mutable dependency references</strong></p>
<ul>
<li>No <code>latest</code>, no <code>*</code>, no movable Git tags. The answer to <em>&quot;what version is in this build?&quot;</em> is always in <code>aeris.toml</code>, pinned by <strong>blake3 hash</strong>.</li>
</ul>
<p><strong>No unsigned third-party native plug-ins</strong></p>
<ul>
<li>Only L2 modules signed by the <strong>Aeris registry key</strong> are loaded. Their cap surface is declared in an embedded manifest the static checker reads — no opaque native authority.</li>
</ul>
<footer>Aeris v0.3 · interpreted language for operations, AI and governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="53" data-paginate="true" data-header="Technical presentation · v0.3" data-footer="Aeris v0.3 · interpreted language for operations, AI and governance" data-class="divider" data-theme="aeris" lang="C" class="divider" data-marpit-pagination="53" style="--paginate:true;--header:Technical presentation · v0.3;--footer:Aeris v0.3 · interpreted language for operations, AI and governance;--class:divider;--theme:aeris;" data-marpit-pagination-total="53">
