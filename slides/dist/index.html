<header>Presentazione tecnica · v0.3</header>
<h1 id="il-file-di-progetto-come-riferimento-unico">Il file di progetto come riferimento unico</h1>
<div class="columns">
<div class="column">
<pre><code class="language-toml"><span class="hljs-section">[project]</span>
<span class="hljs-attr">name</span>  = <span class="hljs-string">&quot;pipeline-fatture&quot;</span>
<span class="hljs-attr">aeris</span> = <span class="hljs-string">&quot;0.3.0&quot;</span>

<span class="hljs-comment"># Dipendenze esterne: nome locale, sorgente, versione,</span>
<span class="hljs-comment"># impronta crittografica del contenuto.</span>
<span class="hljs-section">[deps]</span>
<span class="hljs-attr">deploy</span> = { source = <span class="hljs-string">&quot;github.com/acmecorp/aeris-devops&quot;</span>,
           <span class="hljs-attr">version</span> = <span class="hljs-string">&quot;1.2.0&quot;</span>,
           <span class="hljs-attr">hash</span>    = <span class="hljs-string">&quot;blake3:...&quot;</span> }

<span class="hljs-comment"># Permessi consentiti al programma nel suo insieme.</span>
<span class="hljs-comment"># Modalità rigida: ogni funzione deve dichiarare i propri.</span>
<span class="hljs-section">[caps]</span>
<span class="hljs-attr">enforce</span>         = <span class="hljs-string">&quot;strict&quot;</span>
<span class="hljs-attr">http.allow</span>      = [<span class="hljs-string">&quot;api.acme.com&quot;</span>]
<span class="hljs-attr">fs.allow_write</span>  = [<span class="hljs-string">&quot;./out/**&quot;</span>]
<span class="hljs-attr">ai.models</span>       = [<span class="hljs-string">&quot;claude-opus-4-7&quot;</span>, <span class="hljs-string">&quot;claude-haiku-4-5&quot;</span>]

<span class="hljs-comment"># Come raggiungere il modello: chiamata HTTP a un&#x27;API</span>
<span class="hljs-comment"># oppure invocazione di un sottoprocesso da riga di comando.</span>
<span class="hljs-section">[ai.backend]</span>
<span class="hljs-attr">kind</span> = <span class="hljs-string">&quot;http&quot;</span>
<span class="hljs-attr">url</span>  = <span class="hljs-string">&quot;https://api.anthropic.com&quot;</span>
<span class="hljs-attr">auth</span> = <span class="hljs-string">&quot;env:ANTHROPIC_API_KEY&quot;</span>

<span class="hljs-comment"># Regole di runtime attive nel progetto (slide più avanti).</span>
<span class="hljs-section">[policies]</span>
<span class="hljs-attr">active</span> = [<span class="hljs-string">&quot;egress_produzione&quot;</span>]
</code></pre>
</div>
<div class="column compact">
<p><strong>Un solo file <code>aeris.toml</code> per quello che oggi è sparso</strong></p>
<p>Il file di progetto raccoglie in un solo posto informazioni che oggi vivono distribuite fra variabili d'ambiente, file di manifest, file di configurazione e file di lock specifici dei singoli strumenti.</p>
<p><strong>Contiene quattro cose</strong></p>
<ul>
<li><strong>Le dipendenze</strong>: ogni libreria esterna è registrata con sorgente, versione e impronta crittografica del contenuto. Se la libreria scaricata non corrisponde all'impronta, il programma fallisce <em>prima</em> di iniziare l'esecuzione.</li>
<li><strong>I permessi consentiti</strong>: l'elenco di tutto ciò che il programma può fare verso l'esterno (rete, file system, modelli). Costituisce il <em>tetto</em> dei permessi che le singole funzioni possono dichiarare.</li>
<li><strong>Il backend del modello</strong>: come parlare al modello linguistico (chiamata HTTP a un'API o invocazione di un sottoprocesso da riga di comando).</li>
<li><strong>Le <code>policy</code> attive</strong>: quali regole di sicurezza vengono applicate a ogni chiamata.</li>
</ul>
<blockquote>
<p>La funzione <code>main</code> riceve i permessi <strong>sintetizzati a partire da questo file</strong>. Non esiste alcun altro modo di costruire un valore di tipo <code>cap</code> partendo da zero: i permessi entrano nel programma dall'unico punto controllato in revisione.</p>
</blockquote>
</div>
</div>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="14" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-class="divider" data-theme="aeris" lang="it-IT" class="divider" data-marpit-pagination="14" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--class:divider;--theme:aeris;" data-marpit-pagination-total="39">
<header>Presentazione tecnica · v0.3</header>

<h1 id="parte-iii--le-capabilities">Parte III — Le capabilities</h1>
<blockquote>
<p>Il permesso di compiere un effetto esterno è un <strong>valore</strong> passato come parametro. La firma della funzione è il contratto. Non esiste uno spazio dei nomi globale da cui poter chiamare funzioni con effetti; non esistono effetti collaterali nascosti.</p>
</blockquote>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="15" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-theme="aeris" lang="it-IT" data-marpit-pagination="15" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--theme:aeris;" data-marpit-pagination-total="39">
<header>Presentazione tecnica · v0.3</header>
<h1 id="una-capability-%C3%A8-un-valore-di-tipo-cap">Una capability è un valore di tipo <code>cap</code></h1>
<div class="columns">
<div class="column">
<pre><code class="language-aeris">// Funzione pura: senza il parametro cap non può compiere
// alcun effetto esterno (rete, file, modello).
fn totale(items: list&lt;Fattura@v1&gt;) -&gt; decimal {
  items.map(fn(it) { it.importo }).sum()
}

// Funzione con effetti: l'elenco degli effetti permessi
// è esposto interamente nella firma.
fn chiudi_lotto(
  items: list&lt;Fattura@v1&gt;,
  cap: cap[
    http.post @ [&quot;api.acme.com&quot;],   // solo questo host
    audit.event,                    // qualsiasi evento
  ],
) -&gt; result&lt;unit&gt; {
  intent &quot;chiudi il lotto fatture&quot; {
    for it in items {
      http.post(&quot;https://api.acme.com/charge&quot;, it)?
    }
    audit.event(&quot;chiusura.completata&quot;, { conteggio: len(items) })
  }
}
</code></pre>
</div>
<div class="column compact">
<p><strong>Cosa significa &quot;capability come valore&quot;</strong></p>
<p>Per compiere una chiamata che ha un effetto esterno (<code>http.post</code>, <code>fs.write_file</code>, <code>ai.complete</code>, ...) una funzione deve aver ricevuto un parametro di tipo <code>cap</code> che concede quel preciso permesso. Senza tale parametro, il compilatore <em>rifiuta</em> la chiamata.</p>
<p>Il tipo <code>cap[...]</code> elenca le operazioni concesse e i loro vincoli: ogni operazione può avere una lista di valori ammessi (host per HTTP, percorso per il file system, modello per le chiamate AI, bucket, coda di messaggi, e così via).</p>
<p>La firma di <code>chiudi_lotto</code> dice <strong>tutto</strong>: questa funzione può fare <code>http.post</code> solo verso <code>api.acme.com</code> e scrivere eventi di audit; nient'altro. Né lei né le funzioni che chiama possono uscire da questo perimetro.</p>
<blockquote>
<p>È l'idea della <em>object-capability security</em>: tenere a vista il diritto di compiere un effetto, sotto forma di valore esplicito, invece di leggerlo da uno spazio dei nomi globale.</p>
</blockquote>
</div>
</div>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="16" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-theme="aeris" lang="it-IT" data-marpit-pagination="16" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--theme:aeris;" data-marpit-pagination-total="39">
<header>Presentazione tecnica · v0.3</header>
<h1 id="restringere-la-capability-quando-si-passa-al-chiamato">Restringere la capability quando si passa al chiamato</h1>
<div class="columns">
<div class="column">
<pre><code class="language-aeris">fn chiudi_lotto(items, cap: cap[
  http.post     @ [&quot;api.acme.com&quot;, &quot;api.stripe.com&quot;],
  fs.write_file @ [&quot;./out/**&quot;],
]) {
  // Quando si chiama `addebita` le si passa una capability
  // più stretta: solo http.post verso api.stripe.com.
  // Non si può MAI allargare ciò che si è ricevuto.
  addebita(items, cap.subset[
    http.post @ [&quot;api.stripe.com&quot;]
  ])
}

fn addebita(items, cap: cap[http.post @ [&quot;api.stripe.com&quot;]]) {
  intent &quot;addebita le carte di credito&quot; {
    for it in items { http.post(it.endpoint, it)? }
  }
}
</code></pre>
</div>
<div class="column compact">
<p><strong>Quattro regole strutturali</strong></p>
<p>Sono verificate dal controllore statico, prima che il programma giri.</p>
<ul>
<li>L'operatore <code>cap.subset[...]</code> accetta solo <strong>restringimenti</strong> della capability ricevuta. Un tentativo di allargarla (chiedere un permesso non posseduto) viene rifiutato.</li>
<li>Un valore di tipo <code>cap</code> non può essere salvato dentro un record, restituito come campo di un altro tipo, inviato attraverso un canale. La sua circolazione resta visibile nella firma delle funzioni.</li>
<li>La forma &quot;tuttofare&quot; <code>cap[*]</code> è proibita nel codice utente: nessuna funzione può chiedere &quot;tutti i permessi possibili&quot;.</li>
<li>Solo <code>main</code> riceve la capability iniziale, e la riceve <strong>sintetizzata a partire dal file di progetto</strong>. Non c'è modo di costruirne una da zero altrove.</li>
</ul>
<blockquote>
<p>Una capability che scende lungo l'albero delle chiamate può solo restringersi. Un attacco che cerca di inserire una chiamata a <code>evil.com</code> viene fermato dal compilatore, prima di arrivare in produzione.</p>
</blockquote>
</div>
</div>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="17" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-theme="aeris" lang="it-IT" data-marpit-pagination="17" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--theme:aeris;" data-marpit-pagination-total="39">
<header>Presentazione tecnica · v0.3</header>
<h1 id="le-chiamate-con-effetti-sono-legate-al-cap-ricevuto">Le chiamate con effetti sono legate al <code>cap</code> ricevuto</h1>
<div class="columns">
<div class="column">
<pre><code class="language-aeris">use http       // rende il modulo http visibile nel file

// FALLISCE: in questa funzione non esiste alcun cap
// che concede http.get. Il compilatore rifiuta la
// chiamata con un errore di tipo &quot;permesso mancante&quot;.
fn stato_servizio() -&gt; int {
  http.get(&quot;https://api.acme.com/health&quot;)?.status
}

// OK: la firma dichiara il permesso http.get verso
// api.acme.com; la chiamata viene legata a quel cap.
fn stato_servizio_ok(
  cap: cap[http.get @ [&quot;api.acme.com&quot;]]
) -&gt; int {
  http.get(&quot;https://api.acme.com/health&quot;)?.status
}
</code></pre>
</div>
<div class="column compact">
<p><strong>Le chiamate <code>modulo.operazione(...)</code> non sono globali</strong></p>
<p>Quando in un programma compare <code>http.get(...)</code>, non si sta invocando una funzione di uno spazio dei nomi globale. Il compilatore risolve la chiamata cercando, fra i parametri visibili nel contesto, un valore di tipo <code>cap</code> che concede l'operazione <code>http.get</code>. Se non lo trova, la chiamata viene rifiutata.</p>
<p><strong>Conseguenze pratiche</strong></p>
<ul>
<li>Importare un modulo (<code>use http</code>) non introduce alcuna funzione globale <code>http.post</code>. L'<code>use</code> rende visibile il nome del modulo per scrivere la chiamata, ma il permesso vero arriva sempre dal <code>cap</code> ricevuto.</li>
<li>Aggiungere <code>use http</code> in cima al file non abilita nulla: serve un <code>cap</code> nella firma della funzione che lo concede.</li>
<li>Un modello linguistico che genera codice e dimentica di dichiarare il permesso necessario <strong>fallisce al momento del controllo statico</strong>, prima di girare. L'errore viene visto in fase di revisione, non in produzione.</li>
</ul>
</div>
</div>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="18" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-theme="aeris" lang="it-IT" data-marpit-pagination="18" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--theme:aeris;" data-marpit-pagination-total="39">
<header>Presentazione tecnica · v0.3</header>
<h1 id="la-firma-delle-funzioni-pub-viene-congelata-in-un-file-di-blocco">La firma delle funzioni <code>pub</code> viene congelata in un file di blocco</h1>
<div class="columns">
<div class="column">
<pre><code class="language-toml"><span class="hljs-comment"># .aeris/surface.lock — generato da `aeris lock surface`,</span>
<span class="hljs-comment"># controllato in revisione.</span>

<span class="hljs-section">[chiudi_lotto]</span>
<span class="hljs-attr">caps</span> = [
  <span class="hljs-string">&quot;http.post @ [\&quot;api.acme.com\&quot;]&quot;</span>,
  <span class="hljs-string">&quot;audit.event&quot;</span>,
]

<span class="hljs-section">[totale]</span>
<span class="hljs-attr">caps</span> = []     <span class="hljs-comment"># funzione pura, nessun effetto esterno</span>

<span class="hljs-section">[stato_servizio_ok]</span>
<span class="hljs-attr">caps</span> = [
  <span class="hljs-string">&quot;http.get @ [\&quot;api.acme.com\&quot;]&quot;</span>,
]
</code></pre>
</div>
<div class="column compact">
<p><strong>Cosa c'è nel file di blocco</strong></p>
<p>Per ogni funzione <code>pub</code> (esportata) del progetto, il file <code>.aeris/surface.lock</code> registra l'elenco esatto dei permessi che la firma dichiara. Il file viene generato automaticamente con <code>aeris lock surface</code> e viene messo sotto controllo di versione.</p>
<p><strong>Cosa significa in revisione</strong></p>
<p>Quando qualcuno (umano o modello) modifica una funzione esportata aggiungendo un nuovo effetto — per esempio una chiamata di rete dove prima non ce n'erano — il file di blocco va rigenerato, e la differenza appare come <strong>prima modifica</strong> nella richiesta di merge.</p>
<ul>
<li>Un allargamento dei permessi richiede di rigenerare il file: il revisore vede il diff come prima cosa.</li>
<li>Un restringimento non richiede di rigenerarlo (il vecchio insieme è ancora un sovrainsieme di quello nuovo).</li>
<li><code>aeris fmt --narrow-caps</code> propone in automatico il restringimento minimo della firma in base ai permessi davvero usati dal corpo della funzione.</li>
</ul>
<blockquote>
<p>Una pull request generata da un modello che aggiunge una chiamata di rete a una funzione finora isolata risulta visibile a colpo d'occhio: la prima cosa che il revisore legge è il cambio del file di blocco.</p>
</blockquote>
</div>
</div>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="19" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-class="divider" data-theme="aeris" lang="it-IT" class="divider" data-marpit-pagination="19" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--class:divider;--theme:aeris;" data-marpit-pagination-total="39">
<header>Presentazione tecnica · v0.3</header>

<h1 id="parte-iv--contratti-intenzioni-schemi">Parte IV — Contratti, intenzioni, schemi</h1>
<blockquote>
<p>Tre costrutti per portare il <em>perché</em> del codice dentro la grammatica: condizioni di ingresso e di uscita di una funzione, dichiarazione di scopo obbligatoria sulle scritture esterne, schemi versionati validati sui confini di fiducia.</p>
</blockquote>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="20" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-theme="aeris" lang="it-IT" data-marpit-pagination="20" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--theme:aeris;" data-marpit-pagination-total="39">
<header>Presentazione tecnica · v0.3</header>
<h1 id="condizioni-di-ingresso-e-di-uscita--requires-ed-ensures">Condizioni di ingresso e di uscita — <code>requires:</code> ed <code>ensures:</code></h1>
<div class="columns">
<div class="column">
<pre><code class="language-aeris">fn paga(
  importo: decimal,
  conto:   string,
  cap:     cap[http.post @ [&quot;api.stripe.com&quot;]],
) -&gt; result&lt;Ricevuta@v1&gt;
  // pre-condizioni: controllate all'ingresso
  requires: importo &gt; 0
  requires: len(conto) == 26

  // post-condizione: controllata su ogni via di uscita
  ensures:  result.ok implies result.value.importo == importo
{
  intent &quot;addebita il cliente&quot; {
    let r = http.post(&quot;https://api.stripe.com/v1/charges&quot;,
                       { importo, conto })?
    Ok(Ricevuta@v1 { importo, id_transazione: r.id })
  }
}
</code></pre>
</div>
<div class="column compact">
<p><strong>Cosa dichiarano <code>requires:</code> ed <code>ensures:</code></strong></p>
<p><code>requires:</code> elenca le pre-condizioni che gli argomenti devono soddisfare <em>prima</em> che il corpo della funzione venga eseguito. <code>ensures:</code> elenca le post-condizioni che il valore di ritorno deve soddisfare <em>dopo</em>, su qualsiasi via di uscita della funzione (ritorno normale, ritorno anticipato, propagazione di errore).</p>
<p>Il binding speciale <code>result</code> dentro <code>ensures:</code> permette di ragionare sul valore restituito.</p>
<p><strong>Cosa succede quando una condizione fallisce</strong></p>
<p>La violazione produce un errore strutturale del tipo <code>ContractViolation</code>. Il runtime:</p>
<ol>
<li>registra l'evento nella traccia, incluse le variabili coinvolte;</li>
<li>svuota i buffer di scrittura della traccia su disco;</li>
<li>termina il programma con codice di uscita 64.</li>
</ol>
<blockquote>
<p>Una violazione di contratto <strong>non</strong> si propaga con <code>?</code> né si recupera con <code>catch</code>: è un errore strutturale, non un errore di dominio. Recuperare in silenzio da una violazione di contratto significherebbe vanificare la dichiarazione del contratto stesso.</p>
</blockquote>
</div>
</div>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="21" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-theme="aeris" lang="it-IT" data-marpit-pagination="21" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--theme:aeris;" data-marpit-pagination-total="39">
<header>Presentazione tecnica · v0.3</header>
<h1 id="il-blocco-intent-%C3%A8-obbligatorio-su-ogni-scrittura-esterna">Il blocco <code>intent</code> è obbligatorio su ogni scrittura esterna</h1>
<div class="columns">
<div class="column">
<pre><code class="language-aeris">// FALLISCE al controllo statico:
// &quot;manca il blocco intent intorno a una scrittura esterna&quot;
fn ruota_certificato(
  cap: cap[fs.write_file @ [&quot;/etc/ssl/**&quot;]],
) -&gt; result&lt;unit&gt; {
  fs.write_file(&quot;/etc/ssl/new.pem&quot;, nuovo_pem())?
}
</code></pre>
<pre><code class="language-aeris">// CORRETTO: il blocco intent dichiara lo scopo della
// scrittura. La descrizione finisce nella traccia.
fn ruota_certificato(
  cap: cap[fs.write_file @ [&quot;/etc/ssl/**&quot;]],
) -&gt; result&lt;unit&gt; {
  intent &quot;ruota il certificato TLS prima dello scadere a 30 giorni&quot; {
    fs.write_file(&quot;/etc/ssl/new.pem&quot;, nuovo_pem())?
  }
}
</code></pre>
</div>
<div class="column compact">
<p><strong>Quali chiamate richiedono un <code>intent</code></strong></p>
<p>Tutte le operazioni che producono un effetto <strong>scritturale</strong> verso l'esterno: scritture su file system (<code>fs.write_*</code>), HTTP modificanti (<code>http.{post,put,patch,delete}</code>), apply su Kubernetes (<code>kube.apply</code>), eventi di audit (<code>audit.*</code>), chiamate al modello (<code>ai.*</code>).</p>
<p>Le operazioni di sola lettura (<code>io.println</code>, <code>fs.read_file</code>, <code>http.get</code>) non lo richiedono: possono comparire dentro un blocco <code>intent</code> ma non sono obbligate a farlo.</p>
<p><strong>Cosa finisce nella traccia</strong></p>
<p>Il runtime emette tre eventi attorno al blocco:</p>
<ul>
<li><code>intent_enter</code> all'ingresso: contiene la descrizione testuale, lo scope, il timestamp.</li>
<li><code>intent_exit</code> all'uscita: contiene l'esito (<code>ok</code>, <code>err</code>, <code>partial</code>) e la durata.</li>
<li>Ogni evento emesso <em>dentro</em> il corpo porta il campo <code>&quot;intent&quot;</code> con la stessa descrizione, in modo che si riesca a risalire allo scopo di ogni singola riga della traccia.</li>
</ul>
<blockquote>
<p>Lo scopo della scrittura diventa parte della grammatica. Una pull request non può aggiungere una scrittura esterna in silenzio: il <code>intent</code> deve esistere, e la sua descrizione è leggibile al colpo d'occhio.</p>
</blockquote>
</div>
</div>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="22" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-theme="aeris" lang="it-IT" data-marpit-pagination="22" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--theme:aeris;" data-marpit-pagination-total="39">
<header>Presentazione tecnica · v0.3</header>
<h1 id="schemi-versionati--model-xvn">Schemi versionati — <code>model X@vN</code></h1>
<div class="columns">
<div class="column">
<pre><code class="language-aeris">model Fattura@v1 {
  id:       uuid
  importo:  decimal where importo &gt; 0
  cliente:  string  where len(cliente) &lt;= 64
  stato:    StatoFattura

  // Vincoli che coinvolgono più campi insieme
  // si scrivono come &quot;where:&quot; a livello del record.
  where: stato == Annullata implies importo == 0
}

// Sui confini di fiducia (richieste HTTP in ingresso,
// decodifica JSON, scambi fra agenti) il tipo DEVE
// portare la sua versione. Usare &quot;Fattura&quot; senza @vN
// è rifiutato dal controllore.
fn ingerisci(raw: string) -&gt; result&lt;Fattura@v1&gt; {
  json.decode&lt;Fattura@v1&gt;(raw)   // validazione automatica al confine
}
</code></pre>
</div>
<div class="column compact">
<p><strong>Cos'è un <code>model@vN</code></strong></p>
<p>È uno schema tipizzato — l'analogo di una <code>struct</code> Rust o di un <code>class</code> Python — etichettato con un numero di versione obbligatorio. La versione è parte del tipo: <code>Fattura@v1</code> e <code>Fattura@v2</code> sono due tipi distinti, non convertibili l'uno nell'altro senza una funzione di migrazione esplicita.</p>
<p><strong>Quando il valore viene validato a runtime</strong></p>
<ul>
<li>alla costruzione (<code>Fattura@v1 { ... }</code>);</li>
<li>alla decodifica da JSON (<code>json.decode&lt;Fattura@v1&gt;(...)</code>);</li>
<li>al passaggio fra agenti (lo schema <code>accept</code> / <code>produce</code> di ogni agente);</li>
<li>in ingresso da HTTP o da una coda di messaggi.</li>
</ul>
<p><strong>Due forme di vincolo</strong></p>
<ul>
<li>Vincolo per campo: <code>importo: decimal where importo &gt; 0</code>.</li>
<li>Vincolo a livello del record, che mette in relazione più campi: <code>where: stato == Annullata implies importo == 0</code>.</li>
</ul>
<blockquote>
<p>Il versioning <strong>è obbligatorio sui confini di fiducia</strong> del programma. Una bare <code>Fattura</code> (senza <code>@vN</code>) viene rifiutata dal controllore statico con codice di uscita 68. La migrazione fra versioni è sempre una funzione pura, scritta a mano: niente conversioni implicite, niente sorprese alla decodifica.</p>
</blockquote>
</div>
</div>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="23" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-class="divider" data-theme="aeris" lang="it-IT" class="divider" data-marpit-pagination="23" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--class:divider;--theme:aeris;" data-marpit-pagination-total="39">
<header>Presentazione tecnica · v0.3</header>

<h1 id="parte-v--operazioni-reversibili-e-agenti-ai">Parte V — Operazioni reversibili e agenti AI</h1>
<blockquote>
<p>Operazioni composte da più passi, dove ogni passo dichiara come <strong>compensare</strong> in caso di errore (<code>saga</code>). Agenti AI come unità tipizzate (<code>agent</code>). Reti di agenti come grafi aciclici fra unità (<code>agent_net</code>).</p>
</blockquote>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="24" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-class="tight" data-theme="aeris" lang="it-IT" class="tight" data-marpit-pagination="24" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--class:tight;--theme:aeris;" data-marpit-pagination-total="39">
<header>Presentazione tecnica · v0.3</header>

<h1 id="una-saga--passi-con-do-e-undo-obbligatori">Una <code>saga</code> — passi con <code>do</code> e <code>undo</code> obbligatori</h1>
<div class="columns">
<div class="column">
<pre><code class="language-aeris">saga chiudi_lotto(
  lotto: list&lt;Fattura@v1&gt;,
  cap:   cap[
    http.post  @ [&quot;api.acme.com&quot;],
    kube.apply @ [&quot;prod-eu-1&quot;],
    audit.event,
  ],
) {
  intent &quot;chiudi il lotto fatture e avvisa la finanza&quot;

  step addebita {
    do   { for it in lotto { http.post(&quot;https://api.acme.com/charge&quot;, it)? } }
    undo { for it in lotto { http.post(&quot;https://api.acme.com/refund&quot;, it)? } }
  }

  step registro {
    requires: addebita.ok
    do   { kube.apply(manifesto_registro(lotto))? }
    undo { kube.delete(manifesto_registro(lotto))? }
  }

  step audit {
    requires: registro.ok
    do   { audit.event(&quot;chiusura.completata&quot;,    { conteggio: len(lotto) }) }
    undo { audit.event(&quot;chiusura.annullata&quot;,     { conteggio: len(lotto) }) }
  }
}
</code></pre>
</div>
<div class="column compact">
<p><strong>Cosa garantisce una <code>saga</code></strong></p>
<p>Una <code>saga</code> è un'operazione composta da più passi (<code>step</code>), dove ogni passo dichiara <em>come si fa</em> (<code>do</code>) e <em>come si annulla</em> (<code>undo</code>).</p>
<p>Se uno step intermedio fallisce, il runtime esegue automaticamente gli <code>undo</code> dei passi già completati, in ordine inverso. L'effetto è quello di una transazione: o l'intera operazione va a buon fine, oppure il sistema torna allo stato precedente.</p>
<p><strong>Regole strutturali</strong></p>
<ul>
<li><code>do</code> e <code>undo</code> sono <strong>obbligatori</strong> su ogni passo. La forma <code>undo: noop</code> è ammessa solo quando il <code>do</code> non scrive nulla all'esterno (per esempio se è una pura lettura). Una scrittura senza <code>undo</code> viene rifiutata dal controllore statico.</li>
<li>Gli esiti possibili sono <strong>tre, deterministici</strong>: <code>ok</code> (tutto a buon fine), <code>rolled_back</code> (rollback completato con successo), <code>parziale</code> (uno o più <code>undo</code> hanno esaurito i ritentativi). Non esiste un quarto stato &quot;a metà strada&quot;.</li>
</ul>
<blockquote>
<p>Una <code>saga</code> rende il rollback un'esigenza grammaticale, non una scelta del programmatore. Una pipeline che scrive senza dichiarare come disfare la scrittura non parsa.</p>
</blockquote>
</div>
</div>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="25" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-theme="aeris" lang="it-IT" data-marpit-pagination="25" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--theme:aeris;" data-marpit-pagination-total="39">
<header>Presentazione tecnica · v0.3</header>
<h1 id="chiavi-di-idempotenza-generate-automaticamente-dal-runtime">Chiavi di idempotenza generate automaticamente dal runtime</h1>
<div class="columns">
<div class="column compact">
<p><strong>Il problema dell'idempotenza</strong></p>
<p>Quando un'operazione esterna fallisce a metà — chiamata HTTP scaduta, connessione di rete caduta — il runtime non sa se l'effetto sul sistema remoto sia avvenuto o meno. Un semplice ritentativo rischia di duplicare l'effetto: due addebiti per la stessa fattura, due <code>apply</code> dello stesso manifesto Kubernetes.</p>
<p><strong>Come Aeris lo risolve</strong></p>
<p>Per ogni chiamata di scrittura, il runtime genera <strong>automaticamente</strong> una chiave di idempotenza derivata da:</p>
<pre><code class="language-text">chiave = blake3(id_traccia ‖ nome_step ‖ indice_invocazione)
</code></pre>
<p>Cioè un'impronta crittografica che dipende solo dall'identità dell'esecuzione e dal punto del programma. Lo stesso programma rigiocato con <code>aeris replay</code> produce le stesse chiavi: il sistema remoto, se le riconosce, scarta i duplicati.</p>
</div>
<div class="column compact">
<p><strong>Dove viene inserita la chiave</strong></p>
<p>A seconda del protocollo, il runtime la inserisce nel campo che il sistema remoto si aspetta.</p>
<table>
<thead>
<tr>
<th>Operazione</th>
<th>Dove finisce la chiave</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>http.post</code>, <code>http.put</code>, <code>http.patch</code></td>
<td>Intestazione <code>Idempotency-Key: &lt;chiave&gt;</code></td>
</tr>
<tr>
<td><code>kube.apply</code></td>
<td>Annotation <code>aeris.dev/idempotency-key: &lt;chiave&gt;</code></td>
</tr>
<tr>
<td><code>rabbitmq.publish</code></td>
<td>Campo <code>message-id: &lt;chiave&gt;</code></td>
</tr>
<tr>
<td><code>mongodb.insert</code></td>
<td>Campo di sentinella <code>_aeris_idem: &lt;chiave&gt;</code></td>
</tr>
</tbody>
</table>
<p><strong>Conseguenze pratiche</strong></p>
<ul>
<li>Rigiocare uno step già completato non lo esegue di nuovo: il sistema remoto, vedendo la chiave già usata, risponde senza ripetere l'effetto.</li>
<li>Durante un rollback, i ritentativi sui passi <code>undo</code> non duplicano gli annullamenti già applicati.</li>
<li>La frequenza pratica dello stato &quot;parziale&quot; si riduce molto. Il problema non si elimina del tutto (richiede cooperazione del sistema remoto), ma il linguaggio fa quello che può.</li>
</ul>
</div>
</div>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="26" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-theme="aeris" lang="it-IT" data-marpit-pagination="26" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--theme:aeris;" data-marpit-pagination-total="39">
<header>Presentazione tecnica · v0.3</header>
<h1 id="un-singolo-agente-ai-come-costrutto-del-linguaggio">Un singolo agente AI come costrutto del linguaggio</h1>
<div class="columns">
<div class="column">
<pre><code class="language-aeris">model Fattura@v1   { id: uuid, importo: decimal where importo &gt; 0 }
model Categoria@v1 { tipo: string }

agent classifica {
  llm:     &quot;claude-haiku-4-5&quot;
  intent:  &quot;classifica la fattura per tipo di spesa&quot;
  prompt:  &quot;&quot;&quot;
    Classifica la fattura di importo {input.importo}.
    Restituisci un JSON con un solo campo `tipo`.
  &quot;&quot;&quot;
  accept:  Fattura@v1
  produce: Categoria@v1
  retries: 2
  budget:  { tokens: 2_000, latency: 3s }
}

fn main(cap: cap[ai.complete @ [&quot;claude-haiku-4-5&quot;]])
  -&gt; result&lt;Categoria@v1&gt;
{
  intent &quot;classifica una fattura&quot; {
    classifica(Fattura@v1 { id: uuid_v7(), importo: 99.0 }, cap)
  }
}
</code></pre>
</div>
<div class="column compact">
<p><strong>Cosa dichiara un <code>agent</code></strong></p>
<p>Un <code>agent</code> è un'unità di chiamata al modello linguistico promossa a costrutto del linguaggio. Dichiara cinque cose:</p>
<ul>
<li><code>llm</code>: il nome del modello da usare;</li>
<li><code>intent</code>: lo scopo, parte del trace ad ogni invocazione;</li>
<li><code>prompt</code>: il testo da inviare, con interpolazione dei campi dell'input;</li>
<li><code>accept</code> e <code>produce</code>: gli schemi versionati (<code>model@vN</code>) dell'input e dell'output, validati a ogni chiamata;</li>
<li><code>retries:</code> e <code>budget:</code>: vincoli su ritentativi, token e latenza.</li>
</ul>
<p><strong>Cosa fa il runtime per ogni invocazione</strong></p>
<ul>
<li>Inietta automaticamente nel prompt di sistema un <strong>contratto di formato</strong> in JSON che descrive lo schema di uscita atteso. Il prompt del modello non lo deve scrivere a mano.</li>
<li>Valida la risposta contro lo schema <code>produce</code>. Se la risposta non corrisponde, ritenta entro il budget <code>retries:</code>.</li>
<li>Se viene sforato il budget di token o latenza, l'agente fallisce con <code>BudgetExceeded</code> e codice di uscita 1.</li>
<li>L'intera invocazione (prompt, risposta, token, esito) viene registrata nel file di traccia per il replay successivo.</li>
</ul>
</div>
</div>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="27" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-theme="aeris" lang="it-IT" data-marpit-pagination="27" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--theme:aeris;" data-marpit-pagination-total="39">
<header>Presentazione tecnica · v0.3</header>
<h1 id="una-rete-di-agenti--agent_net">Una rete di agenti — <code>agent_net</code></h1>
<div class="columns">
<div class="column">
<pre><code class="language-aeris">agent_net pipeline_fatture {
  intent &quot;estrai → classifica → smista la fattura&quot;

  flow estrai     -&gt; classifica   -&gt; smista
  flow classifica -&gt; { audit, archivio }   // fork sui due rami
  flow audit      -&gt; avvisa_finanza

  // L'iterazione si ferma quando la fiducia del classificatore
  // supera 0.95, o dopo 3 giri.
  until: classifica.confidence &gt; 0.95 or iterations &gt;= 3
}
</code></pre>
<div class="mermaid">
flowchart LR
  E[estrai] --&gt; C[classifica]
  C --&gt; S[smista]
  C --&gt; A[audit]
  C --&gt; AR[archivio]
  A --&gt; N[avvisa_finanza]
  classDef ag fill:#F6F3F0,stroke:#1C2035,stroke-width:1px,color:#0E1020;
  class E,C,S,A,AR,N ag;
</div>
</div>
<div class="column compact">
<p><strong>Cos'è una <code>agent_net</code></strong></p>
<p>È un grafo di agenti connessi da archi <code>flow</code>. Il grafo deve essere <strong>aciclico</strong>: un ciclo dichiarato esplicitamente nel codice viene rifiutato dal controllore con codice di uscita 70. L'iterazione si ottiene con la clausola <code>until:</code>, che mette un bound massimo sul numero di giri.</p>
<p><strong>Come avviene lo smistamento</strong></p>
<p>Il runtime risolve la diramazione a un nodo a più uscite confrontando lo schema <code>produce</code> del nodo di partenza con gli schemi <code>accept</code> dei nodi di destinazione: prende il ramo i cui schemi combaciano. Il protocollo di smistamento è parte del <strong>programma</strong>, non una stringa di prompt scritta a mano.</p>
<p><strong>Composizione</strong></p>
<p>Una <code>agent_net</code> può comparire come nodo di un'altra <code>agent_net</code>, permettendo di comporre reti più grandi a partire da reti più piccole. Gli esiti possibili sono <code>ok(valore)</code> oppure <code>Err(&quot;agent_net &lt;nome&gt; esaurita&quot;)</code> quando il bound di iterazioni viene raggiunto senza convergenza.</p>
<blockquote>
<p>Lo schema dei messaggi che attraversano la rete è parte della firma. Una hallucination del modello che viola lo schema viene bloccata dal sistema dei tipi, non dal revisore umano.</p>
</blockquote>
</div>
</div>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="28" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-class="divider" data-theme="aeris" lang="it-IT" class="divider" data-marpit-pagination="28" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--class:divider;--theme:aeris;" data-marpit-pagination-total="39">
<header>Presentazione tecnica · v0.3</header>

<h1 id="parte-vi--regole-di-runtime-rifiuti-limiti">Parte VI — Regole di runtime, rifiuti, limiti</h1>
<blockquote>
<p>Le <code>policy</code> come costrutto valutato a runtime. Le scelte che il linguaggio rifiuta per principio. I limiti che Aeris dichiara onestamente di non risolvere.</p>
</blockquote>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="29" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-theme="aeris" lang="it-IT" data-marpit-pagination="29" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--theme:aeris;" data-marpit-pagination-total="39">
<header>Presentazione tecnica · v0.3</header>
<h1 id="regole-di-runtime--policy">Regole di runtime — <code>policy</code></h1>
<div class="columns">
<div class="column">
<pre><code class="language-aeris">policy egress_produzione {
  match: http.*
  deny:  url.host not in [&quot;api.acme.com&quot;, &quot;api.stripe.com&quot;]
  audit: { url, method }
  when:  env == &quot;production&quot;
}

policy budget_modello {
  match: ai.complete
  limit: tokens_per_minute = 60_000
  audit: { model, tokens }
}
</code></pre>
</div>
<div class="column compact">
<p><strong>Cos'è una <code>policy</code></strong></p>
<p>Una <code>policy</code> esprime una regola di sicurezza o di limite operativo come <strong>costrutto del linguaggio</strong>, non come convenzione esterna al codice. È fatta di alcune clausole, tutte facoltative:</p>
<ul>
<li><code>match:</code> — su quali chiamate la regola si applica (per esempio <code>http.*</code> o <code>ai.complete</code>).</li>
<li><code>deny:</code> — una violazione se la condizione è vera (rifiuta la chiamata).</li>
<li><code>require:</code> — una violazione se la condizione è falsa.</li>
<li><code>limit:</code> — quota su una finestra temporale (per minuto, ora, giorno).</li>
<li><code>audit:</code> — campi aggiuntivi da includere nell'evento di trace per le chiamate che combaciano.</li>
<li><code>when:</code> — pre-condizione di attivazione (per esempio &quot;solo in produzione&quot;).</li>
</ul>
<p><strong>Quando una policy è attiva</strong></p>
<p>Una <code>policy</code> può essere attivata in tre modi: dall'<code>use</code> di un modulo che la dichiara, con l'attributo <code>#[policy(nome)]</code> su una funzione, o dichiarandola nel file di progetto <code>aeris.toml [policies] active = [...]</code>.</p>
<p>Ad ogni chiamata che corrisponde a <code>match:</code>, il runtime valuta la regola. Una violazione produce un <code>PolicyViolation</code>, un evento dedicato nel file di traccia, e un'uscita con codice 1. Se durante una riesecuzione (replay) l'esito della policy diverge dall'esecuzione registrata, il runtime emette un evento <code>policy_drift</code> invece di fermarsi.</p>
</div>
</div>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="30" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-theme="aeris" lang="it-IT" data-marpit-pagination="30" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--theme:aeris;" data-marpit-pagination-total="39">
<header>Presentazione tecnica · v0.3</header>
<h1 id="scelte-che-il-linguaggio-rifiuta-per-principio">Scelte che il linguaggio rifiuta per principio</h1>
<table>
<thead>
<tr>
<th>Cosa Aeris non ha</th>
<th>Perché</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Nessuna verifica formale tramite SMT solver</strong></td>
<td>Il verdetto di un solver dipende dalla macchina e dalle euristiche di ricerca, e quindi introduce non-determinismo <em>negli strumenti di sviluppo</em>. Sarebbe peggio del non-determinismo che cerchiamo di controllare.</td>
</tr>
<tr>
<td><strong>Nessun sistema di &quot;livelli&quot; del codice</strong> (<code>draft / standard / verified</code>)</td>
<td>Definire la semantica del confine fra un livello e l'altro è inevitabilmente confuso: cosa succede se <code>standard</code> importa <code>draft</code>? Nessuna risposta è ergonomica.</td>
</tr>
<tr>
<td><strong>Nessuna inferenza automatica dei permessi</strong></td>
<td>Una modifica interna a una funzione chiamata cambierebbe in silenzio i permessi delle funzioni chiamanti. Il diff in revisione diventerebbe ingannevole: l'ambito degli effetti deve essere dichiarato a mano.</td>
</tr>
<tr>
<td><strong>Nessuna parola chiave &quot;morbida&quot;</strong> (con significato dipendente dal contesto)</td>
<td>Un parser che decide il senso di una parola in base ai token successivi (<em>lookahead</em> variabile) produce errori sottili: la parola <code>time</code> può essere interpretata in modo diverso da quanto si vede a colpo d'occhio. Cercare una parola chiave con <code>grep</code> deve restituire <em>tutte</em> le occorrenze.</td>
</tr>
<tr>
<td><strong>Nessun riferimento mutabile fra le dipendenze</strong></td>
<td>Niente <code>latest</code>, niente <code>*</code>, nessun tag Git che possa cambiare contenuto. Ogni <code>use X@v1.2.3</code> deve combaciare con il file di blocco oppure fallisce alla risoluzione.</td>
</tr>
<tr>
<td><strong>Nessuna libreria binaria caricata dinamicamente</strong> (<code>.so</code> o <code>.dll</code>)</td>
<td>Un binario su disco aggiungerebbe una superficie di effetti che il controllore statico non può ispezionare. Romperebbe la verificabilità delle capability.</td>
</tr>
</tbody>
</table>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="31" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-theme="aeris" lang="it-IT" data-marpit-pagination="31" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--theme:aeris;" data-marpit-pagination-total="39">
<header>Presentazione tecnica · v0.3</header>
<h1 id="limiti-dichiarati-onestamente">Limiti dichiarati onestamente</h1>
<table>
<thead>
<tr>
<th>Limite</th>
<th>Cosa significa concretamente</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>La prima esecuzione del modello resta non-deterministica</strong></td>
<td>La registrazione su nastro rende <code>aeris replay</code> identico byte per byte <em>dopo</em> la prima esecuzione. La prima volta resta in balia del modello: impostare <code>temperature = 0</code> riduce la varianza, non la elimina.</td>
</tr>
<tr>
<td><strong>La correttezza del corpo di una funzione non viene verificata</strong></td>
<td>Se una funzione possiede legittimamente il permesso <code>audit.write</code> e all'interno scrive l'attore sbagliato, Aeris non se ne accorge. Il linguaggio garantisce visibilità (la firma dichiara cosa la funzione può fare) e obbligo (i blocchi <code>intent</code> e <code>saga</code> non si possono saltare); la correttezza interna resta affidata a test, code review e controlli di accesso lato sistema (RBAC).</td>
</tr>
<tr>
<td><strong>Il rollback a catena è &quot;il meglio che si può&quot;</strong></td>
<td>Anche l'<code>undo</code> di un passo può a sua volta fallire. Il runtime ritenta usando le chiavi di idempotenza. Esauriti i ritentativi emette <code>PartialFailure</code> con codice di uscita 74, e chiede risoluzione umana. È un limite noto del pattern SAGA, nessun linguaggio lo elimina davvero.</td>
</tr>
</tbody>
</table>
<blockquote>
<p>Aeris è la <strong>prima linea di difesa</strong>, non l'unica. Promettere di più sarebbe disonesto con chi davvero deve fidarsi del linguaggio: chi fa compliance, audit, sicurezza.</p>
</blockquote>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="32" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-theme="aeris" lang="it-IT" data-marpit-pagination="32" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--theme:aeris;" data-marpit-pagination-total="39">
<header>Presentazione tecnica · v0.3</header>
<h1 id="le-novit%C3%A0-di-v03--riepilogo-delle-aggiunte">Le novità di v0.3 — riepilogo delle aggiunte</h1>
<div class="columns">
<div class="column compact">
<p><strong>Più ergonomia su stringhe, controllo, errori</strong></p>
<ul>
<li>Interpolazione <code>&quot;ciao {nome}&quot;</code> con <code>\{</code> e <code>\}</code> come sequenze di escape per le graffe letterali.</li>
<li><code>loop { … }</code> come abbreviazione di <code>while true { … }</code>.</li>
<li>L'operatore <code>??</code> di sostituzione: <code>Ok(v) → v</code>, <code>Some(v) → v</code>, <code>Err</code>/<code>None</code> → valore di destra.</li>
<li><code>expr catch err { … }</code>, <code>error(&quot;...&quot;)</code>, <code>defer stmt</code> per il recupero locale dagli errori.</li>
<li>I blocchi temporali <code>every D { … }</code>, <code>retry N, delay: D { … }</code>, <code>timeout D { … }</code> e la primitiva <code>clock.sleep</code>.</li>
</ul>
<p><strong>Tipi e moduli</strong></p>
<ul>
<li><code>model X@v2 extends X@v1 { … }</code>: una versione successiva eredita campi e clausole <code>where:</code> della versione precedente.</li>
<li>Istruzioni a livello di file senza la necessità di <code>fn main</code> (modalità script).</li>
<li>Parametri di funzione senza annotazione di tipo, per scripting (<code>fn f(x, y) { ... }</code>).</li>
<li>Funzioni di utilità sui tipi base: <code>strings.*</code>, <code>date.*</code>, <code>json.pretty</code>, <code>json.parse</code>, <code>yaml.parse</code>.</li>
</ul>
</div>
<div class="column compact">
<p><strong>Strumenti per il modello linguistico</strong></p>
<ul>
<li><code>ai.session(system, model)</code> e <code>ai.session_ask(s, p)</code>: sessione multi-turno con compattazione automatica della cronologia oltre i quaranta messaggi.</li>
<li><code>ai.decide(p, choices, retries?)</code>: scelta vincolata fra valori dichiarati.</li>
<li><code>ai.usage()</code>: contatori di token, costo, numero di chiamate.</li>
<li><code>ai.chat(system, dir)</code>, con i metodi <code>.ask(p)</code> e <code>.kb_size()</code>: chatbot costruito su una cartella di documentazione.</li>
<li><code>ai.network(max_rounds)</code>: rete di agenti costruita programmaticamente.</li>
<li>Backend di tipo <code>cli</code> per <code>ai.complete</code>: il modello viene invocato come sottoprocesso a riga di comando, in alternativa alla chiamata HTTP.</li>
</ul>
<p><strong>Strumenti per i test</strong></p>
<ul>
<li>Le funzioni <code>assert_status</code>, <code>assert_json</code> e <code>assert_semantic</code> (quest'ultima usa il modello stesso come giudice del contenuto).</li>
</ul>
</div>
</div>
<blockquote>
<p>La traccia, la riesecuzione, gli schemi <code>model@vN</code> e le <code>policy</code> restano attivi <strong>su tutta la superficie v0.3</strong>: nessuna scelta di ergonomia rimuove la possibilità di audit.</p>
</blockquote>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="33" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-class="tight" data-theme="aeris" lang="it-IT" class="tight" data-marpit-pagination="33" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--class:tight;--theme:aeris;" data-marpit-pagination-total="39">
<header>Presentazione tecnica · v0.3</header>

<h1 id="recupero-locale-dagli-errori--catch-retry-timeout-defer-every">Recupero locale dagli errori — <code>catch</code>, <code>retry</code>, <code>timeout</code>, <code>defer</code>, <code>every</code></h1>
<div class="columns">
<div class="column">
<pre><code class="language-aeris">// catch — gestore in linea; il valore del blocco è
// l'alternativa restituita in caso di errore.
let dati = fs.read_file(&quot;config.json&quot;) catch err {
  io.eprintln(&quot;configurazione mancante: {err.message}&quot;)
  b&quot;{}&quot;
}

// retry — riesegue il blocco se l'ultimo esito è Err,
// con pausa configurata fra un tentativo e l'altro.
let risposta = retry 5, delay: 2s {
  http.get(&quot;https://servizio-instabile/health&quot;)
}

// timeout — limite massimo sul tempo a parete; non
// interrompe a metà di un'istruzione.
let r = timeout 30s {
  chiamata_lunga()
}

// defer — pulizia che gira a ogni uscita dalla funzione,
// in ordine inverso rispetto alla dichiarazione.
fn compila(cap: cap[fs.write_file @ [&quot;./build/**&quot;]]) -&gt; result&lt;unit&gt; {
  let tmp = fs.create_temp()?
  defer fs.remove(tmp)
  intent &quot;compila l'artefatto in {tmp}&quot; {
    fs.write_file(&quot;./build/out.bin&quot;, compila_da(tmp))?
    Ok(())
  }
}

// every — ciclo periodico, granularità al secondo.
every 5m {
  let h = http.get(&quot;https://api/health&quot;)
  if !h.ok { audit.event(&quot;api.giu&quot;, { ts: clock.now() }) }
}
</code></pre>
</div>
<div class="column compact">
<p><strong>Pattern temporali ricorrenti, promossi a costrutti del linguaggio</strong></p>
<p><code>catch</code> è un gestore inserito in linea sull'espressione. Quando il valore prodotto è un errore (<code>Err(e)</code>), il blocco di recupero viene eseguito con <code>e</code> legato al nome dichiarato (qui <code>err</code>), e il suo valore prende il posto dell'errore. Si compone con <code>?</code>: il blocco di recupero stesso può a sua volta propagare un errore.</p>
<p><code>retry N, delay: D</code> riesegue il blocco se il valore restituito è <code>Err</code>, fino a <code>N</code> tentativi totali, attendendo <code>D</code> fra un tentativo e l'altro. Il valore dell'espressione è il risultato dell'ultimo tentativo, riuscito o meno.</p>
<p><code>timeout D</code> misura il tempo a parete (<em>wall clock</em>) e produce <code>Err(err.user(&quot;timeout&quot;))</code> se il blocco supera la soglia. Non interrompe il corpo a metà istruzione: l'interprete a visita d'albero (<em>tree-walking</em>) è onesto sui suoi limiti, il controllo del tempo avviene a fine istruzione.</p>
<p><code>defer stmt</code> programma una pulizia che verrà eseguita al ritorno della funzione, in ordine inverso (l'ultima dichiarata gira per prima). Viene eseguita su <strong>ogni</strong> via di uscita: ritorno normale, propagazione di errore con <code>?</code>, violazione di contratto. È il posto giusto per chiudere file, cancellare temporanei, rilasciare lock.</p>
<p><code>every D</code> esegue il blocco, attende <code>D</code>, e lo riesegue. <code>break</code> esce dal ciclo, <code>continue</code> salta direttamente al prossimo intervallo. La prima iterazione parte subito.</p>
<blockquote>
<p>Tutti e cinque i costrutti generano eventi nel file di traccia: numero di tentativi, durate, esiti, ogni <code>defer</code> eseguito. Per fare debug non servono <code>println</code> aggiuntivi.</p>
</blockquote>
</div>
</div>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="34" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-class="tight" data-theme="aeris" lang="it-IT" class="tight" data-marpit-pagination="34" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--class:tight;--theme:aeris;" data-marpit-pagination-total="39">
<header>Presentazione tecnica · v0.3</header>

<h1 id="le-funzioni-del-modulo-ai">Le funzioni del modulo <code>ai</code></h1>
<div class="columns">
<div class="column">
<pre><code class="language-aeris">// Chiamata diretta al modello: prende una stringa,
// restituisce una stringa.
let risposta = ai.complete(&quot;Analizza: {log}&quot;)

// Scelta vincolata: la risposta deve essere uno dei
// valori elencati in choices, altrimenti il runtime
// ritenta e infine restituisce Err(err.llm(...)).
let azione = ai.decide(
  prompt:  &quot;CPU al 95%. Cosa fare?&quot;,
  choices: [&quot;scala_su&quot;, &quot;riavvia&quot;, &quot;avvisa&quot;, &quot;ignora&quot;],
  retries: 3,
)?

// Conversazione multi-turno, con compattazione
// automatica della cronologia oltre i 40 messaggi.
let s          = ai.session(
  system: &quot;Sei un assistente per l'affidabilità di sistema.&quot;,
  model:  &quot;claude-haiku-4-5&quot;,
)
let (s2, a)    = ai.session_ask(s,  &quot;Analizza: {log}&quot;)
let (s3, b)    = ai.session_ask(s2, &quot;Qual è la causa principale?&quot;)

// Chatbot costruito su una cartella di documentazione.
// La cartella viene caricata all'avvio nel prompt di sistema.
let chat = ai.chat(
  &quot;Rispondi solo usando la base di conoscenza fornita.&quot;,
  &quot;./docs&quot;,
)
io.println(&quot;base di conoscenza: {chat.kb_size()} file&quot;)
io.println(chat.ask(&quot;come funzionano le capability?&quot;))

// Contatori dell'intero processo: token, costo, chiamate.
let u = ai.usage()
io.println(&quot;speso: ${u.cost_usd} in {u.calls} chiamate&quot;)
</code></pre>
</div>
<div class="column compact">
<p><strong>Sei funzioni per i casi d'uso più frequenti</strong></p>
<ul>
<li><strong><code>ai.complete(prompt)</code></strong> — invio diretto al modello. È la primitiva su cui sono costruite tutte le altre funzioni del modulo.</li>
<li><strong><code>ai.decide(prompt, choices, retries?)</code></strong> — scelta vincolata. La risposta del modello deve coincidere con uno dei valori dichiarati in <code>choices</code>; in caso contrario il runtime ritenta fino a <code>retries</code> volte, poi produce un <code>Err(err.llm(...))</code> che può essere propagato con <code>?</code>.</li>
<li><strong><code>ai.session</code> e <code>ai.session_ask</code></strong> — conversazione multi-turno. La sessione accumula la cronologia dei messaggi; superati i quaranta messaggi viene compattata automaticamente al riassunto degli ultimi venti, in modo da contenere la lunghezza del prompt.</li>
<li><strong><code>ai.chat(system, dir)</code></strong> — chatbot su una cartella di documenti (markdown, testo, yaml). I documenti vengono concatenati nel prompt di sistema come <em>base di conoscenza</em> fissa. Il valore restituito ha i metodi <code>.ask(prompt)</code> e <code>.kb_size()</code>.</li>
<li><strong><code>ai.usage()</code></strong> — contatori dell'intero processo: token consumati, costo accumulato in dollari, numero di chiamate.</li>
<li><strong><code>ai.network(max_rounds)</code></strong> — costruttore programmatico di una rete di agenti coordinata via instradamento testuale (il fratello più leggero di <code>agent_net</code>).</li>
</ul>
<p><strong>Il backend del modello è configurabile, niente librerie collegate</strong></p>
<p>Il modello viene raggiunto in due modi, a scelta nel file di progetto <code>aeris.toml [ai.backend]</code>: o tramite chiamata HTTP a un'API compatibile con il protocollo OpenAI (Anthropic, OpenAI), oppure tramite invocazione di un sottoprocesso a riga di comando (<code>claude --print</code>, <code>ollama run</code>, <code>llm</code>). Niente librerie di terze parti collegate in fase di compilazione.</p>
<blockquote>
<p>Ogni chiamata <code>ai.*</code> genera un evento <code>ai_call</code> nel file di traccia che contiene prompt, modello, risposta e numero di token consumati. <code>aeris replay</code> rigioca offline sulla traccia.</p>
</blockquote>
</div>
</div>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="35" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-theme="aeris" lang="it-IT" data-marpit-pagination="35" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--theme:aeris;" data-marpit-pagination-total="39">
<header>Presentazione tecnica · v0.3</header>
<h1 id="tre-modalit%C3%A0-di-disciplina-una-sola-grammatica">Tre modalità di disciplina, una sola grammatica</h1>
<p>La tesi del linguaggio fissa la disciplina alla sua forma più rigorosa; in pratica, non tutti i progetti vogliono pagarne il costo <em>da subito</em>. Il file di progetto può scegliere fra tre modalità di applicazione, tutte basate sulla stessa grammatica.</p>
<table>
<thead>
<tr>
<th>Modalità</th>
<th>Predefinita per <code>aeris init</code></th>
<th>Cosa succede</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>enforce = &quot;off&quot;</code></td>
<td><strong>sì</strong> (v0.3)</td>
<td>I permessi vengono sintetizzati come &quot;tutto consentito&quot; e passati a <code>main</code>. Il controllore statico ignora le verifiche di capability, <code>intent</code> e <code>saga</code>; nessun controllo di lista bianca a runtime.</td>
</tr>
<tr>
<td><code>enforce = &quot;loose&quot;</code></td>
<td>—</td>
<td>I permessi elencati nel manifesto fanno da limite massimo a runtime. Le funzioni <em>senza</em> parametro <code>cap</code> restano ammesse; quelle <em>con</em> parametro <code>cap</code> vengono controllate normalmente dal compilatore.</td>
</tr>
<tr>
<td><code>enforce = &quot;strict&quot;</code></td>
<td>—</td>
<td>Disciplina piena: <code>cap</code> obbligatorio sulle funzioni con effetti, <code>intent</code> obbligatorio sulle scritture, <code>cap[*]</code> rifiutato nel codice utente, file di blocco sulle firme <code>pub</code> controllato in revisione.</td>
</tr>
</tbody>
</table>
<p><strong>Cosa resta attivo in tutte e tre le modalità</strong></p>
<ul>
<li>La scrittura del file di traccia non si può disattivare.</li>
<li><code>aeris replay</code> produce esecuzioni identiche byte per byte sulla parte deterministica.</li>
<li>Gli schemi <code>model@vN</code> vengono validati a ogni confine di fiducia.</li>
<li>Le <code>policy</code> vengono valutate a runtime su ogni chiamata che combacia con il loro <code>match:</code>.</li>
</ul>
<blockquote>
<p>La modalità di applicazione regola solo il <strong>controllo statico</strong>, non la <strong>registrazione a runtime</strong>. Un progetto può salire dalla modalità <code>off</code> alla modalità <code>strict</code> <em>senza riscrivere il codice esistente</em> — basta aggiungere progressivamente le annotazioni (<code>cap</code>, <code>intent</code>) là dove vanno.</p>
</blockquote>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="36" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-class="tight" data-theme="aeris" lang="it-IT" class="tight" data-marpit-pagination="36" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--class:tight;--theme:aeris;" data-marpit-pagination-total="39">
<header>Presentazione tecnica · v0.3</header>

<h1 id="esempio-completo--triage-di-un-sistema-sre-1-di-2">Esempio completo — triage di un sistema SRE (1 di 2)</h1>
<div class="columns">
<div class="column">
<pre><code class="language-aeris">// Schemi versionati sui confini di fiducia,
// validati a runtime ad ogni ingresso e uscita.
model Allarme@v1 {
  id:        uuid
  servizio:  string
  messaggio: string
}

model Diagnosi@v1 {
  severita:  string  where [&quot;critica&quot;,&quot;alta&quot;,&quot;media&quot;,&quot;bassa&quot;].contains(severita)
  tipo:      string  where [&quot;database&quot;,&quot;api&quot;,&quot;infrastruttura&quot;].contains(tipo)
  fiducia:   f64     where fiducia &gt;= 0.0 and fiducia &lt;= 1.0
}

model PianoFix@v1 {
  comandi:    list&lt;string&gt;
  rollback:   list&lt;string&gt;
  spiegazione: string
}

agent classifica {
  llm:     &quot;claude-haiku-4-5&quot;
  intent:  &quot;classifica l'allarme per severità, tipo, fiducia&quot;
  prompt:  &quot;Classifica: {input.messaggio} sul servizio {input.servizio}.&quot;
  accept:  Allarme@v1
  produce: Diagnosi@v1
  retries: 2
  budget:  { tokens: 2_000, latency: 3s }
}

agent pianifica {
  llm:     &quot;claude-opus-4-7&quot;
  intent:  &quot;propone un fix concreto e il rollback corrispondente&quot;
  prompt:  &quot;Fix per allarme {input.severita} di tipo {input.tipo}. Dati: {input}.&quot;
  accept:  Diagnosi@v1
  produce: PianoFix@v1
}

agent_net triage {
  flow classifica -&gt; pianifica
  until: classifica.fiducia &gt; 0.85 or iterations &gt;= 3
}
</code></pre>
</div>
<div class="column compact">
<p><strong>La parte AI: una rete di agenti tipizzata</strong></p>
<p>L'intera pipeline di triage degli allarmi è scritta come <code>agent_net</code>. Ogni agente dichiara lo schema dell'<strong>ingresso</strong> (<code>accept</code>) e dello <strong>uscita</strong> (<code>produce</code>) come <code>model@vN</code>, validati ad ogni invocazione.</p>
<p>Il passaggio fra agenti è risolto dal runtime per <strong>combaciamento dei tipi</strong>: l'uscita di <code>classifica</code> è una <code>Diagnosi@v1</code>, e <code>pianifica</code> la accetta. Non esiste un prompt-string di coordinamento scritto a mano; il protocollo di scambio è parte del programma.</p>
<p>Il sistema dei tipi taglia le hallucination del modello: una risposta che non rispetta lo schema diventa <code>Err(err.schema(...))</code> e l'agente la ritenta entro il budget <code>retries</code>.</p>
<p>La clausola <code>until:</code> stabilisce un limite massimo alla convergenza: niente loop infiniti. La rete restituisce il valore prodotto dall'ultimo nodo terminale, oppure <code>Err(err.user(&quot;rete agenti esaurita&quot;))</code> quando il limite di iterazioni viene raggiunto senza che il criterio di convergenza sia soddisfatto.</p>
<blockquote>
<p>Niente stringhe di prompt per smistare i messaggi, niente parsing manuale del JSON di risposta, niente ritentativi cuciti a mano. Tutto questo è infrastruttura del linguaggio.</p>
</blockquote>
</div>

<header>Presentazione tecnica · v0.3</header>

<h1 id="esempio-completo--triage-di-un-sistema-sre-2-di-2">Esempio completo — triage di un sistema SRE (2 di 2)</h1>
<div class="columns">
<div class="column">
<pre><code class="language-aeris">policy egress_produzione {
  match: http.*
  deny:  url.host not in [&quot;api.acme.com&quot;, &quot;slack.com&quot;]
  audit: { url, method }
}

saga applica_fix(
  fix:      PianoFix@v1,
  allarme:  Allarme@v1,
  cap:      cap[
    shell.run @ [&quot;kubectl&quot;],
    http.post @ [&quot;slack.com&quot;],
    audit.event,
  ],
) {
  intent &quot;applica il fix per l'allarme {allarme.id} ({allarme.servizio})&quot;

  step snapshot {
    do   { shell.run(&quot;kubectl get all -n prod -o yaml &gt; /tmp/{allarme.id}.yaml&quot;) }
    undo { shell.run(&quot;rm -f /tmp/{allarme.id}.yaml&quot;) }
  }

  step applica {
    requires: snapshot.ok
    do   { for c in fix.comandi  { shell.run(c)? } }
    undo { for c in fix.rollback { shell.run(c)? } }
  }

  step notifica {
    requires: applica.ok
    do   { http.post(&quot;https://slack.com/hook&quot;, { text: &quot;fix ok: {fix.spiegazione}&quot; })? }
    undo { http.post(&quot;https://slack.com/hook&quot;, { text: &quot;rollback: {allarme.id}&quot; })? }
  }
}

every 30s {
  let raw      = http.get(&quot;https://alertmanager/api/v1/alerts&quot;)?
  let allarmi  = json.decode&lt;list&lt;Allarme@v1&gt;&gt;(raw.body)?
  for a in allarmi {
    let piano = triage(a)?
    applica_fix(piano, a, cap.subset[shell.run, http.post, audit.event])?
  }
}
</code></pre>
</div>
<div class="column compact">
<p><strong>La parte operativa: <code>saga</code>, <code>policy</code>, scheduler nello stesso file</strong></p>
<p>La <code>saga applica_fix</code> salva una fotografia dello stato del cluster (snapshot), applica il fix, e notifica un canale Slack. Ogni <code>step</code> dichiara <code>do</code> e <code>undo</code>. Se uno step intermedio fallisce, il runtime esegue automaticamente gli <code>undo</code> dei passi già completati in ordine inverso: il sistema torna allo stato precedente, non rimane mai a metà strada.</p>
<p>La <code>policy egress_produzione</code> viene valutata su ogni chiamata <code>http.*</code>. Una richiesta verso un host che non compare nella lista bianca finisce in <code>PolicyViolation</code>, con un evento dedicato nel file di traccia. In revisione si vede subito chi ha tentato di violarla.</p>
<p>Lo scheduler <code>every 30s</code> chiude il giro: scarica gli allarmi da Alertmanager, lancia la rete di agenti <code>triage</code> per ottenere un <code>PianoFix@v1</code>, e invoca la <code>saga</code> con una capability ridotta da <code>cap.subset[...]</code> (è il principio del <em>minimo privilegio</em>, applicato a ogni singola chiamata).</p>
<blockquote>
<p>Un solo file <code>.aer</code>, una sola grammatica. Quello che oggi richiede LangChain, Argo, Open Policy Agent e qualche script bash messi insieme, qui sta in poco più di cento righe. Ed è eseguibile, controllabile in audit, riproducibile offline.</p>
</blockquote>
</div>
</div>

<header>Presentazione tecnica · v0.3</header>
<h1 id="stato-dello-sviluppo">Stato dello sviluppo</h1>
<table>
<thead>
<tr>
<th>Versione</th>
<th>Cosa contiene</th>
<th>Stato</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>v0.1</strong></td>
<td>Prototipo esplorativo: funzioni di intelligenza artificiale di base, gestori di rete e file, recupero locale dagli errori. <strong>Non</strong> ha ancora capability tipizzate, blocco <code>intent</code> obbligatorio, replay deterministico.</td>
<td>precedente</td>
</tr>
<tr>
<td><strong>v0.2</strong></td>
<td>Le fondamenta: lexer, parser, interprete, file di traccia, supporto a <code>http</code>, <code>saga</code>, file di progetto, <code>model@vN</code>.</td>
<td>completata</td>
</tr>
<tr>
<td></td>
<td>Aggiunte: funzioni <code>ai.*</code>, replay deterministico, <code>agent_net</code>, gestori dei livelli più alti, comandi <code>aeris test</code> e <code>aeris fmt</code>, diagnostica, impacchettamento, modalità prototipo.</td>
<td>completata</td>
</tr>
<tr>
<td><strong>v0.3</strong></td>
<td>Le tre modalità di applicazione (<code>enforce = &quot;off&quot; / &quot;loose&quot; / &quot;strict&quot;</code>) e la superficie da scripting (<code>loop</code>, <code>??</code>, libreria standard più ricca, metodi sui tipi base, codifica naturale di JSON).</td>
<td>completata</td>
</tr>
<tr>
<td></td>
<td>Interpolazione delle stringhe <code>&quot;{x}&quot;</code>, recupero locale dagli errori (<code>catch</code>/<code>error</code>/<code>defer</code>), costrutti temporali (<code>every</code>/<code>retry</code>/<code>timeout</code>/<code>clock.sleep</code>), versioning di schemi con <code>model X@v2 extends X@v1</code>.</td>
<td>completata</td>
</tr>
<tr>
<td></td>
<td>Funzioni AI di livello più alto (<code>ai.session</code>, <code>ai.decide</code>, <code>ai.usage</code>, <code>ai.chat(system, dir)</code>); strumenti di test (<code>assert_status</code>, <code>assert_json</code>, <code>assert_semantic</code>).</td>
<td>parzialmente</td>
</tr>
<tr>
<td></td>
<td>Server TCP/HTTP di basso livello (M20) e parità completa con la libreria v0.1 (M22).</td>
<td>rimandate</td>
</tr>
</tbody>
</table>
<blockquote>
<p>Eseguibile sotto gli 8 MB una volta strippato. Interprete a visita d'albero, nessuna dipendenza esterna a runtime.<br />
Le voci rimandate richiedono un runtime asincrono o librerie esterne, scelte fuori dallo scopo di v0.3.</p>
</blockquote>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
