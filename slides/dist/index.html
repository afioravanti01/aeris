<header>Presentazione tecnica · v0.3</header>
<p class="eyebrow">Presentazione tecnica · v0.3</p>
<h2 id="aeris-v03">AERIS v0.3</h2>
<p>Linguaggio di programmazione interpretato, pensato per <strong>operazioni di sistema, intelligenza artificiale e automazione</strong>. La sua particolarità è essere scritto <em>e</em> letto da LLM (<em>large language model</em> — modelli linguistici): l'accesso a rete, file system e modelli è descritto nella firma delle funzioni, ogni scrittura esterna dichiara il proprio scopo, e ogni esecuzione viene registrata in modo da essere riprodotta byte per byte.</p>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="2" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-theme="aeris" lang="C" data-marpit-pagination="2" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--theme:aeris;" data-marpit-pagination-total="43">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="3" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-theme="aeris" lang="C" data-marpit-pagination="3" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--theme:aeris;" data-marpit-pagination-total="43">
<header>Presentazione tecnica · v0.3</header>
<h1 id="il-problema-da-risolvere">Il problema da risolvere</h1>
<p>Oggi il codice viene generato dai modelli linguistici (LLM) e a sua volta letto da altri modelli per essere modificato o eseguito. Su un programma del genere si sommano tre sorgenti di comportamento imprevedibile, e nessuno strumento tradizionale le copre tutte insieme:</p>
<ul>
<li><strong>Il modello stesso.</strong> A parità di prompt produce uscite diverse. Impostare <code>temperature = 0</code> riduce la varianza, non la elimina.</li>
<li><strong>La grammatica del linguaggio.</strong> Costrutti ambigui o con più scritture valide costringono il modello a indovinare la forma giusta.</li>
<li><strong>Lo stato del mondo esterno.</strong> La rete cade, il database cambia sotto i piedi, il file system viene modificato da altri processi.</li>
</ul>
<p>Le difese che oggi sono in uso coprono solo una parte del problema:</p>
<ul>
<li>I container (Docker, gVisor) controllano cosa il processo <em>può fare</em> a livello di sistema operativo, ma non sanno quale singola funzione del programma tocca quale risorsa.</li>
<li>I sistemi di tipi (TypeScript, Java, Rust) parlano della forma dei dati, non degli effetti che ogni funzione produce.</li>
<li>I sistemi a effetti accademici (F*, Liquid Haskell, Koka) offrono il rigore voluto, ma il costo cognitivo è troppo alto per un team aziendale medio.</li>
<li>I framework di dominio (Airflow, LangChain) impongono convenzioni che il linguaggio non sa far rispettare.</li>
</ul>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="4" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-theme="aeris" lang="C" data-marpit-pagination="4" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--theme:aeris;" data-marpit-pagination-total="43">
<header>Presentazione tecnica · v0.3</header>
<h1 id="cos%C3%A8-aeris-in-concreto">Cos'è Aeris, in concreto</h1>
<div class="columns">
<div class="column compact">
<p><strong>Il prodotto</strong></p>
<ul>
<li>Linguaggio <strong>interpretato</strong>, scritto in Rust.</li>
<li>Un singolo eseguibile statico chiamato <code>aeris</code>, sotto gli 8 MB, senza alcuna dipendenza esterna: si scarica e si esegue.</li>
<li>I programmi sono file di testo con estensione <code>.aer</code>.</li>
<li>Il modello di esecuzione è un <em>tree-walking interpreter</em>: il programma viene letto, trasformato in un albero sintattico, e il runtime visita l'albero nodo per nodo. Niente compilazione, niente codice intermedio.</li>
</ul>
<p><strong>Cosa succede a ogni esecuzione</strong></p>
<ul>
<li><code>aeris run programma.aer</code> esegue il programma.</li>
<li>In parallelo, viene scritto un <em>file di traccia</em> nella cartella <code>.aeris/traces/</code>. Il formato è JSON Lines: un oggetto JSON per ogni riga, una riga per ogni chiamata significativa.</li>
<li><code>aeris replay &lt;id-traccia&gt;</code> rigioca offline l'intero programma a partire dalla traccia, ottenendo le stesse identiche risposte sulle parti deterministiche.</li>
</ul>
</div>
<div class="column">
<p><strong>Il linguaggio è organizzato in quattro livelli</strong></p>
<figure class="aeris-figure">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-label="I quattro livelli del linguaggio impilati: sintassi, semantica verificabile, operazioni reversibili, coordinamento di agenti AI">
<defs>
<marker id="arrL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1C2035" /></marker>
</defs>
<g font-family="Inter, system-ui, sans-serif">
<rect x="20" y="15" width="560" height="70" rx="10" fill="#F6F3F0" stroke="#1C2035" stroke-width="2" />
<text x="40" y="45" font-size="22" font-weight="700" fill="#0E1020">Livello 1 — Sintassi</text>
<text x="40" y="72" font-size="16" fill="#5F6470">variabili, tipi, controllo di flusso</text>
<line x1="300" y1="85" x2="300" y2="100" stroke="#1C2035" stroke-width="2.5" marker-end="url(#arrL)" />
<rect x="20" y="100" width="560" height="70" rx="10" fill="#F6F3F0" stroke="#1C2035" stroke-width="2" />
<text x="40" y="130" font-size="22" font-weight="700" fill="#0E1020">Livello 2 — Semantica verificabile</text>
<text x="40" y="157" font-size="16" fill="#5F6470">capabilities, contratti, intent</text>
<line x1="300" y1="170" x2="300" y2="185" stroke="#1C2035" stroke-width="2.5" marker-end="url(#arrL)" />
<rect x="20" y="185" width="560" height="70" rx="10" fill="#F6F3F0" stroke="#1C2035" stroke-width="2" />
<text x="40" y="215" font-size="22" font-weight="700" fill="#0E1020">Livello 3 — Operazioni reversibili</text>
<text x="40" y="242" font-size="16" fill="#5F6470">saga con passi do e undo obbligatori</text>
<line x1="300" y1="255" x2="300" y2="270" stroke="#1C2035" stroke-width="2.5" marker-end="url(#arrL)" />
<rect x="20" y="270" width="560" height="70" rx="10" fill="#F6F3F0" stroke="#1C2035" stroke-width="2" />
<text x="40" y="300" font-size="22" font-weight="700" fill="#0E1020">Livello 4 — Coordinamento di agenti AI</text>
<text x="40" y="327" font-size="16" fill="#5F6470">agent, agent_net tipizzato</text>
</g>
</svg>
</figure>
<p>Ogni livello <em>si compone</em> con quello sotto. I livelli si attivano a richiesta: uno script da poche righe vive nel solo livello 1, una pipeline che si ripristina da sola usa i livelli 1, 2 e 3, un sistema multi-agente coordinato li usa tutti e quattro.</p>
</div>
</div>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="5" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-theme="aeris" lang="C" data-marpit-pagination="5" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--theme:aeris;" data-marpit-pagination-total="43">
<header>Presentazione tecnica · v0.3</header>
<h1 id="a-chi-serve-aeris">A chi serve Aeris</h1>
<div class="columns">
<div class="column compact">
<p><strong>Un linguaggio a uso generale</strong></p>
<p>Aeris è un linguaggio di programmazione <em>a uso generale</em>: con Aeris si scrivono programmi da riga di comando, validatori, parser, piccoli servizi e tutte le automazioni che oggi si scriverebbero in Python o in Go. La sintassi è familiare a chi conosce Rust, Swift, Kotlin o TypeScript.</p>
<p>Tre profili trovano nel linguaggio strumenti già pronti, perché Aeris porta dentro la grammatica esattamente le cose che oggi devono essere cucite a mano:</p>
<ul>
<li><strong>Ingegneri delle operazioni</strong> (chi gestisce deploy e infrastruttura), che oggi mettono insieme file YAML, script Python, shell e Terraform.</li>
<li><strong>Autori di pipeline di intelligenza artificiale</strong>, che oggi combinano librerie come LangChain con stringhe di prompt scritte a mano e logiche di ritentativo artigianali.</li>
<li><strong>Team in contesti regolamentati</strong> — banche, sanità, pubblica amministrazione — che devono sapere con precisione che cosa fa il codice e devono poterlo riprodurre offline a distanza di tempo.</li>
</ul>
</div>
<div class="column compact">
<p><strong>Cosa si tiene in un solo file <code>.aer</code></strong></p>
<ul>
<li>Lo script operativo, oggi in <code>bash</code> o Python, diventa un programma Aeris in cui ogni scrittura esterna dichiara il proprio scopo con un blocco <code>intent</code>.</li>
<li>Il manifesto della pipeline, oggi in Airflow o Argo, diventa una <code>saga</code> con i passi <code>do</code> e <code>undo</code> obbligatori.</li>
<li>Il grafo degli agenti AI, oggi in LangChain o CrewAI, diventa una <code>agent_net</code> con messaggi validati ad ogni passaggio contro uno schema tipizzato.</li>
<li>Le regole di sicurezza sulla rete in uscita, oggi in Open Policy Agent (OPA), diventano costrutti <code>policy</code> valutati dal runtime ad ogni chiamata.</li>
</ul>
<p><strong>Tre modi di scriverlo, una sola grammatica</strong></p>
<ul>
<li><strong>Modalità script.</strong> Si scrivono istruzioni direttamente nel file, senza <code>main</code>, senza dichiarare i permessi. Adatta a prototipi, demo, automazioni veloci.</li>
<li><strong>Modalità progressiva.</strong> Le funzioni dichiarano i propri permessi (<code>cap</code>), il manifesto del progetto fa da limite massimo. Adatta a chi vuole salire gradualmente verso la disciplina piena.</li>
<li><strong>Modalità rigida.</strong> Permessi dichiarati ovunque, blocco <code>intent</code> obbligatorio su ogni scrittura, le firme delle funzioni vengono congelate in un file di blocco controllato in revisione. Adatta a produzione, audit, compliance.</li>
</ul>
<blockquote>
<p>In tutte e tre le modalità il file di traccia e la possibilità di rigiocare l'esecuzione restano attivi: la capacità di rivedere e riprodurre ciò che il programma ha fatto non si può togliere.</p>
</blockquote>
</div>
</div>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="6" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-class="tight" data-theme="aeris" lang="C" class="tight" data-marpit-pagination="6" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--class:tight;--theme:aeris;" data-marpit-pagination-total="43">
<header>Presentazione tecnica · v0.3</header>

<h1 id="come-si-presenta-un-programma-aeris">Come si presenta un programma Aeris</h1>
<div class="columns">
<div class="column">
<pre><code class="language-rust"><span class="hljs-comment">// Un programma che legge un file di log, fa classificare</span>
<span class="hljs-comment">// ogni riga da un modello, e annota nel registro di</span>
<span class="hljs-comment">// audit le righe segnalate come critiche.</span>
<span class="hljs-comment">// Senza fn main, senza dichiarazione di permessi.</span>

<span class="hljs-keyword">let</span> <span class="hljs-variable">sessione</span> = ai.<span class="hljs-title function_ invoke__">session</span>(
  system: <span class="hljs-string">&quot;Classifica la riga come critical, warning o info.&quot;</span>,
  model:  <span class="hljs-string">&quot;claude-haiku-4-5&quot;</span>,
)

<span class="hljs-keyword">let</span> <span class="hljs-variable">righe</span> = fs.<span class="hljs-title function_ invoke__">read_file</span>(<span class="hljs-string">&quot;./error.log&quot;</span>)
              .<span class="hljs-title function_ invoke__">split</span>(<span class="hljs-string">&quot;\n&quot;</span>)

<span class="hljs-keyword">for</span> <span class="hljs-variable">riga</span> <span class="hljs-keyword">in</span> righe.<span class="hljs-title function_ invoke__">slice</span>(<span class="hljs-number">0</span>, <span class="hljs-number">50</span>) {
  <span class="hljs-keyword">let</span> <span class="hljs-variable">categoria</span> = ai.<span class="hljs-title function_ invoke__">decide</span>(
    prompt:  <span class="hljs-string">&quot;Classifica: {riga}&quot;</span>,
    choices: [<span class="hljs-string">&quot;critical&quot;</span>, <span class="hljs-string">&quot;warning&quot;</span>, <span class="hljs-string">&quot;info&quot;</span>],
  )?

  <span class="hljs-keyword">if</span> categoria == <span class="hljs-string">&quot;critical&quot;</span> {
    audit.<span class="hljs-title function_ invoke__">event</span>(<span class="hljs-string">&quot;triage.critical&quot;</span>, { riga: riga })
  }
}

io.<span class="hljs-title function_ invoke__">println</span>(<span class="hljs-string">&quot;triage completato — {ai.usage().calls} chiamate al modello&quot;</span>)
</code></pre>
</div>
<div class="column compact">
<p><strong>Cosa rende possibile questa scrittura</strong></p>
<ul>
<li>Le istruzioni vengono scritte direttamente al livello del file e vengono eseguite in ordine, senza bisogno di racchiuderle in una funzione <code>main</code>. È lo stesso modello di uno script Python.</li>
<li>Le stringhe interpolano direttamente le espressioni racchiuse tra graffe: <code>&quot;{riga}&quot;</code> al posto della concatenazione manuale.</li>
<li>Le funzioni della libreria standard accettano argomenti per nome. Una chiamata come <code>ai.decide(prompt: ..., choices: [...])</code> si legge come una documentazione di sé stessa.</li>
<li>Le funzioni di intelligenza artificiale (<code>ai.session</code>, <code>ai.decide</code>, <code>ai.usage</code>) sono nella libreria standard del linguaggio, non in un pacchetto da installare a parte.</li>
<li>Il punto interrogativo <code>?</code> posto dopo una chiamata propaga l'errore al chiamante: nel caso di <code>ai.decide</code>, scatta quando il modello restituisce una risposta che non rientra fra quelle elencate in <code>choices</code>.</li>
<li>Ogni chiamata a <code>ai.decide</code> e a <code>audit.event</code> viene registrata in un file di traccia (in formato JSON Lines, un oggetto JSON per riga) accanto al sorgente. Lo stesso programma si rigioca offline con <code>aeris replay</code>, ottenendo gli stessi byte sulle parti deterministiche.</li>
</ul>
<blockquote>
<p>La grammatica scala senza rotture fino al programma &quot;settle&quot; della Parte III: ci si aggiungono <code>fn</code>, <code>cap</code>, <code>intent</code>, <code>saga</code>, senza cambiare linguaggio.</p>
</blockquote>
</div>
</div>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="7" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-class="tight" data-theme="aeris" lang="C" class="tight" data-marpit-pagination="7" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--class:tight;--theme:aeris;" data-marpit-pagination-total="43">
<header>Presentazione tecnica · v0.3</header>

<h1 id="i-costrutti-di-base-del-linguaggio">I costrutti di base del linguaggio</h1>
<div class="columns">
<div class="column">
<pre><code class="language-rust"><span class="hljs-comment">// let immutabile, var mutabile, const a livello del file.</span>
<span class="hljs-keyword">let</span> <span class="hljs-variable">titolo</span>      = <span class="hljs-string">&quot;report&quot;</span>
var contatore   = <span class="hljs-number">0</span>
<span class="hljs-keyword">const</span> MAX_ITEMS = <span class="hljs-number">100</span>

<span class="hljs-comment">// Tipi inferiti; annotazioni opzionali ai confini.</span>
<span class="hljs-keyword">let</span> <span class="hljs-variable">importo</span>: decimal = <span class="hljs-number">12.50</span>

<span class="hljs-comment">// if è un&#x27;espressione.</span>
<span class="hljs-keyword">let</span> <span class="hljs-variable">etichetta</span> = <span class="hljs-keyword">if</span> importo &gt; <span class="hljs-number">100.0</span> { <span class="hljs-string">&quot;grande&quot;</span> } <span class="hljs-keyword">else</span> { <span class="hljs-string">&quot;piccolo&quot;</span> }

<span class="hljs-comment">// Enumerazioni con varianti tipizzate.</span>
<span class="hljs-keyword">enum</span> <span class="hljs-title class_">Stato</span> {
  Attivo,
  Bannato { motivo: string },
  Sospeso,
}

<span class="hljs-comment">// match è un&#x27;espressione, con destrutturazione e guardie.</span>
<span class="hljs-keyword">let</span> <span class="hljs-variable">messaggio</span> = <span class="hljs-keyword">match</span> <span class="hljs-title function_ invoke__">stato_corrente</span>() {
  Bannato { motivo } <span class="hljs-punctuation">-&gt;</span> <span class="hljs-string">&quot;bloccato: {motivo}&quot;</span>,
  Attivo             <span class="hljs-punctuation">-&gt;</span> <span class="hljs-string">&quot;ok&quot;</span>,
  Sospeso            <span class="hljs-punctuation">-&gt;</span> <span class="hljs-string">&quot;in attesa&quot;</span>,
}

<span class="hljs-comment">// Errori come valori: ? propaga, ?? sostituisce None / Err.</span>
<span class="hljs-keyword">let</span> <span class="hljs-variable">nick</span> = <span class="hljs-title function_ invoke__">cerca_soprannome</span>() ?? <span class="hljs-string">&quot;anonimo&quot;</span>
<span class="hljs-keyword">let</span> <span class="hljs-variable">dati</span> = fs.<span class="hljs-title function_ invoke__">read_file</span>(percorso)?

<span class="hljs-comment">// Closure di prima classe; metodi sui tipi nativi.</span>
<span class="hljs-keyword">let</span> <span class="hljs-variable">maiuscoli</span> = [<span class="hljs-string">&quot;a&quot;</span>, <span class="hljs-string">&quot;b&quot;</span>].<span class="hljs-title function_ invoke__">map</span>(<span class="hljs-title function_ invoke__">fn</span>(n) { strings.<span class="hljs-title function_ invoke__">upper</span>(n) })
</code></pre>
</div>
<div class="column compact">
<p><strong>Una sintassi familiare</strong></p>
<p>I legami sono di tre tipi: <code>let</code> (immutabile, predefinito), <code>var</code> (riassegnabile dentro una funzione), <code>const</code> (costante a livello del file). I tipi sono inferiti; le annotazioni si scrivono ai confini di interfaccia.</p>
<p><code>if</code> e <code>match</code> sono <strong>espressioni</strong>: il loro valore è quello del ramo scelto. Il <code>match</code> accetta letterali, costruttori di enum e record (con destrutturazione dei campi), e guardie introdotte da <code>if</code>.</p>
<p>Gli errori sono <strong>valori restituiti</strong>, non eccezioni. Una funzione che può fallire restituisce <code>result&lt;T&gt;</code> (cioè <code>Ok(t)</code> o <code>Err(e)</code>). L'operatore <code>?</code> propaga l'errore al chiamante; <code>??</code> fornisce un valore di sostituzione su <code>None</code> o <code>Err</code>.</p>
<p>Le funzioni (incluse le closure) sono valori di prima classe. I tipi nativi <code>list</code>, <code>string</code>, <code>map</code> espongono i metodi comuni: <code>.map</code>, <code>.contains</code>, <code>.slice</code>, <code>.join</code>, <code>.split</code>, <code>.trim</code>.</p>
<blockquote>
<p>La novità del linguaggio è altrove: nei costrutti <code>cap</code>, <code>intent</code>, <code>saga</code>, <code>agent</code>, <code>policy</code>.</p>
</blockquote>
</div>
</div>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="8" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-theme="aeris" lang="C" data-marpit-pagination="8" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--theme:aeris;" data-marpit-pagination-total="43">
<header>Presentazione tecnica · v0.3</header>
<h1 id="perch%C3%A9-%C3%A8-adatto-a-essere-scritto-e-letto-da-un-modello-linguistico">Perché è adatto a essere scritto e letto da un modello linguistico</h1>
<div class="columns">
<div class="column compact">
<p><strong>Una grammatica con una sola forma legale</strong></p>
<p>Ogni parola chiave del linguaggio è riservata: nessun termine cambia significato a seconda del contesto. Una ricerca testuale di <code>step</code> o <code>saga</code> trova <em>davvero</em> tutte le occorrenze. Ogni costrutto ha una sola scrittura canonica, e il formatter <code>aeris fmt</code> la impone in modo completo: dato un programma valido, esiste una sola sua forma legale. Non esistono varianti sintattiche per la stessa cosa — si scrive <code>fn</code>, mai <code>function</code> o <code>def</code>.</p>
<p>Il risultato è uno spazio dei completamenti validi molto piccolo. Un modello che genera codice ha meno decisioni da prendere, e quindi meno modi di sbagliare. Una <code>saga</code> da dieci passi sta in mezza pagina; una rete di agenti in sei righe.</p>
<p><strong>Il &quot;perché&quot; è parte della grammatica</strong></p>
<p>Concetti che in altri linguaggi vivono nei commenti, nei messaggi di commit o nei ticket, in Aeris sono costrutti del linguaggio.</p>
<p><code>intent &quot;...&quot;</code> dichiara lo scopo di una scrittura esterna ed è obbligatorio in modalità rigida. <code>model Fattura@v1</code> versiona uno schema dato sui confini di fiducia (chi entra ed esce dal programma) e lo valida a runtime. <code>policy</code> esprime una regola di sicurezza come parte del programma, non come convenzione di prompt. Le clausole <code>requires:</code> ed <code>ensures:</code> portano le pre-condizioni e le post-condizioni dentro la firma della funzione.</p>
</div>
<div class="column compact">
<p><strong>L'intelligenza artificiale è nella libreria standard</strong></p>
<p>Le funzioni che oggi vivono in librerie esterne come LangChain qui sono <strong>primitive del linguaggio</strong>:</p>
<ul>
<li><code>ai.session</code> e <code>ai.session_ask</code> reggono una conversazione multi-turno, con compattazione automatica della cronologia oltre i quaranta messaggi.</li>
<li><code>ai.decide(prompt, choices)</code> impone al modello di scegliere fra un insieme dichiarato di valori, con ritentativo automatico se la risposta cade fuori.</li>
<li><code>ai.chat(system, dir)</code> costruisce un chatbot caricando in avvio una cartella di documenti come base di conoscenza.</li>
<li><code>ai.network</code> programmatico oppure <code>agent</code> e <code>agent_net</code> dichiarativi descrivono le reti di agenti.</li>
<li>Il backend del modello è configurabile via file di progetto: chiamata HTTP a un'API (Anthropic, OpenAI) oppure invocazione di un sottoprocesso da riga di comando (<code>claude --print</code>, <code>ollama run</code>). Nessuna libreria di terze parti collegata in fase di compilazione.</li>
</ul>
<p><strong>Riproducibilità inclusa</strong></p>
<p>Ogni chiamata al modello viene registrata nel file di traccia come un evento JSON che contiene il prompt, il modello, la risposta e il numero di token consumati. Il comando <code>aeris replay</code> rigioca l'intera sessione offline ottenendo gli stessi byte sulla parte deterministica. La prima esecuzione resta stocastica per natura; ogni esecuzione successiva di tipo replay è deterministica.</p>
</div>
</div>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>

<header>Presentazione tecnica · v0.3</header>

<h1 id="parte-ii--come-gira-un-programma">Parte II — Come gira un programma</h1>
<blockquote>
<p>I quattro livelli del linguaggio, il flusso che porta dal sorgente alla traccia, i codici di uscita previsti, il file di progetto come riferimento unico.</p>
</blockquote>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="10" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-theme="aeris" lang="C" data-marpit-pagination="10" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--theme:aeris;" data-marpit-pagination-total="43">
<header>Presentazione tecnica · v0.3</header>
<h1 id="i-quattro-livelli-del-linguaggio">I quattro livelli del linguaggio</h1>
<table>
<thead>
<tr>
<th>Livello</th>
<th>Cosa aggiunge</th>
<th>Costrutti</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>1</strong> — Sintassi adatta ai modelli</td>
<td>Lessico denso, una sola forma canonica per ogni costrutto, tutte le parole chiave riservate</td>
<td><code>fn</code>, <code>record</code>, <code>enum</code>, <code>match</code>, <code>if</code>, <code>for</code></td>
</tr>
<tr>
<td><strong>2</strong> — Semantica verificabile</td>
<td>I permessi sugli effetti esterni sono valori passati per parametro, contratti controllati a runtime, blocco <code>intent</code> obbligatorio sulle scritture</td>
<td><code>cap[...]</code>, <code>requires:</code> / <code>ensures:</code>, <code>intent</code></td>
</tr>
<tr>
<td><strong>3</strong> — Operazioni reversibili</td>
<td><code>saga</code> con passi obbligati a dichiarare <code>do</code> (azione) e <code>undo</code> (compensazione); chiavi di idempotenza generate dal runtime</td>
<td><code>saga</code>, <code>step</code>, <code>do</code>, <code>undo</code></td>
</tr>
<tr>
<td><strong>4</strong> — Coordinamento di agenti AI</td>
<td>Agenti come unità tipizzate, grafo aciclico fra agenti, validazione di schema ad ogni passaggio</td>
<td><code>agent</code>, <code>agent_net</code>, <code>flow</code>, <code>until:</code></td>
</tr>
</tbody>
</table>
<blockquote>
<p>I livelli <strong>si attivano a richiesta</strong>: un programma usa solo i livelli che servono. Uno script di trenta righe vive nel livello 1; chi sale ai livelli superiori paga il costo solo di ciò che usa.</p>
</blockquote>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="11" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-class="tight" data-theme="aeris" lang="C" class="tight" data-marpit-pagination="11" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--class:tight;--theme:aeris;" data-marpit-pagination-total="43">
<header>Presentazione tecnica · v0.3</header>

<h1 id="come-gira-un-programma-aeris-dallinterno">Come gira un programma Aeris dall'interno</h1>
<div class="columns">
<div class="column compact">
<p><strong>Aeris è un linguaggio <em>interpretato</em></strong></p>
<p>Non viene compilato in un binario eseguibile: il programma sorgente viene letto, trasformato in una struttura dati in memoria, e l'eseguibile <code>aeris</code> la visita per eseguire il programma. Le quattro fasi sono:</p>
<p><strong>1. Analisi lessicale (<em>lexer</em>).</strong> Legge i byte del file <code>.aer</code> e li raggruppa in <em>token</em> tipizzati: parole chiave, identificatori, letterali, simboli di punteggiatura. Ogni token porta con sé la posizione nel sorgente. Un carattere non riconosciuto interrompe la lettura.</p>
<p><strong>2. Analisi sintattica (<em>parser</em>).</strong> Prende il flusso di token e costruisce l'<strong>albero di sintassi astratta</strong> (AST, <em>Abstract Syntax Tree</em>): un albero in cui ogni nodo rappresenta una costruzione del linguaggio — una <code>let</code>, una chiamata, una <code>saga</code>, un <code>agent</code>. Un programma è la lista dei nodi al livello del file.</p>
<p><strong>3. Controllo statico.</strong> Una visita sull'AST che verifica le proprietà strutturali del programma: i permessi <code>cap</code> dichiarati nelle firme combaciano con le chiamate effettive, i blocchi <code>intent</code> sono presenti sulle scritture, gli schemi <code>model</code> portano la versione <code>@vN</code> sui confini di fiducia. Un errore qui termina prima di eseguire una riga.</p>
<p><strong>4. Interprete.</strong> Visita l'AST nodo per nodo (<em>tree walk</em>) e valuta ogni espressione. Le funzioni sono valori; chiamarle vuol dire creare un ambiente nuovo e visitare ricorsivamente l'albero del loro corpo.</p>
</div>
<div class="column">
<pre><code class="language-rust"><span class="hljs-comment">// L&#x27;interprete è (di fatto) una funzione che cammina</span>
<span class="hljs-comment">// sull&#x27;AST. Una sola funzione ricorsiva visita ogni</span>
<span class="hljs-comment">// nodo, e per ciascun tipo di nodo decide cosa fare.</span>

<span class="hljs-keyword">fn</span> <span class="hljs-title function_">walk</span>(nodo: Nodo, env: &amp;<span class="hljs-keyword">mut</span> Env) <span class="hljs-punctuation">-&gt;</span> Valore {
  <span class="hljs-keyword">match</span> nodo {
    <span class="hljs-title function_ invoke__">Let</span>(nome, espressione) =&gt; {
      <span class="hljs-keyword">let</span> <span class="hljs-variable">v</span> = <span class="hljs-title function_ invoke__">walk</span>(espressione, env);
      env.<span class="hljs-title function_ invoke__">set</span>(nome, v);
    },

    <span class="hljs-title function_ invoke__">If</span>(condizione, allora, altrimenti) =&gt;
      <span class="hljs-keyword">if</span> <span class="hljs-title function_ invoke__">walk</span>(condizione, env).<span class="hljs-title function_ invoke__">is_truthy</span>() {
        <span class="hljs-title function_ invoke__">walk</span>(allora, env)
      } <span class="hljs-keyword">else</span> {
        <span class="hljs-title function_ invoke__">walk</span>(altrimenti, env)
      },

    <span class="hljs-title function_ invoke__">Chiamata</span>(funzione, argomenti) =&gt; {
      <span class="hljs-keyword">let</span> <span class="hljs-variable">valori</span> = argomenti
        .<span class="hljs-title function_ invoke__">map</span>(|a| <span class="hljs-title function_ invoke__">walk</span>(a, env));
      <span class="hljs-title function_ invoke__">applica</span>(funzione, valori, env)
    },

    <span class="hljs-title function_ invoke__">Blocco</span>(istruzioni) =&gt;
      istruzioni.for_each(|s| <span class="hljs-title function_ invoke__">walk</span>(s, env)),

    <span class="hljs-comment">// ...un ramo per ogni costrutto del linguaggio.</span>
  }
}
</code></pre>
<blockquote>
<p>L'AST <strong>è</strong> il programma. Non c'è una fase di compilazione che produce bytecode, né una rappresentazione intermedia.</p>
</blockquote>
</div>
</div>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="12" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-theme="aeris" lang="C" data-marpit-pagination="12" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--theme:aeris;" data-marpit-pagination-total="43">
<header>Presentazione tecnica · v0.3</header>
<h1 id="dal-sorgente-alla-traccia">Dal sorgente alla traccia</h1>
<div class="columns">
<div class="column">
<figure class="aeris-figure">

</defs>
<g font-family="Inter, system-ui, sans-serif">

<line x1="121" y1="35" x2="131" y2="35" stroke="#1C2035" stroke-width="2.5" marker-end="url(#arrP)" />

<p>L'esecuzione procede in cinque fasi: il <strong>lexer</strong> divide il sorgente in token; il <strong>parser</strong> li ricompone in un albero sintattico; il <strong>controllore statico</strong> verifica le proprietà strutturali (permessi dichiarati, schemi versionati, blocchi <code>intent</code> presenti sulle scritture); l'<strong>interprete</strong> visita l'albero nodo per nodo; ogni evento significativo finisce in una riga del <strong>file di traccia</strong>.</p>
</div>
<div class="column compact">
<p><strong>Codici di uscita previsti</strong></p>
<p>Ogni categoria di violazione ha un proprio codice di uscita, in modo che i sistemi di integrazione continua (CI) possano reagire in maniera differenziata.</p>
<table>
<thead>
<tr>
<th>Codice</th>
<th>Significato</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>0</code></td>
<td>esecuzione conclusa senza errori</td>
</tr>
<tr>
<td><code>64</code></td>
<td>errore di sintassi, di tipo o di contratto</td>
</tr>
<tr>
<td><code>65</code></td>
<td>permesso mancante o uso di <code>cap[*]</code> nel codice utente</td>
</tr>
<tr>
<td><code>66</code></td>
<td>scrittura esterna fuori da un blocco <code>intent</code></td>
</tr>
<tr>
<td><code>67</code></td>
<td>passo di <code>saga</code> che scrive ma dichiara <code>undo: noop</code></td>
</tr>
<tr>
<td><code>68</code></td>
<td><code>model</code> usato senza versione <code>@vN</code> su un confine di fiducia</td>
</tr>
<tr>
<td><code>69</code></td>
<td>file di blocco scaduto: l'impronta di una dipendenza non corrisponde</td>
</tr>
<tr>
<td><code>70</code></td>
<td>ciclo dichiarato in <code>agent_net</code></td>
</tr>
<tr>
<td><code>71</code></td>
<td>la firma di una funzione concede più di quanto consente il manifesto</td>
</tr>
<tr>
<td><code>74</code></td>
<td><code>saga</code> finita in stato parziale (le retry sugli <code>undo</code> sono esaurite)</td>
</tr>
</tbody>
</table>
</div>
</div>

<header>Presentazione tecnica · v0.3</header>
<h1 id="registrazione-e-riesecuzione">Registrazione e riesecuzione</h1>
<div class="columns">
<div class="column compact">
<p><strong>La traccia è sempre attiva</strong></p>
<p>Ogni interazione con il mondo esterno (rete, file system, modelli, orologio, generatore di numeri casuali) finisce su una riga del file di traccia in formato JSON Lines, cioè un oggetto JSON per riga.</p>
<ul>
<li>Chiamate al modello (<code>ai.*</code>): vengono registrati il prompt, il nome del modello, la risposta, il numero di token e il timestamp.</li>
<li>Lettura dell'orologio (<code>clock.now</code>): viene registrato il valore letto.</li>
<li>Generazione di un numero casuale (<code>random.next</code>): viene registrato il valore generato.</li>
<li>Chiamate HTTP o invocazioni di shell: vengono registrate le impronte (hash) della richiesta e della risposta.</li>
</ul>
<p><strong>Rigiocare un'esecuzione</strong></p>
<p>Il comando <code>aeris replay &lt;id-traccia&gt; &lt;sorgente&gt;</code> rilegge il file di traccia e riproduce l'esecuzione del programma leggendo dal &quot;nastro&quot; registrato invece di interrogare il mondo esterno. Sulla parte deterministica del programma l'esecuzione è <strong>identica byte per byte</strong> all'originale.</p>
<p>L'opzione <code>--live</code> lascia che HTTP e modello vengano richiamati realmente, utile per individuare divergenze fra l'esecuzione registrata e una nuova esecuzione (debug differenziale). Il comando <code>aeris trace diff</code> confronta due tracce passo per passo e segnala dove divergono.</p>
</div>
<div class="column">
<pre><code class="language-json"><span class="hljs-punctuation">{</span><span class="hljs-attr">&quot;event&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-string">&quot;intent_enter&quot;</span><span class="hljs-punctuation">,</span>
 <span class="hljs-attr">&quot;intent&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-string">&quot;chiudi il lotto fatture&quot;</span><span class="hljs-punctuation">,</span>
 <span class="hljs-attr">&quot;scope&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-string">&quot;main.settle&quot;</span><span class="hljs-punctuation">,</span>
 <span class="hljs-attr">&quot;ts&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-string">&quot;2026-05-16T08:30:00Z&quot;</span><span class="hljs-punctuation">}</span>

<span class="hljs-punctuation">{</span><span class="hljs-attr">&quot;event&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-string">&quot;ai_call&quot;</span><span class="hljs-punctuation">,</span>
 <span class="hljs-attr">&quot;scope&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-string">&quot;classify&quot;</span><span class="hljs-punctuation">,</span>
 <span class="hljs-attr">&quot;prompt&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-string">&quot;Classifica la fattura...&quot;</span><span class="hljs-punctuation">,</span>
 <span class="hljs-attr">&quot;model&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-string">&quot;claude-opus-4-7&quot;</span><span class="hljs-punctuation">,</span>
 <span class="hljs-attr">&quot;response&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-string">&quot;{\&quot;tipo\&quot;:\&quot;utenze\&quot;}&quot;</span><span class="hljs-punctuation">,</span>
 <span class="hljs-attr">&quot;tokens&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-number">142</span><span class="hljs-punctuation">}</span>

<span class="hljs-punctuation">{</span><span class="hljs-attr">&quot;event&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-string">&quot;http_request&quot;</span><span class="hljs-punctuation">,</span>
 <span class="hljs-attr">&quot;scope&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-string">&quot;main.settle.charge&quot;</span><span class="hljs-punctuation">,</span>
 <span class="hljs-attr">&quot;url&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-string">&quot;https://api.acme.com/charge&quot;</span><span class="hljs-punctuation">,</span>
 <span class="hljs-attr">&quot;idempotency_key&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-string">&quot;blake3:7a3f...&quot;</span><span class="hljs-punctuation">,</span>
 <span class="hljs-attr">&quot;req_hash&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-string">&quot;...&quot;</span><span class="hljs-punctuation">,</span>
 <span class="hljs-attr">&quot;resp_hash&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-string">&quot;...&quot;</span><span class="hljs-punctuation">}</span>

<span class="hljs-punctuation">{</span><span class="hljs-attr">&quot;event&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-string">&quot;intent_exit&quot;</span><span class="hljs-punctuation">,</span><span class="hljs-attr">&quot;outcome&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-string">&quot;ok&quot;</span><span class="hljs-punctuation">}</span>
</code></pre>
</div>
</div>
