</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="30" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-class="divider" data-theme="aeris" lang="C" class="divider" data-marpit-pagination="30" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--class:divider;--theme:aeris;" data-marpit-pagination-total="43">
<header>Presentazione tecnica · v0.3</header>

<h1 id="parte-vi--regole-di-runtime-rifiuti-limiti">Parte VI — Regole di runtime, rifiuti, limiti</h1>
<blockquote>
<p>Le <code>policy</code> come costrutto valutato a runtime. Le scelte che il linguaggio rifiuta per principio. I limiti che Aeris dichiara onestamente di non risolvere.</p>
</blockquote>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="31" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-class="tight" data-theme="aeris" lang="C" class="tight" data-marpit-pagination="31" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--class:tight;--theme:aeris;" data-marpit-pagination-total="43">
<header>Presentazione tecnica · v0.3</header>

<h1 id="regole-di-runtime--policy">Regole di runtime — <code>policy</code></h1>
<div class="columns">
<div class="column">
<pre><code class="language-rust">policy egress_produzione {
  <span class="hljs-keyword">match</span>: http.*
  deny:  url.host not <span class="hljs-keyword">in</span> [<span class="hljs-string">&quot;api.acme.com&quot;</span>, <span class="hljs-string">&quot;api.stripe.com&quot;</span>]
  audit: { url, method }
  when:  env == <span class="hljs-string">&quot;production&quot;</span>
}

policy budget_modello {
  <span class="hljs-keyword">match</span>: ai.complete
  limit: tokens_per_minute = <span class="hljs-number">60_000</span>
  audit: { model, tokens }
}
</code></pre>
</div>
<div class="column compact">
<p><strong>Cos'è una <code>policy</code></strong></p>
<p>Una <code>policy</code> esprime una regola di sicurezza o di limite operativo come <strong>costrutto del linguaggio</strong>, non come convenzione esterna al codice. È fatta di alcune clausole, tutte facoltative:</p>
<ul>
<li><code>match:</code> — su quali chiamate la regola si applica (per esempio <code>http.*</code> o <code>ai.complete</code>).</li>
<li><code>deny:</code> — una violazione se la condizione è vera (rifiuta la chiamata).</li>
<li><code>require:</code> — una violazione se la condizione è falsa.</li>
<li><code>limit:</code> — quota su una finestra temporale (per minuto, ora, giorno).</li>
<li><code>audit:</code> — campi aggiuntivi da includere nell'evento di trace per le chiamate che combaciano.</li>
<li><code>when:</code> — pre-condizione di attivazione (per esempio &quot;solo in produzione&quot;).</li>
</ul>
<p><strong>Quando una policy è attiva</strong></p>
<p>Una <code>policy</code> può essere attivata in tre modi: dall'<code>use</code> di un modulo che la dichiara, con l'attributo <code>#[policy(nome)]</code> su una funzione, o dichiarandola nel file di progetto <code>aeris.toml [policies] active = [...]</code>.</p>
<p>Ad ogni chiamata che corrisponde a <code>match:</code>, il runtime valuta la regola. Una violazione produce un <code>PolicyViolation</code>, un evento dedicato nel file di traccia, e un'uscita con codice 1. Se durante una riesecuzione (replay) l'esito della policy diverge dall'esecuzione registrata, il runtime emette un evento <code>policy_drift</code> invece di fermarsi.</p>
</div>
</div>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="32" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-theme="aeris" lang="C" data-marpit-pagination="32" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--theme:aeris;" data-marpit-pagination-total="43">
<header>Presentazione tecnica · v0.3</header>
<h1 id="scelte-che-il-linguaggio-rifiuta-per-principio">Scelte che il linguaggio rifiuta per principio</h1>
<table>
<thead>
<tr>
<th>Cosa Aeris non ha</th>
<th>Perché</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Nessuna verifica formale tramite SMT solver</strong></td>
<td>Il verdetto di un solver dipende dalla macchina e dalle euristiche di ricerca, e quindi introduce non-determinismo <em>negli strumenti di sviluppo</em>. Sarebbe peggio del non-determinismo che cerchiamo di controllare.</td>
</tr>
<tr>
<td><strong>Nessun sistema di &quot;livelli&quot; del codice</strong> (<code>draft / standard / verified</code>)</td>
<td>Definire la semantica del confine fra un livello e l'altro è inevitabilmente confuso: cosa succede se <code>standard</code> importa <code>draft</code>? Nessuna risposta è ergonomica.</td>
</tr>
<tr>
<td><strong>Nessuna inferenza automatica dei permessi</strong></td>
<td>Una modifica interna a una funzione chiamata cambierebbe in silenzio i permessi delle funzioni chiamanti. Il diff in revisione diventerebbe ingannevole: l'ambito degli effetti deve essere dichiarato a mano.</td>
</tr>
<tr>
<td><strong>Nessuna parola chiave &quot;morbida&quot;</strong> (con significato dipendente dal contesto)</td>
<td>Un parser che decide il senso di una parola in base ai token successivi (<em>lookahead</em> variabile) produce errori sottili: la parola <code>time</code> può essere interpretata in modo diverso da quanto si vede a colpo d'occhio. Cercare una parola chiave con <code>grep</code> deve restituire <em>tutte</em> le occorrenze.</td>
</tr>
<tr>
<td><strong>Nessun riferimento mutabile fra le dipendenze</strong></td>
<td>Niente <code>latest</code>, niente <code>*</code>, nessun tag Git che possa cambiare contenuto. Ogni <code>use X@v1.2.3</code> deve combaciare con il file di blocco oppure fallisce alla risoluzione.</td>
</tr>
<tr>
<td><strong>Nessuna libreria binaria caricata dinamicamente</strong> (<code>.so</code> o <code>.dll</code>)</td>
<td>Un binario su disco aggiungerebbe una superficie di effetti che il controllore statico non può ispezionare. Romperebbe la verificabilità delle capability.</td>
</tr>
</tbody>
</table>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="33" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-theme="aeris" lang="C" data-marpit-pagination="33" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--theme:aeris;" data-marpit-pagination-total="43">
<header>Presentazione tecnica · v0.3</header>
<h1 id="limiti-dichiarati-onestamente">Limiti dichiarati onestamente</h1>
<table>
<thead>
<tr>
<th>Limite</th>
<th>Cosa significa concretamente</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>La prima esecuzione del modello resta non-deterministica</strong></td>
<td>La registrazione su nastro rende <code>aeris replay</code> identico byte per byte <em>dopo</em> la prima esecuzione. La prima volta resta in balia del modello: impostare <code>temperature = 0</code> riduce la varianza, non la elimina.</td>
</tr>
<tr>
<td><strong>La correttezza del corpo di una funzione non viene verificata</strong></td>
<td>Se una funzione possiede legittimamente il permesso <code>audit.write</code> e all'interno scrive l'attore sbagliato, Aeris non se ne accorge. Il linguaggio garantisce visibilità (la firma dichiara cosa la funzione può fare) e obbligo (i blocchi <code>intent</code> e <code>saga</code> non si possono saltare); la correttezza interna resta affidata a test, code review e controlli di accesso lato sistema (RBAC).</td>
</tr>
<tr>
<td><strong>Il rollback a catena è &quot;il meglio che si può&quot;</strong></td>
<td>Anche l'<code>undo</code> di un passo può a sua volta fallire. Il runtime ritenta usando le chiavi di idempotenza. Esauriti i ritentativi emette <code>PartialFailure</code> con codice di uscita 74, e chiede risoluzione umana. È un limite noto del pattern SAGA, nessun linguaggio lo elimina davvero.</td>
</tr>
</tbody>
</table>
<blockquote>
<p>Aeris è la <strong>prima linea di difesa</strong>, non l'unica. Promettere di più sarebbe disonesto con chi davvero deve fidarsi del linguaggio: chi fa compliance, audit, sicurezza.</p>
</blockquote>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="34" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-theme="aeris" lang="C" data-marpit-pagination="34" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--theme:aeris;" data-marpit-pagination-total="43">
<header>Presentazione tecnica · v0.3</header>
<h1 id="le-novit%C3%A0-di-v03--riepilogo-delle-aggiunte">Le novità di v0.3 — riepilogo delle aggiunte</h1>
<div class="columns">
<div class="column compact">
<p><strong>Più ergonomia su stringhe, controllo, errori</strong></p>
<ul>
<li>Interpolazione <code>&quot;ciao {nome}&quot;</code> con <code>\{</code> e <code>\}</code> come sequenze di escape per le graffe letterali.</li>
<li><code>loop { … }</code> come abbreviazione di <code>while true { … }</code>.</li>
<li>L'operatore <code>??</code> di sostituzione: <code>Ok(v) → v</code>, <code>Some(v) → v</code>, <code>Err</code>/<code>None</code> → valore di destra.</li>
<li><code>expr catch err { … }</code>, <code>error(&quot;...&quot;)</code>, <code>defer stmt</code> per il recupero locale dagli errori.</li>
<li>I blocchi temporali <code>every D { … }</code>, <code>retry N, delay: D { … }</code>, <code>timeout D { … }</code> e la primitiva <code>clock.sleep</code>.</li>
</ul>
<p><strong>Tipi e moduli</strong></p>
<ul>
<li><code>model X@v2 extends X@v1 { … }</code>: una versione successiva eredita campi e clausole <code>where:</code> della versione precedente.</li>
<li>Istruzioni a livello di file senza la necessità di <code>fn main</code> (modalità script).</li>
<li>Parametri di funzione senza annotazione di tipo, per scripting (<code>fn f(x, y) { ... }</code>).</li>
<li>Funzioni di utilità sui tipi base: <code>strings.*</code>, <code>date.*</code>, <code>json.pretty</code>, <code>json.parse</code>, <code>yaml.parse</code>.</li>
</ul>
</div>
<div class="column compact">
<p><strong>Strumenti per il modello linguistico</strong></p>
<ul>
<li><code>ai.session(system, model)</code> e <code>ai.session_ask(s, p)</code>: sessione multi-turno con compattazione automatica della cronologia oltre i quaranta messaggi.</li>
<li><code>ai.decide(p, choices, retries?)</code>: scelta vincolata fra valori dichiarati.</li>
<li><code>ai.usage()</code>: contatori di token, costo, numero di chiamate.</li>
<li><code>ai.chat(system, dir)</code>, con i metodi <code>.ask(p)</code> e <code>.kb_size()</code>: chatbot costruito su una cartella di documentazione.</li>
<li><code>ai.network(max_rounds)</code>: rete di agenti costruita programmaticamente.</li>
<li>Backend di tipo <code>cli</code> per <code>ai.complete</code>: il modello viene invocato come sottoprocesso a riga di comando, in alternativa alla chiamata HTTP.</li>
</ul>
<p><strong>Strumenti per i test</strong></p>
<ul>
<li>Le funzioni <code>assert_status</code>, <code>assert_json</code> e <code>assert_semantic</code> (quest'ultima usa il modello stesso come giudice del contenuto).</li>
</ul>
</div>
</div>
<blockquote>
<p>La traccia, la riesecuzione, gli schemi <code>model@vN</code> e le <code>policy</code> restano attivi <strong>su tutta la superficie v0.3</strong>: nessuna scelta di ergonomia rimuove la possibilità di audit.</p>
</blockquote>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="35" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-class="tight" data-theme="aeris" lang="C" class="tight" data-marpit-pagination="35" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--class:tight;--theme:aeris;" data-marpit-pagination-total="43">
<header>Presentazione tecnica · v0.3</header>

<h1 id="recupero-locale-dagli-errori--catch-retry-timeout-defer-every">Recupero locale dagli errori — <code>catch</code>, <code>retry</code>, <code>timeout</code>, <code>defer</code>, <code>every</code></h1>
<div class="columns">
<div class="column">
<pre><code class="language-rust"><span class="hljs-comment">// catch — gestore in linea; il blocco fornisce il fallback.</span>
<span class="hljs-keyword">let</span> <span class="hljs-variable">dati</span> = fs.<span class="hljs-title function_ invoke__">read_file</span>(<span class="hljs-string">&quot;config.json&quot;</span>) catch err {
  io.<span class="hljs-title function_ invoke__">eprintln</span>(<span class="hljs-string">&quot;config mancante: {err.message}&quot;</span>); <span class="hljs-string">b&quot;{}&quot;</span>
}

<span class="hljs-comment">// retry — riesegue su Err, con pausa fra i tentativi.</span>
<span class="hljs-keyword">let</span> <span class="hljs-variable">r</span> = retry <span class="hljs-number">5</span>, delay: <span class="hljs-number">2</span>s {
  http.<span class="hljs-title function_ invoke__">get</span>(<span class="hljs-string">&quot;https://servizio-instabile/health&quot;</span>)
}

<span class="hljs-comment">// timeout — limite sul tempo a parete; non interrompe a metà.</span>
<span class="hljs-keyword">let</span> <span class="hljs-variable">r</span> = timeout <span class="hljs-number">30</span>s { <span class="hljs-title function_ invoke__">chiamata_lunga</span>() }

<span class="hljs-comment">// defer — pulizia in ordine inverso, a ogni uscita.</span>
<span class="hljs-keyword">fn</span> <span class="hljs-title function_">compila</span>(cap: cap[fs.write_file @ [<span class="hljs-string">&quot;./build/**&quot;</span>]]) <span class="hljs-punctuation">-&gt;</span> result&lt;unit&gt; {
  <span class="hljs-keyword">let</span> <span class="hljs-variable">tmp</span> = fs.<span class="hljs-title function_ invoke__">create_temp</span>()?
  defer fs.<span class="hljs-title function_ invoke__">remove</span>(tmp)
  intent <span class="hljs-string">&quot;compila l&#x27;artefatto&quot;</span> {
    fs.<span class="hljs-title function_ invoke__">write_file</span>(<span class="hljs-string">&quot;./build/out.bin&quot;</span>, <span class="hljs-title function_ invoke__">compila_da</span>(tmp))?; <span class="hljs-title function_ invoke__">Ok</span>(())
  }
}

<span class="hljs-comment">// every — ciclo periodico, granularità al secondo.</span>
every <span class="hljs-number">5</span>m {
  <span class="hljs-keyword">let</span> <span class="hljs-variable">h</span> = http.<span class="hljs-title function_ invoke__">get</span>(<span class="hljs-string">&quot;https://api/health&quot;</span>)
  <span class="hljs-keyword">if</span> !h.ok { audit.<span class="hljs-title function_ invoke__">event</span>(<span class="hljs-string">&quot;api.giu&quot;</span>, { ts: clock.<span class="hljs-title function_ invoke__">now</span>() }) }
}
</code></pre>
</div>
<div class="column compact">
<p><strong>Pattern temporali come costrutti del linguaggio</strong></p>
<p><code>catch</code> è un gestore inserito in linea sull'espressione. Quando il valore è <code>Err(e)</code>, l'errore viene legato al nome dichiarato e il blocco di recupero ne fornisce il valore di sostituzione. Si compone con <code>?</code>.</p>
<p><code>retry N, delay: D</code> riesegue il blocco se restituisce <code>Err</code>, fino a <code>N</code> tentativi totali con pausa <code>D</code>. Il valore finale è l'esito dell'ultimo tentativo.</p>
<p><code>timeout D</code> misura il tempo a parete (<em>wall clock</em>) e produce <code>Err(err.user(&quot;timeout&quot;))</code> se il blocco supera la soglia. Non interrompe a metà istruzione: il controllo avviene a fine istruzione.</p>
<p><code>defer stmt</code> programma una pulizia che gira al ritorno della funzione, in ordine inverso. Gira su <strong>ogni</strong> via di uscita: ritorno normale, propagazione con <code>?</code>, violazione di contratto.</p>
<p><code>every D</code> esegue il blocco, attende <code>D</code>, lo riesegue. <code>break</code> esce, <code>continue</code> salta al prossimo intervallo.</p>
<blockquote>
<p>Tutti e cinque emettono eventi nel file di traccia: tentativi, durate, esiti, <code>defer</code> eseguiti.</p>
</blockquote>
</div>
</div>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="36" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-class="tight" data-theme="aeris" lang="C" class="tight" data-marpit-pagination="36" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--class:tight;--theme:aeris;" data-marpit-pagination-total="43">
<header>Presentazione tecnica · v0.3</header>

<h1 id="pattern-di-automazione-tipici">Pattern di automazione tipici</h1>
<div class="columns">
<div class="column">
<pre><code class="language-rust"><span class="hljs-comment">// 1 — Deploy con ritentativo, timeout, e pulizia garantita.</span>
<span class="hljs-keyword">fn</span> <span class="hljs-title function_">deploy</span>(versione: string, cap: cap[shell.exec @ [<span class="hljs-string">&quot;kubectl&quot;</span>]]) <span class="hljs-punctuation">-&gt;</span> result&lt;unit&gt; {
  <span class="hljs-keyword">let</span> <span class="hljs-variable">tmp</span> = fs.<span class="hljs-title function_ invoke__">create_temp</span>()?
  defer fs.<span class="hljs-title function_ invoke__">remove</span>(tmp)
  intent <span class="hljs-string">&quot;deploy della versione {versione} in produzione&quot;</span> {
    <span class="hljs-keyword">let</span> <span class="hljs-variable">r</span> = retry <span class="hljs-number">3</span>, delay: <span class="hljs-number">5</span>s {
      timeout <span class="hljs-number">60</span>s { shell.<span class="hljs-title function_ invoke__">exec</span>(<span class="hljs-string">&quot;kubectl apply -f manifest.yaml&quot;</span>) }
    }
    <span class="hljs-keyword">if</span> !r.ok { <span class="hljs-keyword">return</span> <span class="hljs-title function_ invoke__">Err</span>(<span class="hljs-title function_ invoke__">error</span>(<span class="hljs-string">&quot;deploy fallito dopo 3 tentativi&quot;</span>)) }
    <span class="hljs-title function_ invoke__">Ok</span>(())
  }
}

<span class="hljs-comment">// 2 — Loop di monitoraggio periodico.</span>
every <span class="hljs-number">5</span>m {
  <span class="hljs-keyword">let</span> <span class="hljs-variable">h</span> = http.<span class="hljs-title function_ invoke__">get</span>(<span class="hljs-string">&quot;https://api.acme.com/health&quot;</span>)
  <span class="hljs-keyword">if</span> !h.ok {
    audit.<span class="hljs-title function_ invoke__">event</span>(<span class="hljs-string">&quot;api.giu&quot;</span>, { stato: h.status, ora: clock.<span class="hljs-title function_ invoke__">now</span>() })
  }
}

<span class="hljs-comment">// 3 — Rotazione di un segreto con scopo dichiarato.</span>
<span class="hljs-keyword">fn</span> <span class="hljs-title function_">ruota_token</span>(cap: cap[fs.write_file @ [<span class="hljs-string">&quot;/etc/secrets/**&quot;</span>], audit.event]) <span class="hljs-punctuation">-&gt;</span> result&lt;unit&gt; {
  intent <span class="hljs-string">&quot;ruota il token API prima della scadenza a 30 giorni&quot;</span> {
    fs.<span class="hljs-title function_ invoke__">write_file</span>(<span class="hljs-string">&quot;/etc/secrets/api.token&quot;</span>, <span class="hljs-title function_ invoke__">genera_token</span>())?
    audit.<span class="hljs-title function_ invoke__">event</span>(<span class="hljs-string">&quot;token.ruotato&quot;</span>, { ora: clock.<span class="hljs-title function_ invoke__">now</span>() })
    <span class="hljs-title function_ invoke__">Ok</span>(())
  }
}
</code></pre>
</div>
<div class="column compact">
<p><strong>Tre automazioni operative minime, costruite con i costrutti già visti</strong></p>
<p><strong>1. Deploy con compensazione e ritentativi.</strong> Il blocco <code>intent</code> dichiara lo scopo della scrittura (obbligatorio in modalità rigida). La combinazione <code>retry 3, delay: 5s { timeout 60s { ... } }</code> ripete fino a tre volte la chiamata <code>kubectl apply</code>, abbandonando se ogni singolo tentativo supera il minuto. Il <code>defer</code> rimuove il file temporaneo su qualsiasi via d'uscita: ritorno normale, errore, propagazione con <code>?</code>. Niente <em>finally</em> da ricordare; la pulizia è dichiarata accanto alla creazione della risorsa.</p>
<p><strong>2. Loop di monitoraggio periodico.</strong> L'istruzione <code>every 5m { ... }</code> esegue il blocco ogni cinque minuti. Quando il health check fallisce, <code>audit.event</code> lascia traccia con il timestamp dell'orologio. Non serve uno scheduler esterno (<code>cron</code>, <code>systemd timer</code>, Airflow): il loop è parte del programma, e di conseguenza è osservabile nel file di traccia e rigiocabile con <code>aeris replay</code>.</p>
<p><strong>3. Rotazione di un segreto.</strong> L'unica scrittura della funzione è racchiusa in un <code>intent</code> con una descrizione che finisce in ogni evento della traccia. Una revisione che modifica la rotazione del segreto vede subito il <code>intent</code> come prima cosa.</p>
<blockquote>
<p>Tutti e tre i pattern lasciano traccia rigiocabile, anche quando l'esecuzione fallisce. È la stessa scelta di base che vale per <code>saga</code> e <code>agent_net</code>: niente automazione &quot;muta&quot; verso il mondo esterno.</p>
</blockquote>
</div>
</div>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="37" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-class="tight" data-theme="aeris" lang="C" class="tight" data-marpit-pagination="37" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--class:tight;--theme:aeris;" data-marpit-pagination-total="43">
<header>Presentazione tecnica · v0.3</header>

<h1 id="le-funzioni-del-modulo-ai">Le funzioni del modulo <code>ai</code></h1>
<div class="columns">
<div class="column">
<pre><code class="language-rust"><span class="hljs-comment">// Chiamata diretta al modello.</span>
<span class="hljs-keyword">let</span> <span class="hljs-variable">risposta</span> = ai.<span class="hljs-title function_ invoke__">complete</span>(<span class="hljs-string">&quot;Analizza: {log}&quot;</span>)

<span class="hljs-comment">// Scelta vincolata fra valori dichiarati.</span>
<span class="hljs-keyword">let</span> <span class="hljs-variable">azione</span> = ai.<span class="hljs-title function_ invoke__">decide</span>(
  prompt:  <span class="hljs-string">&quot;CPU al 95%. Cosa fare?&quot;</span>,
  choices: [<span class="hljs-string">&quot;scala_su&quot;</span>, <span class="hljs-string">&quot;riavvia&quot;</span>, <span class="hljs-string">&quot;avvisa&quot;</span>, <span class="hljs-string">&quot;ignora&quot;</span>],
  retries: <span class="hljs-number">3</span>,
)?

<span class="hljs-comment">// Conversazione multi-turno (compattazione auto a 40 msg).</span>
<span class="hljs-keyword">let</span> <span class="hljs-variable">s</span>        = ai.<span class="hljs-title function_ invoke__">session</span>(
  system: <span class="hljs-string">&quot;Sei un assistente per l&#x27;affidabilità.&quot;</span>,
  model:  <span class="hljs-string">&quot;claude-haiku-4-5&quot;</span>,
)
<span class="hljs-keyword">let</span> (s2, a)  = ai.<span class="hljs-title function_ invoke__">session_ask</span>(s,  <span class="hljs-string">&quot;Analizza: {log}&quot;</span>)
<span class="hljs-keyword">let</span> (s3, b)  = ai.<span class="hljs-title function_ invoke__">session_ask</span>(s2, <span class="hljs-string">&quot;Qual è la causa?&quot;</span>)

<span class="hljs-comment">// Chatbot su una cartella di documentazione.</span>
<span class="hljs-keyword">let</span> <span class="hljs-variable">chat</span> = ai.<span class="hljs-title function_ invoke__">chat</span>(
  <span class="hljs-string">&quot;Rispondi solo dalla base di conoscenza.&quot;</span>,
  <span class="hljs-string">&quot;./docs&quot;</span>,
)
io.<span class="hljs-title function_ invoke__">println</span>(<span class="hljs-string">&quot;{chat.kb_size()} file caricati&quot;</span>)
io.<span class="hljs-title function_ invoke__">println</span>(chat.<span class="hljs-title function_ invoke__">ask</span>(<span class="hljs-string">&quot;come funzionano le capability?&quot;</span>))

<span class="hljs-comment">// Contatori dell&#x27;intero processo.</span>
<span class="hljs-keyword">let</span> <span class="hljs-variable">u</span> = ai.<span class="hljs-title function_ invoke__">usage</span>()
io.<span class="hljs-title function_ invoke__">println</span>(<span class="hljs-string">&quot;speso ${u.cost_usd} in {u.calls} chiamate&quot;</span>)
</code></pre>
</div>
<div class="column compact">
<p><strong>Sei funzioni per i casi d'uso più frequenti</strong></p>
<ul>
<li><strong><code>ai.complete(prompt)</code></strong> — invio diretto al modello. È la primitiva su cui poggiano le altre funzioni.</li>
<li><strong><code>ai.decide(prompt, choices, retries?)</code></strong> — scelta vincolata. La risposta deve cadere in <code>choices</code>; in caso contrario il runtime ritenta, poi produce <code>Err(err.llm(...))</code>.</li>
<li><strong><code>ai.session</code> / <code>ai.session_ask</code></strong> — conversazione multi-turno. Oltre i quaranta messaggi la cronologia viene compattata al riassunto degli ultimi venti.</li>
<li><strong><code>ai.chat(system, dir)</code></strong> — chatbot su una cartella di documenti (markdown, testo, yaml). Restituisce un valore con <code>.ask(p)</code> e <code>.kb_size()</code>.</li>
<li><strong><code>ai.usage()</code></strong> — contatori di processo: token, costo, chiamate.</li>
<li><strong><code>ai.network(max_rounds)</code></strong> — costruttore programmatico di una rete di agenti.</li>
</ul>
<p><strong>Backend configurabile, nessuna libreria collegata</strong></p>
<p>Il modello si raggiunge in due modi, scelti nel manifesto <code>aeris.toml [ai.backend]</code>: chiamata HTTP a un'API compatibile con il protocollo OpenAI, oppure invocazione di un sottoprocesso (<code>claude --print</code>, <code>ollama run</code>, <code>llm</code>).</p>
<blockquote>
<p>Ogni chiamata <code>ai.*</code> genera nel file di traccia un evento <code>ai_call</code> con prompt, modello, risposta e numero di token. <code>aeris replay</code> la rigioca offline.</p>
</blockquote>
</div>
</div>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>

<header>Presentazione tecnica · v0.3</header>

<h1 id="test-integrati-nel-linguaggio">Test integrati nel linguaggio</h1>
<div class="columns">
<div class="column">
<pre><code class="language-rust"><span class="hljs-comment">// In Aeris i test stanno in un qualsiasi file `.aer`: il file</span>
<span class="hljs-comment">// è l&#x27;unità di raggruppamento, non c&#x27;è una parola chiave `suite`.</span>

test <span class="hljs-string">&quot;addizione commutativa&quot;</span> {
  assert <span class="hljs-number">2</span> + <span class="hljs-number">3</span> == <span class="hljs-number">3</span> + <span class="hljs-number">2</span>
}

test <span class="hljs-string">&quot;GET /health restituisce 200&quot;</span> {
  <span class="hljs-keyword">let</span> <span class="hljs-variable">resp</span> = http.<span class="hljs-title function_ invoke__">get</span>(<span class="hljs-string">&quot;https://api.acme.com/health&quot;</span>)
  <span class="hljs-title function_ invoke__">assert_status</span>(resp, <span class="hljs-number">200</span>)
  <span class="hljs-title function_ invoke__">assert_json</span>(resp.body, [<span class="hljs-string">&quot;stato&quot;</span>, <span class="hljs-string">&quot;versione&quot;</span>])
}

test <span class="hljs-string">&quot;il riassunto del modello è fedele al testo&quot;</span> {
  <span class="hljs-keyword">let</span> <span class="hljs-variable">testo</span> = <span class="hljs-string">&quot;I costi del Q3 sono cresciuti del 12%, &quot;</span>
            + <span class="hljs-string">&quot;principalmente per il rincaro dell&#x27;energia.&quot;</span>
  <span class="hljs-keyword">let</span> <span class="hljs-variable">riassunto</span> = ai.<span class="hljs-title function_ invoke__">complete</span>(<span class="hljs-string">&quot;Riassumi in una riga: {testo}&quot;</span>)
  <span class="hljs-title function_ invoke__">assert_semantic</span>(
    riassunto,
    <span class="hljs-string">&quot;il riassunto contiene il numero 12% e cita l&#x27;energia&quot;</span>,
  )
}
</code></pre>
</div>
<div class="column compact">
<p><strong>I test sono blocchi di prima classe</strong></p>
<p>Aeris non integra una libreria di test esterna. Si scrive un blocco <code>test &quot;nome&quot; { ... }</code> in un file <code>.aer</code> qualunque, e si lancia il file con <code>aeris test programma.aer</code>. Ogni blocco gira in isolamento: un fallimento ferma quel test, gli altri proseguono. Non esiste una parola chiave <code>suite</code>; l'unità di raggruppamento è <strong>il file</strong> stesso.</p>
<p><strong>Quattro asserzioni built-in coprono i casi comuni</strong></p>
<ul>
<li><code>assert e</code> — fallisce se l'espressione booleana è falsa. La forma estesa <code>assert e, &quot;messaggio&quot;</code> aggiunge contesto al fallimento.</li>
<li><code>assert_status(resp, codice)</code> — passa solo se la risposta HTTP ha lo <code>status</code> indicato.</li>
<li><code>assert_json(testo, [chiavi])</code> — passa se la stringa si decodifica come JSON valido e contiene tutte le chiavi elencate.</li>
<li><code>assert_semantic(valore, criterio)</code> — usa il modello configurato come <strong>giudice</strong>: gli chiede se <code>valore</code> soddisfa il criterio con risposta binaria, e fallisce sul &quot;no&quot;.</li>
</ul>
<blockquote>
<p>Il modello come strumento di asserzione è ciò che permette di scrivere test <em>qualitativi</em> — &quot;il riassunto è fedele all'originale&quot;, &quot;il messaggio di errore è chiaro&quot; — quello che una asserzione numerica non riesce a formulare. La chiamata del giudice viene registrata nella traccia come ogni altra chiamata AI, quindi <code>aeris replay</code> rigioca anche i test.</p>
</blockquote>
</div>
</div>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="39" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-theme="aeris" lang="C" data-marpit-pagination="39" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--theme:aeris;" data-marpit-pagination-total="43">
<header>Presentazione tecnica · v0.3</header>
<h1 id="tre-modalit%C3%A0-di-disciplina-una-sola-grammatica">Tre modalità di disciplina, una sola grammatica</h1>
<p>La tesi del linguaggio fissa la disciplina alla sua forma più rigorosa; in pratica, non tutti i progetti vogliono pagarne il costo <em>da subito</em>. Il file di progetto può scegliere fra tre modalità di applicazione, tutte basate sulla stessa grammatica.</p>
<table>
<thead>
<tr>
<th>Modalità</th>
<th>Predefinita per <code>aeris init</code></th>
<th>Cosa succede</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>enforce = &quot;off&quot;</code></td>
<td><strong>sì</strong> (v0.3)</td>
<td>I permessi vengono sintetizzati come &quot;tutto consentito&quot; e passati a <code>main</code>. Il controllore statico ignora le verifiche di capability, <code>intent</code> e <code>saga</code>; nessun controllo di lista bianca a runtime.</td>
</tr>
<tr>
<td><code>enforce = &quot;loose&quot;</code></td>
<td>—</td>
<td>I permessi elencati nel manifesto fanno da limite massimo a runtime. Le funzioni <em>senza</em> parametro <code>cap</code> restano ammesse; quelle <em>con</em> parametro <code>cap</code> vengono controllate normalmente dal compilatore.</td>
</tr>
<tr>
<td><code>enforce = &quot;strict&quot;</code></td>
<td>—</td>
<td>Disciplina piena: <code>cap</code> obbligatorio sulle funzioni con effetti, <code>intent</code> obbligatorio sulle scritture, <code>cap[*]</code> rifiutato nel codice utente, file di blocco sulle firme <code>pub</code> controllato in revisione.</td>
</tr>
</tbody>
</table>
<p><strong>Cosa resta attivo in tutte e tre le modalità</strong></p>
<ul>
<li>La scrittura del file di traccia non si può disattivare.</li>
<li><code>aeris replay</code> produce esecuzioni identiche byte per byte sulla parte deterministica.</li>
<li>Gli schemi <code>model@vN</code> vengono validati a ogni confine di fiducia.</li>
<li>Le <code>policy</code> vengono valutate a runtime su ogni chiamata che combacia con il loro <code>match:</code>.</li>
</ul>
<blockquote>
<p>La modalità di applicazione regola solo il <strong>controllo statico</strong>, non la <strong>registrazione a runtime</strong>. Un progetto può salire dalla modalità <code>off</code> alla modalità <code>strict</code> <em>senza riscrivere il codice esistente</em> — basta aggiungere progressivamente le annotazioni (<code>cap</code>, <code>intent</code>) là dove vanno.</p>
</blockquote>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="40" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-class="tight" data-theme="aeris" lang="C" class="tight" data-marpit-pagination="40" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--class:tight;--theme:aeris;" data-marpit-pagination-total="43">
<header>Presentazione tecnica · v0.3</header>

<h1 id="esempio-completo--triage-di-un-sistema-sre-1-di-2">Esempio completo — triage di un sistema SRE (1 di 2)</h1>
<div class="columns">
<div class="column">
<pre><code class="language-rust"><span class="hljs-comment">// Schemi versionati validati ai confini di fiducia.</span>
model Allarme@v1  { id: uuid, servizio: string, messaggio: string }
model PianoFix@v1 { comandi: list&lt;string&gt;, rollback: list&lt;string&gt;, spiegazione: string }
model Diagnosi@v1 {
  severita: string  <span class="hljs-keyword">where</span> [<span class="hljs-string">&quot;critica&quot;</span>,<span class="hljs-string">&quot;alta&quot;</span>,<span class="hljs-string">&quot;media&quot;</span>,<span class="hljs-string">&quot;bassa&quot;</span>].<span class="hljs-title function_ invoke__">contains</span>(severita)
  tipo:     string  <span class="hljs-keyword">where</span> [<span class="hljs-string">&quot;database&quot;</span>,<span class="hljs-string">&quot;api&quot;</span>,<span class="hljs-string">&quot;infrastruttura&quot;</span>].<span class="hljs-title function_ invoke__">contains</span>(tipo)
  fiducia:  <span class="hljs-type">f64</span>     <span class="hljs-keyword">where</span> fiducia &gt;= <span class="hljs-number">0.0</span> and fiducia &lt;= <span class="hljs-number">1.0</span>
}

agent classifica {
  llm:     <span class="hljs-string">&quot;claude-haiku-4-5&quot;</span>
  intent:  <span class="hljs-string">&quot;classifica per severità, tipo, fiducia&quot;</span>
  accept:  Allarme@v1
  produce: Diagnosi@v1
  prompt:  <span class="hljs-string">&quot;Classifica: {input.messaggio} su {input.servizio}.&quot;</span>
}

agent pianifica {
  llm:     <span class="hljs-string">&quot;claude-opus-4-7&quot;</span>
  intent:  <span class="hljs-string">&quot;propone un fix concreto e il rollback corrispondente&quot;</span>
  accept:  Diagnosi@v1
  produce: PianoFix@v1
  prompt:  <span class="hljs-string">&quot;Fix per allarme {input.severita} di tipo {input.tipo}.&quot;</span>
}

agent_net triage {
  flow classifica <span class="hljs-punctuation">-&gt;</span> pianifica
  until: classifica.fiducia &gt; <span class="hljs-number">0.85</span> or iterations &gt;= <span class="hljs-number">3</span>
}
</code></pre>
</div>
<div class="column compact">
<p><strong>La parte AI: una rete di agenti tipizzata</strong></p>
<p>L'intera pipeline di triage degli allarmi è scritta come <code>agent_net</code>. Ogni agente dichiara lo schema dell'<strong>ingresso</strong> (<code>accept</code>) e dello <strong>uscita</strong> (<code>produce</code>) come <code>model@vN</code>, validati ad ogni invocazione.</p>
<p>Il passaggio fra agenti è risolto dal runtime per <strong>combaciamento dei tipi</strong>: l'uscita di <code>classifica</code> è una <code>Diagnosi@v1</code>, e <code>pianifica</code> la accetta. Non esiste un prompt-string di coordinamento scritto a mano; il protocollo di scambio è parte del programma.</p>
<p>Il sistema dei tipi taglia le hallucination del modello: una risposta che non rispetta lo schema diventa <code>Err(err.schema(...))</code> e l'agente la ritenta entro il budget <code>retries</code>.</p>
<p>La clausola <code>until:</code> stabilisce un limite massimo alla convergenza: niente loop infiniti. La rete restituisce il valore prodotto dall'ultimo nodo terminale, oppure <code>Err(err.user(&quot;rete agenti esaurita&quot;))</code> quando il limite di iterazioni viene raggiunto senza che il criterio di convergenza sia soddisfatto.</p>
<blockquote>
<p>Niente stringhe di prompt per smistare i messaggi, niente parsing manuale del JSON di risposta, niente ritentativi cuciti a mano. Tutto questo è infrastruttura del linguaggio.</p>
</blockquote>
</div>
</div>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="41" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-class="tight" data-theme="aeris" lang="C" class="tight" data-marpit-pagination="41" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--class:tight;--theme:aeris;" data-marpit-pagination-total="43">
<header>Presentazione tecnica · v0.3</header>

<h1 id="esempio-completo--triage-di-un-sistema-sre-2-di-2">Esempio completo — triage di un sistema SRE (2 di 2)</h1>
<div class="columns">
<div class="column">
<pre><code class="language-rust">policy egress_produzione {
  <span class="hljs-keyword">match</span>: http.*
  deny:  url.host not <span class="hljs-keyword">in</span> [<span class="hljs-string">&quot;api.acme.com&quot;</span>, <span class="hljs-string">&quot;slack.com&quot;</span>]
}

saga <span class="hljs-title function_ invoke__">applica_fix</span>(fix: PianoFix@v1, allarme: Allarme@v1,
                 cap: cap[shell.exec @ [<span class="hljs-string">&quot;kubectl&quot;</span>], http.post @ [<span class="hljs-string">&quot;slack.com&quot;</span>]]) {
  intent <span class="hljs-string">&quot;applica fix per allarme {allarme.id}&quot;</span>
  step snapshot {
    <span class="hljs-keyword">do</span>   { shell.<span class="hljs-title function_ invoke__">exec</span>(<span class="hljs-string">&quot;kubectl get all -n prod &gt; /tmp/{allarme.id}.yaml&quot;</span>) }
    undo { shell.<span class="hljs-title function_ invoke__">exec</span>(<span class="hljs-string">&quot;rm -f /tmp/{allarme.id}.yaml&quot;</span>) }
  }
  step applica {
    requires: snapshot.ok
    <span class="hljs-keyword">do</span>   { <span class="hljs-keyword">for</span> <span class="hljs-variable">c</span> <span class="hljs-keyword">in</span> fix.comandi  { shell.<span class="hljs-title function_ invoke__">exec</span>(c)? } }
    undo { <span class="hljs-keyword">for</span> <span class="hljs-variable">c</span> <span class="hljs-keyword">in</span> fix.rollback { shell.<span class="hljs-title function_ invoke__">exec</span>(c)? } }
  }
  step notifica {
    requires: applica.ok
    <span class="hljs-keyword">do</span>   { http.<span class="hljs-title function_ invoke__">post</span>(<span class="hljs-string">&quot;https://slack.com/hook&quot;</span>, { text: <span class="hljs-string">&quot;ok&quot;</span> })? }
    undo { http.<span class="hljs-title function_ invoke__">post</span>(<span class="hljs-string">&quot;https://slack.com/hook&quot;</span>, { text: <span class="hljs-string">&quot;rollback&quot;</span> })? }
  }
}

every <span class="hljs-number">30</span>s {
  <span class="hljs-keyword">let</span> <span class="hljs-variable">allarmi</span> = json.decode&lt;list&lt;Allarme@v1&gt;&gt;(http.<span class="hljs-title function_ invoke__">get</span>(<span class="hljs-string">&quot;https://alertmanager&quot;</span>)?.body)?
  <span class="hljs-keyword">for</span> <span class="hljs-variable">a</span> <span class="hljs-keyword">in</span> allarmi { <span class="hljs-title function_ invoke__">applica_fix</span>(<span class="hljs-title function_ invoke__">triage</span>(a)?, a, cap.subset[shell.exec, http.post])? }
}
</code></pre>
</div>
<div class="column compact">
<p><strong>La parte operativa: <code>saga</code>, <code>policy</code>, scheduler insieme</strong></p>
<p>La <code>saga applica_fix</code> salva una fotografia del cluster, applica il fix, notifica Slack. Se uno step intermedio fallisce, il runtime esegue gli <code>undo</code> dei passi già completati in ordine inverso: niente stato a metà strada.</p>
<p>La <code>policy egress_produzione</code> viene valutata su ogni chiamata <code>http.*</code>. Una richiesta verso un host fuori lista bianca finisce in <code>PolicyViolation</code>, con evento nel file di traccia.</p>
<p>Lo scheduler <code>every 30s</code> chiude il giro: scarica gli allarmi, lancia la rete di agenti <code>triage</code> per ottenere un <code>PianoFix@v1</code>, e invoca la saga con una capability ridotta da <code>cap.subset[...]</code> — il principio del <em>minimo privilegio</em> applicato per chiamata.</p>
<blockquote>
<p>Un solo file, una sola grammatica. Quello che oggi richiede LangChain, Argo, OPA e script bash messi insieme, qui sta in poco più di cento righe — eseguibile, controllabile in audit, riproducibile offline.</p>
</blockquote>
</div>
</div>
<footer>Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 2560 1600"><foreignObject width="2560" height="1600"><section id="42" data-paginate="true" data-header="Presentazione tecnica · v0.3" data-footer="Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance" data-theme="aeris" lang="C" data-marpit-pagination="42" style="--paginate:true;--header:Presentazione tecnica · v0.3;--footer:Aeris v0.3 · linguaggio interpretato per operazioni, intelligenza artificiale e governance;--theme:aeris;" data-marpit-pagination-total="43">
<header>Presentazione tecnica · v0.3</header>
<h1 id="stato-dello-sviluppo">Stato dello sviluppo</h1>
<table>
<thead>
<tr>
<th>Versione</th>
<th>Cosa contiene</th>
<th>Stato</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>v0.1</strong></td>
<td>Prototipo esplorativo: funzioni di intelligenza artificiale di base, gestori di rete e file, recupero locale dagli errori. <strong>Non</strong> ha ancora capability tipizzate, blocco <code>intent</code> obbligatorio, replay deterministico.</td>
<td>precedente</td>
</tr>
<tr>
<td><strong>v0.2</strong></td>
<td>Le fondamenta: lexer, parser, interprete, file di traccia, supporto a <code>http</code>, <code>saga</code>, file di progetto, <code>model@vN</code>.</td>
<td>completata</td>
</tr>
<tr>
<td></td>
<td>Aggiunte: funzioni <code>ai.*</code>, replay deterministico, <code>agent_net</code>, gestori dei livelli più alti, comandi <code>aeris test</code> e <code>aeris fmt</code>, diagnostica, impacchettamento, modalità prototipo.</td>
<td>completata</td>
</tr>
<tr>
<td><strong>v0.3</strong></td>
<td>Le tre modalità di applicazione (<code>enforce = &quot;off&quot; / &quot;loose&quot; / &quot;strict&quot;</code>) e la superficie da scripting (<code>loop</code>, <code>??</code>, libreria standard più ricca, metodi sui tipi base, codifica naturale di JSON).</td>
<td>completata</td>
</tr>
<tr>
<td></td>
<td>Interpolazione delle stringhe <code>&quot;{x}&quot;</code>, recupero locale dagli errori (<code>catch</code>/<code>error</code>/<code>defer</code>), costrutti temporali (<code>every</code>/<code>retry</code>/<code>timeout</code>/<code>clock.sleep</code>), versioning di schemi con <code>model X@v2 extends X@v1</code>.</td>
<td>completata</td>
</tr>
<tr>
<td></td>
<td>Funzioni AI di livello più alto (<code>ai.session</code>, <code>ai.decide</code>, <code>ai.usage</code>, <code>ai.chat(system, dir)</code>); strumenti di test (<code>assert_status</code>, <code>assert_json</code>, <code>assert_semantic</code>).</td>
<td>parzialmente</td>
</tr>
<tr>
<td></td>
<td>Server TCP/HTTP di basso livello (M20) e parità completa con la libreria v0.1 (M22).</td>
<td>rimandate</td>
</tr>
</tbody>
</table>
<blockquote>
<p>Eseguibile sotto gli 8 MB una volta strippato. Interprete a visita d'albero, nessuna dipendenza esterna a runtime.<br />
Le voci rimandate richiedono un runtime asincrono o librerie esterne, scelte fuori dallo scopo di v0.3.</p>
</blockquote>
