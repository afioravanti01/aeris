name: release

# M14.T1 / M14.T2 / M14.T6 — produce stripped static binaries for the
# five release targets, package them as tarballs with checksums, and
# attach the artifacts to the `v0.2.0` (or any `v*`) tag.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: musl
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: musl
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: native
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: native
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: native
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools (Linux)
        if: matrix.cross == 'musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          RUSTFLAGS: ${{ matrix.target == 'aarch64-unknown-linux-musl' && '-C linker=aarch64-linux-gnu-gcc' || '' }}
      - name: Verify binary size (Linux x86_64 only)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          size=$(stat -c%s target/${{ matrix.target }}/release/aeris)
          echo "binary size: $size bytes"
          test "$size" -lt $((8 * 1024 * 1024))
      - name: Package
        shell: bash
        run: |
          name="aeris-${GITHUB_REF_NAME:-dev}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp "target/${{ matrix.target }}/release/aeris.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/aeris" "dist/$name/"
          fi
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          cd dist
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            7z a "$name.zip" "$name"
            sha256sum "$name.zip" > "$name.zip.sha256" || shasum -a 256 "$name.zip" > "$name.zip.sha256"
          else
            tar -czf "$name.tar.gz" "$name"
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: aeris-${{ matrix.target }}
          path: dist/aeris-*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten artifacts
        run: |
          mkdir -p flat
          find dist -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' \) -exec cp {} flat/ \;
      - name: Import GPG key (optional)
        if: ${{ secrets.GPG_PRIVATE_KEY != '' }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          for f in flat/*.tar.gz flat/*.zip; do
            [ -f "$f" ] || continue
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
                --detach-sign --armor "$f"
          done
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            flat/*.tar.gz
            flat/*.zip
            flat/*.sha256
            flat/*.asc
