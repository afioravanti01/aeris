[project]
name  = "docker-deploy"
aeris = "0.3.0"

[caps]
enforce = "off"

# This demo drives a live docker daemon. The container lifecycle
# (build / rm / run / stop) goes through `shell.exec` because the
# docker.run L1 op is hardwired to `docker run --rm`; the verify gate
# uses the `docker.inspect` L2 backend, which must be "real" to read
# the actual container. `aeris run ./main.aer` builds the images
# itself (the first run pulls alpine:3.20).
[l2.docker]
backend = "real"

# Audit defaults to "real"; it writes to `<output_dir>/audit.jsonl`
# (M41), so the undeploy compensation is observable without an
# override.

# The AI postmortem uses the local Claude CLI as the LLM backend.
# Swap to `kind = "http"` with url/auth to call the API directly.
[ai.backend]
kind = "cli"
cmd  = "claude --print --dangerously-skip-permissions --no-session-persistence --effort low --output-format text --model claude-sonnet-4-6"
