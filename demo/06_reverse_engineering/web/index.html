<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Project Documentation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --nav-h: 56px;
      --sidebar-w: 220px;
      --accent: #6366f1;
      --accent-dark: #4f46e5;
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --code-bg: #f1f5f9;
    }

    html { scroll-behavior: auto; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); }

    /* ── Top nav ─────────────────────────────────────────────────────── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; height: var(--nav-h);
      background: var(--surface); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 1.5rem; gap: 1.5rem;
      z-index: 100; backdrop-filter: blur(8px);
    }
    .nav-logo { font-weight: 700; font-size: .9rem; color: var(--text); display: flex; align-items: center; gap: .5rem; }
    .nav-logo span { color: var(--accent); }
    .nav-tabs { display: flex; gap: .25rem; margin-left: 1rem; }
    .nav-tab {
      padding: .35rem .9rem; border-radius: 6px; font-size: .82rem; font-weight: 500;
      color: var(--text-muted); border: none; background: none; cursor: pointer; transition: all .15s;
    }
    .nav-tab:hover { background: var(--bg); color: var(--text); }
    .nav-tab.active { background: var(--accent); color: #fff; }

    /* ── Layout ──────────────────────────────────────────────────────── */
    .layout { display: flex; padding-top: var(--nav-h); min-height: 100vh; }

    /* ── Sidebar ─────────────────────────────────────────────────────── */
    .sidebar {
      width: var(--sidebar-w); flex-shrink: 0;
      position: sticky; top: var(--nav-h); height: calc(100vh - var(--nav-h));
      overflow-y: auto; padding: 1.5rem 1rem;
      border-right: 1px solid var(--border); background: var(--surface);
    }
    .sidebar-title { font-size: .7rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: .75rem; padding: 0 .5rem; }
    .toc-link {
      display: block; padding: .3rem .75rem; border-radius: 6px;
      font-size: .78rem; color: var(--text-muted); text-decoration: none;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: all .15s; cursor: pointer; border: none; background: none; width: 100%; text-align: left;
    }
    .toc-link:hover { background: var(--bg); color: var(--text); }
    .toc-link.h1 { font-weight: 600; color: var(--text); margin-top: .25rem; }
    .toc-link.h2 { padding-left: 1.25rem; }
    .toc-link.h3 { padding-left: 2rem; font-size: .74rem; }

    /* ── Content ─────────────────────────────────────────────────────── */
    .content { flex: 1; min-width: 0; padding: 2.5rem 3rem 6rem; max-width: 820px; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── Markdown rendering ───────────────────────────────────────────── */
    .doc { line-height: 1.75; }
    .doc h1 { font-size: 1.75rem; font-weight: 700; margin: 0 0 1.25rem; scroll-margin-top: calc(var(--nav-h) + 1.5rem); }
    .doc h2 { font-size: 1.2rem; font-weight: 600; margin: 2.25rem 0 .75rem; padding-bottom: .5rem; border-bottom: 1px solid var(--border); scroll-margin-top: calc(var(--nav-h) + 1.5rem); }
    .doc h3 { font-size: 1rem; font-weight: 600; margin: 1.5rem 0 .5rem; color: #334155; scroll-margin-top: calc(var(--nav-h) + 1.5rem); }
    .doc p  { margin-bottom: 1rem; color: #374151; }
    .doc ul, .doc ol { padding-left: 1.5rem; margin-bottom: 1rem; }
    .doc li { margin-bottom: .35rem; color: #374151; }
    .doc strong { font-weight: 600; color: var(--text); }
    .doc a  { color: var(--accent); text-decoration: none; }
    .doc a:hover { text-decoration: underline; }
    .doc code { font-family: 'JetBrains Mono', monospace; font-size: .8em; background: var(--code-bg); padding: .15em .4em; border-radius: 4px; }
    .doc pre  { background: #0f172a; border-radius: 10px; padding: 1.25rem; overflow-x: auto; margin-bottom: 1.25rem; }
    .doc pre code { background: none; color: #7dd3fc; font-size: .82rem; padding: 0; }
    .doc table { width: 100%; border-collapse: collapse; font-size: .88rem; margin-bottom: 1.25rem; }
    .doc th { background: var(--code-bg); padding: .55rem 1rem; border: 1px solid var(--border); font-weight: 600; text-align: left; }
    .doc td { padding: .55rem 1rem; border: 1px solid var(--border); color: #374151; }
    .doc blockquote { border-left: 3px solid var(--accent); background: #eef2ff; padding: .75rem 1.25rem; border-radius: 0 8px 8px 0; margin-bottom: 1rem; color: #3730a3; }

    /* ── Chat tab (full-screen) ──────────────────────────────────────── */
    .chat-tab-panel {
      display: none !important; flex-direction: column;
      height: calc(100vh - var(--nav-h));
      padding: 0 !important;
      background: #f0f2f8;
    }
    .chat-tab-panel.active { display: flex !important; }

    .chat-header {
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 60%, #4c1d95 100%);
      padding: 1rem 2rem;
      display: flex; align-items: center; gap: .75rem; flex-shrink: 0;
      box-shadow: 0 2px 12px rgba(0,0,0,.18);
    }
    .chat-header-dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: #34d399; box-shadow: 0 0 6px #34d399;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
    .chat-header-title { color: #e0e7ff; font-size: .92rem; font-weight: 600; flex: 1; letter-spacing: .01em; }
    .chat-header-sub { color: #a5b4fc; font-size: .75rem; }

    .chat-messages {
      flex: 1; overflow-y: auto;
      display: flex; flex-direction: column; gap: 0;
      background: #f0f2f8;
      padding: 2rem 0;
    }
    .chat-messages-inner {
      width: 100%; max-width: 1100px; margin: 0 auto;
      padding: 0 2.5rem;
      display: flex; flex-direction: column; gap: 1rem;
    }

    .chat-msg { display: flex; align-items: flex-end; gap: .6rem; }
    .chat-msg.user { justify-content: flex-end; }
    .chat-msg.bot  { justify-content: flex-start; }

    .chat-avatar {
      width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: .75rem; font-weight: 700; letter-spacing: -.01em;
    }
    .chat-msg.bot .chat-avatar {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff; box-shadow: 0 2px 8px rgba(99,102,241,.35);
    }

    .chat-bubble {
      max-width: 78%; padding: .75rem 1.1rem; border-radius: 18px;
      font-size: .875rem; line-height: 1.65;
    }
    .chat-msg.user .chat-bubble {
      background: linear-gradient(135deg, #6366f1 0%, #7c3aed 100%);
      color: #fff; border-radius: 18px 18px 4px 18px;
      box-shadow: 0 4px 14px rgba(99,102,241,.35);
    }
    .chat-msg.bot .chat-bubble {
      background: #ffffff; color: #1e293b;
      border-radius: 18px 18px 18px 4px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    /* Chat markdown */
    .chat-bubble p  { margin-bottom: .4rem; font-size: .875rem; }
    .chat-bubble p:last-child { margin-bottom: 0; }
    .chat-bubble ul, .chat-bubble ol { padding-left: 1.2rem; margin-bottom: .4rem; font-size: .875rem; }
    .chat-bubble li { margin-bottom: .18rem; }
    .chat-bubble code {
      font-family: 'JetBrains Mono', monospace; font-size: .76rem;
      background: rgba(99,102,241,.1); color: #4f46e5;
      padding: .12em .4em; border-radius: 4px;
    }
    .chat-bubble pre {
      background: #1e1b4b; padding: .65rem .9rem;
      border-radius: 8px; margin: .5rem 0; overflow-x: auto;
    }
    .chat-bubble pre code { background: none; color: #a5f3fc; font-size: .77rem; }
    .chat-bubble h1,.chat-bubble h2,.chat-bubble h3 { font-size: .9rem; font-weight: 600; margin: .3rem 0 .2rem; }
    .chat-bubble table { width: 100%; border-collapse: collapse; font-size: .82rem; margin: .5rem 0; border-radius: 8px; overflow: hidden; }
    .chat-bubble th { background: #eef2ff; color: #3730a3; padding: .45rem .8rem; border: 1px solid #c7d2fe; font-weight: 600; text-align: left; }
    .chat-bubble td { padding: .4rem .8rem; border: 1px solid #e0e7ff; color: #1e293b; }
    .chat-bubble tr:nth-child(even) td { background: #f5f3ff; }
    .chat-msg.user .chat-bubble th { background: rgba(255,255,255,.2); color: #e0e7ff; border-color: rgba(255,255,255,.25); }
    .chat-msg.user .chat-bubble td { border-color: rgba(255,255,255,.2); color: #e0e7ff; }
    .chat-msg.user .chat-bubble tr:nth-child(even) td { background: rgba(255,255,255,.08); }
    .chat-msg.user .chat-bubble code { background: rgba(255,255,255,.2); color: #e0e7ff; }
    .chat-msg.user .chat-bubble pre  { background: rgba(0,0,0,.25); }
    .chat-msg.user .chat-bubble pre code { color: #c7d2fe; }

    .chat-typing-wrap {
      width: 100%; max-width: 1100px; margin: 0 auto;
      padding: .35rem 2rem; display: none; flex-shrink: 0;
    }
    .chat-typing {
      display: inline-flex; align-items: center; gap: .35rem;
      padding: .5rem .9rem; border-radius: 14px;
      background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.07);
      font-size: .75rem; color: #7c3aed; font-style: italic;
    }

    .chat-input-wrap {
      flex-shrink: 0; padding: 1rem 0 1.25rem;
      background: #f0f2f8;
    }
    .chat-input-row {
      width: 100%; max-width: 1100px; margin: 0 auto;
      padding: 0 2.5rem;
      display: flex; gap: .75rem; align-items: center;
    }
    .chat-input {
      flex: 1; font-size: .9rem; border: 1.5px solid #c7d2fe;
      border-radius: 14px; padding: .7rem 1.1rem;
      outline: none; font-family: inherit;
      background: #fff; color: #1e293b;
      box-shadow: 0 2px 8px rgba(99,102,241,.08);
      transition: border-color .18s, box-shadow .18s;
    }
    .chat-input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,.15), 0 2px 8px rgba(99,102,241,.1);
    }
    .chat-input::placeholder { color: #94a3b8; }
    .chat-send {
      background: linear-gradient(135deg, #6366f1, #7c3aed);
      color: #fff; border: none; border-radius: 14px;
      padding: .7rem 1.4rem; font-size: .88rem; font-weight: 600; cursor: pointer;
      font-family: inherit; box-shadow: 0 4px 12px rgba(99,102,241,.35);
      transition: opacity .15s, transform .1s;
    }
    .chat-send:hover { opacity: .9; transform: translateY(-1px); }
    .chat-send:active { transform: translateY(0); }
  </style>
</head>
<body>

  <!-- Top nav -->
  <nav>
    <div class="nav-logo"><span>◆</span> Project Docs</div>
    <div class="nav-tabs">
      <button class="nav-tab active" onclick="showTab('requirements')" id="nav-requirements">Requirements</button>
      <button class="nav-tab" onclick="showTab('architecture')"  id="nav-architecture">Architecture</button>
      <button class="nav-tab" onclick="showTab('improvements')"  id="nav-improvements">Improvements</button>
      <button class="nav-tab" onclick="showTab('chat')"          id="nav-chat">Chat</button>
    </div>
  </nav>

  <div class="layout">

    <!-- Sidebar TOC -->
    <aside class="sidebar">
      <div class="sidebar-title">On this page</div>
      <div id="toc"></div>
    </aside>

    <!-- Content -->
    <div class="content">
      <div id="requirements" class="tab-panel active doc"></div>
      <div id="architecture"  class="tab-panel doc"></div>
      <div id="improvements"  class="tab-panel doc"></div>
      <div id="chat"          class="tab-panel chat-tab-panel"></div>
    </div>
  </div>

  <script>
    // All API calls go to the same origin (backend on port 8080).
    const CHAT_API = '/api/chat'
    const DOCS_API = '/api/docs'
    const NAV_H    = 56
    const SECTIONS = ['requirements', 'architecture', 'improvements', 'chat']
    let   activeTab = 'requirements'

    // ── Tabs ─────────────────────────────────────────────────────────
    function showTab(name) {
      SECTIONS.forEach(s => {
        document.getElementById(s).classList.toggle('active', s === name)
        document.getElementById('nav-' + s).classList.toggle('active', s === name)
      })
      activeTab = name
      if (name === 'chat') {
        document.getElementById('toc').innerHTML = ''
        document.querySelector('.sidebar').style.display = 'none'
        document.querySelector('.content').style.maxWidth = '100%'
        document.querySelector('.content').style.padding = '0'
      } else {
        document.querySelector('.sidebar').style.display = ''
        document.querySelector('.content').style.maxWidth = ''
        document.querySelector('.content').style.padding = ''
        buildToc()
      }
      window.scrollTo({ top: 0 })
    }

    // ── Build TOC from visible headings ───────────────────────────────
    function buildToc() {
      const panel = document.getElementById(activeTab)
      const headings = panel.querySelectorAll('h1,h2,h3')
      const toc = document.getElementById('toc')
      toc.innerHTML = ''
      headings.forEach(h => {
        if (!h.id) h.id = h.textContent.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')
        const btn = document.createElement('button')
        btn.className = 'toc-link ' + h.tagName.toLowerCase()
        btn.textContent = h.textContent
        btn.onclick = () => scrollToHeading(h)
        toc.appendChild(btn)
      })
    }

    // ── Scroll to heading accounting for fixed nav ────────────────────
    function getAbsoluteTop(el) {
      let top = 0, node = el
      while (node) { top += node.offsetTop; node = node.offsetParent }
      return top
    }
    function scrollToHeading(el) {
      window.scrollTo({ top: getAbsoluteTop(el) - NAV_H - 20, behavior: 'smooth' })
    }

    // ── Intercept all anchor clicks inside docs ───────────────────────
    document.addEventListener('click', e => {
      const a = e.target.closest('.doc a[href^="#"]')
      if (!a) return
      e.preventDefault()
      const target = document.getElementById(a.getAttribute('href').slice(1))
      if (target) scrollToHeading(target)
    })

    // ── Load markdown docs from backend (fetched from MinIO) ──────────
    async function loadDocs() {
      // 1. Ask backend which docs are available in MinIO
      let availableKeys = []
      try {
        const res = await fetch(DOCS_API)
        if (res.ok) availableKeys = await res.json()
      } catch { /* backend not ready — graceful fallback below */ }

      // 2. Fetch each doc section
      const mdSections = SECTIONS.filter(s => s !== 'chat')
      for (const name of mdSections) {
        const key = `${name}.md`
        if (availableKeys.includes(key)) {
          try {
            const res = await fetch(`${DOCS_API}/${key}`)
            const md  = res.ok
              ? await res.text()
              : `_\`${key}\` could not be loaded from MinIO._`
            document.getElementById(name).innerHTML = marked.parse(md)
          } catch {
            document.getElementById(name).innerHTML =
              '<p style="color:#94a3b8;font-style:italic">Failed to load document.</p>'
          }
        } else {
          document.getElementById(name).innerHTML =
            `<p style="color:#94a3b8;font-style:italic"><code>${key}</code> not found in MinIO — run the analysis first.</p>`
        }
      }

      buildChatPanel()
      buildToc()
    }

    function buildChatPanel() {
      document.getElementById('chat').innerHTML = `
        <div class="chat-header">
          <div class="chat-header-dot"></div>
          <div>
            <div class="chat-header-title">AI Assistant</div>
            <div class="chat-header-sub">Ask anything about this project</div>
          </div>
        </div>
        <div class="chat-messages" id="chat-messages">
          <div class="chat-messages-inner" id="chat-messages-inner"></div>
        </div>
        <div class="chat-typing-wrap" id="chat-typing-wrap">
          <div class="chat-typing">Thinking…</div>
        </div>
        <div class="chat-input-wrap">
          <div class="chat-input-row">
            <input class="chat-input" id="chat-input" type="text" placeholder="Ask about the project…"
              onkeydown="if(event.key==='Enter')sendMessage()"/>
            <button class="chat-send" onclick="sendMessage()">Send</button>
          </div>
        </div>
      `
    }

    function addMessage(text, role) {
      const inner = document.getElementById('chat-messages-inner')
      const box   = document.getElementById('chat-messages')
      const row   = document.createElement('div')
      row.className = 'chat-msg ' + role
      if (role === 'bot') {
        const av = document.createElement('div')
        av.className = 'chat-avatar'
        av.textContent = 'AI'
        row.appendChild(av)
      }
      const bubble = document.createElement('div')
      bubble.className = 'chat-bubble'
      bubble.innerHTML = role === 'bot' ? marked.parse(text) : escapeHtml(text)
      row.appendChild(bubble)
      inner.appendChild(row)
      box.scrollTop = box.scrollHeight
    }

    function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }

    async function sendMessage() {
      const input = document.getElementById('chat-input')
      const text  = input.value.trim()
      if (!text) return
      input.value = ''
      addMessage(text, 'user')
      document.getElementById('chat-typing-wrap').style.display = 'block'
      try {
        const res  = await fetch(CHAT_API, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        })
        const data = await res.json()
        addMessage(data.response ?? data.message ?? JSON.stringify(data), 'bot')
      } catch {
        addMessage('Chat server unavailable. Run `aeris run reverse.ae` to start it.', 'bot')
      } finally {
        document.getElementById('chat-typing-wrap').style.display = 'none'
      }
    }

    loadDocs()
  </script>
</body>
</html>
