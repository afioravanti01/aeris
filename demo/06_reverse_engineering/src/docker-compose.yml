version: "3.9"

services:

  ticket-service:
    build: ./ticket-service
    ports:
      - "8001:8001"
    environment:
      USER_SERVICE_URL: http://user-service:8002

  user-service:
    build: ./user-service
    ports:
      - "8002:8002"

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    environment:
      REACT_APP_API_BASE: http://localhost:8001
