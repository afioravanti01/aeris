<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open City Intelligence</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link  rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    html, body { background: #0f172a; }
    #map { height: 380px; }
    .leaflet-container { background: #e8edf2; }
    .leaflet-popup-content-wrapper {
      background: #fff; color: #1e293b;
      border: 1px solid #cbd5e1; border-radius: 10px;
      box-shadow: 0 4px 24px rgba(0,0,0,.15);
    }
    .leaflet-popup-tip { background: #fff; }
    .leaflet-popup-close-button { color: #64748b !important; }
    .score-bar-track {
      height: 6px; background: #1e293b; border-radius: 9999px; overflow: hidden;
    }
    .score-bar-fill {
      height: 100%; border-radius: 9999px;
      background: linear-gradient(90deg, #6366f1, #a78bfa);
      transition: width .6s ease;
    }
    .city-report h1,.city-report h2,.city-report h3 {
      color: #e2e8f0; font-weight: 600; margin: 1em 0 .3em;
    }
    .city-report p  { color: #94a3b8; margin: .4em 0; line-height: 1.7; }
    .city-report ul { padding-left: 1.4em; margin: .4em 0; }
    .city-report li { color: #cbd5e1; margin: .2em 0; }
    .city-report strong { color: #f1f5f9; }
    #comparison h1,#comparison h2,#comparison h3 {
      color: #e2e8f0; font-weight:600; margin: 1em 0 .3em;
    }
    #comparison h2 { font-size:1.05rem; border-bottom:1px solid #334155; padding-bottom:.3em; }
    #comparison p  { color:#94a3b8; margin:.4em 0; line-height:1.75; }
    #comparison ul { padding-left:1.4em; margin:.4em 0; }
    #comparison li { color:#cbd5e1; margin:.2em 0; }
    #comparison strong { color:#f1f5f9; }
    #comparison table, .city-report table {
      width: 100%; border-collapse: collapse;
      margin: 1em 0; font-size: .85rem;
      border: 1px solid #334155; border-radius: 10px; overflow: hidden;
    }
    #comparison thead th, .city-report thead th {
      background: #1e293b; color: #94a3b8;
      font-weight: 600; font-size: .75rem;
      text-transform: uppercase; letter-spacing: .05em;
      padding: 10px 14px; text-align: left;
      border-bottom: 1px solid #334155;
    }
    #comparison tbody td, .city-report tbody td {
      padding: 9px 14px; color: #cbd5e1;
      border-bottom: 1px solid #1e293b;
    }
    #comparison tbody tr:last-child td, .city-report tbody tr:last-child td { border-bottom: none; }
    #comparison tbody tr:hover td, .city-report tbody tr:hover td { background: #1e293b80; }
    .amenity-table { width: 100%; border-collapse: collapse; font-size: .875rem; }
    .amenity-table thead th {
      color: #64748b; font-weight: 600; font-size: .7rem;
      text-transform: uppercase; letter-spacing: .07em;
      padding: 6px 10px; text-align: left;
      border-bottom: 1px solid #334155;
    }
    .amenity-table thead th:last-child { text-align: right; }
    .amenity-table tbody tr { border-bottom: 1px solid #1e293b; transition: background .15s; }
    .amenity-table tbody tr:last-child { border-bottom: none; }
    .amenity-table tbody tr:hover { background: #1e293b60; }
    .amenity-table tbody td { padding: 8px 10px; }
    .amenity-table .val { text-align: right; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body class="min-h-screen text-slate-100">

  <!-- Header -->
  <header class="sticky top-0 z-[9999] border-b border-slate-800 bg-slate-900/90 backdrop-blur-md">
    <div class="max-w-screen-xl mx-auto px-6 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-xl">🏙</span>
        <span class="font-bold text-lg tracking-tight text-white">Open City Intelligence</span>
      </div>
      <span class="text-slate-500 text-sm hidden sm:block" id="gen-ts">Loading...</span>
    </div>
  </header>

  <main class="max-w-screen-xl mx-auto px-6 py-8 space-y-8">

    <!-- Map -->
    <div class="rounded-2xl border border-slate-700 overflow-hidden shadow-2xl">
      <div class="bg-slate-800/80 px-5 py-3 border-b border-slate-700 flex items-center justify-between">
        <span class="font-medium text-slate-300 text-sm">🗺 City Map</span>
        <div class="flex items-center gap-4 text-xs text-slate-500">
          <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full inline-block" style="background:#4ade80"></span>Good</span>
          <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full inline-block" style="background:#a3e635"></span>Fair</span>
          <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full inline-block" style="background:#facc15"></span>Moderate</span>
          <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full inline-block" style="background:#fb923c"></span>Poor</span>
          <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full inline-block" style="background:#f87171"></span>Very Poor</span>
          <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full inline-block" style="background:#c084fc"></span>Extremely Poor</span>
          <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full inline-block" style="background:#94a3b8"></span>Unknown</span>
        </div>
      </div>
      <div id="map"></div>
    </div>

    <!-- City cards -->
    <div id="city-cards" class="space-y-6">
      <div class="text-slate-500 text-sm text-center py-8">Loading data...</div>
    </div>

    <!-- Comparison -->
    <div class="rounded-2xl border border-slate-700 bg-slate-800/40 overflow-hidden shadow-xl">
      <div class="bg-slate-800/80 px-5 py-3 border-b border-slate-700 flex items-center gap-2">
        <span class="text-slate-300 font-medium text-sm">⚖️ Cross-City Comparison</span>
        <span class="ml-auto text-xs text-slate-600">urban analyst · comparator</span>
      </div>
      <div id="comparison" class="px-6 py-5 text-sm leading-relaxed city-report"></div>
    </div>

  </main>

  <script>
    // ── Map init (once) ─────────────────────────────────────────────────────
    const leafMap = L.map("map", { scrollWheelZoom: true }).setView([30, 10], 2);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png", {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
      subdomains: "abcd",
      maxZoom: 18,
    }).addTo(leafMap);

    let mapLayers = [];

    // ── Helpers ─────────────────────────────────────────────────────────────
    function aqiColor(label) {
      const map = {
        "Good":           "#4ade80",
        "Fair":           "#a3e635",
        "Moderate":       "#facc15",
        "Poor":           "#fb923c",
        "Very Poor":      "#f87171",
        "Extremely Poor": "#c084fc",
      };
      return map[label] || "#94a3b8";
    }

    function weatherIcon(code) {
      if (code === 0)                return "☀️";
      if (code >= 1  && code <= 3)   return "⛅";
      if (code >= 45 && code <= 48)  return "🌫️";
      if (code >= 51 && code <= 67)  return "🌧️";
      if (code >= 71 && code <= 77)  return "❄️";
      if (code >= 80 && code <= 82)  return "🌦️";
      if (code >= 95 && code <= 99)  return "⛈️";
      return "🌡️";
    }

    function scoreBar(score) {
      const pct = Math.min(100, Math.max(0, score));
      const color = pct >= 70 ? "from-emerald-500 to-emerald-400"
                  : pct >= 45 ? "from-yellow-500 to-yellow-400"
                  :             "from-red-500 to-red-400";
      return `<div class="flex items-center gap-2">
        <div class="score-bar-track flex-1">
          <div class="score-bar-fill bg-gradient-to-r ${color}" style="width:${pct}%"></div>
        </div>
        <span class="text-xs text-slate-400 w-8 text-right">${score}</span>
      </div>`;
    }

    function fmt(val, unit) {
      return val !== null && val !== undefined ? val + (unit || "") : "—";
    }

    function amenityLabel(key) { return key.replace(/_/g, " "); }

    // ── Render ──────────────────────────────────────────────────────────────
    function render(data) {
      const { generated_at, cities, comparison } = data;

      document.getElementById("gen-ts").textContent = "Generated: " + generated_at;

      // City cards
      const container = document.getElementById("city-cards");
      container.innerHTML = "";
      cities.forEach(city => {
        const w  = city.weather   || {};
        const aq = city.air       || {};
        const am = city.amenities || {};
        const sc = city.scores    || {};
        const aqiCol = aqiColor(aq.aqi_label);

        const amenityRows = Object.entries(am).map(([k, v]) =>
          `<tr>
            <td class="text-slate-300 capitalize">${amenityLabel(k)}</td>
            <td class="val ${v !== null ? 'text-slate-100 font-semibold' : 'text-slate-600'}">${v !== null ? v : "—"}</td>
          </tr>`
        ).join("");

        const reportHtml = city.report
          ? marked.parse(city.report)
          : '<p class="text-slate-500 italic">No report available.</p>';

        container.innerHTML += `
          <div class="rounded-2xl border border-slate-700 bg-slate-800/40 overflow-hidden shadow-xl">
            <div class="bg-slate-800/80 px-6 py-4 border-b border-slate-700 flex items-center justify-between">
              <div>
                <h2 class="text-xl font-bold text-white">${city.name}</h2>
                <span class="text-slate-500 text-sm">${city.country}</span>
              </div>
              <div class="flex items-center gap-2 px-3 py-1.5 rounded-full border text-sm font-medium"
                   style="color:${aqiCol}; border-color:${aqiCol}40; background:${aqiCol}10">
                ${aq.aqi_label || "No AQI data"}
              </div>
            </div>
            <div class="p-6 space-y-6">
              <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-slate-900/60 border border-slate-700 rounded-xl p-4">
                  <p class="text-xs uppercase tracking-widest text-slate-500 mb-3">Weather</p>
                  <div class="flex items-center gap-3 mb-3">
                    <span class="text-3xl">${weatherIcon(w.weather_code || 0)}</span>
                    <span class="text-4xl font-bold text-white">${fmt(w.temperature, "°")}</span>
                  </div>
                  <div class="space-y-1 text-xs text-slate-400">
                    <div class="flex justify-between"><span>Feels like</span><span>${fmt(w.temp_max, "°")} / ${fmt(w.temp_min, "°")}</span></div>
                    <div class="flex justify-between"><span>Wind</span><span>${fmt(w.wind_speed, " km/h")}</span></div>
                    <div class="flex justify-between"><span>Humidity</span><span>${fmt(w.humidity, "%")}</span></div>
                    <div class="flex justify-between"><span>Precipitation</span><span>${fmt(w.precip_mm, " mm")}</span></div>
                  </div>
                </div>
                <div class="bg-slate-900/60 border border-slate-700 rounded-xl p-4">
                  <p class="text-xs uppercase tracking-widest text-slate-500 mb-3">Air Quality</p>
                  <div class="text-2xl font-bold mb-3" style="color:${aqiCol}">${aq.aqi_label || "No data"}</div>
                  <div class="space-y-1 text-xs text-slate-400">
                    <div class="flex justify-between"><span>PM2.5</span><span>${fmt(aq.pm25, " µg/m³")}</span></div>
                    <div class="flex justify-between"><span>PM10</span><span>${fmt(aq.pm10, " µg/m³")}</span></div>
                    <div class="flex justify-between"><span>NO₂</span><span>${fmt(aq.no2, " µg/m³")}</span></div>
                  </div>
                </div>
                <div class="bg-slate-900/60 border border-slate-700 rounded-xl p-4">
                  <p class="text-xs uppercase tracking-widest text-slate-500 mb-3">City Scores</p>
                  <div class="space-y-3">
                    <div>
                      <div class="flex justify-between text-xs text-slate-400 mb-1">
                        <span>Livability</span><span>${sc.livability || 0}/100</span>
                      </div>
                      ${scoreBar(sc.livability || 0)}
                    </div>
                    <div>
                      <div class="flex justify-between text-xs text-slate-400 mb-1">
                        <span>Sustainability</span><span>${sc.sustainability || 0}/100</span>
                      </div>
                      ${scoreBar(sc.sustainability || 0)}
                    </div>
                    <div>
                      <div class="flex justify-between text-xs text-slate-400 mb-1">
                        <span>Infrastructure</span><span>${sc.infrastructure || 0}/100</span>
                      </div>
                      ${scoreBar(sc.infrastructure || 0)}
                    </div>
                    <div class="mt-2 pt-2 border-t border-slate-700 text-xs text-slate-500 flex justify-between">
                      <span>Overall</span>
                      <span class="text-slate-300 font-semibold">
                        ${Math.round(((sc.livability||0)+(sc.sustainability||0)+(sc.infrastructure||0))/3)}/100
                      </span>
                    </div>
                  </div>
                </div>
              </div>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="bg-slate-900/60 border border-slate-700 rounded-xl p-4">
                  <p class="text-xs uppercase tracking-widest text-slate-500 mb-3">OSM Amenities · 5km radius</p>
                  <table class="amenity-table">
                    <thead><tr><th>Amenity</th><th style="text-align:right">Count</th></tr></thead>
                    <tbody>${amenityRows || '<tr><td colspan="2" class="text-slate-500 py-2">No data</td></tr>'}</tbody>
                  </table>
                </div>
                <div class="bg-slate-900/60 border border-slate-700 rounded-xl p-4">
                  <p class="text-xs uppercase tracking-widest text-slate-500 mb-3">AI City Report</p>
                  <div class="city-report text-sm">${reportHtml}</div>
                </div>
              </div>
            </div>
          </div>`;
      });

      // Map markers
      mapLayers.forEach(l => l.remove());
      mapLayers = [];
      cities.forEach(city => {
        if (!city.lat || !city.lon) return;
        const aq    = city.air    || {};
        const sc    = city.scores || {};
        const col   = aqiColor(aq.aqi_label);
        const score = Math.round(((sc.livability||0)+(sc.sustainability||0)+(sc.infrastructure||0))/3);

        const popup = `
          <div style="font-family:system-ui;min-width:160px">
            <div style="font-weight:700;color:#0f172a;font-size:1rem">${city.name}</div>
            <div style="color:#64748b;font-size:.8rem;margin-bottom:6px">${city.country}</div>
            <div style="color:${col};font-weight:600;font-size:.85rem">${aq.aqi_label || "No AQI"}</div>
            <div style="color:#64748b;font-size:.78rem;margin-top:4px">
              🌡 ${city.weather?.temperature || "—"}°C &nbsp;·&nbsp; Overall score: ${score}/100
            </div>
          </div>`;

        const circle = L.circleMarker([city.lat, city.lon], {
          radius: 18, color: col, fillColor: col, fillOpacity: 0.25, weight: 2,
        }).addTo(leafMap).bindPopup(popup);

        const label = L.marker([city.lat, city.lon], {
          icon: L.divIcon({
            className: "",
            html: `<div style="
              background:${col}20; border:1px solid ${col}60; color:${col};
              padding:2px 8px; border-radius:9999px; font-size:11px;
              font-weight:600; white-space:nowrap; font-family:system-ui;
              transform:translateX(-50%); margin-top:22px;
            ">${city.name}</div>`,
            iconAnchor: [0, 0],
          }),
        }).addTo(leafMap);

        mapLayers.push(circle, label);
      });

      if (cities.length > 0) {
        const lats = cities.map(c => c.lat).filter(Boolean);
        const lons = cities.map(c => c.lon).filter(Boolean);
        if (lats.length > 0) {
          leafMap.fitBounds([
            [Math.min(...lats) - 5, Math.min(...lons) - 10],
            [Math.max(...lats) + 5, Math.max(...lons) + 10],
          ]);
        }
      }

      // Comparison report
      document.getElementById("comparison").innerHTML = marked.parse(comparison || "");
    }

    // ── Fetch ───────────────────────────────────────────────────────────────
    async function fetchData() {
      try {
        const res = await fetch("/api/data");
        if (!res.ok) return;
        const data = await res.json();
        render(data);
      } catch (e) {
        console.warn("fetch /api/data failed:", e);
      }
    }

    fetchData();
  </script>
</body>
</html>
