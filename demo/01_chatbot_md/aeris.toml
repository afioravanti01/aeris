[project]
name  = "demo-chatbot-md"
aeris = "0.3.0"

[caps]
enforce = "off"

[ai.backend]
# Backend headless: ogni chiamata spawna il binario di Claude,
# scrive il prompt su stdin, legge la risposta da stdout.
kind = "cli"
cmd  = "claude -- print --dangerously-skip-permissions --no-session-persistence --effort low --output-format text --model claude-sonnet-4-6"
