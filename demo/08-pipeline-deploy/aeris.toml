[project]
name  = "pipeline-deploy"
aeris = "0.3.0"

[caps]
enforce = "off"

# Real backends — this demo talks to the actual Docker daemon, the
# Azure Container Registry and the live cluster:
#
#   - docker.pull / docker.push  → system `docker` binary
#   - kube.get                   → system `kubectl` binary
#   - shell.exec                 → `az acr login` and `docker tag`
#
# The host must have `docker`, `kubectl` and `az` in PATH, a working
# kubeconfig and network reach to mitramazsplnacr001.azurecr.io.
# Set both to "mock" to run the pipeline offline (trace only, no I/O).
[l2.docker]
backend = "real"

[l2.kube]
backend = "real"
