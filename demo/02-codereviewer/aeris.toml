[project]
name  = "code-reviewer"
aeris = "0.3.0"

[caps]
# Script mode — no `cap` annotations required, no runtime allow-list.
# Trace, replay, model@vN validation and intent blocks remain active.
enforce = "off"

[ai.backend]
# Uses the local Claude CLI as the LLM backend. Swap to `kind = "http"`
# with `url`/`auth` to talk to the Anthropic API directly.
kind = "cli"
cmd  = "claude --print --dangerously-skip-permissions --no-session-persistence --effort low --output-format text --model claude-sonnet-4-6"
