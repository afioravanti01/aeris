[project]
name  = "my-aeris-project"
aeris = "0.2.0"

[deps]

[caps]
# Capability checking mode (§ 8.4.1).
#
#   required = false  — prototype mode (default for `aeris init`).
#                       Functions may call capability operations
#                       without declaring an enclosing `cap`
#                       parameter. The runtime allow-list below
#                       still prevents unauthorised endpoints.
#
#   required = true   — strict mode. Every effectful function must
#                       declare its `cap[...]`; mismatches surface
#                       as `aeris check` errors. Flip to true when
#                       the project becomes mission-critical, then
#                       run `aeris fmt --narrow-caps` to derive the
#                       per-function signatures from the body.
required = false

# Project-wide allow-list ceiling — see docs/language.md § 24.1.
# Uncomment the lines that apply to your program:
# http.allow      = ["api.example.com"]
# fs.allow_read   = ["./data/**"]
# fs.allow_write  = ["./out/**"]
